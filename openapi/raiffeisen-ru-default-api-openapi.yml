openapi: 3.2.0
info:
  title: Raiffeisen Ru Аутентификация API
  version: '1.0'
  description: 'Operations tagged Аутентификация across 7 of this provider''s published API definitions: raiffeisen-ru-authorization-openapi.yml, raiffeisen-ru-content-interactions-openapi.yml, raiffeisen-ru-content-macroeconomic-reviews-openapi.yml, raiffeisen-ru-content-product-news-openapi.yml, raiffeisen-ru-content-webinars-openapi.yml, raiffeisen-ru-loro-openapi.yml, raiffeisen-ru-user-permissions-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://id.business.raiffeisen.ru
- url: https://api.raiffeisen.ru/media-content
- url: https://api.raiffeisen.ru/loro
- url: https://api.raiffeisen.ru/permissions
tags:
- name: Аутентификация
  description: Аутентификация пользователя и управление токенами OAuth2.
paths:
  /oauth2/authorize:
    get:
      operationId: authorize
      summary: Запрос на авторизацию (Code Flow)
      description: 'Запрос инициирует процесс аутентификации пользователя

        (формируется системой клиента).'
      tags:
      - Аутентификация
      parameters:
      - name: response_type
        in: query
        required: true
        description: Тип ответа, для Code Flow необходимо указать `code`.
        schema:
          type: string
          enum:
          - code
          example: code
      - name: code_challenge
        in: query
        required: true
        description: "Хэш значения `code_verifier` (криптографически стойкой случайно сгенерированной строки):\n`code_challenge = BASE64URL-ENCODE(SHA256(ASCII(code_verifier)))`\n\nПодробнее о том, как создать code_challenge — \n[Proof Key for Code Exchange (PKCE)](https://datatracker.ietf.org/doc/html/rfc7636#section-4.2)"
        schema:
          type: string
          example: ewliMz7SBtJdHLlNuuJLdzu-gRs2olJQ24AQ8GTS6Qo
      - name: code_challenge_method
        in: query
        required: true
        description: Метод хэширования значения `code_verifier`, поддерживается только `S256`.
        schema:
          type: string
          enum:
          - S256
          example: S256
      - name: client_id
        in: query
        required: true
        description: Идентификатор клиента (выдается Райффайзен Банком после подачи заявления на подключение).
        schema:
          type: string
          example: 01e3decf-f997-4b5d-b52c-6bc646b3a528
      - name: redirect_uri
        in: query
        required: true
        description: "URI, на который сервис аутентификации перенаправит пользователя после прохождения аутентификации \n(указывается при подключении клиента к Райффайзен Банку)."
        schema:
          type: string
          format: uri
          example: https://www.rbo.raiffeisen.ru/
      - name: scope
        in: query
        required: true
        description: "Запрашиваемые привилегии доступа. \nЗначения указываются через пробел."
        schema:
          type: string
          example: accounts:statement:read company:profile:read
      - name: state
        in: query
        required: true
        description: "Криптографически стойкая случайная строка для защиты от CSRF-атак (генерируется системой клиента).\nВозвращается в неизменном виде после успешной аутентификации пользователя. \nСистема клиента должна проверять, соответствует ли полученное в ответе значение `state` исходному значению."
        schema:
          type: string
          example: VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
      responses:
        '302':
          description: 'Редирект на указанный в параметре `redirect_uri` URI клиента

            в случае успешной аутентификации пользователя или ошибки в параметрах запроса.'
          headers:
            Location:
              description: "URI клиента для завершения авторизации.\n\nЕсли пользователь аутентифицирован, в параметрах URI будут переданы `code` и `state` \nдля получения токенов доступа. Система клиента должна проверять, \nсоответствует ли полученное в ответе значение `state` исходному значению.\n\nВ случае ошибки в параметрах URI будет переданы `error` и `error_description` с описанием ошибки."
              schema:
                type: string
                format: uri-reference
              examples:
                SuccessWithCode:
                  summary: URI клиента c authorization code для получения токенов доступа
                  value: https://www.rbo.raiffeisen.ru/?code=tb424Ly7439iihvpJWUdh19sVdpEiPdCQCWnHqFu6DsCDtsmdye2rth8iJNS0oQWRgPeeHB4y2YH9zLZErCmN9cR81R1mMfeZpCrVQoVWZAKmnbbfPvQS--2qC-rUrbl&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestNoScope:
                  summary: Ошибка в параметрах запроса (не указан scope)
                  value: https://www.rbo.raiffeisen.ru/?error=invalid_request&error_description=OAuth%202.0%20Parameter%3A%20scope&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestScope:
                  summary: Ошибка в параметрах запроса (некорректное значение scope)
                  value: https://www.rbo.raiffeisen.ru/?error=invalid_scope&error_description=OAuth%202.0%20Parameter%3A%20scope&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestNoResponseType:
                  summary: Ошибка в параметрах запроса (не указан response_type)
                  value: https://www.rbo.raiffeisen.ru/?error=invalid_request&error_description=OAuth%202.0%20Parameter%3A%20response_type&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestResponseType:
                  summary: Ошибка в параметрах запроса (некорректное значение response_type)
                  value: https://www.rbo.raiffeisen.ru/?error=unsupported_response_type&error_description=OAuth%202.0%20Parameter%3A%20response_type&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestCodeChallenge:
                  summary: Ошибка в параметрах запроса (некорректное значение code_challenge)
                  value: https://www.rbo.raiffeisen.ru/?error=invalid_request&error_description=OAuth%202.0%20Parameter%3A%20code_challenge&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestCodeChallengeMethod:
                  summary: Ошибка в параметрах запроса (некорректное значение code_challenge_method)
                  value: https://www.rbo.raiffeisen.ru/?error=invalid_request&error_description=OAuth%202.0%20Parameter%3A%20code_challenge_method&state=VvTS5lCd5949t3ysuUbzgxfhwid0JCWyNm8Ey2BX39Q
                InvalidRequestState:
                  summary: Ошибка в параметрах запроса (не указан state)
                  value: https://www.rbo.raiffeisen.ru/?error=invalid_request&error_description=OAuth%202.0%20Parameter%3A%20state
            Set-Cookie:
              description: Служебные куки сервиса аутентификации (например, authentication_flow, raifid.device.deviceId).
              schema:
                type: string
        '303':
          description: Редирект для продолжения процесса аутентификации пользователя.
          headers:
            Location:
              description: URI для продолжения процесса аутентификации пользователя.
              schema:
                type: string
                format: uri-reference
              examples:
                RedirectToLogin:
                  summary: URI страницы для ввода аутентификационных данных пользователя
                  value: /login
            Set-Cookie:
              description: Служебные куки сервиса аутентификации (например, authentication_flow, raifid.device.deviceId).
              schema:
                type: string
        '400':
          description: Запрос некорректен. Не указаны или переданы некорректные значения `client_id` или `redirect_uri`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                InvalidClientId:
                  summary: Ошибка в параметрах запроса (не указано или передано некорректное значение client_id)
                  value: 'OAuth 2.0 Parameter: client_id'
                InvalidRedirectUri:
                  summary: Ошибка в параметрах запроса (не указано или передано некорректное значение redirect_uri)
                  value: 'OAuth 2.0 Parameter: redirect_uri'
    servers:
    - url: https://id.business.raiffeisen.ru
  /oauth2/token:
    post:
      operationId: token
      summary: Получение и обновление токенов
      description: 'Получение токенов по Authorization Code (`grant_type=authorization_code`)

        или обновление токенов по Refresh Token (`grant_type=refresh_token`).'
      tags:
      - Аутентификация
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequestDTO'
            examples:
              AuthorizationCodeGrant:
                summary: Получение токенов по Authorization Code
                value:
                  grant_type: authorization_code
                  code: mG9oKcfhuYthtkeH9Ovmv3T66cvH4PLVe3d6ulUiu_f8VbBxqsUkpmZzwHgjvTwzOvQi9idYfUBq5nSCNaxsJavxUAFx63u3MIHi20_va3ZkSPBT9GGi9ZvGDUO57kvT
                  code_verifier: ACbrszxo9MTPRDHBej_Hyjftt9jc2r2aQZurfomS_ctYglRFj-ckHphyoc39_-9OD-G9itHoyvIMJTT8V3TSbksMm6KC1S4Ji7FXogJPtTx-vy3yp2CgPVxBBJkegSTA
                  client_id: 01e3decf-f997-4b5d-b52c-6bc646b3a528
                  client_secret: ClientSecretPassword
                  redirect_uri: https://www.rbo.raiffeisen.ru/
              RefreshTokenGrant:
                summary: Обновление токенов по Refresh токену
                value:
                  grant_type: refresh_token
                  refresh_token: <opaque-refresh-token>
                  client_id: 01e3decf-f997-4b5d-b52c-6bc646b3a528
                  client_secret: ClientSecretPassword
      responses:
        '200':
          description: Успешно выданы токены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDTO'
              examples:
                TokenResponse:
                  description: Успешный ответ с access_token и refresh_token.
                  value:
                    access_token: <jwt-access-token>
                    expires_in: 1800
                    token_type: Bearer
                    scope: openid profile
                    refresh_token: <opaque-refresh-token>
                    refresh_expires_at: 1777618800
        '400':
          description: Ошибка параметров запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorDTO'
              examples:
                InvalidGrantError:
                  summary: Ошибка invalid_grant (неверный код или истекший токен)
                  value:
                    error: invalid_grant
        '401':
          description: Ошибка авторизации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorDTO'
              examples:
                Error:
                  summary: Ошибка invalid_client (неверно указан client_id или client_secret)
                  value:
                    error: invalid_client
    servers:
    - url: https://id.business.raiffeisen.ru
  /oauth2/revoke:
    post:
      operationId: revokeToken
      summary: Отзыв токена
      description: 'Отзывает Access Token или Refresh Token, выданный клиенту.

        Неизвестный сервису или уже отозванный токен также приводит к ответу 200 согласно RFC 7009.'
      tags:
      - Аутентификация
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRevocationRequestDTO'
      responses:
        '200':
          description: Запрос обработан. Тело ответа отсутствует, в том числе для неизвестного или уже отозванного токена.
        '400':
          description: Ошибка параметров запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorDTO'
        '401':
          description: Ошибка аутентификации клиента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorDTO'
    servers:
    - url: https://id.business.raiffeisen.ru
  /oauth2/jwks:
    get:
      operationId: getJwks
      summary: Публичные ключи для проверки JWT
      description: Возвращает набор публичных ключей сервиса в формате JWK Set для проверки подписи JWT.
      tags:
      - Аутентификация
      responses:
        '200':
          description: Набор публичных ключей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJwksResponseDTO'
    servers:
    - url: https://id.business.raiffeisen.ru
  /oauth2/token/liveness:
    get:
      operationId: tokenLiveness
      summary: Проверка активности Access Token
      description: 'Проверяет, что Access Token в заголовке `Authorization` выпущен сервисом,

        не истек и не был отозван.


        Ответы не содержат тела.'
      tags:
      - Аутентификация
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Токен активен
        '401':
          description: Заголовок Authorization отсутствует, имеет неверный формат или токен недействителен
        '503':
          description: Проверка токена временно недоступна
    servers:
    - url: https://id.business.raiffeisen.ru
  /login:
    get:
      operationId: getLoginPage
      summary: Получение формы текущего шага входа
      description: 'Возвращает HTML страницу входа без предварительной авторизации пользователя.

        Процесс входа начинается через `GET /oauth2/authorize`; браузер должен сохранять служебные cookies.

        Тип формы определяется `viewData.pageData.stepViewData.stepType`: `username-password`, `password`,

        `phone`, `sms-otp`, `email-otp` или `consent`.


        JSON внутри `script#viewData` с типом `application/json` описан схемой `LoginViewDataDTO`.

        CSRF токен находится в `pageData.authenticationFlowContext.csrf`.

        Если процесс входа завершён, выполняется редирект на исходный `/oauth2/authorize`.

        Если процесс не найден, пользователь возвращается на зарегистрированный адрес клиентской системы

        из `login_client_entry` либо на страницу выхода по умолчанию.'
      tags:
      - Аутентификация
      parameters:
      - $ref: '#/components/parameters/AuthenticationFlowCookie'
      - $ref: '#/components/parameters/LoginClientEntryCookie'
      - $ref: '#/components/parameters/CsrfCookie'
      - name: step_error_details
        in: cookie
        description: Служебные данные ошибки предыдущей попытки ввода пароля или OTP.
        schema:
          type: string
      - name: raifid.captcha.required
        in: cookie
        description: Признак отображения CAPTCHA; не отменяет проверку необходимости CAPTCHA сервером.
        schema:
          type: string
      responses:
        '200':
          description: HTML страница текущего шага с JSON в script#viewData.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
          content:
            text/html:
              schema:
                type: string
                description: HTML с данными LoginViewDataDTO внутри script#viewData.
              x-view-data-schema:
                $ref: '#/components/schemas/LoginViewDataDTO'
        '302':
          description: Возврат к OAuth авторизации или на адрес клиентской системы при отсутствии процесса входа.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
        '303':
          $ref: '#/components/responses/UiErrorRedirect'
    post:
      operationId: submitLoginStep
      summary: Отправка формы текущего шага входа
      description: 'Обрабатывает один шаг входа: логин и пароль, номер телефона, пароль, SMS/Email OTP или согласие на scopes.

        Нужны активный процесс входа, служебные cookies и CSRF токен из

        `viewData.pageData.authenticationFlowContext.csrf`. Токен передаётся полем `_csrf`

        вместе с cookie `XSRF-TOKEN`.


        После обработки возвращается `303` на `/login`, исходный `/oauth2/authorize` или `/error`.

        Ошибки ввода отображаются при следующем GET формы. Если процесс истёк, а cookie

        `login_client_entry` действительна, возвращается `302` на адрес клиентской системы для повторного входа.'
      tags:
      - Аутентификация
      parameters:
      - $ref: '#/components/parameters/AuthenticationFlowCookie'
      - $ref: '#/components/parameters/LoginClientEntryCookie'
      - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginStepRequestDTO'
      responses:
        '303':
          description: 'Продолжение входа или повтор формы после ошибки ввода — `/login`;

            завершение всех шагов — исходный `/oauth2/authorize`;

            ошибка CSRF или невозможность продолжить процесс — `/error`.'
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
        '302':
          description: Процесс входа не найден; возврат на зарегистрированный адрес клиентской системы.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
    servers:
    - url: https://id.business.raiffeisen.ru
  /login/restart:
    get:
      operationId: restartLogin
      summary: Повторный запуск входа со страницы ошибки
      description: 'Восстанавливает исходный OAuth запрос по cookie `failed_authentication_flow_id`.

        Если восстановить запрос нельзя, использует проверенный адрес клиентской системы из `login_client_entry`

        либо страницу выхода по умолчанию. Cookie `failed_authentication_flow_id` очищается.'
      tags:
      - Аутентификация
      parameters:
      - $ref: '#/components/parameters/FailedAuthenticationFlowCookie'
      - $ref: '#/components/parameters/LoginClientEntryCookie'
      responses:
        '302':
          description: Редирект на исходный OAuth запрос, адрес клиентской системы или страницу выхода по умолчанию.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
        '303':
          $ref: '#/components/responses/UiErrorRedirect'
    servers:
    - url: https://id.business.raiffeisen.ru
  /login/user-settings/auth-method:
    post:
      operationId: updateLoginAuthMethod
      summary: Изменение способа входа
      description: 'Выбирает вход по паролю (`PASSWORD`) или телефону (`PHONE`) и начинает текущий процесс входа заново.

        Требуются активный процесс входа и CSRF токен из `viewData.pageData.authenticationFlowContext.csrf`.

        Передайте токен полем `_csrf` либо заголовком `X-XSRF-TOKEN` вместе с cookie `XSRF-TOKEN`.

        При ошибке параметров, CSRF или отсутствии процесса входа выполняется редирект на `/error`.'
      tags:
      - Аутентификация
      parameters:
      - $ref: '#/components/parameters/AuthenticationFlowCookie'
      - $ref: '#/components/parameters/CsrfCookie'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - authMethod
              properties:
                authMethod:
                  type: string
                  enum:
                  - PASSWORD
                  - PHONE
                _csrf:
                  type: string
                  description: CSRF токен; обязателен, если не передан заголовок X-XSRF-TOKEN.
      responses:
        '303':
          description: Редирект на /login после смены способа входа либо на /error при ошибке.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
    servers:
    - url: https://id.business.raiffeisen.ru
  /login/user-settings/locale:
    patch:
      operationId: updateLoginLocale
      summary: Изменение языка формы входа
      description: 'Меняет язык без перезапуска текущего шага. Требуется cookie `authentication_flow`

        либо `failed_authentication_flow_id` для смены языка на странице ошибки.

        CSRF токен берётся из `viewData.pageData.authenticationFlowContext.csrf`

        или `viewData.pageData.errorPageContext.csrf` и передаётся в `X-XSRF-TOKEN`.

        Ответы не содержат тела. При ошибках возвращается HTTP status без редиректа на `/error`.'
      tags:
      - Аутентификация
      parameters:
      - name: locale
        in: query
        required: true
        description: Язык формы входа.
        schema:
          $ref: '#/components/schemas/SupportedLocale'
      - $ref: '#/components/parameters/AuthenticationFlowCookie'
      - $ref: '#/components/parameters/FailedAuthenticationFlowCookie'
      - $ref: '#/components/parameters/CsrfCookie'
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: CSRF токен из viewData страницы входа или ошибки.
        schema:
          type: string
      responses:
        '200':
          description: Язык сохранён; текущий шаг не изменён.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
        '400':
          description: Не указан locale, язык не поддерживается или процесс входа не найден.
        '403':
          description: Ошибка проверки CSRF или доступа.
        '500':
          description: Временная ошибка при обновлении языка.
    servers:
    - url: https://id.business.raiffeisen.ru
  /login/user-settings/otp-method:
    post:
      operationId: updateLoginOtpMethod
      summary: Выбор доставки OTP по email
      description: 'Выбирает резервную доставку OTP по email для текущего SMS второго фактора.

        Требуются активный процесс входа и CSRF токен из `viewData.pageData.authenticationFlowContext.csrf`.

        Передайте токен полем `_csrf` либо заголовком `X-XSRF-TOKEN` вместе с cookie `XSRF-TOKEN`.


        Адрес email и доступность перехода проверяет сервер. Если переключение недоступно,

        процесс не меняется и пользователь возвращается на `/login`.

        OTP создаётся при следующем GET `/login`; при утрате доступности email сохраняется доставка по SMS.

        Некорректный `otpMethod`, отсутствие процесса входа или ошибка CSRF приводят к редиректу на `/error`.'
      tags:
      - Аутентификация
      parameters:
      - $ref: '#/components/parameters/AuthenticationFlowCookie'
      - $ref: '#/components/parameters/CsrfCookie'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - otpMethod
              properties:
                otpMethod:
                  type: string
                  enum:
                  - email
                _csrf:
                  type: string
                  description: CSRF токен; обязателен, если не передан заголовок X-XSRF-TOKEN.
      responses:
        '303':
          description: Редирект на /login после обработки выбора либо на /error при ошибке.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
    servers:
    - url: https://id.business.raiffeisen.ru
  /error:
    get:
      operationId: getErrorPage
      summary: Получение страницы ошибки входа
      description: 'Возвращает HTML страницу с JSON внутри `script#viewData` с типом `application/json`.

        Структура JSON описана схемой `ErrorPageDataDTO`: код ошибки, доступные действия

        `RELOAD`, `RETRY_LOGIN`, `REDIRECT` и CSRF токен для смены языка.


        Читает и очищает служебную cookie `error_page_details`. Для повторного входа может установить

        `failed_authentication_flow_id`. Если данных ошибки нет, они повреждены или ошибка требует выхода,

        выполняется редирект на страницу выхода по умолчанию.'
      tags:
      - Аутентификация
      parameters:
      - name: error_page_details
        in: cookie
        description: Служебные данные ошибки, установленные сервером перед редиректом на /error.
        schema:
          type: string
      - $ref: '#/components/parameters/FailedAuthenticationFlowCookie'
      responses:
        '200':
          description: HTML страница ошибки с JSON в script#viewData.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
          content:
            text/html:
              schema:
                type: string
                description: HTML с данными ErrorPageDataDTO внутри script#viewData.
              x-view-data-schema:
                $ref: '#/components/schemas/ErrorPageDataDTO'
        '302':
          description: Редирект на страницу выхода по умолчанию.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/UiCookies'
    servers:
    - url: https://id.business.raiffeisen.ru
