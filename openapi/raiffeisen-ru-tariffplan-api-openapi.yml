                        deferralFeeValue: 0.123
                        additionalPeriodFeeValue: 0.234
                        waitingPeriodFeeValue: 0.345
                        startDate: '2025-05-01'
                        state:
                          status: APPROVED
                          statusDate: '2025-10-16T12:00:01.024991'
                          errors: []
                          cqrsVersion: 1742767789
                      - id: aae70d79-6912-41d6-81db-b74a0fd5f1e2
                        type: FOR_FINANCE_FLOAT_CBR
                        deferralFeeValue: 0.234
                        additionalPeriodFeeValue: 0.345
                        waitingPeriodFeeValue: 0.567
                        startDate: '2026-01-12'
                        state:
                          status: APPROVED
                          statusDate: '2025-10-16T12:00:01.024991'
                          errors: []
