          description: 'Вложения: `fileId`, `fileName` и `contentHash` из успешного ответа `POST /currency-control/files`.


            **Проверки сервера:**

            - принадлежность файлов клиенту, срок доступности и ограничения документа;

            - недоступное вложение — `400 VALIDATION_ERROR` по `attachments[N].fileId`;

            - для справки о подтверждающих документах размер каждого вложения не должен превышать 10485760 байт.


            **Жизненный цикл:**

            - при успешном сохранении документа (включая `DRAFT`) связь и отмена удаления невостребованного файла фиксируются атомарно; из метаданных исчезает поле `expiresAt`;

            - использованный файл не возвращается в режим невостребованного после удаления ссылки;

            - хранение и доступ сохраняются до окончания срока хранения всех связанных документов.


            > **Внимание:** при гонке с очисткой либо сохраняется документ с защищённым файлом, либо запрос отклоняется.

