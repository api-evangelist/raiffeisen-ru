openapi: 3.2.0
info:
  title: Raiffeisen Ru QR API
  x-refined-note:
  - x-description-i18n differs across the merged source definitions and was not carried
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged QR across 3 of this provider''s published API definitions: raiffeisen-ru-raif-pay-sbp-openapi.json, raiffeisen-ru-raif-pay-sbp-openapi.yml, raiffeisen-ru-sbp-acquiring-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay.raif.ru/api
  description: Production
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://api.raiffeisen.ru/raif-pay
tags:
- name: QR
  x-displayName: Динамический и статический QR
  x-x-displayName-i18n:
    eng: Static and dynamic QRS (QRStatic, QRDynamic)
  description: 'Для реализации взаимодействия с партнёром Райффайзенбанк предоставляет API из следующих запросов:

    * отмена QR-кода,

    * получение данных по зарегистрированному QR-коду,

    * получение данных по платежу,

    * получение информации о заказе,

    * возврат денежных средств - может быть выполнен в любое время после проведения оплаты на полную сумму платежа или частичную. Однако сумма частичных запросов на возврат не должна превышать общую сумму заказа.

    * получение информации по возврату.


    Схема взаимодействия.'
  x-description-i18n:
    eng: "To implement interaction with a partner, Raiffeisenbank provides an API of the following requests:\n  * receiving data on a previously registered QR code,\n  * QR code cancellation,\n  * receipt of payment data,\n  * getting order information,\n  * refund - can be made both for the full amount of the payment, and for a partial one. However, the amount of partial refund requests should not exceed the total amount of the order,\n  * receiving information on return.\n\n[Diagram](#section/General-schemas-of-work/White-label-SBP-API).\n"
paths:
  /sbp/v2/qrs:
    post:
      summary: Регистрация QR
      x-summary-i18n:
        eng: QR code registration
      operationId: createQrV2
      description: 'Метод позволяет сформировать статические QR-коды, динамические QR-коды и кассовую ссылку СБП (QRVariable) для каждой кассы.

        Также с помощью данного метода вы можете сформировать динамический QR-код для оплаты с подпиской.


        При каждом новом запросе будет возвращаться новый QR.


        Тестовые QR можно оплатить только с помощью тестового приложения.'
      x-description-i18n:
        eng: 'This method allows you to generate static QR codes, dynamic QR codes and QRVariable. You can also use this method to generate a QR code for pay and subscription at one the moment.


          Test QR codes can only be paid for by our [test application](#section/Testing).

          '
      requestBody:
        $ref: '#/components/requestBodies/CreateQrV2Request'
      tags:
      - QR
      responses:
        '200':
          $ref: '#/components/responses/CreateQrV2Response'
        '400':
          $ref: '#/components/responses/GeneralErrorResponse'
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /sbp/v2/qrs/{qrId}:
    parameters:
    - $ref: '#/components/parameters/qrId'
    delete:
      summary: Отмена QR
      x-summary-i18n:
        eng: QR code cancellation
      operationId: deleteQrV2
      responses:
        '200':
          description: OK
      description: 'Метод позволяет отменить ранее созданный QR.


        Динамический QR можно отменить только до момента его оплаты.


        Для кассовой ссылки будет отменен последний активный заказ, до момента его оплаты.'
      x-description-i18n:
        eng: 'This method allows you to cancel a previously created QR code. <br>

          A Dynamic QR code can only be canceled before it is paid. <br>

          For a QRVariable, the last active order will be canceled until it is paid.

          '
      tags:
      - QR
      security:
      - secretKey: []
    get:
      summary: Получение данных по QR
      x-summary-i18n:
        eng: Get QR code data
      operationId: getQrV2
      responses:
        '200':
          $ref: '#/components/responses/CreateQrV2Response'
      description: Метод позволяет получить данные по зарегистрированному ранее QR-коду
      x-description-i18n:
        eng: This method allows to get data from a previously created QR code
      tags:
      - QR
      security:
      - secretKey: []
    put:
      summary: Изменение параметров QR
      x-summary-i18n:
        eng: Update QR code parameters
      operationId: updateStaticQr
      description: 'Метод полностью заменяет параметры QR-кода значениями из запроса.


        Чтобы сохранить текущее значение поля, передайте его повторно.


        **API для данного сценария может быть расширяемым**.'
      x-description-i18n:
        eng: 'Method fully replaces the QR code parameters with the values from the request.


          To preserve a field''s current value, send it again.


          **The API for this scenario may be extensible**.

          '
      requestBody:
        $ref: '#/components/requestBodies/UpdateQrRequest'
      tags:
      - QR
      responses:
        '200':
          $ref: '#/components/responses/CreateQrV2Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
              examples:
                Некорректный параметр:
                  value:
                    code: ERROR.INVALID_REQUEST
                    message: Передан некорректный параметр
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /sbp/v1/qr/{qrId}/payment-info:
    parameters:
    - $ref: '#/components/parameters/qrId'
    get:
      summary: Получение информации по платежу
      x-summary-i18n:
        eng: Get payment Information
      tags:
      - QR
      responses:
        '200':
          $ref: '#/components/responses/PaymentInfoResponse'
      operationId: getPaymentInfo
      description: 'Метод позволяет получить информацию по платежу по QR-коду.

        Метод не используется для QRVariable.'
      x-description-i18n:
        eng: The method allows you to get payment data. Don't use for QRVariable
      parameters: []
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /v1/merchants/{publicId}/orders/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор заказа
      x-description-i18n:
        eng: Order ID
    get:
      summary: Получение информации о заказе
      x-summary-i18n:
        eng: Getting order information
      operationId: get-payments-v1-merchants-publicId-orders-id-sbp
      description: 'Используется для опроса статуса заказа по QR-коду.


        Метод позволяет получить информацию о заказе по его идентификатору, включая текущий статус, сумму и срок действия.


        Рекомендуется проводить опрос статуса раз в 2 секунды до получения финального статуса (PAID, EXPIRED или CANCELLED).'
      x-description-i18n:
        eng: 'Used to poll the order status for QR codes.


          The method allows you to get information about an order by its identifier, including current status, amount and expiration date.


          It is recommended to poll the status every 2 seconds until a final status is received (PAID, EXPIRED, or CANCELLED).'
      responses:
        '200':
          $ref: '#/components/responses/GetOrderResponseV2'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
              examples:
                Доступ запрещен:
                  value:
                    code: ERROR.FORBIDDEN
                    message: Доступ запрещен
                    traceId: abb066c61a7c8b74af83f245c7706813
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
              examples:
                Мерчант не найден:
                  value:
                    code: ERROR.NOT_FOUND
                    message: Мерчант с publicId = '%s' не зарегистрирован в сервисе
                    traceId: abbasd2c61a7c8b74af83f245c7706813
                Заказ не найден:
                  value:
                    code: ERROR.NOT_FOUND
                    message: Заказ с id = '%s' не найден
                    traceId: abbasd2c61a7c8b74af83f245c7706814
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
              examples:
                Внутренняя ошибка сервиса:
                  value:
                    code: ERROR.INTERNAL_ERROR
                    message: Внутренняя ошибка сервиса
                    traceId: abb066c61a7c8b74af83f245c7706813
      tags:
      - QR
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /payments/v2/orders/{orderId}/refunds/{refundId}:
    parameters:
    - $ref: '#/components/parameters/orderId'
    - $ref: '#/components/parameters/refundId'
    post:
      summary: Оформление возврата
      x-summary-i18n:
        eng: Refund
      operationId: createRefundOld
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusOldResponse'
      description: 'Метод позволяет выполнить возврат по заказу.


        Метод также позволяет провести возврат плательщику в другой банк. Поддерживаются как полный, так и частичный возвраты.'
      x-description-i18n:
        eng: The method allows you to refund a payment, either full or partial. Also, if it is necessary to make a refund to another number and to another bank, for this you need to fill out bankAlias ​​and phone; during such an operation, the full name of the payer of the original transaction will be checked with the full name of the recipient of the return.
      parameters: []
      tags:
      - QR
      requestBody:
        $ref: '#/components/requestBodies/CreateRefundOldRequest'
      security:
      - secretKey: []
    get:
      summary: Получение статуса возврата
      x-summary-i18n:
        eng: Get information about a refund
      tags:
      - QR
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusOldResponse'
      operationId: getRefundOld
      description: Метод позволяет получить статус по возврату.
      x-description-i18n:
        eng: Getting information about the refund.
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /sbp/v1/refund:
    post:
      summary: Оформление возврата по QRStatic
      operationId: createRefundQRStatic
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusQRStaticResponse'
      requestBody:
        $ref: '#/components/requestBodies/CreateRefundQRStaticRequest'
      tags:
      - QR
      description: Метод позволяет осуществлять полный и частичный возврат по QRStatic.
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /payments/v2/banks:
    parameters: []
    get:
      summary: Получение списка банков для возвратов
      tags:
      - QR
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankListResponse'
              examples:
                Payload:
                  value:
                  - alias: RAIFFEISEN
                    name: Райффайзенбанк
                  - alias: TINKOFF
                    name: Тинькофф
                  - alias: VTB
                    name: ВТБ
      operationId: getBanksForRefunds
      description: Получение списка банков, принимающих возвраты по СБП.
      parameters: []
      x-summary-i18n:
        eng: Get list of banks
      x-description-i18n:
        eng: Get a list of banks accepting SBP payments
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
components:
  schemas:
    SubscriptionAutoCharge:
      type: object
      description: Данные автоматического списания по подписке. Объект передается, если по подписке необходимо взимать деньги на регуряной основе. Используется как альтернатива [методу списания по запросу](#operation/post-sbp-v1-subscriptions-subscriptionId-orders)
      x-description-i18n:
        eng: Automatic recurring charges. Required if subscription has to be paid on regular basis. Used as alternative to the [method of payment on request](#operation/post-sbp-v1-subscriptions-subscriptionId-orders)
      properties:
        frequency:
          type: string
          enum:
          - MONTHLY
          description: Периодичность списания по подписке<br>Если параметр передан, то банк будет автоматически проводить ежемесячное списание средств с клиента.
          x-description-i18n:
            eng: Frequency of recurring charges. If passed, the bank will automatically charge customer once a month. As of now, only monthly frequency is supported
        firstChargeDate:
          type: string
          description: 'Дата первого списания по подписке<br>

            Списание в указанную дату произойдет автоматически, далее – с заданной периодичностью начиная с этой даты. Переданное значение должно быть не меньше 7 дней от текущей даты. Например, при создании подписки 1 января firstChargeDate может быть 8 января или позже.<br>

            Если параметр не передан, то при `frequency` равен `MONTHLY` первое списание по подписке произойдет через месяц после привязки счета клиентом.'
          x-description-i18n:
            eng: 'Date of first subscription charge<br>

              The debit will be automatically debited on the specified date. Then, it will be debited at the specified frequency starting from that date. The value passed must be at least 7 days old. For example, if you create a subscription on January 1st, firstChargeDate could be January 8th or later.

              If the parameter is not passed, then if `frequency` is equal to `MONTHLY`, the first subscription charge will occur one month after the client links the account.'
          example: '2024-01-25'
          format: date
        amount:
          type: number
          description: Сумма ежемесячного списания в рублях. Для копеек доступно два знака после точки.
          x-description-i18n:
            eng: Amount of automatic recurring charges in rubles
          example: 103.32
          exclusiveMinimum: 1
      required:
      - frequency
      - amount
    QRStatic:
      allOf:
      - $ref: '#/components/schemas/CreateQrV2Request'
      - type: object
        properties:
          account:
            $ref: '#/components/schemas/Account'
          additionalInfo:
            $ref: '#/components/schemas/AdditionalInfo'
          amount:
            $ref: '#/components/schemas/Amount'
          amountEditable:
            $ref: '#/components/schemas/AmountEditable'
          currency:
            $ref: '#/components/schemas/Currency'
          order:
            $ref: '#/components/schemas/OrderId'
          paymentDetails:
            $ref: '#/components/schemas/PaymentDetails'
          qrType:
            description: '`QRStatic` может быть оплачен несколько раз. Если будет зарегистрирован статический QR-код без суммы - клиент самостоятельно укажет сумму в мобильном приложении. Подходит для размещения на кассе и в благотворительных фондах.'
            x-description-i18n:
              eng: QR Code type. QRStatic is a static QR code. It can be paid several times. If a static QR code is registered without an amount, the client will independently indicate the amount in the mobile application
            type: string
          qrExpirationDate:
            $ref: '#/components/schemas/ExpirationDate'
          sbpMerchantId:
            type: string
            description: Идентификатор зарегистрированного партнёра в СБП
            x-description-i18n:
              eng: ID of registered partner in SBP
            maxLength: 12
          redirectUrl:
            $ref: '#/components/schemas/RedirectUrl'
          qrDescription:
            type: string
            maxLength: 32
            description: Описание QR-кода<br>Может содержать любую информацию для удобства идентификации конкретного QR-кода. Например, его местоположение или расположение в магазине. Отображается в ЛК и RBO как название QR. Не отображается покупателю и в выписке.
            x-description-i18n:
              eng: QR description<br>May contain any useful information to differentiate between QRs. For example, QR location or where it is placed in the store. It is displayed as QR name in UI of RBO and Raif Pay account. This information is not displayed to customers in banking apps nor in bank statements
          extra:
            $ref: '#/components/schemas/Extra'
        required:
        - order
        - qrType
        - sbpMerchantId
    AmountEditable:
      type: boolean
      description: 'Признак возможности изменения суммы платежа плательщиком.


        Если `amount` не передан, значение по умолчанию — `true`.

        Если `amount` больше `0`, значение по умолчанию — `false`.

        '
      x-description-i18n:
        eng: 'Indicates whether the payer can edit the payment amount.


          If `amount` is omitted, the default value is `true`.

          If `amount` is greater than `0`, the default value is `false`.

          '
    Subscription:
      title: Subscription
      type: object
      properties:
        id:
          type: string
          description: Идентификатор подписки. Рекомендуем использовать длинный формат без возможности перебора, например, использовать формат [UUID v4](https://ru.wikipedia.org/wiki/UUID)
          pattern: ^[A-Za-z0-9-_.]+$
          minLength: 1
          maxLength: 40
        subscriptionPurpose:
          type: string
          description: 'Описание подписки<br>

            Может содержать:<br>

            * Символы латиницы (A-Z и a-z)

            * Символы кириллицы (А-Я и а-я)

            * Цифры 0-9

            * Спецсимволы: `(`, `)`, `!`, `@`, `[`, `]`, `#`, `+`, `=`, `-`, `|`, `.`, `,`'
          pattern: ^[A-Za-zА-Яа-я0-9 ()!@\[\]#+=_\|.,-]+$
          minLength: 1
          maxLength: 140
        autoCharge:
          $ref: '#/components/schemas/SubscriptionAutoCharge'
        extra:
          type: string
          description: Дополнительные поля для свободного заполнения по принципу key-value<br> Если передан объект autoCharge, то в extra необходимо передать ключ, который вернется в теле [callback-уведомления](#operation/сallbackPay). Это позволит соотнести подписку и автоматические платежи по ней
      required:
      - subscriptionPurpose
      description: Данные для оформления подписки. Результат подписки зависит от плательщика.
    OrderComment:
      title: OrderComment
      type: string
      description: 'Комментарий. Доступен в реестрах и Онлайн-Банке. Не может быть пустым или содержать только пробелы. Может содержать:<br>

        • Символы латиницы (A–Z и a–z) <br>

        • Символы кириллицы (А-Я и а-я) <br>

        • Цифры 0-9 <br>

        • Спецсимволы: пробел и `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`<br>

        • Спецсимвол `№`'
      x-description-i18n:
        eng: 'Comment. Cannot be empty or contain only spaces. May contain:<br>

          • Latin symbols (A–Z и a–z); <br>

          • Cyrillic symbols (А-Я и а-я); <br>

          • Digits 0-9;<br>

          • Special symbols: spaces and `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`<br>

          • Special symbol №

          '
      maxLength: 140
      pattern: ^(?=.*\S)[A-Za-zА-Яа-яЁё0-9 !"#$%''()*+,\-./:;=>?@\[\\\]\^_`{\|}~№]+$
      example: Тестовый комментарий
    UpdateQrV2Request:
      type: object
      discriminator:
        propertyName: qrType
        mapping:
          QRStatic: '#/components/schemas/UpdateQRStatic'
      properties:
        qrType:
          type: string
      title: QrType
    OrderStatus:
      title: OrderStatus
      type: object
      description: Статус заказа
      x-description-i18n:
        eng: Order status
      minProperties: 1
      properties:
        value:
          $ref: '#/components/schemas/OrderStatusValue'
        date:
          type: string
          description: Дата создания заказа
          x-description-i18n:
            eng: Order creation date
          format: date-time
          example: '2025-01-10T20:10:00+03:00'
          minLength: 1
    ExpirationDate:
      title: ExpirationDate
      type: string
      description: 'Срок действия<br>

        Может содержать точную дату и время, например `2025-01-10T20:10:00+03:00` или количество минут в формате `+nM`, где n - количество минут. Например, для формирования QR на 2 минуты можно передать: `''+2M''`.<br>

        Параметр не может быть меньше текущей даты и времени.

        Не может быть меньше 1 минуты. Максимальное значение - 90 суток. Если параметр не передан, то по умолчанию QR будет действителен 3 суток<br>

        '
      format: date-time
    DigitalRubleOrder:
      title: DigitalRubleOrder
      allOf:
      - $ref: '#/components/schemas/GetOrderResponseSchema'
    UndefinedOrder:
      title: UndefinedOrder
      allOf:
      - $ref: '#/components/schemas/GetOrderResponseSchema'
    PaymentInfo:
      title: PaymentInfo
      type: object
      properties:
        code:
          type: string
          description: Код сообщения запроса
          default: SUCCESS
          minLength: 1
        transactionId:
          type: number
          description: Идентификатор транзакции
        qrId:
          type: string
          description: Идентификатор QR-кода
          maxLength: 32
          minLength: 1
        sbpMerchantId:
          type: string
