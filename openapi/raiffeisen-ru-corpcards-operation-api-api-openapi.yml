openapi: 3.2.0
info:
  title: Raiffeisen Ru Corpcards Operation API
  x-refined-note:
  - x-description-i18n differs across the merged source definitions and was not carried
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged corpcards-operation-api across 3 of this provider''s published API definitions: raiffeisen-ru-raif-pay-corporate-cards-openapi.json, raiffeisen-ru-corporate-cards-openapi.yml, raiffeisen-ru-raif-pay-corporate-cards-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay-test.raif.ru
  description: Sandbox
- url: https://pay.raif.ru
  description: Production
- url: https://api.raiffeisen.ru/corporate-cards
tags:
- name: corpcards-operation-api
  x-displayName: Операции по картам
  x-x-displayName-i18n:
    eng: Cards operation
  description: 'Для просмотра информации и управления картой Райффайзенбанк предоставляет API:

    * Просмотр списка карт

    * Подробная информация по карте

    * История действий

    * Список операций

    * Реквизиты карты

    * Установка лимитов

    * Блокировка, разблокировка и закрытие карты'
  x-description-i18n:
    eng: 'To view and manage cards, Raiffeisenbank provides the following API:


      * View card list

      * Card details

      * Action history

      * Transaction list

      * Card details

      * Set limits

      * Block, unblock, and close card

      '
paths:
  /api/cards/v1/corporate-cards/cards:
    get:
      operationId: getCardsWithFilterAndPagination
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/AccountInQuery'
      - $ref: '#/components/parameters/ExpiryStartDate'
      - $ref: '#/components/parameters/ExpiryEndDate'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Product'
      - $ref: '#/components/parameters/FullNameParam'
      summary: Список карт
      x-summary-i18n:
        eng: List of cards
      description: Подробная информация о картах с фильтром и пагинацией
      deprecated: true
      x-description-i18n:
        eng: Detailed information about maps with filter and pagination
      tags:
      - corpcards-operation-api
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Страница карт
                x-description-i18n:
                  eng: Page of cards
                properties:
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/CardDto'
        '400':
          $ref: '#/components/responses/400_business_exception'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v1/corporate-cards/cards/{cardId}:
    parameters:
    - $ref: '#/components/parameters/CardId'
    get:
      summary: Информация о карте
      x-summary-i18n:
        eng: Information about card
      operationId: getCardById
      description: Подробная информация по конкретной карте
      deprecated: true
      x-description-i18n:
        eng: Detailed card information
      tags:
      - corpcards-operation-api
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v1/corporate-cards/cards/{cardId}/actions:
    get:
      tags:
      - corpcards-operation-api
      summary: История действий по карте
      x-summary-i18n:
        eng: Card transaction history
      description: Метод получения истории действий с картой
      x-description-i18n:
        eng: Card transaction history request method
      operationId: getCardActionHistory
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/CardActionDto'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v1/corporate-cards/cards/{cardId}/requisites:
    get:
      tags:
      - corpcards-operation-api
      summary: Реквизиты карты
      x-summary-i18n:
        eng: Card Requisites
      description: Получение реквизитов по карте. Инфраструктура клиента должна соответствовать стандартам PCI DSS
      x-description-i18n:
        eng: Obtaining card requisites. The client's infrastructure must comply with PCI DSS standards.
      operationId: getCardRequisites
      parameters:
      - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RequisitesDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v1/operations/cards/{cardId}/limit:
    post:
      tags:
      - corpcards-operation-api
      summary: Установка лимита по карте
      x-summary-i18n:
        eng: Card limit setup
      description: 'На данный момент возможна установка следующих лимитов:

        * суточный лимит на снятие наличных - "period": "DAILY", "type": "CASH"

        * месячный лимит на все операции (безналичные оплаты и снятие наличных) - "period": "MONTHLY", "type": "AUTH".


        Данные лимиты устанавливаются как по отдельности, так и оба единовременно'
      x-description-i18n:
        eng: 'Currently, the following limits can be set:

          * Daily cash withdrawal limit - "period": "DAILY", "type": "CASH"

          * Monthly limit for all transactions (card payments and cash withdrawals) - "period": "MONTHLY", "type": "AUTH"

          These limits can be configured either individually or both simultaneously."

          '
      operationId: setCardLimit
      parameters:
      - $ref: '#/components/parameters/CardId'
      requestBody:
        description: Тело сообщения
        x-description-i18n:
          eng: Request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitDto'
            examples:
              Daily:
                $ref: '#/components/examples/CardLimitDaily'
              Monthly:
                $ref: '#/components/examples/CardLimitMonthly'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v1/operations/cards/{cardId}/status:
    parameters:
    - $ref: '#/components/parameters/CardId'
    post:
      summary: Блокировка, разблокировка и закрытие карты
      x-summary-i18n:
        eng: Blocking, unblocking and closing a card
      description: Метод по закрытию и блокировке/разблокировке карты
      x-description-i18n:
        eng: Method for closing and blocking/unblocking a card
      operationId: changeCardStatus
      tags:
      - corpcards-operation-api
      requestBody:
        description: Change card status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardChangeStatusRequestDto'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v1/transactions/cards/{cardId}:
    get:
      tags:
      - corpcards-operation-api
      summary: Список операций по карте
      x-summary-i18n:
        eng: Card operation history
      description: 'Метод получения списка операций по карте (период не обязательный, если его не указывать то: toDate = текущая дата, fromDate = минус 7 дней от текущей даты)'
      x-description-i18n:
        eng: 'Method for retrieving card transaction list (period is optional; if not specified: toDate = current date, fromDate = current date minus 7 days)'
      operationId: getCardOperations
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/FromDate'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/cards/v2/transactions/cards/{cardId}:
    get:
      tags:
      - corpcards-operation-api
      summary: Список операций по карте
      description: Метод получения списка операций по карте
      operationId: getCardOperationsV2
      x-raif-api-service: system
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/AmountMin'
      - $ref: '#/components/parameters/AmountMax'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/MerchantName'
      responses:
        '200':
          description: Метод завершил работу
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/OperationDtoV2'
              examples:
                Операции успешно получены:
                  $ref: '#/components/examples/OperationDtoV2Example'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/v1/cards:
    get:
      tags:
      - corpcards-operation-api
      summary: Получение информации о картах компании
      x-summary-i18n:
        eng: Getting information about company cards
      operationId: getCards
      parameters:
      - $ref: '#/components/parameters/CardIdParam'
      - $ref: '#/components/parameters/FullNameParam'
      - $ref: '#/components/parameters/Product-2'
      - $ref: '#/components/parameters/AccountInQuery'
      - $ref: '#/components/parameters/ExpiryStartDate'
      - $ref: '#/components/parameters/ExpiryEndDate'
      - $ref: '#/components/parameters/CardStatuses'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/LimitSelectionType'
      responses:
        '200':
          description: Успешный ответ
          x-description-i18n:
            eng: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardInfoPageableBff'
              examples:
                CardInfoPageable:
                  $ref: '#/components/examples/CardInfoExampleBff'
                CardInfoPageableEmpty:
                  $ref: '#/components/examples/CardInfoPageableEmptyExample'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/v1/cards/{cardId}:
    get:
      tags:
      - corpcards-operation-api
      summary: Получение информации о карте
      x-summary-i18n:
        eng: Getting information about company cards
      operationId: getSingleCardByCardId
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/LimitSelectionType'
      responses:
        '200':
          description: Успешный ответ
          x-description-i18n:
            eng: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardInfoDtoBff'
              examples:
                CardInfo:
                  $ref: '#/components/examples/CardInfoExampleBff'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - Authorization: []
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
components:
  schemas:
    Meta:
      type: object
      properties:
        page:
          allOf:
          - $ref: '#/components/schemas/Page'
        size:
          allOf:
          - $ref: '#/components/schemas/Size'
        hasNext:
          allOf:
          - $ref: '#/components/schemas/HasNext'
        count:
          allOf:
          - $ref: '#/components/schemas/Count'
    EmployeeId:
      type: string
      description: Табельный номер сотрудника
      example: 3012345633
    MerchantCountry:
      type: string
      description: Страна торговой точки.
      example: RU
    LimitDto:
      type: array
      items:
        required:
        - type
        - period
        - value
        type: object
        properties:
          type:
            allOf:
            - $ref: '#/components/schemas/LimitType'
          period:
            allOf:
            - $ref: '#/components/schemas/Period'
          value:
            allOf:
            - $ref: '#/components/schemas/LimitValue'
    CardProduct:
      type: object
      properties:
        id:
          type: string
          example: '12345'
        name:
          type: string
          example: MIR_CORPORATE
        value:
          type: string
          example: Универсальная
        imageUrl:
          type: string
          example: http://raif.ru/example/{id}
      required:
      - id
      - name
      - value
    CardType:
      type: string
      description: Тип карты (именная/мгновенная)
      x-description-i18n:
        eng: Card type (named/instant)
        rus: Тип карты (именная/мгновенная)
      enum:
      - NAMED
      - INSTANT
      example: NAMED
    IsActivated:
      type: boolean
      description: Признак активации карты
      x-description-i18n:
        eng: Card activation sign
      example: true
    OperationDtoV2:
      type: object
      required:
      - offset
      - limit
      - totalCount
      - data
      properties:
        offset:
          type: integer
          description: Смещение для пагинации
        limit:
          type: integer
          description: Кол-во возвращаемых элементов
          example: 25
        totalCount:
          type: integer
          description: Общее количество доступных операций, без учёта offset и limit
          example: 3
        data:
          type: array
          items:
            type: object
            required:
            - id
            - accountMovementType
            - extendedNarrative
            - authorization
            - status
            - transaction
            - card
            - merchant
            properties:
              id:
                type: string
                description: Порядковый номер
              accountMovementType:
                allOf:
                - $ref: '#/components/schemas/AccountMovementType'
              extendedNarrative:
                type: string
                description: Описание операции (назначение платежа)
              authorization:
                allOf:
                - $ref: '#/components/schemas/AuthorizationDto'
              status:
                allOf:
                - $ref: '#/components/schemas/StatusDto'
              transaction:
                allOf:
                - $ref: '#/components/schemas/TransactionDto'
              card:
                allOf:
                - $ref: '#/components/schemas/TransactionsCardDto'
              merchant:
                allOf:
                - $ref: '#/components/schemas/MerchantDto'
    CardActionStatusDto:
      type: object
      properties:
        oldStatus:
          type: string
          description: Старое значение статуса
          x-description-i18n:
            eng: Old status
        status:
          type: string
          description: Новое значение статуса
          x-description-i18n:
            eng: New status
        reason:
          allOf:
          - $ref: '#/components/schemas/Reason'
    EmbossedName:
      type: string
      description: Имя на карте
      x-description-i18n:
        eng: Embossed name
      example: TEST TESTOV
    MaskedNumber:
      type: string
      description: Маскированный номер карты
      x-description-i18n:
        eng: Masked card number
      example: 1***56
    Page:
      type: integer
      description: Номер страницы
      x-description-i18n:
        eng: Page number
      example: 1
    DateTime:
      type: string
      description: Дата и время обновления
      format: date-time
      example: '2025-08-29T07:29:26.795033'
    Amount:
      type: string
      description: Сумма операции в рублях
      example: '1000.00'
    ExpiryDateWithMmYy:
      type: string
      description: Срок действия карты
      x-description-i18n:
        eng: Card expiry date
      example: 12/12
    Pan:
      type: string
      description: Номер карты
      x-description-i18n:
        eng: Primary Account Number
      example: '2200000000000000'
    Status:
      type: string
      enum:
      - ACTIVE
      - CLOSED
      - BLOCKED
      description: Статус карты
      x-description-i18n:
        eng: Card Status
      example: CLOSED
    LimitPeriod:
      type: string
      description: Период лимита
      x-description-i18n:
        eng: Limit period
        rus: Название лимита
      enum:
      - MONTHLY
      - DAILY
      - ANNUAL
    Name:
      type: string
      description: Имя
      x-description-i18n:
        eng: Name
      example: Тест
    OperationStatus:
      type: string
      description: Статус операции
      enum:
      - HOLD
      - CANCEL
      - CAPTURE
    CardStatusValue:
      type: object
      description: Объект, описывающий текущий статус карты и время последнего его обновления
      required:
      - value
      - updatedDate
      properties:
        value:
          allOf:
          - $ref: '#/components/schemas/Status'
        updatedDate:
          allOf:
          - $ref: '#/components/schemas/UpdatedDateTime'
    CardInfoPageableBff:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/CardInfoDtoBff'
        offset:
          type: integer
          example: 125
        limit:
          type: integer
          example: 25
        count:
          type: integer
          example: 200
      required:
      - data
      - offset
      - limit
      - count
    CardStatus:
      type: string
      description: Статус для установки
      x-description-i18n:
        eng: Status for installation
      enum:
      - CLOSED
      - BLOCKED
      - ACTIVE
    LimitEntityType:
      type: string
      description: Тип сущности лимита
      x-description-i18n:
        eng: Limit entity type
        rus: Тип сущности лимита
      enum:
      - CARD
      - ACCOUNT
      - CLIENT
    AccountMovementType:
      type: string
      enum:
      - DEBIT
      - CREDIT
    CardActivationStatusValue:
      type: object
      description: Объект, описывающий текущий статус активации карты и время последнего его обновления
      required:
      - value
      properties:
        value:
          allOf:
          - $ref: '#/components/schemas/ActivationStatus'
        updatedDate:
          allOf:
          - $ref: '#/components/schemas/UpdatedDateTime'
    Label:
      type: string
      description: Расшифровка MCC.
      example: Различные продовольственные магазины
    LimitCounterType:
      type: string
      description: Тип счётчика лимита
      x-description-i18n:
        eng: Limit counter type
        rus: Тип счётчика лимита
      enum:
      - QUANTITY
      - AMOUNT
    AccountOwnerResponseDtoV1:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
        cnum:
          allOf:
          - $ref: '#/components/schemas/Cnum'
        balance:
          allOf:
          - $ref: '#/components/schemas/AvailableBalance'
      required:
      - account
      - cnum
    MCC:
      type: string
      description: Код категории товара или услуги (MCC)
      example: '1000'
    Created:
      type: string
