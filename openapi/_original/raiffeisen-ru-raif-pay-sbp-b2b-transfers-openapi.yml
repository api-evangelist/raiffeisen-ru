- name: errors
  x-displayName: Справочник ошибок
  description: 'Стандартный ответ сервиса содержит код сообщения (code).

    Если в процессе обработки запроса произойдет логическая ошибка, API вернет описание
    ошибки (message).


    Описание основных ошибок:


    HTTP-code | code | message

    ----------|------|----------

    400 | INVALID_AMOUNT | The specified amount is invalid. The QR code requires a
    different value.

    400 | INVALID_DATA | The request contains invalid fields or values.

    400 | INVALID_SIGNATURE | The provided signature is invalid.

    400 | INVALID_DIGEST | The provided digest is invalid.

    400 | PAYMENT_ALREADY_SIGNED | The payment has already been signed.

    400 | QR_ALREADY_PAID | The QR code has already been paid.

    409 | QR_IN_PROGRESS | The QR code is processing.

    400 | QR_EXPIRED | The QR code has expired and cannot be processed.

    400 | MISSING_SIGNATURE_DATA | Required signature components are missing from
    the request.

    403 | NON_RESIDENT_RECIPIENT | This recipient''s account cannot be paid.

    403 | OPERATION_FORBIDDEN | The operation is not allowed.

    403 | DBO_BLOCKED | The client does not have an active DBO.

    403 | SBP_DISABLED | The SBP feature is currently disabled.

    404 | PAYMENT_NOT_FOUND | The specified payment was not found.

    404 | BUNDLE_NOT_FOUND | The specified bundle was not found

    404 | QR_NOT_FOUND | The specified QR code was not found.

    500 | INTERNAL_ERROR | An internal error occurred.

    '
paths:
  /api/transfers/v1/qrs/{id}:
    get:
      tags:
      - qr-sender
      summary: Получение данных платёжной ссылки
      operationId: getQr
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id-2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQrResponse'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/transfers/v1/transfers:
    post:
      tags:
      - qr-sender
      summary: Создание одиночного платежа
      operationId: createPayment
      description: 'Метод позволяет создать платёж. Если платёж содержит криптографическую
        подпись (через заголовки ContentDigest и Signature),

        он будет выполнен немедленно. В случае отсутствия подписи платёж направляется
        в раздел [**РБО**](https://sso.rbo.raiffeisen.ru/signin) -> **Договор в работе**
        и требует

        последующего подписания соответствующего документа в этом разделе для его
        исполнения.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: Content-Digest
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/ContentDigest'
      - name: Signature
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/transfers/v1/transfers/{id}:
    get:
      tags:
      - qr-sender
      summary: Получение информации об одиночном платеже
      operationId: getPaymentOld
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/transfers/v1/bundles:
    post:
      tags:
      - qr-sender
      summary: Создание пакета платежей
      operationId: createPaymentBundles
      security:
      - BearerAuth: []
      parameters:
      - name: Content-Digest
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ContentDigest'
      - name: Signature
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentBundleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBundleInfoResponse'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
    x-exclude-for-generate-front: true
  /api/transfers/v1/bundles/{id}:
    get:
      tags:
      - qr-sender
      summary: Получение информации о пакете платежей
      operationId: getPaymentBundleById
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBundleInfoResponse'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
      x-exclude-for-generate-front: true
  /api/v2/b2b/transfers:
    post:
      tags:
      - transfers-v2
      summary: Создание B2B-платежа по QR-коду, ссылке или реквизитам
      operationId: createPaymentV2
      description: 'Метод позволяет создать B2B-платеж. Способ указывается в поле
        `type`:


        - `QR` - по QR-коду или платежной ссылке получателя,

        - `REQUISITES` - по банковским реквизитам получателя.


        Что происходит с платежом дальше, зависит от криптографической подписи:


        - Если запрос подписан заголовками `Content-Digest` и `Signature`, платеж
        исполняется сразу после создания.

        - Если подписи нет, создается документ, который нужно подписать в Райффайзен
        Бизнес Онлайн в разделе «Документы в работе». Платеж уйдет в обработку только
        после подписания.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: Content-Digest
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/ContentDigest'
      - name: Signature
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentV2Request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentV2Response'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/v2/b2b/transfers/{id}:
    get:
      tags:
      - transfers-v2
      summary: Детальная информация о платеже B2B (V2)
      operationId: getPaymentV2
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentV2Response'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/v2/b2b/transfers/bundles:
    post:
      tags:
      - transfers-v2
      summary: Создание пакета B2B-платежей по QR-коду, ссылке или реквизитам
      operationId: createPaymentBundleV2
      description: 'Метод позволяет создать пакет платежей B2B. Пакет может одновременно
        содержать платежи разных типов:


        - `QR` — платёж по QR-коду

        - `REQUISITES` — платёж по реквизитам


        Счёт списания задаётся один раз для всего пакета в поле `account`.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: Content-Digest
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ContentDigest'
      - name: Signature
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentBundleV2Request'
            examples:
              qrPayments:
                $ref: '#/components/examples/CreatePaymentBundleV2QrExample'
              requisitesPayments:
                $ref: '#/components/examples/CreatePaymentBundleV2ReqExample'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBundleV2Response'
              examples:
                qrPayments:
                  $ref: '#/components/examples/PaymentBundleV2QrExample'
                requisitesPayments:
                  $ref: '#/components/examples/PaymentBundleV2ReqExample'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/v2/b2b/transfers/bundles/{id}:
    get:
      tags:
      - transfers-v2
      summary: Получение информации о пакете платежей B2B (V2)
      operationId: getPaymentBundleV2
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBundleV2Response'
              examples:
                qrPayments:
                  $ref: '#/components/examples/PaymentBundleV2QrExample'
                requisitesPayments:
                  $ref: '#/components/examples/PaymentBundleV2ReqExample'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
components:
  securitySchemes:
    BearerAuth:
      type: http
      description: '[Bearer secretKey](#tag/authorization)


        example: eyJ0eXA***

        '
      scheme: bearer
      bearerFormat: JWT
      x-internal: false
  parameters:
    SenderCnum:
      name: senderCnum
      in: query
      description: Cnum компании отправителя
      schema:
        type: string
    SenderLegalName:
      name: senderLegalName
      in: query
      schema:
        type: string
    SenderInn:
      name: senderInn
      in: query
      description: ИНН компании отправителя
      schema:
        type: string
    SenderAccount:
      name: senderAccount
      in: query
      description: Счет списания компании отправителя
      schema:
        type: string
    ReceiverLegalName:
      name: receiverLegalName
      in: query
      description: Название компании получателя
      schema:
        type: string
    ReceiverInn:
      name: receiverInn
      in: query
      description: ИНН компании получателя
      schema:
        type: string
    Status:
      name: status
      in: query
      description: Статус
      schema:
        $ref: '#/components/schemas/NotSignedPaymentStatusesEnum'
    AmountFrom:
      name: amountFrom
      in: query
      description: Сумма от
      schema:
        type: number
        format: float
        minimum: 0.01
    AmountTo:
      name: amountTo
      in: query
      description: Сумма до
      schema:
        type: number
        format: float
        maximum: 1000000
    CreatedDateFrom:
      name: createdDateFrom
      in: query
      description: Дата создания от
      schema:
        type: string
        format: date-time
        example: '2024-06-12T19:36:55+03:00'
    CreatedDateTo:
      name: createdDateTo
      in: query
      description: Дата создания до
      schema:
        type: string
        format: date-time
        example: '2024-06-13T19:36:55+03:00'
    QrId:
      name: qrId
      in: query
      required: false
      description: Идентификатор платежной ссылки (QR)
      schema:
        type: string
    SbpTransactionId:
      name: sbpTransactionId
      in: query
      description: Идентификатор операции в СБП
      schema:
        type: string
    TransactionId:
      name: transactionId
      in: query
      description: Идентификатор операции в банке
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Количество операций в ответе
      schema:
        type: integer
    Offset:
      name: offset
      in: query
      description: Смещение списка операций
      schema:
        type: integer
    Id:
      name: id
      in: path
      required: true
      description: Уникальный идентификатор операции
      schema:
        type: string
    Id-2:
      name: id
      in: path
      required: true
      description: Уникальный идентификатор платёжной ссылки
      schema:
        type: string
        maxLength: 32
    BundleId:
      name: id
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: ^[A-z0-9-_.]$
      description: Уникальный идентификатор пакета
      example: ee64d393836241dcb557
      required: true
    StatusV2:
      name: status
      in: query
      description: Статус
      schema:
        $ref: '#/components/schemas/PaymentV2StatusesEnum'
  schemas:
    NotSignedPaymentStatusesEnum:
      type: string
      description: Статус
      enum:
      - SUCCESS
      - FAILED
      - IN_PROGRESS
      - ON_SIGNING
      - REJECTED_BY_COMPLIANCE
      - PARTLY_SIGNED
      - CANCELLED
      example: SUCCESS
    TransactionId:
      type: string
      pattern: ^[A-z0-9-_.]+$
      description: Уникальный идентификатор операции в вашей системе, используется
        как номер документа в выписке
      example: 1a5cbc843b2742be9093
      minLength: 1
      maxLength: 40
    SenderLegalName:
      type: string
      description: Название компании отправителя
    ReceiverLegalName:
      type: string
      description: Название компании получателя
    NotSignedPaymentStatuses:
      properties:
        value:
          $ref: '#/components/schemas/NotSignedPaymentStatusesEnum'
    SignedPaymentStatusesEnum:
      type: string
      description: Статус
      enum:
      - SUCCESS
      - FAILED
      - IN_PROGRESS
      example: SUCCESS
    PaymentStatus:
      type: object
      description: Статус платежа
      allOf: []
      required:
      - updateDate
      - value
      properties:
        value:
