---
openapi: "3.0.3"
info:
  title: "Рублевые переводы. Импорт платежей в форматах 1С, CSV, XML, MT103 (0.0.3)"
  version: "0.0.3"
  description: "## Описание API\nЭто API предназначено для загрузки пакетов платеж\
    ей в различных форматах (1С, XML, MT103, CSV), используемых в системе РПП (Руб\
    лёвые платежные поручения) Райффайзенбанка.\n"
servers:
- url: "https://api.raiffeisen.ru/domestic-payments"
paths:
  /v2/transfers/import/payment-orders/1C:
    post:
      tags:
      - "domestic-payments"
      summary: "Импорт РПП в формате 1С"
      operationId: "import1CDomesticPayment"
      description: "ВАЖНО: Данный функционал недоступен для клиентов сегмента Фина\
        нсовые институты!  \nИмпорт платежных поручений из файла в формате 1С.\n"
      parameters:
      - name: "notes"
        in: "query"
        description: "Дополнительные примечания"
        required: false
        schema:
          type: "string"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        description: "Файлы в формате 1С"
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                files:
                  type: "array"
                  items:
                    type: "string"
                    format: "binary"
                  description: "Массив файлов в формате 1С"
        required: true
      responses:
        "201":
          description: "Файл сохранен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiShortProcessImportDto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
