  /v1/creditors:
    get:
      description: "Метод получение списка кредиторов по фильтрам"
      operationId: "getCreditors"
      parameters:
      - description: "Номер договора"
        in: "query"
        name: "agreementNumber"
        required: true
        schema:
          example: "АФ-1"
          type: "string"
      - description: "Наименование или ИНН кредитора"
        in: "query"
        name: "search"
        required: false
        schema:
          example: "7777225556"
          type: "string"
      - description: "Статус кредитора"
        examples:
          oneStatus:
            summary: "Пример с одним статусом"
            value:
            - "APPROVED"
          multipleStatuses:
            summary: "Пример с несколькими статусами"
            value:
            - "APPROVED"
            - "REJECTED"
        in: "query"
        name: "statuses"
        required: false
        schema:
          example:
          - "APPROVED"
          items:
            $ref: "#/components/schemas/CreditorStatus"
          type: "array"
      - description: "Количество элементов для сдвига"
        in: "query"
        name: "offset"
        required: true
        schema:
          example: 0
          type: "integer"
      - description: "Ограничение элементов"
        in: "query"
        name: "limit"
        required: true
        schema:
          example: 10
          type: "integer"
