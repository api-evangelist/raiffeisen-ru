                      period:
                        from: '2025-07-24'
                        to: '2025-07-25'
                      clientName: test
                      accounts:
                      - K550987654321
                      totalDueAmount: 100
                      reportDetails:
                      - feeName: test
                        feeAmount: 0
                        debt: 555.01
                        taxAmount: 666.01
                        currency: RUB
                        creationDate: '2025-07-01'
                      reportType: RUB_BALANCES
                    offset: 0
                    limit: 1
                    totalCount: 1
                arrestLoroDailyReports:
                  summary: Отчёт по арестам
                  description: arrestLoroDailyReports
                  value:
                    data:
                    - reportType: ARREST_LORO_DAILY
                      cnum: Z12345
                      period:
                        from: '2025-07-24'
                        to: '2025-07-25'
                      clientName: test
                      accountDetails:
                      - account: K551234567890
                        totalAccountArrests: 111.01
                        arrestAccountStatus: BLOCKED
                        arrestDetails:
                        - arrestStartDate: '2025-07-25'
                          currentArrestSum: 116.9
                          arrestStatus: ACTIVE
                          arrestType: FULL
                          arrestEvents:
                          - arrestNumber: AN123456789
                            arrestOrigin: AO123456789
                            arrestEventStatus: CREATED
                            date: '2025-07-25'
                            arrestType: FULL
                            arrestSum: 116.9
                            timestamp: '2025-07-31T07:48:16.049Z'
                    offset: 0
                    limit: 1
                    totalCount: 1
        '400':
          description: Неверный запрос
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
