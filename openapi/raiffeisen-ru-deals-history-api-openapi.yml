  /v1/deliverable/conversion/blotter:
    post:
      tags:
      - Deals history
      summary: Запрос для получения истории подтверждений сделок
      operationId: deliverableConversionBlotter
      description: Чтобы запросить историю подтверждений сделок заполните параметры фильтрации и сортировки и получите в ответе историю ранее созданных подтверждений сделок с их параметрами
      parameters:
      - in: header
        name: CNUM
        description: Уникальный идентификатор клиента (CNUM)
        required: true
        schema:
          type: string
          example: U12345
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        description: Запросить историю подтверждений сделок
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableConversionBlotterRequest'
            examples:
              Запрос с фильтрацией и сортировкой:
                summary: Запрос с фильтрацией по статусу "Исполнен" и Дате создания
                value:
                  offset: 0
                  limit: 10
                  sort:
                  - property: creationDate
                    direction: DESC
                  filter:
                  - property: status
                    clause:
                    - DONE
                  - property: creationDate
                    clause:
                      from:
                        value: 1769979600000
                        inclusive: true
                      to:
                        value: 1770238799999
                        inclusive: true
      responses:
        '200':
          description: История подтверждений сделок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverableConversionBlotterResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - requestId
                properties:
                  error:
                    type: object
                    description: Объект с кодом ошибки и описанием
                    required:
                    - code
                    properties:
                      code:
                        type: string
                        description: Значение кода ошибки
                      message:
                        type: string
                        description: Описание кода ошибки
                      data:
                        type: array
                        description: Дополнительная информация об ошибке
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              description: Параметр, вызвавший ошибку
                            value:
                              type: string
                              description: Значение параметра
                  requestId:
                    type: string
                    description: Идентификатор запроса
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    DeliverableConversionBlotterResponse:
      type: object
      required:
      - result
      - requestId
      properties:
        result:
          type: object
          description: Объект с результатом исполнения запроса
          required:
          - hasMore
          - list
          properties:
            hasMore:
              type: boolean
              description: Признак наличия других записей в истории, удовлетворяющих параметрам запроса
            list:
              type: array
              description: Массив истории подтверждений сделок
              items:
                $ref: '#/components/schemas/DeliverableConversionBlotterItem'
        requestId:
          type: string
          description: Идентификатор запроса
    BlotterSortItem:
      type: object
      properties:
        property:
          type: string
          description: 'Объект с параметрами сортировки.

            Доступные паарметры (property):

            - creationDate

            - sendDate

            - processingDate

            - creator.signer.name'
        direction:
          type: string
          description: Направление сортировки, с возможными значениями "ASC" или "DESC"
          enum:
          - ASC
          - DESC
    BlotterFilterItem:
      type: object
      required:
      - property
      - clause
      properties:
        property:
          type: string
          description: Параметр фильтрации
          enum:
          - id
          - creationDate
          - processingDate
          - sendDate
          - creator.signer.name
          - tradeDate
          - clientBuyAccount.currency
          - clientSellAccount.currency
          - clientBuyAmount
          - clientSellAmount
          - price
          - participant.signer.name
          - comment
          - status
        clause:
          type: array
          description: Значение фильтра
    DeliverableConversionBlotterItem:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор записи
        clientBuyAccount:
          type: object
          description: Объект с информацией о счете покупки
          required:
          - number
          - currency
          - accountType
          - trustManagementName
          properties:
            number:
              type: string
              description: Номер счета покупки
              example: 12334
            currency:
              type: object
              description: Валюта счета покупки
              required:
              - isoCode
              - numericCode
              properties:
                isoCode:
                  type: string
                  example: RUB
                numericCode:
                  type: string
                  example: 643
            accountType:
              type: string
              description: Тип счета (INTERNAL/EXTERNAL)
              example: EXTERNAL
            trustManagementName:
              type: string
              description: Наименование управляющей компании
              example: null
        clientSellAccount:
          type: object
          description: Объект с информацией о счете продажи
          required:
          - number
          - currency
          - accountType
          - trustManagementName
          properties:
            number:
              type: string
              description: Номер счета продажи
              example: 40817840000000382729
            currency:
              type: object
              description: Валюта счета продажи
              required:
              - isoCode
              - numericCode
              properties:
                isoCode:
                  type: string
                  example: USD
                numericCode:
                  type: string
                  example: 840
            accountType:
              type: string
              description: Тип счета (INTERNAL/EXTERNAL)
              example: INTERNAL
            trustManagementName:
              type: string
              description: Наименование управляющей компании
              example: null
        clientSellAmount:
          type: string
          description: Сумма продажи
        clientBuyAmount:
          type: string
          description: Сумма покупки
        creationDate:
          type: string
          description: Дата создания подтверждения (ISO 8601)
          example: '2025-07-22T13:23:13.507701Z'
        tradeDate:
          type: string
          description: Дата заключения сделки (ISO 8601)
          example: '2025-07-22T13:23:13.507701Z'
        valueDate:
          type: string
          description: Дата расчетов по сделке (ISO 8601)
          example: '2025-07-22T13:23:13.507701Z'
        sendDate:
          type: string
          description: Дата подписания подтверждения (ISO 8601)
          example: '2025-07-22T13:23:13.507701Z'
        processingDate:
          type: string
          description: Дата исполнения подтверждения (ISO 8601)
          example: '2025-07-22T13:27:04.747733Z'
        price:
          type: string
          description: Обменный курс
        creator:
          type: object
          description: Информация о создателе сделки
          required:
          - id
          - name
          properties:
            id:
              type: string
              description: Идентификатор создателя
              example: organization.user.authority.external.id
            name:
              type: string
              description: ФИО создателя
              example: Вячеславов Александр Михайлович
        traders:
          type: array
          description: Список подписантов сделки
          items:
            type: object
            properties:
              id:
                type: string
                description: Идентификатор подписанта
                example: organization.user.authority.external.id
              name:
                type: string
                description: ФИО подписанта
                example: Вячеславов Александр Михайлович
        status:
          type: string
          description: Статус подтверждения
        resultComment:
          type:
          - string
          - 'null'
          description: Комментарий при отклонении подтверждения
        comment:
          type:
          - string
          - 'null'
          description: Комментарий к подтверждению
        conversionAgreementNumber:
          type: string
          description: Номер подтверждения
        confirmDeal:
          type:
          - boolean
          - 'null'
          description: Признак, что подтверждение формируется на основании соглашения об условиях совершения конверсионной сделки
        client:
          type: object
          description: Объект с информацией о клиенте
          required:
          - id
          - name
          - shortName
          - clientType
          properties:
            id:
              type: string
              description: Идентификатор клиента
              example: 409387
            name:
              type: string
              description: Наименование клиента
              example: Авилекс ООО
            shortName:
              type: string
              description: Короткое наименование клиента
              example: Авилекс
            clientType:
              type: string
              description: Тип клиента
              example: REAL
    DeliverableConversionBlotterRequest:
      type: object
      required:
      - offset
      - limit
      properties:
        offset:
          type: integer
          description: Значение смещения строк из истории
        limit:
          type: integer
          description: Ограничение на количество строк из истории, не более 1000 записей в одном запросе
        filter:
          type: array
          description: 'Объект с параметрами фильтрации.

            Доступные фильтры (property):

            - id — номер заявки

            - creationDate — дата создания (from/to)

            - processingDate — дата обработки (from/to)

            - sendDate — дата отправления (from/to)

            - creator.signer.name — автор

            - tradeDate — дата заключения сделки (from/to)

            - clientBuyAccount.currency — валюта зачисления

            - clientSellAccount.currency — валюта списания

            - clientBuyAmount — сумма зачисления

            - clientSellAmount — сумма списания

            - price — обменный курс

            - participant.signer.name — подписант

            - comment — заметка

            - status — статус'
          items:
            $ref: '#/components/schemas/BlotterFilterItem'
        sort:
          type: array
          description: Объект с параметрами сортировки
          items:
            $ref: '#/components/schemas/BlotterSortItem'
  responses:
    Unauthorized:
      description: Аутентификация не пройдена
    InternalError:
      description: Внутренняя ошибка
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
