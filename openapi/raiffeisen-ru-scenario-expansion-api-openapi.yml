            name:
              type: string
              description: '`Тег ФФД — 1227` <br>

                ФИО покупателя (ФФД 1.05)'
              x-description-i18n:
                eng: '`Tag FFD - 1227` <br>

                  Full name of the buyer (FFD 1.05)

                  '
              example: Иванов Иван Иванович
