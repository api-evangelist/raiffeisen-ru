openapi: 3.2.0
info:
  version: '1.0'
  title: платежной формы Payform API
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 178
    x-short-team-name: PAPAS
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: '# Подключение к эквайрингу


    Для подключения заполните заявку в Онлайн-банке или мобильном приложении.'
  x-description-i18n:
    eng: '# Connection to acquiring


      To connect, fill out an application in [the online bank](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) or [the mobile application.](https://rbo.page.link/internet)


      For questions about working with the API, please contact Raiffeisenbank support service:

      - email: ecom@raiffeisen.ru


      ### Preparatory activities

      To accept payments:

      * Fill out the [application](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) to connect acquiring

      * Choose an integration method and implement it

      * Make test payments


      ### Payment page integration methods

      To integrate the payment page, use:

      * A ready-made library that allows you to open a popup for entering payment data and transfer a complex data structure

      * Redirecting the client to the Raiffeisenbank payment page


      # Operation scheme

      ## Bank payment form

      Demonstration of the payment form:


      [Payment form](https://pay.raif.ru/pay/demo.html)


      During the payment process, the user performs the following actions:

      * The user adds goods/services to the store cart and clicks the "Pay" button

      * The partner opens a payment form

      * The user enters the bank card details on the payment form and confirms the payment


      <a href=''images/payment_form_scheme_en.svg'' target=''_blank''><img src=''images/payment_form_scheme_en.svg''></a>


      # API

      Interaction is carried out via the HTTP protocol using the `POST` `GET` `PUT` `DELETE` methods.


      When sending requests to open a payment form and create an order with opening a payment form, the API returns a response in the HTML document format, responses to other requests are returned in JSON format.


      ## Authorization

      To authorize requests, you need:

      * `publicId` - The identifier that is used to open the payment form and is public.

      * `secretKey` - A secret key that is used for inter-service interaction. It is private, must be stored in a secure place and must not be transferred to third parties.


      | Circuit           | URL address       |

      |------------------|-------------------------|

      | Production       |https://pay.raif.ru      |

      | Test             |https://pay-test.raif.ru |


      Inter-service requests are authorized using the secret key `secretKey`. The authorization parameter is passed in the `Authorization` header, the value of which is formed as `Bearer + secretKey`


      You can view the production `publicId` and generate a `secretKey` in the [Online Bank](https://www.rbo.raiffeisen.ru/acquiring/mcp#/), or [Personal Account](https://pay.raif.ru/account/#/auth).


      Instructions for generating `secretKey` can be found in the Help Center:

      * [Generate a secret key in Online Banking](https://help.pay.raif.ru/sbp/rbo/secretkey)

      * [Generate a secret key in your Personal Account](https://help.pay.raif.ru/sbp/lk/secretkey)


      To generate a `secretKey` in the test circuit, you must contact the support service ecom@raiffeisen.ru


      # Testing

      ## Acquiring

      `Bank payment form`:

      | PAN of a bank card| Card validity period| CVV | OTP code| Payment scenario   |

      |-------------------|---------------------|-----|---------|--------------------|

      | 4000001000000018  | 12/35               | 880 |   1234  | Successfull payment|

      | 4000001000000018  | 12/35               | 880 |   1111  | Unsuccessful payment|


      For a full payment testing cycle, you must specify a payment amount greater than 10 rubles.


      ## SBP

      For a full testing cycle, Raiffeisenbank provides the opportunity to use a demo application for QR code payment on behalf of the buyer:

      [WEB application for payment by QR code](https://pay.raif.ru/pay/rfuture/)


      The application can be opened in the browser of any device with a camera. After opening the application, you need to click on the "Scan QR" button (if necessary, allow the browser to access the camera) and scan the image of the test QR code.


      **Bank apps won''t work for QR code payments in the test environment**


      # SDK

      Using JS SDK allows you to open a form from the frontend part in a pop-up window, or redirect the user to the Raiffeisenbank page, which provides a seamless payment scenario for the client.


      Additionally, you can customize the payment form interface and transfer additional parameters for subsequent payment.

      You can customize the visual part of the form (company name, logo, button color) in the [Payment Form Configurator](https://pay.raif.ru/pay/configurator/).


      The payment form configurator also allows you to obtain code for embedding it into a JS library.

      Available SDK:

      * [JS SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-javascript)

      * [PHP SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-php)

      * [NODE SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-node)

      * [JAVA SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-java)


      JS SDK allows you to open a payment form from the frontend of your application. When using other SDKs to work with the payment form, you must either use the methods described in the [[Payment form]](#tag/payform) section yourself, or use the JS SDK additionally.


      Plugins for various CMS can also be found on [GitHub](https://github.com/Raiffeisen-DGTL/).


      Questions regarding solution support can be sent to technical support: ecom@raiffeisen.ru'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: payform
  x-displayName: Платежная форма банка
  x-x-displayName-i18n:
    eng: Bank's payment form
  description: 'Простой способ для интеграции. Клиента необходимо перенаправить на платежную форму, передав параметры заказа.


    [[Схема взаимодействия]](#section/Shema-raboty/Platezhnaya-forma-banka).'
  x-description-i18n:
    eng: 'Easy way to integrate. The client must be redirected to the payment form, passing the order parameters.

      '
paths:
  /pay:
    get:
      servers:
      - url: https://pay-test.raif.ru
        description: Sandbox
      - url: https://pay.raif.ru
        description: Production
      summary: Открытие платежной формы
      x-summary-i18n:
        eng: Opening a payment form
      tags:
      - payform
      responses:
        '200':
          description: OK
      operationId: get-pay
      description: При редиректе клиента на полученный URL откроется форма для оплаты. Для проверки суммы, поступившей от клиента, рекомендуется настроить Уведомление о платеже и сверять суммы созданного заказа и оплаты. Кастомизация интерфейса платежной формы или передача дополнительных полей в данном варианте интеграции недоступна.
      x-description-i18n:
        eng: When the client redirects to the received URL, a form for payment will open. To check the amount received from the client, it is recommended to set up [Payment Notification](https://pay.raif.ru/doc/ecom.html#tag/Callback/operation/%D1%81allbackTransaction) and check the order amount and the amount payment.  Customization of the form interface or transfer of additional fields is not available in this integration option.
      parameters:
      - schema:
          type: string
        in: query
        name: publicId
        description: Идентификатор мерчанта в системе Банка
        x-description-i18n:
          eng: Merchant ID in the Bank system
        required: true
      - schema:
          type: string
          pattern: ^[A-z0-9-_.]+$
          maxLength: 40
          example: order-test
        in: query
        name: orderId
        description: Идентификатор заказа в системе мерчанта
        x-description-i18n:
          eng: Order id
      - schema:
          type: number
          minimum: 0.01
        in: query
        name: amount
        required: true
        description: Сумма платежа в рублях. Для копеек доступно два знака после точки.
        x-description-i18n:
          eng: Payment amount in rubles. The minimum payment by card is 10 rubles. Two signs after the dot are available for kopecks.
      - schema:
          type: string
          maxLength: 140
          format: URL encoded
          example: '%D0%9A%D0%BE%D0%BC%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%80%D0%B8%D0%B9'
        in: query
        name: comment
        description: Комментарий. Не может быть пустым или содержать только пробелы. Может содержать:<br>• Символы латинского алфавита (A–Z и a–z) с десятичными кодами из диапазонов [065-090] и [097-122] в кодировке UTF-8;<br>• Символы русского алфавита (А-Я и а-я) с десятичными кодами из диапазона [1040-1103] в кодировке UTF-8;<br>• Цифры 0-9 с десятичными кодами из диапазона [048-057] в кодировке UTF-8;<br>• Специальные символы с десятичными кодами из диапазонов [032-047], [058-064], [091-096], [123-126] в кодировке UTF-8; - Символ «№» под номером 8470 в кодировке UTF-8
        x-description-i18n:
          eng: Comment. Cannot be empty or contain only spaces. May contain:<br>• Latin alphabet characters (A–Z and a–z) with decimal codes from the ranges [065–090] and [097–122] in UTF-8 encoding;<br>• Symbols of the Russian alphabet (A-Z and a-ya) with decimal codes from the range [1040-1103] in UTF-8 encoding;<br>• Digits 0-9 with decimal codes from the range [048-057] in UTF-8 encoding;<br>• Special characters with decimal codes from the ranges [032-047], [058-064], [091-096], [123-126] in UTF-8 encoding; - Character "№" under number 8470 in UTF-8 encoding'
      - schema:
          type: string
          format: uri
        in: query
        name: successUrl
        description: URL-адрес ресурса, куда будет перенаправлен плательщик в случае успешной оплаты
        x-description-i18n:
          eng: URL of the resource where the client will be redirected in case of successful
      - schema:
          type: string
          format: uri
        in: query
        name: failUrl
        description: URL-адрес ресурса, куда будет перенаправлен плательщик в случае неуспешной оплаты
        x-description-i18n:
          eng: URL of the resource where the client will be redirected in case of payment failure
      - schema:
          type: string
          enum:
          - ONLY_SBP
          - ONLY_ACQUIRING
        in: query
        name: paymentMethod
        description: Метод оплаты
        x-description-i18n:
          eng: Payment method
      - schema:
          type: string
          enum:
          - ru
          - en
          default: ru
        in: query
        name: locale
        description: Язык, используемый в интерфейсе платежной формы
        x-description-i18n:
          eng: Form language
      - schema:
          type: string
          format: YYYY-MM-DDТHH24:MM:SS±HH:MM
        in: query
        name: expirationDate
        description: Срок жизни заказа. YYYY-MM-DDТHH24:MM:SS±HH:MM
        x-description-i18n:
          eng: Lifetime of the order. YYYY-MM-DDТHH24:MM:SS±HH:MM
      - schema:
          type: string
          format: uri
        in: query
        name: successSbpUrl
        description: Ссылка для автоматического возврата плательщика из приложения Банка в приложение или на сайт мерчанта. Ссылка должна содержать https:// для web-страниц или уникальную схему для мобильного приложения
        x-description-i18n:
          eng: Link for automatic redirect of the payer from the banks app to the app or to the stores website. The link must contain https:// for web pages or a unique scheme for a mobile application.
      - schema:
          type: string
          maxLength: 140
          format: URL encoded
        in: query
        name: paymentDetails
        description: Назначение платежа в выписке, используется при оплате по СБП
        x-description-i18n:
          eng: Payment details for statement, only for SBP
    post:
      servers:
      - url: https://pay-test.raif.ru
        description: Sandbox
      - url: https://pay.raif.ru
        description: Production
      summary: Создание заказа с открытием формы
      operationId: post-pay
      responses:
        '200':
          description: OK
          content: {}
        '415':
          $ref: '#/components/responses/Error415Response'
      description: Метод позволяет создать заказ с открытием формы
      requestBody:
        $ref: '#/components/requestBodies/CreateOrderPayFormRequest'
      x-summary-i18n:
        eng: Create a order and open a payment form
      x-codeSamples:
      - lang: JavaScript
        source: "paymentPage.openPopup({\namount: 10.10,\norderId: 'order-test',\nextra: {\n  email: 'test@test.ru',\n  login: 'testLogin',\n  phone: '79191234567'\n  },\nstyle: {\n  button: {\n    backgroundColor: '#ffc800',\n    textColor: '#542595',\n    hoverTextColor: '#ffc800',\n    hoverBackgroundColor: '#542595',\n    borderRadius: '3px'\n          },\n  header: {\n    logo: 'https://www.raiffeisen.ru/common/new/images/logo-raif.svg',\n    titlePlace: 'RIGHT'\n          }\n    },\n  comment: 'Тирольский пирог с яблоками, грушами, ветчиной, сыром, ананасами, 50см'\n          })\n  .then(function() {\n  //console.log(\"Спасибо\");\n          })\n  .catch(function() {\n  //console.log(\"Неудача\");\n          });\n  );\n"
      - lang: Node
        source: "const amount = 10;\nconst orderId = 'testOrder';\nconst query = {\n  successUrl: 'https://test.ru/',\n  receipt: {\n    customer: { ... },\n    items: { ... }\n  }\n};\n\nclient.postPayUrl(amount, orderId, query);\n"
      x-description-i18n:
        eng: Сreate a order and open a payment form
      tags:
      - payform
  /v1/merchants/{publicId}/subscription-form:
    parameters:
    - $ref: '#/components/parameters/publicId'
    post:
      summary: Оформление подписки на форме
      x-summary-i18n:
        eng: Subscribing on the payment form
      operationId: post-v1-merchants-publicId-forms
      responses:
        '200':
          $ref: '#/components/responses/CreateSubscriptionFormResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  value:
                    code: ERROR.BAD_REQUEST
                    message: Некорректная сумма
                    traceId: fb3d0232a3dba2d2490ca1283c6bddd4
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/WL_ERROR_403_FORBIDDEN'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      tags:
      - payform
      requestBody:
        $ref: '#/components/requestBodies/CreateSubscriptionFormRequest'
      description: 'Метод позволяет получить ссылку на форму для привязки счета СБП или карты плательщиком, а также сформировать подписку с автоматическими списаниями.


        После успешного оформления привязки у мерчанта появляется возможность проводить безакцептные списания.'
      x-description-i18n:
        eng: 'This method allows you to obtain a link to the payment form for the payer to link their SBP account or card, as well as to create a subscription with automatic recurring charges.<br>

          After successful binding, the merchant gains the ability to perform unaccepted charges.'
  /v1/merchants/{publicId}/orders:
    parameters:
    - $ref: '#/components/parameters/publicId'
    post:
      summary: Создание заказа с получением платежной ссылки
      x-summary-i18n:
        eng: Creating an order with receiving a payment link
      operationId: post-payments-v1-merchants-publicId-orders-payment-link2
      responses:
        '200':
          $ref: '#/components/responses/CreateOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Некорректное время жизни заказа:
                  value:
                    code: ERROR.BAD_REQUEST
                    message: Некорректно передан параметр expirationDate, минимальное время действия 60 секунд
                    traceId: fb3d0232a3dba2d2490ca1283c6bddd4
                Некорректные суммы:
                  value:
                    code: ERROR.BAD_REQUEST
                    message: Суммы чека и заказа не совпадают
                    traceId: 616de1dcb49f76de332aadf3df5e6b1c
                Ошибка сохранения чека:
                  value:
                    code: ERROR.BAD_REQUEST
                    message: Чек '%s' в статусе '%s', действие невозможно
                    traceId: bc99e7f47c6bc38315321906973f5cf28
                Ошибки валидации в чеке:
                  value:
                    code: ERROR.BAD_REQUEST
                    message: Сумма значений поля 'payments' не совпадает с суммой чека
                    traceId: bc799e7f47c6bc38315321906973f5cf28
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  value:
                    code: ERROR.FORBIDDEN
                    message: Доступ запрещен
                    traceId: abb066c61a7c8b74af83f245c7706813
                Мерчант не найден:
                  value:
                    code: ERROR.FORBIDDEN
                    message: Мерчант с publicId = '%s' не зарегистрирован в сервисе
                    traceId: abbasd2c61a7c8b74af83f245c7706813
                Способ оплаты недоступен:
                  value:
                    code: ERROR.FORBIDDEN
                    message: Нет доступных способов оплаты для мерчанта
                    traceId: abbasd2c61a7c8b74af82345c7706813
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  value:
                    code: ERROR.INTERNAL_ERROR
                    message: Внутренняя ошибка сервиса
                    traceId: abb066c61a7c8b74af83f245c7706813
      description: Метод позволяет сформировать заказ и получить платежную ссылку для последующего редиректа / открытия на стороне мерчанта. Метод также позволяет изменить данные заказа, если заказ уже был сформирован ранее.
      x-description-i18n:
        eng: The method allows you to create an order and get a payment link for subsequent redirect / opening on the merchant side. The method also allows you to change the order details if the order has already been created earlier.
      tags:
      - payform
      requestBody:
        $ref: '#/components/requestBodies/CreateOrderRequest'
      security:
      - secretKey: []
      parameters: []
      x-internal: false
components:
  schemas:
    Extra:
      title: Extra
      type: object
      description: Дополнительные поля в формате key-value. Отображаются в реестрах.
      x-description-i18n:
        eng: Additional fields in key-value format. Displayed in registries
      additionalProperties:
        type: string
    Subscription:
      title: Subscription
      type: object
      description: Данные для оформления подписки и будущих рекурентных платежей. Результат подписки зависит от плательщика. При успешной подписке будет отправлено [[Уведомление о подписке (v2)]](#tag/Callback/operation/subscriptionNotificationV2).
      x-description-i18n:
        eng: Subscription data. Subscription results depend on the payer. If the subscription is successful [[a subscription notification (v2) will be sent to the merchant's address]](#tag/Callback/operation/subscriptionNotificationV2).
      properties:
        id:
          type: string
          description: Идентификатор подписки. Рекомендуем использовать длинный формат без возможности перебора, например, использовать формат [UUIDv4](https://ru.wikipedia.org/wiki/UUID)
          x-description-i18n:
            eng: Subscription ID. We recommend using a long, non-threadable format, such as [UUIDv4](https://ru.wikipedia.org/wiki/UUID)
          maxLength: 40
          example: a7631fbb-f94f-4c17-1e13-0e96a3a77113
          pattern: ^[A-Za-z0-9-_.]+$
        purpose:
          type: string
          description: 'Описание подписки<br>

            Может содержать:<br>

            * Символы латиницы (A-Z и a-z)

            * Символы кириллицы (А-Я и а-я)

            * Цифры 0-9

            * Спецсимволы: `(`, `)`, `!`, `@`, `[`, `]`, `#`, `+`, `=`, `-`, `|`, `.`, `,`'
          x-description-i18n:
            eng: 'Subscription description<br>

              May contain:<br>

              * Latin characters (A-Z и a-z)

              * Cyrillic symbols (А-Я и а-я)

              * Numbers 0-9

              * Special characters: `(`, `)`, `!`, `@`, `[`, `]`, `#`, `+`, `=`, `-`, `|`, `.`, `,`'
          maxLength: 140
          example: Подписка на интернет магазин
          pattern: ^[A-Za-zА-Яа-я0-9 ()!@\[\]#+=_\|.,-]+$
        autoCharge:
          $ref: '#/components/schemas/SubscriptionAutoCharge'
        customer:
          $ref: '#/components/schemas/SubscriptionCustomer'
        autoAcceptance:
          type: boolean
          default: false
          description: 'Флаг для управления привязкой карты. Если флаг установлен в `true`, чекбокс привязки на платежной форме будет установлен по умолчанию на согласие плательщика с привязкой карты.<br>

            Для управления флагом необходима дополнительная настройка со стороны Банка. <br>

            Поле используется только для метода [[Создание заказа с получением платежной ссылки]](#tag/payform/operation/post-payments-v1-merchants-publicId-orders-payment-link2)

            '
          x-description-i18n:
            eng: 'Flag for managing card binding. If the flag is set to `true`, the binding checkbox on the payment form will be checked by default to indicate the payer''s consent to binding the card.<br>

              Additional configuration on the Bank''s side is required to manage this flag. <br>

              The field is only used for the [[Create order with payment link]](#tag/payform/operation/post-payments-v1-merchants-publicId-orders-payment-link2) method

              '
      required:
      - purpose
    SubscriptionAutoCharge:
      title: SubscriptionAutoCharge
      type: object
      description: Данные автоматического списания по подписке. Объект передается, если по подписке необходимо взимать деньги на регулярной основе.
      x-description-i18n:
        eng: Automatic subscription debit data. This item is passed if the subscription requires recurring payments.
      properties:
        frequency:
          type: string
          description: 'Периодичность списания по подписке<br>

            Если параметр передан, то банк будет автоматически проводить ежемесячное списание средств.'
          x-description-i18n:
            eng: 'Subscription debit frequency<br>

              If this parameter is passed, the bank will automatically debit funds monthly.'
          enum:
          - MONTHLY
        firstChargeDate:
          type: string
          format: date
          description: 'Дата первого списания по подписке<br>

            Списание в указанную дату произойдет автоматически, далее – с заданной периодичностью начиная с этой даты. Переданное значение должно быть не меньше 7 дней от текущей даты. Например, при создании подписки 1 января firstChargeDate может быть 8 января или позже.<br>

            Если параметр не передан, то при `frequency` равен `MONTHLY` первое списание по подписке произойдет через месяц после привязки счета клиентом.'
          x-description-i18n:
            eng: 'Date of first subscription charge<br>

              The debit will be automatically debited on the specified date. Then, it will be debited at the specified frequency starting from that date. The value passed must be at least 7 days old. For example, if you create a subscription on January 1st, firstChargeDate could be January 8th or later.

              If the parameter is not passed, then if `frequency` is equal to `MONTHLY`, the first subscription charge will occur one month after the client links the account.'
        amount:
          type: number
          description: Сумма платежа в рублях. Для копеек доступно два знака после точки.
          x-description-i18n:
            eng: Payment amount in rubles. For kopecks, two decimal places are allowed.
          minimum: 1
