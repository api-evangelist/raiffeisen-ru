openapi: 3.2.0
info:
  description: API Факторинга
  title: Финансирование. Факторинг Tariff Plan API
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/factoring
tags:
- description: Тарифный план
  name: TariffPlan
paths:
  /v1/tariff-plans:
    get:
      description: Метод получения тарифных планов по переданным параметрам
      operationId: getTariffPlans
      parameters:
      - description: Идентификатор контракта
        in: query
        name: contractId
        required: false
        schema:
          example: ba705955-3e0f-4956-84e0-e12616e84e2b
          format: uuid
          type: string
      - description: Число записей для смещения для формирования страницы ответа
        in: query
        name: offset
        required: false
        schema:
          example: 10
          type: integer
      - description: Ограничение количества элементов на странице ответа
        in: query
        name: limit
        required: false
        schema:
          example: 2
          type: integer
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                multiple:
                  description: Несколько тарифных планов. Такой результат возможен без указания contractId
