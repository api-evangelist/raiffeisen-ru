---
openapi: "3.1.0"
info:
  title: "Счета и документы"
  description: "Управление счетами на оплату и закрывающими документами"
  version: "1.0.0"
servers:
- url: "https://api.raiffeisen.ru/invoices"
tags:
- name: "bills"
  description: "Управление выставлением счетов на оплату"
- name: "closingDocuments"
  description: "Управление закрывающими документами"
paths:
  /v4/closing-documents/{documentId}:
    get:
      tags:
      - "closingDocuments"
      summary: "Получить детальную информацию о закрывающем документе"
      description: "Возвращает детальную информацию о закрывающем документе по id\
        \ документа"
      operationId: "getDocumentDetails"
      parameters:
      - name: "documentId"
        in: "path"
        required: true
        description: "Идентификатор закрывающего документа"
        schema:
          type: "string"
          format: "uuid"
          example: "c735502b-fb38-4f60-8f06-ba3cb72a7b0e"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingDocumentDetailsResponse"
              examples:
                closingDocumentDetailConsignmentNote:
                  $ref: "#/components/examples/closingDocumentDetailConsignmentNote"
                closingDocumentDetailWorkAct:
                  $ref: "#/components/examples/closingDocumentDetailWorkAct"
                closingDocumentDetailUPD:
                  $ref: "#/components/examples/closingDocumentDetailUPD"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
      - "closingDocuments"
      summary: "Обновить информацию о закрывающем документе"
      description: "Обновляет информацию о закрывающем документе по id документа"
      operationId: "updateDocument"
      parameters:
      - name: "documentId"
        in: "path"
        required: true
        description: "Идентификатор закрывающего документа"
        schema:
          type: "string"
          format: "uuid"
          example: "c735502b-fb38-4f60-8f06-ba3cb72a7b0e"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ConsignmentNoteRequest"
              - $ref: "#/components/schemas/UPDRequest"
              - $ref: "#/components/schemas/WorkActRequest"
            examples:
              consignmentNoteRequest:
                $ref: "#/components/examples/consignmentNoteRequest"
              workActRequest:
                $ref: "#/components/examples/workActRequest"
              updRequest:
                $ref: "#/components/examples/updRequest"
        required: true
      responses:
        "204":
          description: "OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v4/closing-documents:
    get:
      tags:
      - "closingDocuments"
      summary: "Получить список закрывающих документов"
      description: "Возвращает список закрывающих документов"
      operationId: "getDocuments"
      parameters:
      - name: "page"
        in: "query"
        required: false
        description: "Номер страницы для пагинации, нумерация с нуля"
        schema:
          type: "integer"
          format: "int32"
          default: 0
          minimum: 0
          example: 0
      - name: "size"
        in: "query"
        required: false
        description: "Количество элементов на странице"
        schema:
          type: "integer"
          format: "int32"
          default: 30
          maximum: 50
          minimum: 1
          example: 30
      - name: "sumFrom"
        in: "query"
        required: false
        description: "Минимальная сумма документа (включительно) для фильтрации"
        schema:
          type: "number"
          example: 1000.0
      - name: "sumTo"
        in: "query"
        required: false
        description: "Максимальная сумма документа (включительно) для фильтрации"
        schema:
          type: "number"
          example: 500000.0
      - name: "types"
        in: "query"
        required: false
        description: "Список типов закрывающих документов для фильтрации"
        schema:
          type: "array"
          items:
            type: "string"
            description: "Тип закрывающего документа"
            enum:
            - "BILL"
            - "WORK_ACT"
            - "CONSIGNMENT_NOTE"
            - "UPD"
            - "INVOICE_FACTURA"
            example: "WORK_ACT"
          uniqueItems: true
          example:
          - "WORK_ACT"
          - "UPD"
      - name: "periodFrom"
        in: "query"
        required: false
        description: "Начало периода фильтрации по дате документа (включительно)"
        schema:
          type: "string"
          format: "date"
          example: "2026-09-01"
      - name: "periodTo"
        in: "query"
        required: false
        description: "Конец периода фильтрации по дате документа (включительно)"
        schema:
          type: "string"
          format: "date"
          example: "2026-09-30"
      - name: "customerSearchString"
        in: "query"
        required: false
        description: "Строка поиска по контрагенту (наименование или ИНН)"
        schema:
          type: "string"
          example: "ООО Ромашка"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingDocumentListResponse"
              examples:
                closingDocumentListResponse:
                  $ref: "#/components/examples/closingDocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
      - "closingDocuments"
      summary: "Создать закрывающий документ"
      description: "Создает закрывающий документ одного из следующих видов: Товарн\
        ая накладная (ConsignmentNoteRequest), Акт работ (WorkActRequest), УПД (UPDRequest)"
      operationId: "createDocument"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ConsignmentNoteRequest"
              - $ref: "#/components/schemas/UPDRequest"
              - $ref: "#/components/schemas/WorkActRequest"
            examples:
              consignmentNoteRequest:
                $ref: "#/components/examples/consignmentNoteRequest"
              workActRequest:
                $ref: "#/components/examples/workActRequest"
              updRequest:
                $ref: "#/components/examples/updRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingDocumentResponse"
              examples:
                closingDocumentCreateResponse:
                  $ref: "#/components/examples/closingDocumentCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
    delete:
      tags:
      - "closingDocuments"
      summary: "Удалить закрывающие документы"
      description: "Удаляет один или несколько закрывающих документов"
      operationId: "removeDocuments"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentIdsRequest"
            examples:
              closingDocumentDeleteRequest:
                $ref: "#/components/examples/closingDocumentDeleteRequest"
        required: true
      responses:
        "204":
          description: "OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
  /v4/bills/{billId}:
    get:
      tags:
      - "bills"
      summary: "Получить детальную информацию о счете на оплату"
      description: "Возвращает детальную информацию о счете на оплату по id"
      operationId: "getBillDetails"
      parameters:
      - name: "billId"
        in: "path"
        required: true
        description: "Идентификатор счета на оплату"
        schema:
          type: "string"
          format: "uuid"
          example: "60612e6c-d182-4b59-a868-69714a910ee3"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetailsResponse"
              examples:
                billDetailsResponse:
                  $ref: "#/components/examples/billDetailsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
      - "bills"
      summary: "Обновить счет на оплату"
      description: "Обновляет информацию о счете на оплату по id"
      operationId: "updateBill"
      parameters:
      - name: "billId"
        in: "path"
        required: true
        description: "Идентификатор счета на оплату"
        schema:
          type: "string"
          format: "uuid"
          example: "60612e6c-d182-4b59-a868-69714a910ee3"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillUpdateRequest"
            examples:
              billUpdateRequest:
                $ref: "#/components/examples/billUpdateRequest"
        required: true
      responses:
        "204":
          description: "OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v4/bills/status:
    put:
      tags:
      - "bills"
      summary: "Обновить статус счетов"
      description: "Обновить статус одного или нескольких счетов по списку id"
      operationId: "deleteBills"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillStatusUpdateRequest"
            examples:
              billStatusUpdateRequest:
                $ref: "#/components/examples/billStatusUpdateRequest"
        required: true
      responses:
        "204":
          description: "OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
  /v4/closing-documents/{documentId}/file:
    get:
      tags:
      - "closingDocuments"
      summary: "Получить документ в виде файла"
      description: "Возвращает документ (XML или PDF) по его id. Для PDF можно зап\
        росить вариант без информации о формировании документа (параметр withoutGenerationInfo)"
      operationId: "file"
      parameters:
      - name: "documentId"
        in: "path"
        required: true
        description: "Идентификатор закрывающего документа"
        schema:
          type: "string"
          format: "uuid"
          example: "c735502b-fb38-4f60-8f06-ba3cb72a7b0e"
      - name: "docType"
        in: "query"
        required: false
        description: "Формат файла документа"
        schema:
          type: "string"
          enum:
          - "PDF"
          - "XML"
          example: "PDF"
      - name: "withoutGenerationInfo"
        in: "query"
        required: false
        description: "Исключить из PDF блок с информацией о формировании документа"
        schema:
          type: "boolean"
          default: false
          example: false
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/pdf:
              schema:
                type: "string"
                format: "byte"
            application/xml;charset=windows-1251:
              schema:
                type: "string"
                format: "byte"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v4/bills:
    get:
      tags:
      - "bills"
      summary: "Получить список счетов на оплату"
      description: "Возвращает список счетов на оплату с возможностью фильтрации"
      operationId: "getBillList"
      parameters:
      - name: "page"
        in: "query"
        required: false
        description: "Номер страницы для пагинации, нумерация с нуля"
        schema:
          type: "integer"
          format: "int32"
          default: 0
          minimum: 0
          example: 0
      - name: "size"
        in: "query"
        required: false
        description: "Количество элементов на странице"
        schema:
          type: "integer"
          format: "int32"
          default: 30
          maximum: 50
          minimum: 1
          example: 30
      - name: "statuses"
        in: "query"
        required: false
        description: "Список статусов счетов для фильтрации"
        schema:
          type: "array"
          items:
            type: "string"
            description: "Статус счета на оплату"
            enum:
            - "PAYMENT_PENDING"
            - "PAID"
            example: "PAYMENT_PENDING"
          uniqueItems: true
          example:
          - "PAYMENT_PENDING"
      - name: "year"
        in: "query"
        required: false
        description: "Год выставления счета для фильтрации"
        schema:
          type: "integer"
          format: "int32"
          minimum: 1
          example: 2026
      - name: "date"
        in: "query"
        required: false
        description: "Дата выставления счета для точной фильтрации"
        schema:
          type: "string"
          format: "date"
          example: "2026-09-30"
      - name: "periodFrom"
        in: "query"
        required: false
        description: "Начало периода фильтрации по дате выставления счета (включит\
          ельно)"
        schema:
          type: "string"
          format: "date"
          example: "2026-09-01"
      - name: "periodTo"
        in: "query"
        required: false
        description: "Конец периода фильтрации по дате выставления счета (включите\
          льно)"
        schema:
          type: "string"
          format: "date"
          example: "2026-09-30"
      - name: "sumFrom"
        in: "query"
        required: false
        description: "Минимальная сумма счета (включительно) для фильтрации"
        schema:
          type: "number"
          example: 1000.0
      - name: "sumTo"
        in: "query"
        required: false
        description: "Максимальная сумма счета (включительно) для фильтрации"
        schema:
          type: "number"
          example: 500000.0
      - name: "customerSearchString"
        in: "query"
        required: false
        description: "Строка поиска по ИНН плательщика"
        schema:
          type: "string"
          example: "394439302723"
      - name: "query"
        in: "query"
        required: false
        description: "Строка полнотекстового поиска по счету (наименование, номер\
          , контрагент)"
        schema:
          type: "string"
          example: "Услуги по настройке ПО"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageBillMiniResponse"
              examples:
                billListResponse:
                  $ref: "#/components/examples/billListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
      - "bills"
      summary: "Сформировать счет на оплату"
      description: "Сохраняет новый счет на оплату"
      operationId: "saveBill"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillRequest"
            examples:
              billRequest:
                $ref: "#/components/examples/billRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
              examples:
                billResponse:
                  $ref: "#/components/examples/billResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
    delete:
      tags:
      - "bills"
      summary: "Удалить счета на оплату"
      description: "Удалить один или несколько счетов на оплату по списку id"
      operationId: "markBillsRemoved"
      parameters:
      - name: "ids"
        in: "query"
        required: true
        description: "Список идентификаторов счетов на оплату для удаления"
        schema:
          type: "array"
          items:
            type: "string"
            format: "uuid"
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          example:
          - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "204":
          description: "OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v4/bills/{billId}/document:
    get:
      tags:
      - "bills"
      summary: "Получить счет на оплату в виде документа"
      description: "Возвращает счет на оплату в виде документа (XML или PDF) по ег\
        о id. Для PDF можно запросить вариант без информации о формировании докуме\
        нта (параметр withoutGenerationInfo)"
      operationId: "getDocument"
      parameters:
      - name: "billId"
        in: "path"
        required: true
        description: "Идентификатор счета на оплату"
        schema:
          type: "string"
          format: "uuid"
          example: "60612e6c-d182-4b59-a868-69714a910ee3"
      - name: "docType"
        in: "query"
        required: false
        description: "Формат файла документа"
        schema:
          type: "string"
          enum:
          - "PDF"
          - "XML"
          example: "PDF"
      - name: "withoutGenerationInfo"
        in: "query"
        required: false
        description: "Исключить из PDF блок с информацией о формировании документа"
        schema:
          type: "boolean"
          default: false
          example: false
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/xml;charset=windows-1251:
              schema:
                type: "string"
                format: "byte"
            application/pdf:
              schema:
                type: "string"
                format: "byte"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v4/bills/measurements:
    get:
      tags:
      - "bills"
      summary: "Получить список единиц измерения"
      description: "Возвращает список единиц измерения, которые можно использовать\
        \ при сохранении счета на оплату"
      operationId: "getMeasurements"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementResponse"
              examples:
                measurementResponse:
                  $ref: "#/components/examples/measurementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
  /v4/bills/doc-number/next:
    get:
      tags:
      - "bills"
      summary: "Получение следующего свободного номера документа для счета на опла\
        ту"
      description: "Возвращает свободный номер документа, который можно использова\
        ть при сохранении нового счета на оплату"
      operationId: "getNextDocNumber"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocNumberResponse"
              examples:
                docNumberResponse:
                  value:
                    nextDocNumber: "12"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
components:
  schemas:
    ClosingDocumentDetailsResponse:
      type: "object"
      description: "Детальная информация о закрывающем документе"
      properties:
        cnum:
          type: "string"
          description: "Уникальный идентификатор организации"
          example: "UVGASK"
        document:
          oneOf:
          - $ref: "#/components/schemas/ConsignmentNote"
          - $ref: "#/components/schemas/UPD"
          - $ref: "#/components/schemas/WorkAct"
          description: "Содержимое закрывающего документа"
          example:
            type: "UPD"
            status: "2"
        type:
          type: "string"
          description: "Тип закрывающего документа"
          enum:
          - "BILL"
          - "WORK_ACT"
          - "CONSIGNMENT_NOTE"
          - "UPD"
          - "INVOICE_FACTURA"
          example: "UPD"
        linkedDocuments:
          type: "array"
          description: "Связанные со счетом закрывающие документы"
          items:
            $ref: "#/components/schemas/CDDetailsLinkedDocumentResponse"
          example:
          - id: "60612e6c-d182-4b59-a868-69714a910ee3"
            type: "WORK_ACT"
            documentNumber: "35503799"
            documentDate: "2026-09-30"
            totalPrice: 22600.0
            totalVatAmount: 0.0
            items: []
        createdOn:
          type: "string"
          format: "date-time"
          description: "Дата и время создания документа"
          example: "2026-09-30T15:39:26.681Z"
      required:
      - "cnum"
      - "createdOn"
