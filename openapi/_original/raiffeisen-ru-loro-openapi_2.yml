        creationDate:
          type: "string"
          description: "Дата возникновения задолженности"
          format: "date"
          example: "2025-07-01"
      description: "Детали отчёта о дебиторской задолженности"
    OffsetPageDebtLoroReportModelRs:
      required:
      - "data"
      - "limit"
      - "offset"
      - "totalCount"
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/DebtLoroReportModelRs"
        offset:
          type: "integer"
          description: "Смещение, с которого взяты элементы"
          format: "int32"
          example: 0
        limit:
          type: "integer"
          description: "Количество переданных элементов"
          format: "int32"
          example: 10
        totalCount:
          type: "integer"
          description: "Общее количество элементов"
          format: "int64"
          example: 10
    PeriodRs:
      required:
      - "from"
      - "to"
      type: "object"
      properties:
        from:
          type: "string"
          description: "Дата, с которой идёт выборка отчётов"
          format: "date"
          example: "2025-07-24"
        to:
          type: "string"
          description: "Дата, по которую идёт выборка отчётов"
          format: "date"
          example: "2025-07-25"
  responses:
    Unauthorized:
      description: "Аутентификация не пройдена"
    InternalError:
      description: "Внутренняя ошибка"
  parameters:
    IdTokenHeader:
      name: "Id-Token"
      in: "header"
      description: "Идентификационный токен пользователя"
      required: true
      schema:
        type: "string"
        format: "byte"
        example: "SUQgVE9LRU4gRk9SIFRFU1RJTkc="
    AuthorizationHeader:
      name: "Authorization"
      in: "header"
      description: "Токен доступа"
      required: true
      schema:
        type: "string"
        format: "byte"
        example: "Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc="
