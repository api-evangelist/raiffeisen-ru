                          errors: []
                          cqrsVersion: 1742767789
                      financedSupplyTariffs:
                      - id: 0cc43258-7c89-48c1-94ab-7c3885f97576
                        type: FOR_FINANCED_SUPPLY_PERCENT
                        value: 0.123
                        startDate: '2025-05-01'
                        state:
                          status: APPROVED
                          statusDate: '2025-10-16T12:00:01.024991'
                          errors: []
                          cqrsVersion: 1742767789
                      - id: 0cc43258-7c89-48c1-94ab-7c3885f97576
                        type: FOR_FINANCED_SUPPLY_FIX
                        value: 500
                        startDate: '2026-01-12'
                        state:
                          status: APPROVED
                          statusDate: '2025-10-16T12:00:01.024991'
                          errors: []
                          cqrsVersion: 1742767789
                      incomingPaymentOrderHandlingTariffs:
                      - id: 01516372-4465-4b9e-9aa3-19f421849592
