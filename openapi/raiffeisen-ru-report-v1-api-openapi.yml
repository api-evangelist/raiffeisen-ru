        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/{reportId}/status:
    get:
      tags:
      - Report V1
      summary: Получение статуса генерации отчета
      description: Возвращает статус генерации отчета по переданному идентификатору.
      operationId: reportStatus
      parameters:
      - $ref: '#/components/parameters/reportId'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/reportStatus'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportStatus'
        '404':
          $ref: '#/components/responses/reportNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/{reportId}/file:
    get:
      tags:
      - Report V1
      summary: Скачивание файла отчета
      description: Возвращает сгенерированный файл отчета.
      operationId: downloadReportFile
      parameters:
      - $ref: '#/components/parameters/range'
      - $ref: '#/components/parameters/reportId'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/fileContent'
        '400':
          $ref: '#/components/responses/requestValidationErrorFileStorage'
        '404':
          $ref: '#/components/responses/reportNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags:
      - Report V1
      summary: Получение метаданных файла отчета
      description: Возвращает метаданные сгенерированного файла отчета
      operationId: downloadReportFileHead
      parameters:
      - $ref: '#/components/parameters/range'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/reportId'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/fileMetadata'
        '400':
          $ref: '#/components/responses/requestValidationErrorFileStorage'
        '404':
          $ref: '#/components/responses/reportNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    acceptRanges:
      name: Accept-Ranges
      in: header
      description: Стандартное поведение заголовка Accept-Ranges.
      schema:
        type: string
      example: bytes
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
    dryRun:
      name: dryRun
      in: query
      description: "Параметр позволяет выполнить проверку необходимых условий для формирования отчета без запуска генерации. \ntrue - будут выполнены все необходимые проверки перед формированием отчета без запуска генерации. В случае невозможности сгенерировать отчет будет возвращаться ошибка.  \nfalse - проверка необходимых условий для формирования отчета будет выполнена и затем запущена генерация."
      schema:
        type: boolean
        default: false
      example: true
    reportId:
      name: reportId
      in: path
      description: Идентификатор отчета
      required: true
      schema:
        type: string
        format: uuid
      example: f81d4fae-7dec-11d0-a765-00a0c91e6bf6
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: Проверить был ли модифицирован файл по значению заголовка ETag
      schema:
        type: string
      example: b7a68b1bfd796350eebccce70ae597e4
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    range:
      name: Range
      in: header
      description: Скачивать определенный интервал байтов файла
      required: false
      schema:
        type: string
      example: bytes=500-999
    contentLength:
      name: Content-Length
      in: header
      description: Стандартное поведение заголовка Content-Length.
      schema:
        type: string
      example: '1809115'
    eTag:
      name: ETag
      in: header
      description: Идентификатор версии ресурса
      schema:
        type: string
      example: b7a68b1bfd796350eebccce70ae597e4
    contentDisposition:
      name: Content-Disposition
      in: header
      description: Стандартное поведение заголовка Content-Disposition.
      schema:
        type: string
      example: attachment; filename="export_to_pdf_05-05-2025_20-38-50.zip"
  schemas:
    Create1CReportRequest:
      type: object
      properties:
        accountKeys:
          $ref: '#/components/schemas/AccountKeys'
        from:
          $ref: '#/components/schemas/RequestIntervalFrom'
        to:
          $ref: '#/components/schemas/RequestIntervalTo'
        zero:
          $ref: '#/components/schemas/Zero'
        fileName:
          $ref: '#/components/schemas/FileName'
        sort:
          $ref: '#/components/schemas/ReportSort'
        intraday:
          $ref: '#/components/schemas/Intraday'
        debitCreditFilter:
          $ref: '#/components/schemas/DebitCreditFilter'
        includeHolds:
          $ref: '#/components/schemas/IncludeHolds'
        encoding:
          $ref: '#/components/schemas/Encoding1C'
        splitBy:
          $ref: '#/components/schemas/SplitByAccountDate'
        zeroIfNoStatementExpected:
          $ref: '#/components/schemas/ZeroIfNoStatementExpected'
      required:
      - accountKeys
      - from
      - to
    ZeroIfNoStatementExpected:
      type: boolean
      description: Генерировать синтетическую нулевую итоговую выписку, когда обычная выписка не будет генерироваться.
      example: true
      default: false
    ErrorMessage:
      type: string
      description: Сообщение об ошибке
      example: Too many transactions for print
    AccountKeys:
      type: array
      description: 'Бизнес-ключ счета. Формат: `<20-значный номер счета>` или `<20-значный номер счета>:<CNUM>`'
      example:
      - 40701978200000000001:401867
      - '40702810500001306832'
      items:
        type: string
    Encoding1C:
      type: string
      enum:
      - WINDOWS
      - DOS
      description: 'Кодировка файла: WINDOWS - cp1251, DOS - cp866'
      default: WINDOWS
      example: DOS
    OrderBy:
      type: string
      enum:
      - ASC
      - DESC
      description: Направление сортировки
      example: ASC
    CreateXmlReportRequest:
      type: object
      properties:
        accountKeys:
          $ref: '#/components/schemas/AccountKeys'
        from:
          $ref: '#/components/schemas/RequestIntervalFrom'
        to:
          $ref: '#/components/schemas/RequestIntervalTo'
        zero:
          $ref: '#/components/schemas/Zero'
        fileName:
          $ref: '#/components/schemas/FileName'
        sort:
          $ref: '#/components/schemas/ReportSort'
        intraday:
          $ref: '#/components/schemas/Intraday'
        splitBy:
          $ref: '#/components/schemas/SplitByAccount'
      required:
      - accountKeys
      - from
      - to
    SplitByExcel:
      type: string
      enum:
      - ACCOUNT
      - ACCOUNT_DATE
      - MULTIPLE_ACCOUNT_DATE
      description: "Разделить выписки на отдельные файлы и генерировать zip архив. \nACCOUNT - разделить по счетам (в архиве каждый файл будет содержать выписки за период по одному счету), \nACCOUNT_DATE - разделить по счетам и дням (в архиве каждый файл будет содержать выписки по счету за один день),\nMULTIPLE_ACCOUNT_DATE - разделить по дням (в архиве каждый файл будет содержать выписки по нескольким счетам за один день),\nnull - генерируется один файл. \nПо умолчанию генерируется один файл."
      example: ACCOUNT
    FileName:
      type: string
      description: Имя сгенерированного файла
      example: qwerty
    ReportGenerationStatusResponse:
      type: object
      properties:
        reportId:
          $ref: '#/components/schemas/ReportId'
        status:
          type: string
          enum:
          - CREATED
          - STARTED
          - FAILED
          - STOPPED
          - RESTARTED
          - COMPLETED
          - CANCELLED
      required:
      - status
      - reportId
      example:
        reportId: 4c8d9891-4ee9-4ac8-ae2d-e41ad9f5ee10
        status: STARTED
    ErrorType:
      type: string
      enum:
      - BAD_REQUEST
      - STATEMENT_KEY_PARSE_ERROR
      - ACCOUNT_KEY_PARSE_ERROR
      - TRANSACTION_KEY_PARSE_ERROR
      - STMT_FILE_NAME_PARSE_ERROR
      - REPLACEMENTS_PARSE_ERROR
      - TOO_MANY_TRANSACTIONS_ERROR
      - NO_STATEMENTS
      - NO_TRANSACTIONS
