                  Значение отраслевого реквизита. Заполнение регламентируется нормативным актом федерального органа исполнительной власти'
                x-description-i18n:
                  eng: '`The tag FDF — 1265` <br/>

                    The value of the sectoral property. Filling is regulated by the normative act of the federal executive authority'
                example: UUID=2ce10bdb-6515-4d37-be04-dd475b98c728&Time=1692691702067
