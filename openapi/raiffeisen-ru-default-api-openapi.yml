          - DEBT_LORO_MONTHLY
          - DEBT_NFI_MONTHLY
          - RUB_FEE_LORO_MONTHLY
          - ARREST_LORO_DAILY
        example: RUB_BALANCES
      - name: dateFrom
        in: query
        description: Дата отчётов с
        required: true
        schema:
          type: string
          format: date
        example: '2025-07-24'
      - name: dateTo
        in: query
        description: Дата отчётов по
        required: true
        schema:
          type: string
          format: date
        example: '2025-07-25'
      - name: limit
        in: query
        description: Максимальное количество отчётов в ответе, по умолчаниию 10
        required: false
        schema:
          type: integer
        example: 10
      - name: offset
        in: query
        description: Значение смещения строк с отчётами, по умолчанию 0
        required: false
        schema:
          minimum: 0
          type: integer
        example: 0
      - name: sortDirection
        in: query
        description: Направление сортировки, с возможными значениями "ASC" или "DESC"
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
        example: DESC
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
