        `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`,
        `_`, `{`, `|`, `}`, `~`,`№`

        '
      example: Какое-то назначение платежа
    RedirectUrl:
