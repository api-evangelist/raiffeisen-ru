              - value
              properties:
                format:
                  type: string
                  description: Формат кода маркировки
                  x-description-i18n:
                    eng: Marking code format
                  enum:
                  - UNKNOWN
                  - EAN8
                  - EAN13
                  - ITF14
                  - GS1M
                  - SHORT
                  - FUR
                  - EGAIS20
                  - EGAIS30
                  example: GS1M
                value:
                  type: string
                  description: '`Тег ФФД — 1300. Нераспознанный код товара` <br/>

                    `Тег ФФД — 1301. КТ EAN-8` <br/>

                    `Тег ФФД — 1302. КТ EAN-13` <br/>

                    `Тег ФФД — 1303. КТ ITF-14` <br/>

                    `Тег ФФД — 1305. КТ GS1.М` <br/>

                    `Тег ФФД — 1306. КТ КМК, (SHORT)` <br/>

                    `Тег ФФД — 1307. КТ Меховые изделия, (FUR)` <br/>

                    `Тег ФФД — 1308. КТ ЕГАИС-3.0, (EGAIS20)` <br/>

                    `Тег ФФД — 1309. КТ ЕГАИС-3.0, (EGAIS30)` <br/>

                    Код маркировки. Должен соответствовать формату, переданному в параметре format'
                  x-description-i18n:
                    eng: '`The tag FDF — 1300. Undefined item code` <br/>

                      `The tag FDF — 1301. Item code EAN-8` <br/>

                      `The tag FDF — 1302. Item code EAN-13` <br/>

                      `The tag FDF — 1303. Item code ITF-14` <br/>

                      `The tag FDF — 1305. Item code GS1.М` <br/>

                      `The tag FDF — 1306. Item code SHORT` <br/>

                      `The tag FDF — 1307. Item code FUR` <br/>

                      `The tag FDF — 1308. Item code EGAIS20` <br/>

                      `The tag FDF — 1309. Item code EGAIS30` <br/>

                      Marking code. Value must match the format'
                  example: MDEwNDYwNzQyODY3OTA5MDIxNmVKSWpvV0g1NERkVSA5MWZmZDAgOTJzejZrU1BpckFwZk1CZnR2TGJvRTFkbFdDLzU4aEV4UVVxdjdCQmtabWs0PQ==
                plannedStatus:
                  type: integer
                  minimum: 1
                  maximum: 6
                  description: '`Тег 2003 — планируемый статус маркированного торвара` <br/>

                    Только маркировок вида GS1M и SHORT<br/>

                    1 - Штучный товар, подлежащий обязательной маркировке

                    средством идентификации, реализован<br/>

                    2 - Мерный товар, подлежащий обязательной маркировке

                    средством идентификации, в стадии реализации<br/>

                    3 - Штучный товар, подлежащий обязательной маркировке

                    средством идентификации, возвращен<br/>

                    4 - Часть товара, подлежащего обязательной маркировке

                    средством идентификации, возвращена<br/>

                    5 - Штучный товар, подлежащий обязательной маркировке

                    средством идентификации, в стадии реализации<br/>

                    6 - Мерный товар, подлежащий обязательной маркировке

                    средством идентификации, реализован<br/>'
          required:
