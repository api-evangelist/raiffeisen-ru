          type: "string"
          description: "Номер документа"
          example: "1"
        cnum:
          type: "string"
          description: "CNUM организации"
          example: "UVGASK"
        goods:
          $ref: "#/components/schemas/GoodsResponse"
        invoice:
          $ref: "#/components/schemas/Invoice"
          description: "Счёт на оплату"
        payer:
          $ref: "#/components/schemas/Payer"
          description: "Плательщик"
        payee:
          $ref: "#/components/schemas/PayeeResponse"
          description: "Получатель платежа"
        linkedDocuments:
          type: "array"
          description: "Связанные закрывающие документы"
          items:
            $ref: "#/components/schemas/BillDetailsLinkedDocumentResponse"
          example:
          - id: "60612e6c-d182-4b59-a868-69714a910ee3"
