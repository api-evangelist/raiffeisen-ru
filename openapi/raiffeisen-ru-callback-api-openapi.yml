      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingPaymentReusablePaymentLink'
            examples:
              incoming_payment_for_reusable_payment_link:
                $ref: '#/components/examples/IncomingPaymentForReusablePaymentLinkCallbackDto'
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  IncomingInvoicePayment:
    post:
      summary: Уведомление о входящем платеже по выставленному счету
      operationId: sendInvoicePaymentCallback
      tags:
      - Callback
      responses:
        '200':
          description: Нужно вернуть статус 200, чтобы указать, что данные были успешно получены
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentCallback'
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  CallbackPaymentV3:
    post:
      summary: Уведомление об оплате (v3)
      x-summary-i18n:
        eng: Payment notification (v3)
      operationId: callbackPaymentV3
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotificationV3_2'
            examples:
              sbp:
                $ref: '#/components/examples/PaymentNotificationV3SBP'
      parameters:
      - schema:
          type: string
        in: header
