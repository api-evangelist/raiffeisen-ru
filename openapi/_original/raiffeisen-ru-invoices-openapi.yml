      - "cnum"
      - "createdOn"
      - "docNumber"
      - "goods"
      - "id"
      - "invoice"
      - "linkedDocuments"
      - "payee"
      - "payer"
      - "payments"
      - "receipts"
      - "status"
      - "statusIsUpdating"
