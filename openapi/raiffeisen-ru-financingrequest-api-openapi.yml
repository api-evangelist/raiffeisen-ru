      type: object
    SupplyToIncludeInFinancingRequest:
      description: Информация о поставке для включения в запрос на финансирование
      example:
        id: 5675c400-9835-491d-8489-d42ea7ed551c
        cqrsVersion: -1628796591
      properties:
        id:
          description: Идентификатор поставки
          example: 5675c400-9835-491d-8489-d42ea7ed551c
          format: uuid
          type: string
        cqrsVersion:
          description: cqrsVersion поставки
          example: -1628796591
          type: integer
      required:
      - cqrsVersion
      - id
      type: object
    PaginationResponse:
      example:
        offset: 0
        limit: 10
        totalCount: 100
      properties:
        offset:
          description: Число записей для смещения для формирования страницы ответа
          example: 1
