description: 'Official remote MCP server published by Raiffeisenbank (Russia) giving AI assistants access to the public developer
  portal (developer.raif.ru / developer.raiffeisen.ru): documentation in Russian and English, the business-scenario catalog,
  the public API catalog, API variants, operation lists and the current OpenAPI specifications. It is a documentation/discovery
  server; it does not call the banking APIs themselves. Listed in the provider llms.txt and described by a provider-published
  "raifmcp" 1.1.0 document.'
status: live
