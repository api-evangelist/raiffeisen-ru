      tags:
      - Supply
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/supplies/change-status-to-retired:
    post:
      description: Метод массового удаления поставок через перевод в статус RETIRED
      operationId: changeSupplyStatusesToRetired
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: Массовое удаление поставок
                value:
                - id: 2c44306f-fc96-4780-9b37-6447273b190e
                  cqrsVersion: -1628796591
                - id: 6f143f0a-5393-4e37-a5c7-2d21d0778f4e
                  cqrsVersion: -1628796592
            schema:
              $ref: '#/components/schemas/ChangeSuppliesStatusToRetiredRequest'
        description: Параметры для массового удаления поставок
        required: true
      responses:
        '200':
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: BAD_REQUEST
        '401':
