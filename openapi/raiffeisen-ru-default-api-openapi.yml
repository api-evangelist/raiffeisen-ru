    servers:
    - url: https://api.raiffeisen.ru/permissions
components:
  schemas:
    TokenRevocationRequestDTO:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: Access Token или Refresh Token, который нужно отозвать.
        token_type_hint:
          type: string
          enum:
          - access_token
          - refresh_token
          description: Подсказка о типе переданного токена.
        client_id:
          type: string
          description: Идентификатор клиента (выдается Райффайзен Банком после подачи заявления на подключение).
        client_secret:
          type: string
          description: Пароль клиента (указывается при подключении системы клиента к Райффайзен Банку).
    OAuth2ErrorDTO:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Код ошибки.
        error_description:
          type: string
          description: Описание ошибки.
    PublicJwksResponseDTO:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          description: Публичные RSA-ключи для проверки подписи JWT.
          items:
            type: object
            required:
            - kty
            - kid
            - use
            - alg
            - n
            - e
            properties:
              kty:
                type: string
                description: Тип ключа.
                example: RSA
              kid:
                type: string
                description: Идентификатор ключа, соответствующий заголовку kid проверяемого JWT.
              use:
                type: string
                description: Назначение ключа.
                example: sig
              alg:
                type: string
                description: Алгоритм подписи.
                example: RS256
              n:
                type: string
                description: Модуль RSA в формате Base64url.
              e:
                type: string
                description: Публичная экспонента RSA в формате Base64url.
                example: AQAB
    TokenResponseDTO:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: Access Token в формате JWT.
        expires_in:
          type: integer
          description: Время действия токена в секундах.
        token_type:
          type: string
          enum:
          - Bearer
          description: Тип токена.
        scope:
          type: string
          description: Выданные привилегии доступа (значения указываются через пробел).
        refresh_token:
          type: string
          description: Refresh Token.
        id_token:
          type: string
          description: ID Token в формате JWT при использовании OpenID Connect (scope openid).
        refresh_expires_at:
          type: integer
          description: Время завершения действия Refresh токена (Epoch Unix Timestamp).
    TokenRequestDTO:
      type: object
      required:
      - grant_type
      properties:
        grant_type:
          type: string
          enum:
          - authorization_code
          - refresh_token
          description: 'Тип взаимодействия, в рамках которого происходит получение токенов:

            - `authorization_code` для получения токенов по Authorization Code (Code Flow);

            - `refresh_token` для получения новых токенов по Refresh токену.'
        code:
          type: string
          description: "Authorization Code (обязательный параметр для grant_type=authorization_code), \nзначение переданное в параметре code после успешной аутентификации пользователя и \nперенаправлении на redirect_uri клиентского приложения."
        code_verifier:
          type: string
          description: 'Криптографически стойкая случайно сгенерированная строка,

            которая согласно стандарту PKCE (RFC 7636) использовалась для генерации значения `code_challenge`

            в запросе GET /oauth2/authorize (обязательный параметр для grant_type=authorization_code).'
        client_id:
          type: string
          description: Идентификатор клиента (выдается Райффайзен Банком после подачи заявления на подключение).
        client_secret:
          type: string
          description: Пароль клиента (указывается при подключении системы клиента к Райффайзен Банку).
        redirect_uri:
          type: string
          description: "URI, на который сервис аутентификации перенаправляет пользователя после прохождения аутентификации \n(указывается при подключении системы клиента к Райффайзен Банку)."
        refresh_token:
          type: string
          description: Refresh токен (обязательный параметр для grant_type=refresh_token).
    LoginViewDataDTO:
      type: object
      required:
      - pageType
      - pageData
      description: 'JSON данные, встроенные в HTML страницу /login внутри script#viewData с типом application/json.

        Эти данные используются React SPA для отображения формы входа и отправки credentials.'
      properties:
        pageType:
          type: string
          enum:
          - LOGIN_FORM_STEP
          example: LOGIN_FORM_STEP
        pageData:
          type: object
          required:
          - authenticationFlowContext
          - stepViewData
          - themeViewData
          - errors
          properties:
            authenticationFlowContext:
              type: object
              required:
              - authenticationFlowId
              - authPageRefreshTtlMs
              - deviceId
              - csrf
              properties:
                authenticationFlowId:
                  type: string
                  description: Уникальный идентификатор текущего authentication flow
                  example: 8379e3cb-50b2-47b4-8f4f-ea8d250a1d66
                authPageRefreshTtlMs:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  description: TTL до обновления auth page в миллисекундах.
                deviceId:
                  type:
                  - string
                  - 'null'
                  description: Идентификатор устройства, если он известен.
                csrf:
                  type: string
                  description: CSRF токен для POST `/login`.
            stepViewData:
              description: 'Тип и дополнительные данные текущего шага. Дополнительные поля зависят от `stepType` и передаются

                на том же уровне, без вложенного объекта `attributes`. Поле `attributesType`, используемое при

                хранении authentication flow, в page data не передаётся.'
              discriminator:
                propertyName: stepType
                mapping:
                  username-password: '#/components/schemas/UsernamePasswordStepViewDataDTO'
                  password: '#/components/schemas/PasswordStepViewDataDTO'
                  phone: '#/components/schemas/PhoneStepViewDataDTO'
                  sms-otp: '#/components/schemas/SmsOtpStepViewDataDTO'
                  email-otp: '#/components/schemas/EmailOtpStepViewDataDTO'
                  consent: '#/components/schemas/ConsentStepViewDataDTO'
              oneOf:
              - $ref: '#/components/schemas/UsernamePasswordStepViewDataDTO'
              - $ref: '#/components/schemas/PasswordStepViewDataDTO'
              - $ref: '#/components/schemas/PhoneStepViewDataDTO'
              - $ref: '#/components/schemas/SmsOtpStepViewDataDTO'
              - $ref: '#/components/schemas/EmailOtpStepViewDataDTO'
              - $ref: '#/components/schemas/ConsentStepViewDataDTO'
              - type: 'null'
            themeViewData:
              type:
              - object
              - 'null'
              description: Данные login-страницы, предоставленные выбранной frontend-темой.
              properties:
                passwordResetEnabled:
                  type: boolean
                  description: Включён ли переход на форму запроса сброса пароля.
                supportDrawer:
                  $ref: '#/components/schemas/SupportDrawerByLocaleDTO'
                systemMessages:
                  $ref: '#/components/schemas/SystemMessagesByLocaleDTO'
            errors:
              $ref: '#/components/schemas/LoginFormErrorDetails'
        locale:
          description: Выбранная локаль формы входа.
          oneOf:
          - $ref: '#/components/schemas/SupportedLocale'
          - type: 'null'
          example: en
    EmailOtpStepViewDataDTO:
      type: object
      additionalProperties: false
      required:
      - stepType
      properties:
        stepType:
          type: string
          const: email-otp
        viewType:
          type: string
          enum:
          - secondFactor
        emailOtpProcessId:
          type:
          - string
          - 'null'
          format: uuid
          description: Идентификатор email OTP процесса.
    ErrorPageDataDTO:
      type: object
      required:
      - pageType
      - pageData
      description: 'JSON данные, встроенные в HTML страницу /error внутри script#viewData с типом application/json.

        Эти данные используются React SPA для отображения error page.'
      properties:
        pageType:
          type: string
          enum:
          - ERROR
          example: ERROR
        pageData:
          type: object
          required:
          - errorPageContext
          - errorDetails
          properties:
            errorPageContext:
              type: object
              required:
              - csrf
              properties:
                csrf:
                  type: string
                  description: CSRF токен для background-запросов со страницы ошибки.
                  example: 2m08G2v6RpNUyxbz85Jq6uJ0xSXXsxA_gRZ4Nky5BBdOzltU6gwKIg_IJaR5-HfEwr9e2NtC6ETji3UStyIeVX6KMi5592ls
            errorDetails:
              type: object
              required:
              - errorCode
              - actions
              properties:
                errorCode:
                  type: string
                  description: 'Код ошибки для frontend error page.

                    Возможные значения:

                    - `unknown-error` — неизвестная ошибка

                    - `fatal-error` — фатальная ошибка

                    - `user-is-blocked` — пользователь заблокирован

                    - `consent.*` — ошибки шага consent

                    - `authenticate.sms-otp.*` — ошибки аутентификации SMS-OTP

                    - `challenge.sms-otp.*` — ошибки ввода SMS-OTP кода'
                  example: unknown-error
                actions:
                  type: array
                  description: Список действий, доступных пользователю на странице ошибки.
                  items:
                    $ref: '#/components/schemas/ErrorActionItemDTO'
    PhoneStepViewDataDTO:
      type: object
      additionalProperties: false
      required:
      - stepType
      properties:
        stepType:
          type: string
          const: phone
        viewType:
          type: string
          enum:
          - default
        principal:
          type:
          - string
          - 'null'
          description: Ранее введённый идентификатор пользователя.
        captchaRequired:
          type: boolean
          description: Требуется ли CAPTCHA для текущей формы.
    ErrorActionItemDTO:
      type: object
      required:
      - action
      description: 'Действие, доступное пользователю на странице ошибки.

        Каждое действие отображается как кнопка или ссылка на error page.'
      properties:
        action:
          type: string
          description: 'Тип действия:

            - `RELOAD` — обновление страницы (редирект на /login)

            - `RETRY_LOGIN` — повторная попытка входа (редирект на /login/restart для перезапуска flow)

            - `REDIRECT` — редирект на внешний URL'
