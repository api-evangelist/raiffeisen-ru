openapi: 3.2.0
info:
  title: Управление кодами внесения АДМ Payer Email Change API
  version: 1.0.0
  description: '# Общая информация


    Данный раздел описывает методы для просмотра и управления выпущенными кодами внесения АДМ, включая:

    - Получение списка кодов

    - Фильтрация по ключевым атрибутам

    - Получение детальной информации о коде

    - Блокировка кода

    - Изменение электронной почты для получения чеков'
servers:
- url: https://api.raiffeisen.ru/adm
tags:
- name: payer-email-change
  description: ''
paths:
  /v1/codes/{id}:
    patch:
      tags:
      - payer-email-change
      summary: Изменение параметров кода
      description: 'Выполняет операции изменения email плательщика.


        Поддерживаемые поля для обновления:

        - `email` — email плательщика (необходима для отправки электронных чеков)


        Метод выполняет частичное обновление ресурса в стиле JSON Merge Patch.'
      operationId: updateCode
      parameters:
      - $ref: '#/components/parameters/CodeId'
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCodeRequest'
            examples:
              Обновление email:
                $ref: '#/components/examples/UpdateCodeRequestExample'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'
              examples:
                Код обновлён:
                  $ref: '#/components/examples/CodeDetailsResponseExample'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              examples:
                Ошибка валидации:
                  $ref: '#/components/examples/BadRequestErrorExample'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              examples:
                Ресурс не найден:
                  $ref: '#/components/examples/NotFoundErrorExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    BadRequestErrorResponse:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          example: INVALID_DATA
        message:
          type: string
          example: The request contains invalid fields or values
        traceId:
          type: string
          example: 84b19a21e19410b62c30b4cd40c228a1
    NotFoundErrorResponse:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: The resource not found
        traceId:
          type: string
          example: 84b19a21e19410b62c30b4cd40c228a1
    Person:
      type: object
      required:
      - surname
      - name
      - birthDate
      - cnum
      properties:
        surname:
          type: string
          description: Фамилия
          example: Иванов
        name:
          type: string
          description: Имя
          example: Иван
        patronymic:
          type: string
          description: Отчество
          example: Иванович
        birthDate:
          type: string
          format: date
          description: Дата рождения
          example: '2007-07-04'
        email:
          type:
          - string
          - 'null'
          format: email
          description: Email плательщика
          example: test@test.ru
        cnum:
          type: string
          description: Клиентский номер плательщика
          example: ADWCF1
    UpdateCodeRequest:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: Новый email плательщика
          example: newemail@client.com
      example:
        email: newemail@client.com
    Code:
      type: object
      required:
      - id
      - available
      - createDate
      - updateDate
      - customer
      - person
      properties:
        id:
          type: string
          description: Идентификатор кода
          example: '12345678'
        available:
          type: boolean
          description: Доступен ли код
          example: true
        createDate:
          type: string
          format: date-time
          description: Дата создания записи
          example: '2025-07-16T08:29:31.93956Z'
        updateDate:
          type: string
          format: date-time
          description: Дата последнего обновления
          example: '2025-07-31T19:13:15.331124Z'
        customer:
          $ref: '#/components/schemas/Customer'
        person:
          $ref: '#/components/schemas/Person'
    Customer:
      type: object
      required:
      - cnum
      - name
      - inn
      properties:
        cnum:
          type: string
          description: Клиентский номер компании
          example: '123456'
        name:
          type: string
          description: Наименование компании
          example: Тестовая компания
        inn:
          type: string
          description: ИНН компании
          pattern: ^[0-9]{10}$|^$
          example: '7701000001'
  examples:
    UpdateCodeRequestExample:
      summary: Пример обновления email
      value:
        email: newemail@client.com
    CodeDetailsResponseExample:
      summary: Пример детальной информации о коде
      value:
        id: '12345678'
        available: true
        createDate: '2025-07-16T08:29:31.93956Z'
        updateDate: '2025-07-31T19:13:15.331124Z'
        customer:
          cnum: '123456'
          name: Тестовая компания
          inn: '7701000001'
        person:
          surname: Иванов
          name: Иван
          patronymic: Иванович
          birthDate: '2007-07-04'
          email: test@test.ru
          cnum: ADWCF1
    BadRequestErrorExample:
      summary: Пример ошибки валидации
      value:
        code: INVALID_DATA
        message: The request contains invalid fields or values
        traceId: 84b19a21e19410b62c30b4cd40c228a1
    NotFoundErrorExample:
      summary: Пример ошибки "ресурс не найден"
      value:
        code: RESOURCE_NOT_FOUND
        message: The resource not found
        traceId: 84b19a21e19410b62c30b4cd40c228a1
  responses:
    Unauthorized:
      description: Аутентификация не пройдена
    InternalError:
      description: Внутренняя ошибка
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    CodeId:
      name: id
      in: path
      required: true
      description: Идентификатор кода
      schema:
        type: string
        example: '78901211'
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
