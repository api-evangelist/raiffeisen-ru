    WebinarV2Resource:
      type: object
      description: ''
      example:
        id: id
        new: true
        status: PUBLISHED
        eventStatus: STARTED
        eventStatusLabel: В эфире
        title: Ключевую ставку, вероятно, не снизят до конца года
        body: '**Центробанк не изменил ключевую ставку, но ужесточил риторику**


          7 июня прошло заседание Центробанка по ключевой ставке. Регулятор, как мы и ожидали, решил оставить ее на уровне 16%. На пресс-конференции Эльвира Набиуллина отметила, что также были рассмотрены варианты повышения на 100 и 200 базисных пунктов. 


          По нашим оценкам, Центробанк ужесточил риторику. Во-первых, он «допускает возможность повышения ключевой ставки на ближайшем заседании» — для прошлых заседаний такое указание не публиковалось. Во-вторых, регулятор выделил, что жесткие денежно-кредитные условия необходимо поддерживать существенно дольше, чем планировалось раньше.


          Такая риторика связана с ценовой динамикой, которая, видимо, не позволяет в этом году приблизить инфляцию к целевому уровню. Так, в апреле регулятор планировал замедление до диапазона 4,3–4,8% в 2024 году и до 4% в 2025 году. Но в этот раз цель на 2024 год была убрана из пресс-релиза.


          **Регулятор отложил вопрос о необходимости повысить ключевую ставку до конца июля**


          До заседания в конце июля Центробанк планирует анализировать соответствие основных показателей базовому сценарию. 


          Мы полагаем, что отклонение от него будет означать необходимость дополнительно повысить ключевую ставку. Эльвира Набиуллина заявила, что шаг в таком случае будет существенным — от 1 процентного пункта. Сейчас Центробанк считает этот сценарий альтернативным. Риски его реализации высоки. 


          Вместе с тем вопрос о возможном снижении ключевой ставки временно снят с обсуждения. Вряд ли регулятор вернется к его рассмотрению до конца года.


