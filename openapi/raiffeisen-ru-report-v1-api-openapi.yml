openapi: 3.2.0
info:
  title: Выписки Report V1 API
  description: API для генерации и получения выписок в различных форматах.
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/bank-statements
tags:
- name: Report V1
paths:
  /v1/reports/xml:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате XML
      description: Генерация XML отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: xmlRequest
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateXmlReportRequest'
            examples:
              xmlRequestOnlyRequired:
                $ref: '#/components/examples/xmlRequestOnlyRequired'
              xmlRequestAllFields:
                $ref: '#/components/examples/xmlRequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/excel:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате Excel
      description: Генерация Excel отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: excelRequest
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExcelReportRequest'
            examples:
              excelRequestOnlyRequired:
                $ref: '#/components/examples/excelRequestOnlyRequired'
              excelRequestAllFields:
                $ref: '#/components/examples/excelRequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/mt-942:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате MT942
      description: Генерация MT942 отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: mt942Request
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        description: Для MT942 валидируется условие "from" == "to" == "текущая дата".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMt942ReportRequest'
            examples:
              mt942RequestOnlyRequired:
                $ref: '#/components/examples/mt942RequestOnlyRequired'
              mt942RequestAllFields:
                $ref: '#/components/examples/mt942RequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/mt-942-delta:
    post:
      tags:
      - Report V1
      summary: Генерация инкрементальной внутридневной выписки в формате MT942
      description: 'Генерация инкрементального MT942 отчета за текущий день по переданным параметрам запроса.

        В ответе возвращается идентификатор генерации отчета.


        Для получения первой инкрементальной выписки за текущую дату отправьте запрос

        без параметра lastStatementNumber.

        Для получения следующих инкрементов укажите в параметре lastStatementNumber

        номер ранее полученной инкрементальной выписки (поле 28С).


        В течение календарного года номера инкрементальных выписок начинаются с 1 и последовательно увеличиваются,

        в начале нового календарного года нумерация снова начинается с 1.'
      operationId: mt942DeltaRequest
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMt942DeltaReportRequest'
            examples:
              mt942RequestOnlyRequired:
                $ref: '#/components/examples/mt942DeltaRequestOnlyRequired'
              mt942RequestAllFields:
                $ref: '#/components/examples/mt942DeltaRequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/mt-940:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате MT940
      description: Генерация MT940 отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: mt940Request
      parameters:
