                    totalCount: 10
              schema:
                $ref: "#/components/schemas/CreditorPageResponse"
          description: "OK"
        "400":
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: "REST_ERR_5001"
                    message: "General service error"
                    traceId: "29bda8ca-4d33-11ec-81d3-0242ac130000"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
