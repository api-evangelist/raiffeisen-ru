          type: "boolean"
          description: "Признак того, что статус счета сейчас обновляется"
          example: false
        createdOn:
          type: "string"
          format: "date-time"
          description: "Дата и время создания счета"
          example: "2026-09-30T10:19:26Z"
        receipts:
          type: "array"
          description: "Связанные чеки самозанятых"
          items:
            type: "string"
            format: "uuid"
          example:
          - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
