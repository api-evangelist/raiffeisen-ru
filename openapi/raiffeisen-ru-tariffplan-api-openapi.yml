                one-with-all-tariffs:
                  description: Один тарифный план. У данного тарифа заданы все возможные типы тарифов. Такой результат возможен при указании contractId
                  summary: Тарифный план со всеми доступными тарифами
                  value:
                    tariffPlans:
                    - id: 87c4b6c5-4340-4b01-b910-8736420178d2
                      contractId: 4f7d974a-dd63-421b-ba2b-712da215b86b
                      financingTariffs:
                      - id: 7591a148-5ccb-4b53-984d-1a6cb0f3c72c
                        type: FOR_FINANCE_PERCENT
