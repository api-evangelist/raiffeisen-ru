openapi: 3.2.0
info:
  version: '1.0'
  title: платежной формы Pay Controller API
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 178
    x-short-team-name: PAPAS
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: '# Подключение к эквайрингу


    Для подключения заполните заявку в Онлайн-банке или мобильном приложении.'
  x-description-i18n:
    eng: '# Connection to acquiring


      To connect, fill out an application in [the online bank](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) or [the mobile application.](https://rbo.page.link/internet)


      For questions about working with the API, please contact Raiffeisenbank support service:

      - email: ecom@raiffeisen.ru


      ### Preparatory activities

      To accept payments:

      * Fill out the [application](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) to connect acquiring

      * Choose an integration method and implement it

      * Make test payments


      ### Payment page integration methods

      To integrate the payment page, use:

      * A ready-made library that allows you to open a popup for entering payment data and transfer a complex data structure

      * Redirecting the client to the Raiffeisenbank payment page


      # Operation scheme

      ## Bank payment form

      Demonstration of the payment form:


      [Payment form](https://pay.raif.ru/pay/demo.html)


      During the payment process, the user performs the following actions:

      * The user adds goods/services to the store cart and clicks the "Pay" button

      * The partner opens a payment form

      * The user enters the bank card details on the payment form and confirms the payment


      <a href=''images/payment_form_scheme_en.svg'' target=''_blank''><img src=''images/payment_form_scheme_en.svg''></a>


      # API

      Interaction is carried out via the HTTP protocol using the `POST` `GET` `PUT` `DELETE` methods.


      When sending requests to open a payment form and create an order with opening a payment form, the API returns a response in the HTML document format, responses to other requests are returned in JSON format.


      ## Authorization

      To authorize requests, you need:

      * `publicId` - The identifier that is used to open the payment form and is public.

      * `secretKey` - A secret key that is used for inter-service interaction. It is private, must be stored in a secure place and must not be transferred to third parties.


      | Circuit           | URL address       |

      |------------------|-------------------------|

      | Production       |https://pay.raif.ru      |

      | Test             |https://pay-test.raif.ru |


      Inter-service requests are authorized using the secret key `secretKey`. The authorization parameter is passed in the `Authorization` header, the value of which is formed as `Bearer + secretKey`


      You can view the production `publicId` and generate a `secretKey` in the [Online Bank](https://www.rbo.raiffeisen.ru/acquiring/mcp#/), or [Personal Account](https://pay.raif.ru/account/#/auth).


      Instructions for generating `secretKey` can be found in the Help Center:

      * [Generate a secret key in Online Banking](https://help.pay.raif.ru/sbp/rbo/secretkey)

      * [Generate a secret key in your Personal Account](https://help.pay.raif.ru/sbp/lk/secretkey)


      To generate a `secretKey` in the test circuit, you must contact the support service ecom@raiffeisen.ru


      # Testing

      ## Acquiring

      `Bank payment form`:

      | PAN of a bank card| Card validity period| CVV | OTP code| Payment scenario   |

      |-------------------|---------------------|-----|---------|--------------------|

      | 4000001000000018  | 12/35               | 880 |   1234  | Successfull payment|

      | 4000001000000018  | 12/35               | 880 |   1111  | Unsuccessful payment|


      For a full payment testing cycle, you must specify a payment amount greater than 10 rubles.


      ## SBP

      For a full testing cycle, Raiffeisenbank provides the opportunity to use a demo application for QR code payment on behalf of the buyer:

      [WEB application for payment by QR code](https://pay.raif.ru/pay/rfuture/)


      The application can be opened in the browser of any device with a camera. After opening the application, you need to click on the "Scan QR" button (if necessary, allow the browser to access the camera) and scan the image of the test QR code.


      **Bank apps won''t work for QR code payments in the test environment**


      # SDK

      Using JS SDK allows you to open a form from the frontend part in a pop-up window, or redirect the user to the Raiffeisenbank page, which provides a seamless payment scenario for the client.


      Additionally, you can customize the payment form interface and transfer additional parameters for subsequent payment.

      You can customize the visual part of the form (company name, logo, button color) in the [Payment Form Configurator](https://pay.raif.ru/pay/configurator/).


      The payment form configurator also allows you to obtain code for embedding it into a JS library.

      Available SDK:

      * [JS SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-javascript)

      * [PHP SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-php)

      * [NODE SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-node)

      * [JAVA SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-java)


      JS SDK allows you to open a payment form from the frontend of your application. When using other SDKs to work with the payment form, you must either use the methods described in the [[Payment form]](#tag/payform) section yourself, or use the JS SDK additionally.


      Plugins for various CMS can also be found on [GitHub](https://github.com/Raiffeisen-DGTL/).


      Questions regarding solution support can be sent to technical support: ecom@raiffeisen.ru'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: pay-controller
  x-displayName: Расширение сценариев
  x-x-displayName-i18n:
    eng: Available methods
  description: 'Для реализации взаимодействия с партнёром Райффайзенбанк предоставляет API для:

    * открытия платежной формы с использованием HTTP запросов;

    * получения информации о статусе заказа.'
  x-description-i18n:
    eng: 'To implement interaction with a partner, Raiffeisenbank provides an API:

      * for opening a payment form using HTTP requests;

      * for receiving payment status.

      '
paths:
  /v1/merchants/{publicId}/orders/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор заказа
      x-description-i18n:
        eng: Order ID
    get:
      summary: Получение заказа
      x-summary-i18n:
        eng: Getting order information
      operationId: get-payments-v1-merchants-publicId-orders-id
      responses:
        '200':
          $ref: '#/components/responses/GetOrderResponseV2'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  value:
                    code: ERROR.FORBIDDEN
                    message: Доступ запрещен
                    traceId: abb066c61a7c8b74af83f245c7706813
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Мерчант не найден:
                  value:
                    code: ERROR.NOT_FOUND
                    message: Мерчант с publicId = '%s' не зарегистрирован в сервисе
                    traceId: abbasd2c61a7c8b74af83f245c7706813
                Заказ не найден:
                  value:
                    code: ERROR.NOT_FOUND
                    message: Заказ с id = '%s' не найден
                    traceId: abbasd2c61a7c8b74af83f245c7706814
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  value:
                    code: ERROR.INTERNAL_ERROR
                    message: Внутренняя ошибка сервиса
                    traceId: abb066c61a7c8b74af83f245c7706813
      description: Метод позволяет получить информацию о заказе по его идентификатору.
      x-description-i18n:
        eng: The method allows you to get information about an order by its identifier.
      x-internal: false
      tags:
      - pay-controller
  /payment/v1/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/orderId'
    delete:
      summary: Отмена заказа
      operationId: delete-payment-v1-orders-orderId
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400Response'
        '404':
          $ref: '#/components/responses/Error404Response'
      description: Метод позволяет отменить заказ, если он не был оплачен. После отмены страница оплаты будет недоступна.
      security:
      - secretKey: []
      x-summary-i18n:
        eng: Сancel the order
      x-description-i18n:
        eng: This method allows you to cancel an order if it has not been paid, after cancellation the payment page will be unavailable.
      tags:
      - pay-controller
  /payments/v2/merchants/{publicId}/orders/{orderId}/refunds:
    parameters:
    - $ref: '#/components/parameters/orderId'
    - $ref: '#/components/parameters/publicId'
    post:
      summary: Оформление возврата
      operationId: createRefundV2
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusResponseV2'
        '400':
          $ref: '#/components/responses/Error400Response'
      tags:
      - pay-controller
      requestBody:
        $ref: '#/components/requestBodies/CreateRefundRequestV2'
      description: 'Метод позволяет выполнить возврат по заказу.

        Метод также позволяет провести возврат плательщику в другой банк. Поддерживаются как полный, так и частичный возвраты.'
      security:
      - secretKey: []
      x-summary-i18n:
        eng: Refund
      x-description-i18n:
        eng: 'The method allows you to make a refund for the order.

          The method also allows you to make a refund to the payer to another bank. Both full and partial refunds are supported.

          '
  /payments/v2/merchants/{publicId}/orders/{orderId}/clear:
    parameters:
    - $ref: '#/components/parameters/orderId'
    - $ref: '#/components/parameters/publicId'
    post:
      tags:
      - pay-controller
      summary: Проведение клиринга
      operationId: post-payments-v2-orders-orderId-clear
      deprecated: false
      responses:
        '200':
          $ref: '#/components/responses/ClearCardPaymentResponse'
        '400':
          $ref: '#/components/responses/Error400Response'
      description: 'Метод позволяет выполнить принудительный клиринг операций по интернет-эквайрингу с возможностью частичной отмены.

        Поддерживает операции как со сплитованием платежей, так и без него.


        При переданных `splits` будет произведена частичная отмена, равная сумме по заказу за вычетом итоговой суммы клиринга.

        Сплиты, которые сохраняют ту же сумму, что и в оригинальном заказе, передавать не требуется.'
      security:
      - secretKey: []
      requestBody:
        $ref: '#/components/requestBodies/ClearEcomRequest'
      x-summary-i18n:
        eng: Clearing
      x-description-i18n:
        eng: 'This method enables forced clearing of internet acquiring operations with support for partial cancellation.

          It supports both operations with payment splitting and without splitting.


          When `splits` are provided, a partial cancellation is performed, where the cancellation amount equals the order amount minus the final clearing amount.

          Splits that retain the same amount as in the original order do not need to be included.

          '
  /payments/v2/merchants/{publicId}/orders/{orderId}/refunds/{refundId}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - $ref: '#/components/parameters/orderId'
    - schema:
        type: string
      name: refundId
      in: path
      required: true
      description: Идентификатор возврата
      x-description-i18n:
        eng: Refund ID
    get:
      summary: Получение статуса возврата
      tags:
      - pay-controller
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusResponseV2'
        '404':
          $ref: '#/components/responses/Error404Response'
      operationId: getRefundV2
      description: Метод позволяет получить статус по возврату.
      security:
      - secretKey: []
      x-summary-i18n:
        eng: Refund status
      x-description-i18n:
        eng: The method allows you to get the refund status.
  /fiscal/v1/orders/{orderId}/receipts:
    parameters:
    - $ref: '#/components/parameters/orderId'
    get:
      summary: Получение списка чеков
      tags:
      - pay-controller
      responses:
        '200':
          $ref: '#/components/responses/GetReceiptsListResponse'
        '401':
          $ref: '#/components/responses/Error401Response'
      operationId: get-fiscal-v1-orders-orderId-receipts
      security:
      - secretKey: []
      parameters:
      - in: query
        name: receiptType
        description: 'Тип чека:

          - `SELL` – чек прихода

          - `REFUND` – чек возврата''

          '
        x-description-i18n:
          eng: Receipt type:<br>• `SELL` – payment receipt<br>• `REFUND` – refund receipt
        schema:
          type: string
      x-summary-i18n:
        eng: Getting list of fiscal receipts
      x-description-i18n:
        eng: Method allows to get a list of fiscal receipts, that are successfully processed by fiscal data operator, using order ID. Therefore the list contains receipts in status 'DONE' only. By default response contains both types of receipts. To get receipts of a certain type, optional path parameter 'receiptType' needs to be used.<br> If no receipts are found, response will be 200 OK and empty array in the body.
      description: 'Метод позволяет получить по заказу список чеков, которые успешно зарегистрированы в ОФД и имеют статус `DONE`. По умолчанию возвращаются как чеки прихода, так и чеки возврата. Чтобы получить чеки определенного типа, необходимо в строке запроса передать дополнительный параметр receiptType.

        Если ни один чек не найден, в ответ вернется 200 OK и пустой массив.'
  /fiscal/v1/orders/{orderId}/refunds/{refundId}/receipt:
    parameters:
    - $ref: '#/components/parameters/orderId'
    - $ref: '#/components/parameters/refundId'
    get:
      summary: Получение чека возврата
      tags:
      - pay-controller
      responses:
        '200':
          $ref: '#/components/responses/GetRefundReceiptResponse'
        '401':
          $ref: '#/components/responses/Error401Response'
        '404':
          $ref: '#/components/responses/Error404Response'
      operationId: get-fiscal-v1-orders-orderId-refunds-refundId-receipt
      description: Метод позволяет получить чек возврата по идентификатору заказа и идентификатору возврата.
      security:
      - secretKey: []
      x-summary-i18n:
        eng: Getting refund receipt
      x-description-i18n:
        eng: Method allows to get refund receipt by order ID and refund ID.
components:
  schemas:
    Extra:
      title: Extra
      type: object
      description: Дополнительные поля в формате key-value. Отображаются в реестрах.
      x-description-i18n:
        eng: Additional fields in key-value format. Displayed in registries
      additionalProperties:
        type: string
    RefundWithSplits:
      title: RefundWithSplits
      type: object
      properties:
        id:
          type: string
          example: 348230ad-2a8d-4976-af4f-8603d11cba8c
          description: Идентификатор возврата
          x-description-i18n:
            eng: Refund ID
        amount:
          type: number
          description: Сумма возврата в рублях
          x-description-i18n:
            eng: Refund amount in rubles
          format: float
          example: 432.21
        paymentDetails:
          $ref: '#/components/schemas/PaymentDetails'
        customer:
          type: object
          description: Объект данных получателя, будет заполнен при отправке возврата в другой банк. **Заполняется только для возвратов по СБП**
          x-description-i18n:
            eng: Recipient data object, populated when sending a refund to another bank
          properties:
            bankAlias:
              type: string
              description: Код банка плательщика. Коды банков можно получить выполнив [[Запрос на получение списка банков]](#tag/QR/operation/getBanksForRefunds).
              x-description-i18n:
                eng: Recipient bank code from the bank list request
            phone:
              type: string
              description: Номер телефона плательщика
              x-description-i18n:
                eng: Recipient's phone number
        splits:
          $ref: '#/components/schemas/Split'
        status:
          type: object
          properties:
            value:
              type: string
              description: Код состояния запроса на возврат
              x-description-i18n:
                eng: Refund status code
              enum:
              - IN_PROGRESS
              - COMPLETED
              - DECLINED
            date:
              type: string
              description: Дата и время состояния
              x-description-i18n:
                eng: Status date and time
              format: date-time
              example: '2024-12-31T17:00:00+03:00'
        receipt:
          $ref: '#/components/schemas/FiscalReceiptBasic'
    UndefinedOrder:
      title: UndefinedOrder
      allOf:
      - $ref: '#/components/schemas/GetOrderResponseSchema'
    DigitalRubleOrder:
      title: DigitalRubleOrder
      allOf:
      - $ref: '#/components/schemas/GetOrderResponseSchema'
    receiptItem:
      type: object
      title: ФФД 1.05 | ФФД 1.2
      properties:
        name:
          type: string
          maxLength: 128
          description: '`Тег ФФД — 1030` <br/>

            Наименование товара, работы, услуги, иного предмета расчета'
          x-description-i18n:
            eng: '`The tag FDF — 1030` <br/>

              Name of goods, work, service, other payment objects'
          example: Шоколадный торт
        price:
          type: number
          description: '`Тег ФФД — 1079` <br/>

            Цена за единицу товара, работы, услуги, иного предмета расчета в рублях (8 символов на целую часть, 2 на дробную)'
          x-description-i18n:
            eng: '`The tag FDF — 1079` <br/>

              Price per unit of goods, work, services, other payment objects in rubles (8 characters for a whole part, 2 for a fractional part)'
          example: 1200
        quantity:
          type: number
          description: '`Тег ФФД — 1023` <br/>

            Количество/вес (5 символов на целую часть, 3 на дробную)'
          x-description-i18n:
            eng: '`The tag FDF — 1023` <br/>

              Quantity / weight (5 characters for a whole part, 3 for a fractional part)'
          example: 1
        amount:
          type: number
          description: '`Тег ФФД — 1043` <br/>

            Сумма в рублях. Должна равняться произведению цены на количество (price * quantity). 8 символов на целую часть, 2 на дробную'
          x-description-i18n:
            eng: '`The tag FDF — 1023` <br/>

              Amount in rubles. Must be equal to price * quantity (8 characters for a whole part, 2 for a fractional part)'
          example: 1200
        paymentObject:
          type: string
          description: '`Тег ФФД — 1212` <br/>

            Признак предмета расчёта. Возможные значения:

            <br/>• COMMODITY – товар, который не является подакцизным и не подлежит маркировке (ФФД 1.05 и ФФД 1.2)

            <br/>• EXCISE – подакцизный товар, который не подлежит маркировке (ФФД 1.05 и ФФД 1.2)

            <br/>• JOB – работа (ФФД 1.05 и ФФД 1.2)

            <br/>• SERVICE – услуга (ФФД 1.05 и ФФД 1.2)

            <br/>• PAYMENT – платеж (ФФД 1.05 и ФФД 1.2)

            <br/>• ANOTHER – иной предмет расчета (ФФД 1.05 и ФФД 1.2)<br/>

            <br/>• COMMODITY_MARKING_NO_CODE – товар, который не является подакцизным, подлежит маркировке, но не имеет кода маркировки (ФФД 1.2)

            <br/>• COMMODITY_MARKING_WITH_CODE – товар, который не является подакцизным, подлежит маркировке и имеет код маркировки (ФФД 1.2)

            <br/>• EXCISE_MARKING_NO_CODE – подакцизный товар, который подлежит маркировке, но не имеет кода маркировки (ФФД 1.2)

            <br/>• EXCISE_MARKING_WITH_CODE – подакцизный товар, который подлежит маркировке и имеет код маркировки (ФФД 1.2)<br/>

            <br/>Для авансовых чеков и чеков частичной предоплаты должен заполняться значением PAYMENT. Если параметр не передан, то заполняется значением COMMODITY по умолчанию'
          x-description-i18n:
            eng: '`The tag FDF — 1212` <br/>

              Payment object type. Valid values:

              <br/>• COMMODITY – good (FFD 1.05 and FFD 1.2)

              <br/>• EXCISE – excisable good (FFD 1.05 and FFD 1.2)

              <br/>• JOB – job (FFD 1.05 and FFD 1.2)

              <br/>• SERVICE – service (FFD 1.05 and FFD 1.2)

              <br/>• PAYMENT – payment (FFD 1.05 and FFD 1.2)

              <br/>• ANOTHER – another payment object (FFD 1.05 and FFD 1.2)

              <br/>• COMMODITY_MARKING_NO_CODE – marked good that has no marking code (FFD 1.2)

              <br/>• COMMODITY_MARKING_WITH_CODE – marked good that has a marking code (FFD 1.2)

              <br/>• EXCISE_MARKING_NO_CODE – excisable good that has no marking code (FFD 1.2)

              <br/>• EXCISE_MARKING_WITH_CODE – excisable good that has a marking code (FFD 1.2)<br/>

              <br/>For advance payments and prepayments value PAYMENT must be passed. If null, value COMMODITY will be set by default'
          enum:
          - COMMODITY
          - EXCISE
          - JOB
          - SERVICE
          - PAYMENT
          - ANOTHER
          - COMMODITY_MARKING_NO_CODE
          - COMMODITY_MARKING_WITH_CODE
          - EXCISE_MARKING_NO_CODE
          - EXCISE_MARKING_WITH_CODE
          example: COMMODITY_MARKING_WITH_CODE
        paymentMode:
          type: string
          description: '`Тег ФФД — 1214` <br/>

            Способ расчета. Возможные значения:<br/>

            • FULL_PREPAYMENT – 100% предоплата до момента передачи предмета расчета<br/>

            • FULL_PAYMENT – полная оплата в момент передачи предмета расчета<br/>

            • ADVANCE – аванс<br/>

            • PREPAYMENT – частичная предоплата до момента передачи предмета расчета<br/>

            • CREDIT – Передача в кредит<br/>

            • CREDIT_PAYMENT – Оплата кредита<br/>

            Если параметр не передан, по умолчанию устанавливается значение FULL_PREPAYMENT'
          x-description-i18n:
            eng: '`The tag FDF — 1214` <br/>

              Payment mode. Valid values:<br/>

              • FULL_PREPAYMENT – 100% prepayment<br/>

              • FULL_PAYMENT – full payment<br/>

              • ADVANCE – advance payment<br/>

              • PREPAYMENT – partial prepayment<br/>

              • CREDIT – credit<br/>

              • CREDIT_PAYMENT – credit payment<br/>

              If null, the value FULL_PREPAYMENT is set dy default'
          enum:
          - FULL_PREPAYMENT
          - FULL_PAYMENT
          - ADVANCE
