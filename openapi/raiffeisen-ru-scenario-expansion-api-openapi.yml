              • VAT22 – 22% VAT<br/>

              • VAT122 – 22/122 VAT'
          enum:
          - NONE
          - VAT0
          - VAT10
          - VAT110
          - VAT20
          - VAT120
          - VAT5
          - VAT105
          - VAT7
          - VAT107
          - VAT22
          - VAT122
          example: VAT20
        agentType:
          type: string
          description: '`Тег ФФД — 1222` <br/>

            Признак агента по предмету расчета. Опциональный параметр, который заполняется только для операций через агента. Возможные значения:<br/>

            • BANK_PAYING_AGENT – банковский платежный агент<br/>

