  /v1/orders/total-debt:
    get:
      description: Метод получение общей суммы долга по договору
      operationId: getTotalDebt
      parameters:
      - description: Идентификатор договора
        in: query
        name: agreementId
        required: true
        schema:
          example: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Долг присутствует
                  value:
                    totalDebt: '100.11'
                    overDebt: '100.11'
                    maturityTodayDebt: '100.11'
              schema:
                $ref: '#/components/schemas/OrderTotalDebtResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERR_5001
                    message: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение общей суммы долга по договору
      tags:
      - Order
    servers:
    - url: https://api.raiffeisen.ru/payables-financing
  /v1/orders/{id}/payment-orders/report:
    get:
      description: Метод получения файла с платежным поручением в формате pdf без подписи со стороны банка
      operationId: getPaymentOrderReport
      parameters:
      - description: Идентификатор поручения
        in: path
        name: id
        required: true
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERR_5001
                    message: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение файла с платежным поручением в формате pdf
      tags:
      - Order
    head:
      description: Метод получения размера файла с платежным поручением в формате pdf без подписи со стороны банка
      operationId: getPaymentOrderReportSize
      parameters:
      - description: Идентификатор поручения
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        style: simple
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              examples:
                simple:
                  value: report.pdf
              schema:
                example: report.pdf
                type: string
            Content-Length:
              examples:
                simple:
                  value: 1000000
              schema:
                example: 1000000
                type: integer
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERR_5001
                    message: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение размера файла с платежным поручением в формате pdf
      tags:
      - Order
    servers:
    - url: https://api.raiffeisen.ru/payables-financing
