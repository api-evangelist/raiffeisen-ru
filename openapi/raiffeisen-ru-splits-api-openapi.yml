openapi: 3.2.0
info:
  title: Raiffeisen Ru Splits API
  x-refined-note:
  - x-description-i18n differs across the merged source definitions and was not carried
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  version: '1.0'
  description: 'Operations tagged splits across 4 of this provider''s published API definitions: raiffeisen-ru-raif-pay-sbp-b2b-openapi.json, raiffeisen-ru-raif-pay-sbp-openapi.json, raiffeisen-ru-raif-pay-sbp-b2b-openapi.yml, raiffeisen-ru-raif-pay-sbp-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay-test.raif.ru
  description: Sandbox
- url: https://pay.raif.ru
  description: Production
- url: https://pay.raif.ru/api
  description: Production
- url: https://pay-test.raif.ru/api
  description: Sandbox
tags:
- name: Splits
  x-displayName: Разделение платежа (Сплитование)
  description: Этот раздел позволяет вам удобно управлять распределением денег при получении денежных средств через СБП B2B.
paths:
  /api/v1/b2b/split-orders:
    post:
      tags:
      - Splits
      summary: Создание заказа со сплитованием
      operationId: createPaymentLinkSplits
      security:
      - BearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderSplitsRequestDto'
            examples:
              splits_count_of_minutes:
                $ref: '#/components/examples/CreateOrderSplitsRequestDtoCountOfMinutes'
              splits_without_restriction:
                $ref: '#/components/examples/CreateOrderSplitsRequestDtoWithoutRestriction'
              splits_with_restriction:
                $ref: '#/components/examples/CreateOrderSplitsRequestDtoWithRestriction'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderSplitsResponseDto'
              examples:
                splits_without_restrictions:
                  $ref: '#/components/examples/CreateOrderSplitsResponseDtoWithOutRestrictions'
                splits_with_restrictions:
                  $ref: '#/components/examples/CreateOrderSplitsResponseDtoWithRestrictions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/b2b/sbp/v1/qrs/{qrId}/image:
    parameters:
    - $ref: '#/components/parameters/QrId'
    get:
      tags:
      - Splits
      summary: Генерация изображения платёжной ссылки
      operationId: getQrImage
      parameters:
      - $ref: '#/components/parameters/QrId'
      - $ref: '#/components/parameters/Format'
      - $ref: '#/components/parameters/WithLogo'
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string
                format: byte
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /api/v1/b2b/split-orders/{id}:
    get:
      tags:
      - Splits
      summary: Получение данных заказа со сплитованием
      operationId: getOrderSplitsPaymentLinkInfo
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderIdWithoutGenerating'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderInfoSplitsResponseDto'
              examples:
                splits_without_restrictions:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoWithoutRestrictions'
                splits_active:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoActive'
                splits_paid:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoPaid'
                splits_expired:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Splits
      summary: Отмена заказа со сплитованием
      operationId: deleteOrderSplits
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderIdWithoutGenerating'
      description: Метод позволяет отменить неоплаченный заказ со сплитованием. После отмены оплата заказа с текущим id будет недоступна. Но вы можете переиспользовать этот id для создания нового заказа
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  /payments/v2/merchants/{publicId}/orders:
    parameters:
    - $ref: '#/components/parameters/publicId'
    post:
      summary: Запрос создания заказа
      operationId: createOrder
      responses:
        '200':
          $ref: '#/components/responses/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/GeneralErrorResponse'
      requestBody:
        $ref: '#/components/requestBodies/CreateOrderRequest'
      tags:
      - Splits
      description: 'Метод позволяет создать заказ с привязкой к существующему кассовой ссылке `QRVariable` или с созданием нового динамического QR-кода `QRDynamic`.

        Также с помощью данного метода вы можете сгенерировать QR код для оплаты с подпиской.'
      parameters: []
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /payments/v2/merchants/{publicId}/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - $ref: '#/components/parameters/orderId'
    put:
      summary: Создание и изменение заказа
      tags:
      - Splits
      responses:
        '200':
          $ref: '#/components/responses/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/GeneralErrorResponse'
      requestBody:
        $ref: '#/components/requestBodies/ChangeOrderRequest'
      operationId: putOrder
      security:
      - secretKey: []
      description: Метод позволяет создать или изменить заказ.
    get:
      summary: Получения статуса заказа
      tags:
      - Splits
      responses:
        '200':
          $ref: '#/components/responses/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/GeneralErrorResponse'
      operationId: getOrder
      security:
      - secretKey: []
      description: Метод позволяет получить статус заказа по его номеру. Опрос статуса заказа рекомендуется проводить раз в 2 секунды. При работе в штатном режиме заказ переводится в статус оплаченного в течение 15 секунд с момента оплаты.
    delete:
      summary: Отмена заказа
      operationId: cancelOrder
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/GeneralErrorResponse'
        '404':
          $ref: '#/components/responses/GeneralErrorResponse'
      tags:
      - Splits
      description: Данный метод позволяет отменить заказ, если он не был оплачен. После отмены заказ будет недоступен для оплаты.
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /payments/v2/merchants/{publicId}/orders/{orderId}/refunds:
    parameters:
    - $ref: '#/components/parameters/parameters-orderId'
    - $ref: '#/components/parameters/parameters-publicId'
    post:
      summary: Оформление возврата
      operationId: createRefund
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundWithSplits'
        '400':
          $ref: '#/components/responses/Error400Response'
      tags:
      - Splits
      requestBody:
        $ref: '#/components/requestBodies/CreateRefundRequestV2'
      description: 'Метод позволяет выполнить возврат по заказу.

        Метод также позволяет провести возврат плательщику в другой банк. Поддерживаются как полный, так и частичный возвраты.'
      parameters: []
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /payments/v2/merchants/{publicId}/orders/{orderId}/refunds/{refundId}:
    parameters:
    - $ref: '#/components/parameters/parameters-publicId'
    - $ref: '#/components/parameters/parameters-orderId'
    - schema:
        type: string
      name: refundId
      in: path
      required: true
      description: Идентификатор возврата
    get:
      summary: Получение статуса возврата по заказу
      tags:
      - Splits
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusResponseV2'
        '404':
          $ref: '#/components/responses/Error404Response'
      operationId: getRefund
      description: Метод позволяет получить статус по возврату.
      parameters: []
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  /payments/v2/banks:
    parameters: []
    get:
      summary: Получение списка банков для возвратов
      tags:
      - Splits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankListResponse'
              examples:
                Payload:
                  value:
                  - alias: RAIFFEISEN
                    name: Райффайзенбанк
                  - alias: TINKOFF
                    name: Тинькофф
                  - alias: VTB
                    name: ВТБ
      operationId: getBanksForRefunds
      description: Получение списка банков, принимающих возвраты по СБП.
      parameters: []
      x-summary-i18n:
        eng: Get list of banks
      x-description-i18n:
        eng: Get a list of banks accepting SBP payments
      security:
      - secretKey: []
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
webhooks:
  IncomingPayment:
    post:
      summary: Уведомление о входящем платеже заказа
      operationId: sendIncomingPaymentCallback
      tags:
      - Splits
      responses:
        '200':
          description: Вернуть статус 200, чтобы указать, что данные были успешно получены
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingPaymentCallbackDto'
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
