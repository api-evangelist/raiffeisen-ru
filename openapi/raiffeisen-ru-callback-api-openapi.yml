openapi: 3.2.0
info:
  title: Raiffeisen Ru Callback API
  x-refined-note:
  - x-description-i18n differs across the merged source definitions and was not carried
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  version: '1.0'
  description: 'Operations tagged Callback across 10 of this provider''s published API definitions: raiffeisen-ru-raif-pay-payment-form-openapi.json, raiffeisen-ru-raif-pay-payouts-openapi.json, raiffeisen-ru-raif-pay-sbp-b2b-openapi.json, raiffeisen-ru-raif-pay-sbp-openapi.json, raiffeisen-ru-raif-pay-whitelabel-ecom-openapi.json, raiffeisen-ru-raif-pay-payment-form-openapi.yml, raiffeisen-ru-raif-pay-payouts-openapi.yml, raiffeisen-ru-raif-pay-sbp-b2b-openapi.yml, raiffeisen-ru-raif-pay-sbp-openapi.yml…'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
- url: https://pay-test.raif.ru
  description: Sandbox
- url: https://pay.raif.ru
  description: Production
tags:
- name: Callback
  x-displayName: Уведомления
  x-x-displayName-i18n:
    eng: Notifications
  description: Для информирования ТСП о проведенных платежах и возвратах могут использоваться HTTP-уведомления на адрес, указанный в его настройках.
  x-description-i18n:
    eng: 'In order to inform the Merchant site about payments made, HTTP notifications to the address specified in its settings can be used.


      The prod url can be specified in the [personal account](https://www.rbo.raiffeisen.ru/acquiring/mcp#/) in the "Accept payments" tab.


      <div align=center><a href=''images/callback.png'' target=''_blank''><img src=''images/callback.png''></a></div>


      And prod or test url can be specified with [API.](#operation/postsettingsUrl)


      For partners, a notification is presented as an incoming POST request that uses the JSON structure.


      A notification is considered accepted if the recipient responded to the request with HTTP 200.


      Responses with any other HTTP codes will be considered invalid. Repeated attempts to send will be conducted during the day with increasing intervals.


      In order to verify the authenticity of the notification, a signature is added to the data in the x-api-signature-sha256 header, obtained on the basis of the shared secret key and control string (amount|publicId|order|paymentStatus|transactionDate) by way of HMAC-SHA-256.


      To verify the authenticity of the notification on refund, a signature is added to the data in the X-Api-Signature-SHA256 header, obtained on the basis of a common secret key and a control string (amount | publicId | refund.id | status.value | status.date) using HMAC-SHA-256.


      It is necessary to check the amount, as customers have the opportunity to change it.


      Notifications are sent from an IP 193.28.44.23

      '
paths:
  /settings/v1/callback:
    post:
      summary: Настройка url для callback
      operationId: post-settings-v1-callback
      responses:
        '200':
          $ref: '#/components/responses/CreateCallbackSettingsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Некоррректный адрес уведомления:
                  summary: Ошибка валидации callbackUrl
                  x-summary-i18n:
                    eng: callbackUrl validation error
                  value:
                    code: ERROR.BAD_REQUEST
                    message: callbackUrl is not null
                MissingRequiredField:
                  summary: Отсутствует обязательное поле
                  x-summary-i18n:
                    eng: Required field is missing
                  value:
                    code: ERROR.BAD_REQUEST
                    message: paymentCallback enabled is not null
      tags:
      - Callback
      description: 'Уведомления будут подписываться ключом, переданным в заголовке авторизации.


        Подробнее о форматах уведомлений читайте в документации.'
      x-description-i18n:
        eng: 'The key from the authorization header will be used to sign notifications.


          Read more about notification formats in the [documentation](https://pay.raif.ru/doc/callbacks.html).'
      security:
      - secretKey: []
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/CreateCallbackSettingsRequest'
      x-summary-i18n:
        eng: Setting url for callback
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /api/settings/v1/callback:
    post:
      summary: Настройка url для callback
      tags:
      - Callback
      x-summary-i18n:
        eng: Setting url for callback
      operationId: postApiSettingsV1Callback
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBackSetting'
              examples:
                '200':
                  value:
                    callbackUrl: https://yoururl.ru
      description: Для подписи уведомлений будет использоваться ключ из заголовка авторизации.
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallBackSetting'
            examples:
              Payload:
                value:
                  callbackUrl: https://yoururl.ru
      x-operation-id-source: normalized
      x-operation-id-original: post-settings-v1-callback
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
webhooks:
  paymentCallback:
    post:
      summary: Уведомление об оплате (v3)
      x-summary-i18n:
        eng: Payment notification v.3
      operationId: payment-callback
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotificationV3'
            examples:
              СБП платеж:
                $ref: '#/components/examples/PaymentNotificationV3SBP'
              Карточный платеж:
                $ref: '#/components/examples/PaymentNotificationV3CARD'
              Платеж по подписке:
                $ref: '#/components/examples/PaymentNotificationV3SUBSCRIPTION'
              Платеж по цифровому рублю:
                $ref: '#/components/examples/PaymentNotificationV3DigitalRuble'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Api-Signature-SHA256
        description: Заполняется подписью, полученной алгоритмом HMAC-SHA-256 с использованием выбранного секретного ключа и контрольной строки
        x-description-i18n:
          eng: Filled with a signature obtained by the HMAC-SHA-256 algorithm using the selected secret key and control string
        required: true
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  refundCallback:
    post:
      summary: Уведомление о возврате (v1)
      x-summary-i18n:
        eng: Refund notification (v1)
      operationId: refundCallback
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundNotificationV1'
            examples:
              SBP_COMPLETED:
                $ref: '#/components/examples/RefundNotificationV1SBPCompleted'
              SBP_DECLINED:
                $ref: '#/components/examples/RefundNotificationV1SBPDeclined'
              ACQUIRING_COMPLETED:
                $ref: '#/components/examples/RefundNotificationV1AcquiringCompleted'
              ACQUIRING_DECLINED:
                $ref: '#/components/examples/RefundNotificationV1AcquiringDeclined'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Api-Signature-SHA256
        description: Заполняется подписью, полученной алгоритмом HMAC-SHA-256 с использованием выбранного секретного ключа и контрольной строки
        x-description-i18n:
          eng: Filled with a signature obtained by the HMAC-SHA-256 algorithm using the selected secret key and control string
        required: true
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  subscriptionCallback:
    post:
      summary: Уведомление о подписке (v2)
      x-summary-i18n:
        eng: Subscription notification (v2)
      operationId: subscriptionNotificationV2
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionNotificationV2'
            examples:
              ACQUIRING:
                $ref: '#/components/examples/SubscriptionNotificationV2Success'
              SBP:
                $ref: '#/components/examples/SubscriptionNotificationV2SBP'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Api-Signature-SHA256
        description: Заполняется подписью, полученной алгоритмом HMAC-SHA-256 с использованием выбранного секретного ключа и контрольной строки
        x-description-i18n:
          eng: Filled with a signature obtained by the HMAC-SHA-256 algorithm using the selected secret key and control string
        required: true
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  newPay:
    post:
      summary: Уведомление о выплате
      x-summary-i18n:
        eng: Payment notification
      operationId: сallbackTransaction
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentsNotification'
      x-examples:
        event:
          event: payout
          payout:
            id: p210730t2WjboNkN0ft1
            amount: 0.01
            currency: RUB
            payoutMethod: SBP
            payoutParams:
              phone: '79267016490'
              bankAlias: RAIFFEISEN
              firstName: Сергей
              middleName: Сергеевич
              lastName: Брюзгин
            extra:
              apiClient: Payout Software
              apiClientVersion: 1.0.0
            status:
              value: COMPLETED
              date: '2021-07-30T14:16:32+03:00'
            creationDate: '2021-07-30T14:16:31+03:00'
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: prod
  IncomingPayment:
    post:
      summary: Уведомление о входящем платеже заказа
      operationId: sendIncomingPaymentCallback
      tags:
      - Callback
      responses:
        '200':
          description: Вернуть статус 200, чтобы указать, что данные были успешно получены
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingPaymentCallbackDto'
    servers:
    - url: https://pay-test.raif.ru
      description: Sandbox
    - url: https://pay.raif.ru
      description: Production
  IncomingReusablePaymentLinkPayment:
    post:
      summary: Уведомление о входящем платеже по многоразовой платежной ссылке
      operationId: sendIncomingPaymentReusablePaylink
      tags:
      - Callback
      responses:
        '200':
