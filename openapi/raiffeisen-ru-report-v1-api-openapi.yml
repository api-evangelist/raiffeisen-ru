        reportId: 819e5e3c-07f8-4dda-a640-9d6d47bd9344
    oneCRequestOnlyRequired:
      summary: Запрос 1C только обязательные поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - '40702810500001306832'
        from: '2023-10-06'
        to: '2023-10-06'
    mt940RequestOnlyRequired:
      summary: Запрос MT940 только обязательные поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - '40702810500001306832'
        from: '2023-10-06'
        to: '2023-10-06'
    xmlRequestOnlyRequired:
      summary: Запрос XML только обязательные поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - '40702810500001306832'
        from: '2023-10-06'
        to: '2023-10-06'
    mt940RequestAllFields:
      summary: Запрос MT940 все поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - 40701978200000000001:401867
        from: '2023-10-06'
        to: '2023-10-06'
        fileName: file
        zero: true
        sort:
        - sortBy: DEBIT
          orderBy: ASC
        - sortBy: CREDIT
          orderBy: ASC
        splitBy: ACCOUNT_DATE
        encoding: WINDOWS
        showHeader: false
        field25:
          format: CUSTOM
          customValue: Счёт [Account Number] с БИКом [RCBIC] вставлен в отчёт
        field86: SEPA
        transliteration: true
        replacements: a:b;c:d;e:empty;f:space
    pdfAttachmentsRequestOnlyRequired:
      summary: Запрос PDF приложения только обязательные поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - '40702810500001306832'
        from: '2023-10-06'
        to: '2023-10-06'
    camt052RequestOnlyRequired:
