annotations_note: Every tool reports readOnlyHint false and destructiveHint true in its live annotations although each tool
  is described as a read (list/get) of public portal content; recorded verbatim, not corrected.
tools:
- name: get_public_documentation
  description: Returns metadata and complete source content of an official Raiffeisen Bank Developer Portal (https://developer.raif.ru)
    document by its catalog ID.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      documentId:
        type: string
        description: Document ID returned by list_public_documentation
    required:
    - documentId
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
- name: list_public_documentation
  description: Lists official public documentation from Raiffeisen Bank's Developer Portal (https://developer.raif.ru). Optionally
    filters documents by the ru or en language code.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      language:
        type: string
        description: 'Optional documentation language: ru or en'
    required: []
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
- name: get_public_api_specification
  description: Returns the complete specification for a selected Raiffeisen Bank Developer Portal (https://developer.raif.ru)
    API Router or bundled Code Flow or sandbox API variant.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      apiId:
        type: string
        description: Public API identifier from list_public_apis
      variantCode:
        type: string
        description: Variant code from list_public_api_variants
    required:
    - apiId
    - variantCode
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
- name: list_public_api_operations
  description: Returns every operation for one public Raiffeisen Bank Developer Portal (https://developer.raif.ru) API, including
    bundled Code Flow and sandbox, optionally limited to one variant.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      apiId:
        type: string
        description: Public API identifier from list_public_apis
      variantCode:
        type: string
        description: Optional variant code from list_public_api_variants
    required:
    - apiId
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
- name: list_public_api_variants
  description: Returns all variants for one public Raiffeisen Bank Developer Portal (https://developer.raif.ru) API from API
    Router or bundled Code Flow and sandbox documentation.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      apiId:
        type: string
        description: Public API identifier from list_public_apis
    required:
    - apiId
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
- name: list_public_apis
  description: Returns every public API currently available from Raiffeisen Bank's Developer Portal (https://developer.raif.ru),
    API Router, and bundled Code Flow and sandbox documentation.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties: {}
    required: []
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
- name: list_public_scenarios
  description: Returns every localized business scenario currently available from Raiffeisen Bank's Developer Portal (https://developer.raif.ru),
    including full public details.
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      language:
        type: string
        description: 'Optional scenario language: ru or en; defaults to ru'
    required: []
  annotations:
    title: ''
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  source: tools/list (live, anonymous)
