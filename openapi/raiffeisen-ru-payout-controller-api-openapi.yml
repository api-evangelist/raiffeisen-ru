components:
  schemas:
    Size:
      type: integer
      description: Размер страницы
      example: 1
    BundleTotalPayouts:
      type: number
      description: Количество выплат в пакете
      example: 100
    ImportRegistryRequest:
      type: object
      properties:
        fiscal:
          $ref: '#/components/schemas/Fiscal'
        id:
          $ref: '#/components/schemas/BundleId'
        registryFile:
          $ref: '#/components/schemas/RegistryFile'
      required:
      - registryFile
    DeleteFailedItem:
      type: object
      required:
      - bundleNumber
      - code
      - message
      properties:
        bundleNumber:
          type: string
          description: Номер реестра, для которого операция не выполнена
          x-description-i18n:
            eng: Number of the bundle for which the operation failed
          example: payoutBundle-2
        code:
          type: string
          description: Код ошибки
          x-description-i18n:
            eng: Error code
          enum:
          - PAYOUT_BUNDLE_DELETE_UNAVAILABLE
          - PAYOUT_BUNDLE_NOT_FOUND
          example: PAYOUT_BUNDLE_DELETE_UNAVAILABLE
        message:
          type: string
          description: Описание ошибки
          x-description-i18n:
            eng: Error description
          example: 'Удаление реестра недоступно в статусе: "В работе". Доступные для удаления статусы: "Черновик", "Ждет доп. подпись"'
    Fiscal:
      type: boolean
      description: '1. true - выплата самозанятому с фискализацией, в payoutParams нужно передать ИНН и телефон

        2. false - выплата физ лицу, в payoutParams нужно передать телефон'
      x-description-i18n:
        eng: '1. true - payment to self-employed with fiscalization, INN and phone number must be passed to payoutParams

          2. false - payment to physical person, phone number must be passed to payoutParams

          '
    DeleteBundlesResponse:
      type: object
      properties:
        failed:
          type: array
          description: Список реестров, которые не удалось удалить
          x-description-i18n:
            eng: List of bundles that failed to delete
          items:
            $ref: '#/components/schemas/DeleteFailedItem'
    payoutV2Request:
      description: Запрос на проведение выплаты
      type: object
      x-examples:
        Payload:
          id: 1404fhr7i272a2
          account: '40700000000000000000'
          amount: 1110.01
          currency: RUB
          fiscal: true
          paymentDetails: Выплата от страховой компании
          payoutMethod: SBP
          payoutParams:
            phone: '79191234567'
            bankAlias: RAIFFEISEN
            firstName: Иван
            middleName: Иванович
            lastName: Иванов
            inn: '12345678910'
          incomeTypeCode: '1'
          extra:
            apiClient: Payout Software
            apiClientVersion: 1.0.0
          currencyOperationCode: 21200
          agreementDate: '2025-09-18'
          agreementNumber: 123456789
          value:
            id: 1404fhr7i272a2
            account: '40700000000000000000'
            amount: 1110.01
            currency: RUB
            paymentDetails: Выплата от страховой компании
            payoutMethod: SBP
            payoutParams:
              phone: '79191234567'
              bankAlias: RAIFFEISEN
              firstName: Иван
              middleName: Иванович
              lastName: Иванов
              inn: '123456789101'
            incomeTypeCode: '1'
            extra:
              apiClient: Payout Software
              apiClientVersion: 1.0.0
            currencyOperationCode: 21200
            agreementDate: '2025-09-18'
            agreementNumber: 123456789
      title: payoutRequest
      properties:
        id:
          type: string
          minLength: 1
          description: Уникальный идентификатор выплаты в вашей системе, используется как номер документа в выписке
          x-description-i18n:
            eng: The unique payout ID in your system, used as the document number in the statement
          format: ^[Aa-Zz0-9_-]+
        account:
          type: string
          description: Счет, с которого будет происходить списание
