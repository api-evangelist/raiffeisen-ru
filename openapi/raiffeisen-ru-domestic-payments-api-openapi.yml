      - domestic-payments
      summary: Импорт РПП в формате 1С
      operationId: import1CDomesticPayment
      description: 'ВАЖНО: Данный функционал недоступен для клиентов сегмента Финансовые институты!

        Импорт платежных поручений из файла в формате 1С.'
      parameters:
      - name: notes
        in: query
        description: Дополнительные примечания
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        description: Файлы в формате 1С
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Массив файлов в формате 1С
        required: true
      responses:
        '201':
          description: Файл сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiShortProcessImportDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
