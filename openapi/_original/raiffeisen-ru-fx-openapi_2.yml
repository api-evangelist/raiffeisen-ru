  /v1/rfq/forward:
    get:
      tags:
      - "Forward"
      summary: "Получение обменного курса для поставочного/беспоставочного форвард\
        а"
      operationId: "getForwardRfq"
      description: "Чтоб запросить обменный курс валют, введите обязательные парам\
        етры и получите в ответе:\n  - идентификатор квоты\n  - курс на указанную\
        \ сторону"
      parameters:
      - in: "header"
        name: "CNUM"
        description: "Уникальный идентификатор клиента (CNUM)"
        required: true
        schema:
          type: "string"
          example: "U12345"
      - in: "query"
        name: "baseCurrency"
        description: "Базовая валюта"
        required: true
        schema:
          type: "string"
          example: "USD"
      - in: "query"
        name: "quotedCurrency"
        description: "Котируемая валюта"
        required: true
        schema:
          type: "string"
          example: "RUB"
      - in: "query"
        name: "amount"
        description: "Объем, на который запрашивается цена"
        required: true
        schema:
          type: "string"
          example: 5000
      - in: "query"
        name: "side"
        description: "Сторона сделки"
        required: true
        schema:
          type: "string"
          enum:
          - "BUY"
          - "SELL"
          example: "SELL"
      - in: "query"
        name: "endorsement"
        description: "Способ подтверждения сделки"
        required: true
        schema:
          type: "string"
          example: "CRYPTO_PRO"
      - in: "query"
        name: "valueDate"
        description: "Дата расчетов по форвардной сделке"
        required: true
        schema:
          type: "string"
          format: "date"
          example: "2026-05-28"
      - in: "query"
        name: "settlMethod"
        description: "Тип расчетов по сделке"
        required: true
        schema:
          type: "string"
          enum:
          - "DELIVERABLE"
          - "NON_DELIVERABLE"
        examples:
          Поставочный форвард:
            summary: "Поставочный форвард"
            value: "DELIVERABLE"
          Беспоставочный форвард:
            summary: "Беспоставочный форвард"
            value: "NON_DELIVERABLE"
      - in: "query"
        name: "fixingType"
        description: "Способ определения курса спот для беспоставочного форварда.\
          \ Его можно определить по ответу соответствующего API"
        required: false
        schema:
          type: "string"
          enum:
          - "RAIF_FIXING"
          - "CBRF_FIXING"
        examples:
          Поставочный форвард:
            summary: "Поставочный форвард"
            value: "Не указывать"
          Беспоставочный форвард:
            summary: "Беспоставочный форвард"
            value: "RAIF_FIXING"
      - in: "query"
        name: "initialMarginCurrency"
        description: "Валюта первоначальной маржевой суммы. Указывается, если нуже\
          н курс для форварда под обеспечение"
        required: false
        schema:
          type: "string"
          enum:
          - "RUB"
        examples:
          Поставочный форвард:
            summary: "Форвард не под обеспечение"
            value: "Не указывать"
          Беспоставочный форвард:
            summary: "Форвард под обеспечение"
            value: "RUB"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: "Обменный курс для поставочного/беспоставочного форварда"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "result"
                - "requestId"
                properties:
                  result:
                    type: "object"
                    description: "Объект с результатом исполнения запроса"
                    required:
                    - "rfqId"
                    - "buyAmount"
                    - "buyCurrency"
                    - "sellAmount"
                    - "sellCurrency"
                    - "clientSide"
                    - "price"
                    - "priceDecimalPlaces"
                    - "initialMargin"
                    - "currencyPair"
                    - "tenor"
                    - "valueDate"
                    - "tradeDate"
                    - "ttl"
                    - "enableTrading"
                    properties:
                      rfqId:
                        type: "string"
                        description: "Идентификатор запроса цены"
                        example: "dc037808550811f18473e3d33f213b47"
                      buyAmount:
                        type: "string"
                        description: "Сумма покупки"
                        example: "468560"
                      buyCurrency:
                        type: "string"
                        description: "Валюта покупки"
                        example: "RUB"
                      sellAmount:
                        type: "string"
                        description: "Сумма продажи"
                        example: "5000"
                      sellCurrency:
                        type: "string"
                        description: "Валюта продажи"
                        example: "USD"
                      clientSide:
                        type: "string"
                        description: "Сторона сделки"
                        example: "SELL"
                      price:
                        type: "string"
                        description: "Курс сделки"
                        example: "93.712"
                      priceDecimalPlaces:
                        type: "integer"
                        description: "Количество знаков после запятой для курса"
                        example: 3
                      initialMargin:
                        type: "object"
                        description: "Первоначальная маржевая сумма по форвардной\
                          \ сделке"
                        required:
                        - "amount"
                        - "percent"
                        - "currency"
                        properties:
                          amount:
                            type: "string"
                            description: "Сумма первоначальной маржевой суммы"
                            example: "1000.00"
                          percent:
                            type: "string"
                            description: "Процент первоначальной маржевой суммы"
                            example: "10.00"
                          currency:
                            type: "string"
                            description: "Валюта первоначальной маржевой суммы"
                            example: "RUB"
                      currencyPair:
                        type: "string"
                        description: "Валютная пара"
                        example: "USD/RUB"
                      tenor:
                        type: "string"
                        description: "Тенор сделки"
                        example: "BRD"
                      valueDate:
                        type: "string"
                        description: "Дата расчетов по сделке"
                        example: "2026-05-28T00:00:00Z"
                      tradeDate:
                        type: "string"
                        description: "Дата совершения операции"
                        example: "2026-05-21"
                      ttl:
                        type: "integer"
                        description: "Время жизни обменного курса в миллисекундах"
                        example: 10000
                      enableTrading:
                        type: "boolean"
                        description: "Признак доступности заключения сделки по пол\
                          ученной котировке"
                        example: true
                  requestId:
                    type: "string"
                    description: "Идентификатор запроса для трейсинга"
                    example: "6a0eed7ca78a443595f7be90b8acac88"
              examples:
                Успешный ответ:
                  summary: "Успешный ответ"
                  value:
                    result:
                      rfqId: "dc037808550811f18473e3d33f213b47"
                      buyAmount: "468560"
                      buyCurrency: "RUB"
                      sellAmount: "5000"
                      sellCurrency: "USD"
                      clientSide: "SELL"
                      price: "93.712"
                      priceDecimalPlaces: 3
                      initialMargin:
                        amount: "1000.00"
                        percent: "10.00"
                        currency: "RUB"
                      currencyPair: "USD/RUB"
                      tenor: "BRD"
                      valueDate: "2026-05-28T00:00:00Z"
                      tradeDate: "2026-05-21"
                      ttl: 10000
                      enableTrading: true
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
        "400":
          description: "Некорректный запрос"
          content:
            application/json:
              schema:
                required:
                - "error"
                - "requestId"
                type: "object"
                properties:
                  error:
                    type: "object"
                    description: "Объект с кодом ошибки"
                    required:
                    - "code"
                    properties:
                      code:
                        type: "string"
                        description: "Значение кода ошибки"
                      message:
                        type: "string"
                        description: "Описание ошибки"
                      data:
                        type: "array"
                        description: "Дополнительные данные об ошибке"
                        items:
                          type: "object"
                          properties:
                            field:
                              type: "string"
                              description: "Параметр"
                            value:
                              type: "string"
                              description: "Значение параметра"
                  requestId:
                    type: "string"
                    description: "Идентификатор запроса"
                    example: "6a0eed7ca78a443595f7be90b8acac88"
              examples:
                Некорректный запрос:
                  summary: "Некорректный запрос"
                  value:
                    error:
                      code: "app.invalid.request"
                      message: "Bad Request"
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
                Недоступный инструмент:
                  summary: "Недоступный инструмент"
                  value:
                    error:
                      code: "unavailable.instrument"
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "Бизнес ошибки"
          content:
            application/json:
              schema:
                required:
                - "error"
                - "requestId"
                type: "object"
                properties:
                  error:
                    type: "object"
                    description: "Объект с кодом ошибки"
                    required:
                    - "code"
                    properties:
                      code:
                        type: "string"
                        description: "Значение кода ошибки"
                      message:
                        type: "string"
                        description: "Описание ошибки"
                      data:
                        type: "object"
                        description: "Дополнительная информация об ошибке"
                  requestId:
                    type: "string"
                    description: "Идентификатор запроса"
                    example: "6a0eed7ca78a443595f7be90b8acac88"
              examples:
                Запрос курсов выключен:
                  summary: "Запрос курсов выключен"
                  value:
                    error:
                      code: "rfq.disabled"
                      message: null
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
                Запрос был произведен вне часов торговли:
                  summary: "Запрос был произведен вне часов торговли"
                  value:
                    error:
                      code: "rfq.market.data.invalid.trading.time.outside.trading.hours"
                      message: null
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
                Запрос был произведен в праздник или нерабочий день:
                  summary: "Запрос был произведен в праздник или нерабочий день"
                  value:
                    error:
                      code: "rfq.market.data.invalid.trading.time.holiday"
                      message: null
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
                Запрошенная сумма превышает допустимый порог:
                  summary: "Запрошенная сумма превышает допустимый порог"
                  value:
                    error:
                      code: "rfq.quote.exceeds.limits"
                      message: null
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
                Нет ликвидности для предоставления цены:
                  summary: "Нет ликвидности для предоставления цены"
                  value:
                    error:
                      code: "rfq.market.data.not.available"
                      message: null
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
                Инструмент выключен:
                  summary: "Инструмент выключен"
                  value:
                    error:
                      code: "rfq.market.data.disabled"
                      message: null
                    requestId: "6a0eed7ca78a443595f7be90b8acac88"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/trades/blotter:
    post:
      tags:
      - "Deals history"
      summary: "Запрос для получения истории спотовых и форвардных сделок"
      operationId: "tradesBlotter"
      description: "Чтобы запросить историю сделок заполните параметры фильтрации\
        \ и сортировки и получите в ответе историю ранее заключенных сделок с их п\
        араметрами"
      parameters:
      - in: "header"
        name: "CNUM"
        description: "Уникальный идентификатор клиента (CNUM)"
        required: true
        schema:
          type: "string"
          example: "U12345"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        description: "Запросить историю сделок"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                offset:
                  type: "integer"
                  description: "Значение смещения строк со сделками из истории сде\
                    лок"
                limit:
                  type: "integer"
                  description: "Ограничение на количество строк со сделками из ист\
                    ории сделок"
                filter:
                  type: "array"
                  description: "Объект с параметрами фильтрации"
                  items:
                    type: "object"
                    properties:
                      property:
                        type: "string"
                        description: "Параметры фильтрации"
                      clause:
                        type: "array"
                        description: "Массив со значениями параметров, по которым\
                          \ необходимо производить фильтрацию"
                        items:
                          type: "string"
                sort:
                  type: "array"
                  description: "Объект с параметрами фильтрации"
                  items:
                    type: "object"
                    properties:
                      direction:
                        type: "string"
                        description: "Направление сортировки, с возможными значени\
                          ями \"ASC\" или \"DESC\""
                      property:
                        type: "string"
                        description: "Параметр по которому необходимо сортировать"
            examples:
              Запрос с фильтраций и сортировкой:
                summary: "Запрос с фильтраций и сортировкой"
                value:
                  offset: 0
                  limit: 60
                  sort:
                  - property: "tradeDate"
                    direction: "DESC"
                  filter:
                  - property: "currencyPair"
                    clause:
                    - "USD/RUB"
                    - "AUD/RUB"
                    - "USD/CNH"
              Запрос с фильтрацией:
                summary: "Запрос с фильтрацией"
                value:
                  offset: 0
                  limit: 60
                  filter:
                  - property: "currencyPair"
                    clause:
                    - "USD/RUB"
                    - "AUD/RUB"
                    - "USD/CNH"
              Запрос с сортировкой:
                summary: "Запрос с сортировкой"
                value:
                  offset: 0
                  limit: 60
                  sort:
                  - property: "tradeDate"
                    direction: "DESC"
        required: true
      responses:
        "200":
          description: "История сделок"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "result"
                - "requestId"
                properties:
                  result:
                    type: "object"
                    description: "Объект с результатом исполнения запроса"
                    required:
                    - "hasMore"
