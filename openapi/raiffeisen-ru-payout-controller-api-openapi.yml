            eng: Account to be debited
          maxLength: 20
        amount:
          type: number
          description: 'Сумма в рублях.

            Действует несколько лимитов от НСПК:

            1. Ограничение до 1000000 рублей (включительно) на одну операцию

            2. Ограничение до 2000000 рублей в сутки в пользу одного получателя

            Можно сделать 3 выплаты на одинаковую сумму, например, по 400000. Главное, чтобы первые 2 выплаты в общей сумме не превысили лимит в 1000000'
          x-description-i18n:
            eng: 'Amount in Russian ruble.

              There are several limits from NSPK

              1. Limitation up to 1,000,000 rubles (inclusive) for one operation

              2. Limitation up to 2,000,000 rubles per day in favor of one recipient

              You can make 3 payouts for the same amount, for example, 400,000 each. The main thing is that the first 2 payouts in total do not exceed the limit of 1,000,000

              '
        currency:
          type: string
          description: Валюта выплаты
          x-description-i18n:
            eng: Payout currency
          maxLength: 3
          minLength: 3
          enum:
          - RUB
        fiscal:
          $ref: '#/components/schemas/Fiscal'
        paymentDetails:
          type: string
          minLength: 1
          description: Назначение платежа. Значение попадает в выписку после системного префикса. Не может быть пустым или содержать только пробелы. Может содержать:<br/>• Символы латинского алфавита (A–Z и a–z) с десятичными кодами из диапазонов [065-090] и [097-122] в кодировке UTF-8;<br/>• Символы русского алфавита (А-Я и а-я) с десятичными кодами из диапазона [1040-1103] в кодировке UTF-8;<br/>• Цифры 0-9 с десятичными кодами из диапазона [048-057] в кодировке UTF-8;<br/>• Специальные символы с десятичными кодами из диапазонов [032-047], [058-064], [091-096], [123-126] в кодировке UTF-8; - Символ «№» под номером 8470 в кодировке UTF-8
          x-description-i18n:
            eng: Purpose of payment. The value is included in the statement after the system prefix. Cannot be empty or contain only spaces. May contain:<br/>• Latin alphabet characters (A–Z and a–z) with decimal codes from the ranges [065-090] and [097-122] in UTF-8 encoding;<br/>• Characters of the Russian alphabet (A-Z and a-z) with decimal codes from the range [1040-1103] in UTF-8 encoding;<br/>• Digits 0-9 with decimal codes from the range [048-057] in UTF-8 encoding;<br/>• Special characters with decimal codes from ranges [032-047], [058-064], [091-096], [123-126] in UTF-8 encoding; - The character "№." under the number 8470 in UTF-8 encoding
          maxLength: 140
