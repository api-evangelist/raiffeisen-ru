      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        description: Для MT940 валидируется условие "to" != "текущая дата".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMt940ReportRequest'
            examples:
              mt940RequestOnlyRequired:
                $ref: '#/components/examples/mt940RequestOnlyRequired'
              mt940RequestAllFields:
                $ref: '#/components/examples/mt940RequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/pdf/attachments:
    post:
      tags:
      - Report V1
      summary: Генерация приложений к выписке в формате PDF
      description: Генерация приложений PDF отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: pdfAttachmentsRequest
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePdfAttachmentsReportRequest'
            examples:
              pdfAttachmentsRequestOnlyRequired:
                $ref: '#/components/examples/pdfAttachmentsRequestOnlyRequired'
              pdfAttachmentsRequestAllFields:
                $ref: '#/components/examples/pdfAttachmentsRequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorPdfAttachmentsReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorPdfAttachmentsReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/pdf:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате PDF с приложениями или без приложений
      description: Генерация PDF отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: pdfRequest
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePdfReportRequest'
            examples:
              pdfRequestOnlyRequired:
                $ref: '#/components/examples/pdfRequestOnlyRequired'
              pdfRequestAllFields:
                $ref: '#/components/examples/pdfRequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorPdfReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/1c:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате 1С
      description: Генерация 1C отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: oneCRequest
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create1CReportRequest'
            examples:
              oneCRequestOnlyRequired:
                $ref: '#/components/examples/oneCRequestOnlyRequired'
              oneCRequestAllFields:
                $ref: '#/components/examples/oneCRequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/camt-053:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате camt.053
      description: Генерация camt.053 отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: camt053Request
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        description: Для camt.053 валидируется условие "to" != "текущая дата".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCamt053ReportRequest'
            examples:
              camt053RequestOnlyRequired:
                $ref: '#/components/examples/camt053RequestOnlyRequired'
              camt053RequestAllFields:
                $ref: '#/components/examples/camt053RequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
          $ref: '#/components/responses/requestValidationErrorReportRequest'
        '404':
          $ref: '#/components/responses/noStatementsErrorReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports/camt-052:
    post:
      tags:
      - Report V1
      summary: Генерация выписки в формате camt.052
      description: Генерация camt.052 отчета по переданным параметрам запроса. В ответе возвращается идентификатор генерации отчета.
      operationId: camt052Request
      parameters:
      - $ref: '#/components/parameters/dryRun'
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        description: Для camt.052 валидируется условие "from" == "to" == "текущая дата".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCamt052ReportRequest'
            examples:
              camt052RequestOnlyRequired:
                $ref: '#/components/examples/camt052RequestOnlyRequired'
              camt052RequestAllFields:
                $ref: '#/components/examples/camt052RequestAllFields'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/dryRunCheckSuccess'
        '202':
          $ref: '#/components/responses/reportRequestGenerationAccepted'
        '400':
