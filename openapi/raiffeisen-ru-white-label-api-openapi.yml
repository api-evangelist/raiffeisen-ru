          - PREPAYMENT
          - CREDIT
          - CREDIT_PAYMENT
          example: FULL_PREPAYMENT
        measurementUnit:
          type: string
          description: '`Тег ФФД — 2108` <br/>

            Единица измерения товара, работы, услуги, иного предмета расчета.

            <br/> Для ФФД 1.05 передавать строковое значение до 16 символов включительно.

            <br/> Для ФФД 1.2 передавать значения из списка:

            <br/>• PIECE – штука/единица/дробный товар

            <br/>• GRAM – грамм

            <br/>• KILOGRAM – килограмм

            <br/>• TON – тонна

            <br/>• CENTIMETER – сантиметр

            <br/>• DECIMETER – дециметр

            <br/>• METER – метр

            <br/>• SQUARE_CENTIMETER – кв. сантиметр

            <br/>• SQUARE_DECIMETER – кв. дециметр

            <br/>• SQUARE_METER – кв. метр

            <br/>• MILLILITER – миллилитр

            <br/>• LITER – литр

            <br/>• CUBIC_METER – куб. метр

            <br/>• KILOWATT_HOUR – киловатт-час

            <br/>• GIGACALORIE – гигакалория

            <br/>• DAY – сутки/день

            <br/>• HOUR – час

            <br/>• MINUTE – минута

            <br/>• SECOND – секунда

            <br/>• KILOBYTE – килобайт

            <br/>• MEGABYTE – мегабайт

            <br/>• GIGABYTE – гигабайт

            <br/>• TERABYTE – терабайт

            <br/>• OTHER – иное

            <br/>Если передано значение не из списка выше, то в ОФД автоматически будет передано OTHER

            '
          x-description-i18n:
            eng: '`The tag FDF — 2108` <br/>

              Unit of measurement of goods, work, services, other payment objects

              <br/> If FFD 1.05, string value up to 16 symbols has to be passed.

              <br/> If FFD 1.2, value from the list is accepted:

              <br/>• PIECE – a piece

              <br/>• GRAM – gram

              <br/>• KILOGRAM – kilogram

              <br/>• TON – ton

              <br/>• CENTIMETER – centimeter

              <br/>• DECIMETER – decimeter

              <br/>• METER – meter

              <br/>• SQUARE_CENTIMETER – sq. centimeter

              <br/>• SQUARE_DECIMETER – sq. decimeter

              <br/>• SQUARE_METER – sq. meter

              <br/>• MILLILITER – milliliter

              <br/>• LITER – liter

              <br/>• CUBIC_METER – c. meter

