components:
  examples:
    pdfAttachmentsRequestAllFields:
      summary: Запрос PDF приложения все поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - 40701978200000000001:401867
        from: '2023-10-06'
        to: '2023-10-06'
        fileName: file
        intraday: true
        debitCreditFilter: DEBIT
        counterpartyInn: '7718266916'
        counterpartyAccounts:
        - '40701978200000000001'
        - '40701978200000000001'
        splitBy: OPERATION
        sign: true
        sort:
        - sortBy: DEBIT
          orderBy: ASC
        - sortBy: CREDIT
          orderBy: ASC
    reportStatusCompleted:
      summary: Генерация отчета завершена
      value:
        reportId: 819e5e3c-07f8-4dda-a640-9d6d47bd9344
        status: COMPLETED
    fileIsNotReady:
      summary: Файл отчета не готов
      value:
        code: report-file-is-not-ready
        message: Requested report file is not ready yet.
    statementsSignParamsError:
      summary: Невозможно подписать выписки. Внутридневные или разделенные на файлы выписки не могут быть подписаны.
      value:
        code: statements-sign-params-error
        message: 'Statements cannot be signed: intraday or split statements cannot be signed.'
    excelRequestAllFields:
      summary: Запрос Excel все поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - 40701978200000000001:401867
        from: '2023-09-06'
        to: '2023-10-06'
        zero: true
        fileName: file
        sort:
        - sortBy: DEBIT
          orderBy: ASC
        - sortBy: CREDIT
          orderBy: ASC
        intraday: true
        debitCreditFilter: DEBIT
        counterpartyInn: '7718266916'
        counterpartyAccounts:
        - '40701978200000000001'
        - '40701978200000000001'
        splitBy: ACCOUNT
    noStatements:
      summary: Выписок не найдено
      value:
        code: no-statements
        message: No statements were found that match the request parameters
    reportRequestGenerationAccepted:
      summary: Запрос на генерацию отчета был принят
