      - "name"
      - "price"
      - "unit"
      - "vat"
    Invoice:
      type: "object"
      description: "Счёт на оплату"
      example:
        num: "INV-2024-001"
        date: "2026-09-30"
        cause: "Оплата по договору №123456"
        comment: "Платёж по договору №123456"
      properties:
        num:
          type: "string"
          description: "Номер счёта в буквенно-цифровом формате (может содержать л\
            атиницу, кириллицу, цифры, дефис и слэш)"
          example: "INV-2024-001"
          pattern: "^(?=[A-Za-zА-Яа-я0-9/-]{1,30})(?=.*[1-9]+).*$"
        date:
          type: "string"
          format: "date"
          description: "Дата выставления счёта"
          example: "2007-12-03"
        cause:
          type: "string"
          description: "Основание для выставления счёта"
          example: "Оплата по договору №123456"
        comment:
          type: "string"
          description: "Комментарий"
          example: "Платёж по договору №123456"
