openapi: 3.2.0
info:
  title: Raiffeisen Ru White Label API
  version: '1.0'
  contact:
    name: Support e-mail
    email: ecom@raiffeisen.ru
    x-team-id: 178
    x-short-team-name: PAPAS
  license:
    name: Proprietary
    url: https://www.raiffeisen.ru/
  x-description-i18n:
    eng: "# Connection to acquiring\nTo connect, fill out an application in [the online bank](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) or [the mobile application.](https://rbo.page.link/internet)\n\nFor questions about working with the API, please contact Raiffeisenbank support service:\n- email: ecom@raiffeisen.ru\n\n### Preparatory activities\nTo accept payments:\n* Fill out the [application](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) to connect acquiring\n* Choose an integration method and implement it\n* Make test payments\n\n# Operation scheme\n## Payment on the merchant's form\n\n<a href='images/WLEcom_en.svg' target='_blank'><img src='images/WLEcom_en.svg'></a>\n\n## Create payment with subscription\n\n<a href='images/WLEcom-sub-and-payment_en.svg' target='_blank'><img src='images/WLEcom-sub-and-payment_en.svg'></a>\n\n## Bind card\n`IN DEVELOPMENT` <br>\n\n<a href='images/WLEcom-bind-card_en.svg' target='_blank'><img src='images/WLEcom-bind-card_en.svg'></a>\n\n### Payment scenario\n`This workflow requires your company to have PCI DSS certification`<br><br>\nTo make a payment using your own payment form, you must support integration with the [Bank's API](#tag/white-label) methods.\n\n**1. Creating a payment or binding a bank card**\n\nTo make a payment or bind a bank card, you must first create a payment using the [[Create payment]](#operation/post-payments-v1-merchants-publicId-payments) method, specifying the required 'flow' parameter:\n- `flow: CARD` — Card payment\n- `flow: CARD_BINDING` — Card binding\n\nAs a result of executing the method, the payment will be generated in the Bank's system.\nThe method response will return a payment object with the status `NEW`.\n\n- Together with the payment object, additional parameters required for performing an additional [[3DS Method]](#operation/post3DSMethod) step may be returned.\n\n**2. Continuing the payment**\n\nAfter the payment or bind bank card has been created, you must continue processing the payment using the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method.\n- In some cases, the method can complete the payment (transfer it to the final status `SUCCESS`) if the payment passes via 3DS v.2 frictionless flow.\n\n**3. Calling the issuer's ACS for 3DS authentication and OTP code entry by the user**\n\nIf, as a result of executing the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method, the status `3DS_PENDING` is returned,\nthe merchant must redirect the payer to the issuing bank's authorization page, and also send a POST request to the issuer's authentication service.\n\n- The issuing bank's address will be returned in the `acsUrl` parameter\n- The parameters required to send in the request depend on the 3DS version\n\n**3DS v.1**:\n  | Parameter           | Description             |\n  |---------------------|-------------------------|\n  | `MD`                | Information for payment identification. The parameter is returned in the response of the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method. |\n  | `PaReq`             | The parameter required for payer authentication. The parameter is returned in the response of the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method. |\n  | `TermUrl`           | The URL on the merchant's side, to which the ACS will return the response after passing 3DS. The payer will also be redirected to this address after successful OTP code entry.|\n\n**3DS v.2**:\n  | Parameter         | Description             |\n  |-------------------|-------------------------|\n  | `creq`            | Payment session data required for 3DS authentication. The parameter is returned in the response of the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method. |\n\nExample of sending a POST request to the issuer's ACS to continue 3DS v.2:\n```js\n  export function createContinuePayment3ds2Iframe(acsUrl, creq) {\n    const container = document.getElementById('otp-page');\n    const iframe = window.document.createElement('iframe');\n    iframe.id = 'threeDs-2-iframe';\n    iframe.style = 'height: 100%; width: 100%; overflow: hidden; position: absolute; top: 0; left: 0; background: white; z-index: 1000; border: none;';\n    const html = `\n      <body onload=\"document.forms[0].submit()\">\n        <div>\n          <form name=\"form\" action=\"${acsUrl}\" method=\"post\">\n            <input type=\"hidden\" name=\"creq\" value=\"${creq}\">\n          </form>\n        </div>\n      </body>\n    `;\n    container.appendChild(iframe);\n    iframe.contentWindow.document.open();\n    iframe.contentWindow.document.write(html);\n  }\n```\n\nAfter calling the ACS and successful OTP code entry by the user, the merchant's `termUrl` will receive an incoming request from the issuer with the `cres` parameter (in case of 3DS v.2 challenge), or `pares` and `md` in case of 3DS v.1.\n\nExample of obtaining pares via subscription and post-message listening:\n```js\n  window.addEventListener('message', (event) => {\n    try {\n      if (typeof event.data !== 'string') return;\n      const { pares } = JSON.parse(event.data);\n      // Call the required 3DS confirmation method to complete the payment\n    } catch (error) {\n      console.error('Error processing message:', error);\n    }\n  });\n```\n\n**4. 3DS confirmation and payment completion**\n\nTo complete the payment, you must finish processing the payment using the\n[[3DS v.1 Confirmation]](#operation/put-payments-v1-merchants-publicId-payments-id-3ds1-confirm) or\n[[3DS v.2 Confirmation]](#operation/put-api-payments-v1-merchants-publicId-payments-id-3ds2-confirm) methods.\n\nExample of completing the payment via 3DS v.1:\n  ```js\n  window.parent.postMessage(JSON.stringify({\n    pares: paRes\n  }), '*');\n  ```\n\nExample of completing the payment via 3DS v.2:\n  ```js\n  window.parent.postMessage(JSON.stringify({\n    cres: document.getElementById('data').dataset.cres,\n  }), '*');\n  ```\n\n**Payment status model**:\n\n<div style=\"text-align: center;\">\n  <img src=\"images/wl-ecom-payment-status-model.png\" alt=\"Payment status model\">\n</div>\n\n# Integration\nInteraction is carried out via the HTTP protocol using the `POST` `GET` `PUT` `DELETE` methods.\n\nWhen sending requests to open a payment form and create an order with opening a payment form, the API returns a response in the HTML document format, responses to other requests are returned in JSON format.\n\n## Authorization\nTo authorize requests, you need:\n* `publicId` - The identifier that is used to open the payment form and is public.\n* `secretKey` - A secret key that is used for inter-service interaction. It is private, must be stored in a secure place and must not be transferred to third parties.\n\n| Circuit          | URL address             |\n|------------------|-------------------------|\n| Production       |https://pay.raif.ru      |\n| Test             |https://pay-test.raif.ru |\n\nInter-service requests are authorized using the secret key `secretKey`. The authorization parameter is passed in the `Authorization` header, the value of which is formed as `Bearer + secretKey`\n\nYou can view the production `publicId` and generate a `secretKey` in the [Online Bank](https://www.rbo.raiffeisen.ru/acquiring/mcp#/), or [Personal Account](https://pay.raif.ru/account/#/auth).\n\nInstructions for generating `secretKey` can be found in the Help Center:\n* [Generate a secret key in Online Banking](https://help.pay.raif.ru/sbp/rbo/secretkey)\n* [Generate a secret key in your Personal Account](https://help.pay.raif.ru/sbp/lk/secretkey)\n\nTo generate a `secretKey` in the test circuit, you must contact the support service ecom@raiffeisen.ru\n\n# Testing\nFor a full payment testing cycle, you must specify a payment amount greater than 10 rubles.\n\n`Test cards for payment scenarios`\n| Card PAN          | Card validity period| CVV | OTP code| 3DS Scenario       |\n|-------------------|---------------------|-----|---------|--------------------|\n| 2201382000000039  | 12/35               | 880 |         | 3DS2 Frictionless  |\n| 2201382000000021  | 12/35               | 880 |   1234  | 3DS2 Challenge     |\n| 4000001000000018  | 12/35               | 880 |   1234  | 3DS1 Flow          |\n\n## Negative testing\n\nThe amounts listed below can be used to trigger errors for payments or subscription debits.\n\n| Scenario | Amount | Error type |\n|----------|--------|------------|\n|* Card payment <br> * Card subscription debit | 99.51 | Insufficient funds to perform the operation |\n|* Card payment | 99.61 | Authorization amount exceeded the card spending limit |"
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: 'Operations tagged white-label across 2 of this provider''s published API definitions: raiffeisen-ru-raif-pay-whitelabel-ecom-openapi.json, raiffeisen-ru-raif-pay-whitelabel-ecom-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: white-label
  x-displayName: Платежная форма клиента
  x-x-displayName-i18n:
    eng: Merchant's payment form
  description: Для работы с карточными платежами с вашей формой, потребуется PCI DSS сертификация вашей организации.
  x-description-i18n:
    eng: 'To work with card payments with your payment form, your organization will need PCI DSS certification.


      PCI DSS is an information security standard adopted in the Visa and MasterCard payment card industry. All companies that accept card payments on their own payment form are required to comply with the standard''s requirements.<br>

      For fiscalization of payments, you can use [Bank fiscalization API](https://pay.raif.ru/api/doc/fiscal.html)

      Before starting work, it is recommended that you familiarize yourself with the payment scenario: [Payment scenario](#section/Shema-raboty/Provedenie-platezha-na-forme-klienta).


      **The API for this scenario may be extensible**.

      '
paths:
  /payments/v1/merchants/{publicId}/payments:
    parameters:
    - $ref: '#/components/parameters/publicId'
    post:
      summary: Создание платежа
      x-summary-i18n:
        eng: Create payment
      operationId: post-payments-v1-merchants-publicId-payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
            examples:
              Привязка карты:
                $ref: '#/components/examples/WL.CREATE_CARD_BINDING_REQUEST'
              Платёж картой:
                $ref: '#/components/examples/WL.CREATE_PAYMENT_REQUEST'
              Платёж картой с оформлением подписки:
                $ref: '#/components/examples/WL.CREATE_CARD_PAYMENT_WITH_SUBSCRIPTION_REQUEST'
              Платёж картой со сплитованием:
                $ref: '#/components/examples/WL.CREATE_CARD_PAYMENT_WITH_SPLITS_REQUEST'
              Платёж картой с подпиской и сплитованием:
                $ref: '#/components/examples/WL.CREATE_CARD_PAYMENT_WITH_SUBSCRIPTION_AND_SPLITS_REQUEST'
              Списание по подписке:
                $ref: '#/components/examples/WL.CREATE_SUBSCRIPTION_PAYMENT_REQUEST'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPayment'
              examples:
                Привязка карты, 3DS v.1 сценарий:
                  $ref: '#/components/examples/WL.CARD_BINDING_RESPONSE_3DS1'
                Привязка карты, 3DS v.2 сценарий:
                  $ref: '#/components/examples/WL.CARD_BINDING_RESPONSE_3DS2'
                Оплата картой, 3DS v.1 сценарий:
                  $ref: '#/components/examples/WL.CREATED_WL_PAYMENT'
                Оплата картой, 3DS v.2 сценарий:
                  $ref: '#/components/examples/WL.REQUIRED_3DS_METHOD'
                Списание по подписке:
                  $ref: '#/components/examples/WL.SUBSCRIPTION_PAYMENT_RESPONSE'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Ошибка формирования платежа:
                  $ref: '#/components/examples/WL_ERROR_400_ERROR_CREATE_PAYMENT'
                Ошибка валидации:
                  $ref: '#/components/examples/WL_ERROR_400_ERROR_VALID_TO_CREATE_PAYMENT'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/WL_ERROR_403_FORBIDDEN'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      description: '`Для мерчантов с наличием сертификата PCI DSS`


        Метод позволяет сформировать платеж в системе Банка, выполнить списание по подписке, привязать карту с автоматическим возвратом фиксированной суммы.


        **Сценарии использования:**

        - `flow: CARD` — Оплата картой

        - `flow: SUBSCRIPTION` — Оплата по подписке

        - `flow: CARD_BINDING` — Привязка карты


        **Примечания:**

        - Если в ответе метода вернулись дополнительные параметры `acsUrl`, `threeDSMethodData`, необходимо выполнить шаг [[Прохождение 3DS Method]](#operation/post3DSMethod).

        - Если дополнительные данные в ответе не вернулись, необходимо продолжать обработку платежа, используя метод [[Продолжение платежа]](#operation/put-payments-v1-merchants-publicId-payments-id).'
      x-description-i18n:
        eng: '`For merchants with PCI DSS certificate` <br> <br>

          This method allows you to generate a payment in the Bank''s system, perform a subscription debit, and bind a card with an automatic refund of a fixed amount.


          **Use cases:**

          - `flow: CARD` — Card payment

          - `flow: SUBSCRIPTION` — Subscription payment

          - `flow: CARD_BINDING` — Bank card binding


          **Card binding:**

          To create a binding, pass `flow: CARD_BINDING`.

          The request does not require `amount`, `order`, `extra`, or `splits`.

          The `id` parameter is optional; if not passed, it will be generated by the bank.


          **Notes:**

          - If the method response returned additional parameters `acsUrl`, `threeDSMethodData`, you must perform the [[Pass 3DS Method]](#operation/post3DSMethod) step.

          - If no additional data is returned in the response, you must continue processing the payment using the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method.

          '
      tags:
      - white-label
      security:
      - secretKey: []
      parameters: []
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /3DSMethod:
    post:
      summary: Прохождение 3DS Method
      x-summary-i18n:
        eng: 3DS Method processing
      description: '`Для мерчантов с наличием сертификата PCI DSS`


        Метод используется для выполнения шага 3DS Method в процессе аутентификации.

        Браузер плательщика должен отправить POST-запрос на `acsUrl`, предоставленный системой, с передачей параметра `threeDSMethodData`.


        **Примечания:**

        - Данный запрос выполняется **только из браузера плательщика**.

        - `acsUrl` - Полный адрес, который необходимо вызвать из браузера плательщика. Параметр будет получен в результате выполнения метода [[Создание платежа]](#operation/post-payments-v1-merchants-publicId-payments).

        - `threeDSMethodData` - JSON объект, закодированный в base64, содержащий информацию о транзакции, будет получен в результате выполнения метода [[Создание платежа]](#operation/post-payments-v1-merchants-publicId-payments).

        - После выполнения метода необходимо продолжать обработку платежа, используя метод [[Продолжение платежа]](#operation/put-payments-v1-merchants-publicId-payments-id).'
      x-description-i18n:
        eng: '`For merchants with PCI DSS certificate` <br> <br>

          The method is used to perform the 3DS Method step in the authentication process.

          The payer browser must send a POST request to the `acsUrl` provided by the system, passing the `threeDSMethodData` parameter.


          **Notes:**

          - This request is executed **only from the payer browser**.

          - `acsUrl` - The full address that must be called from the payer browser. The parameter will be obtained as a result of executing the [[Create payment]](#operation/post-payments-v1-merchants-publicId-payments) method.

          - `threeDSMethodData` - A base64 encoded JSON object containing transaction information that will be returned as a result of executing the [[Create Payment]](#operation/post-payments-v1-merchants-publicId-payments) method.

          - After executing the method, you must continue processing the payment using the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method.

          '
      operationId: post3DSMethod
      security: []
      servers:
      - url: https://3ds-ds1.mirconnect.ru/ma
        description: Адрес для вызова вернется в параметре `acsUrl` метода [[Создание платежа]](#operation/post-payments-v1-merchants-publicId-payments).
        x-description-i18n:
          eng: The address to call will be returned in the `acsUrl` parameter of the [[Create payment]](#operation/post-payments-v1-merchants-publicId-payments) method.
      tags:
      - white-label
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                threeDSMethodData:
                  type: string
                  description: JSON, закодированный в base64, содержащий информацию о транзакции
                  x-description-i18n:
                    eng: Base64 encoded JSON containing transaction information
                  example: eyJ0aHJlZURTQ29tcEluZm8iOiAiZXhhbXBsZSJ9
              required:
              - threeDSMethodData
            example:
              threeDSMethodData: eyJ0aHJlZURTQ29tcEluZm8iOiAiZXhhbXBsZSJ9
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      x-codeSamples:
      - lang: JavaScript
        source: "function executeThreeDSMethodInIframe(acsUrl, threeDSMethodData) {\n  const iframe = window.document.createElement('iframe');\n  iframe.id = 'call-3ds-method';\n  iframe.style.display = 'none';\n  document.body.appendChild(iframe);\n  const html = `\n    <body onload=\"document.forms[0].submit()\">\n      <div>\n        <form name=\"form\" action=\"${acsUrl}\" method=\"post\">\n          <input type=\"hidden\" name=\"threeDSMethodData\" value=\"${threeDSMethodData}\">\n        </form>\n      </div>\n    </body>\n  `;\n  iframe.contentWindow.document.open();\n  iframe.contentWindow.document.write(html);\n  iframe.contentWindow.document.close();\n}\n"
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /payments/v1/merchants/{publicId}/payments/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
        pattern: ^[A-Za-z0-9-_.]+$
      name: id
      in: path
      required: true
      description: Идентификатор платежа
      x-description-i18n:
        eng: Payment ID
    get:
      summary: Получение информации по платежу
      x-summary-i18n:
        eng: Receiving payment information
      tags:
      - white-label
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInfo'
              examples:
                Оплата картой, 3DS v.1 сценарий:
                  $ref: '#/components/examples/WL.CREATED_WL_PAYMENT'
                Оплата картой, 3DS v.2 сценарий:
                  $ref: '#/components/examples/WL.REQUIRED_3DS_METHOD'
                Необходимо подтверждение 3DS v.1:
                  $ref: '#/components/examples/WL.REQUIRED_CONFIRMATION_3DS1'
                Необходимо подтверждение 3DS v.2:
                  $ref: '#/components/examples/WL.REQUIRED_CONFIRMATION_3DS2'
                Успешная оплата:
                  $ref: '#/components/examples/WL.SUCCESS_PAYMENT'
                Неуспешная оплата:
                  $ref: '#/components/examples/WL.DECLINED_PAYMENT'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/WL_ERROR_403_FORBIDDEN'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Платеж не найден:
                  $ref: '#/components/examples/WL_ERROR_404_PAYMENT_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      operationId: get-payments-v1-merchants-publicId-payments-id
      security:
      - secretKey: []
      description: '`Для мерчантов с наличием сертификата PCI DSS`


        Метод позволяет получить состояние платежа, а также необходимые данные для прохождения 3DS аутентификации на любом этапе оплаты.'
      x-description-i18n:
        eng: '`For merchants with PCI DSS certificate` <br> <br>

          The method allows you to get the payment status, as well as the necessary data for passing 3DS authentication at any stage of payment.

          '
    put:
      summary: Продолжение платежа
      x-summary-i18n:
        eng: Continue payment
      operationId: put-payments-v1-merchants-publicId-payments-id
      responses:
        '200':
          $ref: '#/components/responses/ContinueWLPaymentResponse'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  value:
                    code: ERROR.FORBIDDEN
                    message: Доступ запрещен
                    traceId: abb066c61a7c8b74af83f245c7706813
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Платеж не найден:
                  value:
                    code: ERROR.PAYMENT_NOT_FOUND
                    message: Платеж не найден
                    traceId: 3af319058c62903432219dd24ed304d1
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  value:
                    code: ERROR.INTERNAL_ERROR
                    message: Внутренняя ошибка сервиса
                    traceId: abb066c61a7c8b74af83f245c7706813
      description: '`Для мерчантов с наличием сертификата PCI DSS`


        Метод используется для продолжения платежа. Метод также может завершить платеж в случае прохождения платежа по frictionless flow (3DS2).


        **Примечания:**

        - В случае получения статуса `3DS_PENDING` в ответе метода, необходимо отправить POST-запрос и перенаправить плательщика на ACS эмитента, подробнее данный шаг описан в [[Сценарии проведения платежа]](#section/Shema-raboty/Provedenie-platezha-na-forme-klienta).

        - После перенаправления плательщика на ACS эмитента, необходимо завершить платеж, используя методы [[Подтверждение 3DS v.1]](#operation/put-payments-v1-merchants-publicId-payments-id-3ds1-confirm), либо [[Подтверждение 3DS v.2]](#operation/put-api-payments-v1-merchants-publicId-payments-id-3ds2-confirm) с параметрами, полученными от эмитента.'
      x-description-i18n:
        eng: '`For merchants with PCI DSS certificate` <br> <br>

          The method is used to continue the payment. The method can also complete the payment in case of payment through frictionless flow (3DS2).


          **Notes:**

          - If the `3DS_PENDING` status is received in the method response, it is necessary to send a POST request and redirect the payer to the issuer''s ACS. This step is described in more detail in the [[Payment Scenarios]](#section/Shema-raboty/Provedenie-platezha-na-forme-klienta).

          - After the payer is redirected to the issuer''s ACS, it is necessary to complete the payment using the [[3DS v.1 Confirmation]](#operation/put-payments-v1-merchants-publicId-payments-id-3ds1-confirm) or [[3DS v.2 Confirmation]](#operation/put-api-payments-v1-merchants-publicId-payments-id-3ds2-confirm) methods with the parameters received from the issuer.

          '
      security:
      - secretKey: []
      tags:
      - white-label
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cresNotificationUrl:
                  type: string
                  description: URL-адрес на стороне мерчанта, на который ACS вернет ответ после прохождения 3DS. Также на данный адрес будет перенаправлен плательщик после успешного ввода OTP-кода. **Только для платежей, которые будут обработаны по 3DS v.2**.
                  x-description-i18n:
                    eng: The URL on the merchant side to which ACS will return a response after passing 3DS. The payer will also be redirected to this address after successfully entering the OTP code. **Only for payments that will be processed via 3DS v.2**.
            examples:
              '3DS v.2 ':
                value:
                  cresNotificationUrl: https://myscore.ru/succes-page-example
