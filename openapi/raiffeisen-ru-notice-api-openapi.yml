    Buyer:
      allOf:
      - $ref: '#/components/schemas/BuyerRequisites'
      - properties:
          id:
            description: Идентификатор покупателя
            example: 2c44306f-fc96-4780-9b37-6447273b190e
            format: uuid
            type: string
          createdAt:
            description: Дата и время создания
            example: '2025-07-10T06:53:37.433211'
            pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
            type: string
          clients:
            description: Клиенты связанные с покупателем
            example:
            - id: 2c44306f-fc96-4780-9b37-6447273b190e
              createdAt: '2025-07-10T06:53:37.433211'
              requisites:
                ogrn: '123456789012345'
                fullNameRus: Акционерное общество Ромашка
                shortNameRus: АО Ромашка
                address: address
                opf: opf
                inn: '1234567890'
                kpp: '123456789'
                shortNameEn: АО Ромашка
                cnum: AAAAAA
                fullNameEn: Акционерное общество Ромашка
                okved: '11.11'
              contacts:
              - id: 2c44306f-fc96-4780-9b37-6447273b190e
                createdAt: '2025-07-10T06:53:37.433211'
                email: foobar@mail.ru
                state:
                  statusDate: '2021-07-10T06:53:37.433111'
                  errors: []
