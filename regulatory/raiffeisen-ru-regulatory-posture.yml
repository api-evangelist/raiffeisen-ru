  HTTP 200, fetched 2026-10-09), written against Federal Law No. 152-FZ. Quotes are copied from
  the PDF text with line breaks joined by single spaces. The policy names data-subject request
  rights with a ten-day response duty, Russian-territory database localization, cross-border
  transfer, retention limits and processing by third parties on the Bank's instruction (no list
