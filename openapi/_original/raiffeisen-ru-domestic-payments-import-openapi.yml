        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    IdTokenHeader:
      name: "Id-Token"
      in: "header"
      description: "Идентификационный токен пользователя"
      required: true
      schema:
        type: "string"
        format: "byte"
        example: "SUQgVE9LRU4gRk9SIFRFU1RJTkc="
    AuthorizationHeader:
      name: "Authorization"
      in: "header"
      description: "Токен доступа"
      required: true
      schema:
        type: "string"
        format: "byte"
        example: "Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc="
  responses:
    ValidationError:
      description: "Ошибки валидации"
      content:
        application/xml:
          schema:
            type: "string"
    Forbidden:
      description: "Ошибка прав"
    Unauthorized:
      description: "Аутентификация не пройдена"
    InternalError:
      description: "Внутренняя ошибка"
  schemas:
    ApiShortProcessImportDto:
      type: "object"
      description: "Краткая информация о задаче импорта"
      properties:
        importTaskId:
          type: "string"
          description: "Идентификатор процесса импорта"
    ApiProcessImportDto:
      type: "object"
      description: "Подробная информация о задаче импорта"
      allOf:
      - $ref: "#/components/schemas/ApiShortProcessImportDto"
      properties:
        message:
          type: "string"
          description: "Сообщение, если не удалось целиком импортировать файл"
        startTime:
          type: "string"
          description: "Время начала импорта (GMT+3)"
        endTime:
          type: "string"
          description: "Время завершения импорта (GMT+3). Отображается только при\
            \ importStatus COMPLETED или ERROR"
        importStatus:
          $ref: "#/components/schemas/ProcessImportStatus"
        massPaymentId:
          type: "string"
          description: "Уникальный идентификатор массового платежа (отображается п\
            ри импорте массового платежа)"
        massPaymentStatus:
          $ref: "#/components/schemas/ApiMassPaymentStatus"
        importFormat:
          type: "string"
          description: "Формат импорта"
        documentsInfo:
          type: "array"
          items:
            $ref: "#/components/schemas/ImportDocumentInfoDto"
          description: "Информация по ошибкам в документах (платежному поручению)\
            \ в файле"
    ApiProcessImportFullDto:
      type: "object"
      description: "Подробная информация о задаче импорта"
      allOf:
      - $ref: "#/components/schemas/ApiShortProcessImportDto"
      properties:
        message:
          type: "string"
          description: "Сообщение, если не удалось целиком импортировать файл"
        startTime:
          type: "string"
          description: "Время начала импорта (GMT+3)"
        endTime:
          type: "string"
          description: "Время завершения импорта (GMT+3). Отображается только при\
            \ importStatus COMPLETED или ERROR"
        importStatus:
          $ref: "#/components/schemas/ProcessImportStatus"
        massPaymentId:
          type: "string"
          description: "Уникальный идентификатор массового платежа (отображается п\
            ри импорте массового платежа)"
        massPaymentStatus:
          $ref: "#/components/schemas/ApiMassPaymentStatus"
        importFormat:
          type: "string"
          description: "Формат импорта"
        documentsInfo:
          type: "array"
          items:
            $ref: "#/components/schemas/ImportDocumentFullInfoDto"
          description: "Информация и текущий статус по каждому документу (платежно\
            му поручению) в файле"
    ProcessImportStatus:
      type: "string"
      description: "Статус процесса импорта"
      enum:
      - "IN_PROGRESS"
      - "COMPLETED"
      - "QUEUED"
      - "ERROR"
    ApiMassPaymentStatus:
      type: "string"
      description: "Статус массового платежа"
      enum:
      - "IMPORT_PROCESS"
      - "IMPORTED"
      - "DRAFT"
      - "REJECTED"
    ImportDocumentInfoDto:
      type: "object"
      description: "Информация по одному документу в файле импорта"
      properties:
        documentListNumber:
          type: "integer"
          description: "Порядковый номер документа (платежного поручения) в файле"
        fileName:
          type: "string"
          description: "Имя файла, из которого импортирован платеж"
        paymentId:
          type: "string"
          description: "Уникальный идентификатор импортированного платежа. Присваи\
            вается только при documentStatus IMPORTED или DRAFT"
        message:
          type: "string"
          description: "Сообщение с ошибкой"
        documentNumber:
          type: "integer"
          description: "Номер документа"
        documentStatus:
          $ref: "#/components/schemas/ImportDocumentInfoStatus"
    ImportDocumentFullInfoDto:
      type: "object"
      description: "Информация по одному документу в файле импорта"
      properties:
        paymentId:
          type: "string"
          description: "Уникальный идентификатор импортированного платежа"
        documentNumber:
          type: "integer"
          description: "Номер документа"
        documentDate:
          type: "integer"
          description: "Дата документа"
        payerAccount:
          type: "string"
          description: "Счет плательщика"
        receiverAccount:
          type: "string"
          description: "Счет получателя"
        paymentAmount:
          type: "number"
          format: "decimal"
          description: "Сумма платежа"
        message:
          type: "string"
          description: "Сообщение из банка"
        status:
          $ref: "#/components/schemas/ImportDocumentFullInfoStatus"
    ImportDocumentInfoStatus:
      type: "string"
      description: "Статус документа"
      enum:
      - "IMPORTED"
      - "DRAFT"
      - "REJECTED"
    ImportDocumentFullInfoStatus:
      type: "string"
      description: "Возможные статусы платежа TEMP - черновик,  CREATED/IMPORTED -\
        \ документ прошел все проверки и ожидает подписи SIGNED/PARTLY_SIGNED - до\
        кумент частично или полностью подписан,  POSTPONED - отложена отправка, ACCEPTED_BY_ABS\
        \ - документ подписан и отправлен на процессинг,   IN_PROGRESS_BY_ABS - до\
        кумент поставлен в рейс на отправку в ЦБ,  INSUFFICIENT_FUNDS - недостаточ\
        но средств,  HOLD_ACCEPT_SPM - документ задержан противодействием мошеннич\
        еству,  HOLD_ACCEPT_UKK - документ задержан управлением комплаенс контроля\
        ,  PDC - документ отправлен в картотеку, т.е. денежные средства не поступи\
        ли на оплату платежа до COT, нодокумент не отклонился, т.к. является обяза\
        тельным к исполнению (зарплатный, алиментный итп),  PROCESSED - исполненны\
        й документ, INVALID_CHECKS/INVALID_SIGN - отклонен в сервисе из-за не прой\
        денных контролей, DECLINED_BY_ABS - отказанный в банке,  DECLINED_BY_CBR -\
        \ отказанный ЦБ документ,  REVOKED - отозванный документ,  DELETED - удалё\
        нный документ"
      enum:
      - "TEMP"
      - "CREATED"
      - "IMPORTED"
      - "PARTLY_SIGNED"
      - "SIGNED"
      - "POSTPONED"
      - "ACCEPTED_BY_ABS"
      - "IN_PROGRESS_BY_ABS"
      - "INSUFFICIENT_FUNDS"
      - "HOLD_ACCEPT_SPM"
      - "HOLD_ACCEPT_UKK"
      - "PDC"
      - "PROCESSED"
      - "INVALID_CHECKS"
      - "INVALID_SIGN"
      - "DECLINED_BY_ABS"
      - "DECLINED_BY_CBR"
      - "REVOKED"
      - "DELETED"
