openapi: 3.2.0
info:
  title: Модуль обработки клиентских запросов на смену тарифного…
  description: Модуль обработки клиентских запросов на смену тарифного плана в системе управления тарифами клиента
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/client-tariffs
tags:
- name: client-tariff-plan-change-correspond-controller
paths:
  /v1/ctcm/correspond/client/{cnum}/correspond/future/{id}:
    post:
      tags:
      - client-tariff-plan-change-correspond-controller
      summary: createTariffChangeRequestCorrespond
      description: Отправка письма об отмене смены тарифного плана
      operationId: createTariffChangeRequestCorrespond
      parameters:
      - name: id
        in: path
        description: Идентификатор будущего тарифного плана
        required: true
        schema:
          type: integer
          format: int64
      - name: cnum
        in: path
        description: Идентификатор клиента
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TariffChangeCorrespondResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                required:
                - code
                type: object
                properties:
                  code:
                    type: string
                    description: Код ошибки для обработки на клиенте
                    example: oct.not-found
                  traceId:
                    type: string
                    description: Идентификатор трассировки
                    example: cf9924bed9c41f689f97728a50dbc035
                  message:
                    type: string
                    description: Сообщение об ошибке
                    example: Record not found
                  data:
                    type: object
                    description: Дополнительные данные об ошибке (например, список нарушенных полей валидации)
                    example:
                      key: value
                  status:
                    type: string
                    description: HTTP-статус, соответствующий ошибке
                    example: 400 BAD_REQUEST
                    enum:
                    - 100 CONTINUE
                    - 101 SWITCHING_PROTOCOLS
                    - 102 PROCESSING
                    - 103 EARLY_HINTS
                    - 200 OK
                    - 201 CREATED
                    - 202 ACCEPTED
                    - 203 NON_AUTHORITATIVE_INFORMATION
                    - 204 NO_CONTENT
                    - 205 RESET_CONTENT
                    - 206 PARTIAL_CONTENT
                    - 207 MULTI_STATUS
                    - 208 ALREADY_REPORTED
                    - 226 IM_USED
                    - 300 MULTIPLE_CHOICES
                    - 301 MOVED_PERMANENTLY
                    - 302 FOUND
                    - 303 SEE_OTHER
                    - 304 NOT_MODIFIED
                    - 307 TEMPORARY_REDIRECT
                    - 308 PERMANENT_REDIRECT
                    - 400 BAD_REQUEST
                    - 401 UNAUTHORIZED
                    - 402 PAYMENT_REQUIRED
                    - 403 FORBIDDEN
                    - 404 NOT_FOUND
                    - 405 METHOD_NOT_ALLOWED
                    - 406 NOT_ACCEPTABLE
                    - 407 PROXY_AUTHENTICATION_REQUIRED
                    - 408 REQUEST_TIMEOUT
                    - 409 CONFLICT
                    - 410 GONE
                    - 411 LENGTH_REQUIRED
                    - 412 PRECONDITION_FAILED
                    - 413 CONTENT_TOO_LARGE
                    - 413 PAYLOAD_TOO_LARGE
                    - 414 URI_TOO_LONG
                    - 415 UNSUPPORTED_MEDIA_TYPE
                    - 416 REQUESTED_RANGE_NOT_SATISFIABLE
                    - 417 EXPECTATION_FAILED
                    - 418 I_AM_A_TEAPOT
                    - 421 MISDIRECTED_REQUEST
                    - 422 UNPROCESSABLE_CONTENT
                    - 422 UNPROCESSABLE_ENTITY
                    - 423 LOCKED
                    - 424 FAILED_DEPENDENCY
                    - 425 TOO_EARLY
                    - 426 UPGRADE_REQUIRED
                    - 428 PRECONDITION_REQUIRED
                    - 429 TOO_MANY_REQUESTS
                    - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
                    - 451 UNAVAILABLE_FOR_LEGAL_REASONS
                    - 500 INTERNAL_SERVER_ERROR
                    - 501 NOT_IMPLEMENTED
                    - 502 BAD_GATEWAY
                    - 503 SERVICE_UNAVAILABLE
                    - 504 GATEWAY_TIMEOUT
                    - 505 HTTP_VERSION_NOT_SUPPORTED
                    - 506 VARIANT_ALSO_NEGOTIATES
                    - 507 INSUFFICIENT_STORAGE
                    - 508 LOOP_DETECTED
                    - 509 BANDWIDTH_LIMIT_EXCEEDED
                    - 510 NOT_EXTENDED
                    - 511 NETWORK_AUTHENTICATION_REQUIRED
                description: Ошибка API
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
  responses:
    InternalError:
      description: Внутренняя ошибка
    Unauthorized:
      description: Аутентификация не пройдена
  schemas:
    TariffChangeCorrespondResponse:
      type: object
      properties:
        mailId:
          type: string
          description: Идентификатор созданной переписки в mail-service
      description: Ответ на создание переписки в mail-service
