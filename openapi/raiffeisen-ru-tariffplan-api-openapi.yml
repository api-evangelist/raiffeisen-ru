              schema:
                $ref: '#/components/schemas/TariffPlanPageResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  summary: Ошибка
                  value:
                  - code: REST_ERROR_5001
                    message: General service error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение тарифных планов
      tags:
      - TariffPlan
components:
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
  schemas:
    FinancedSupplyTariffStatus:
      description: Статус тарифа за профинансированную поставку
      enum:
      - APPROVED
      example: APPROVED
      type: string
    IncomingPaymentOrderHandlingTariffState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/IncomingPaymentOrderHandlingTariffStatus'
        required:
        - status
        type: object
      description: Состояние тарифа за обработанное входящее платежное поручение
      example:
        status: APPROVED
        statusDate: '2025-10-16T12:00:01.024991'
        errors: []
        cqrsVersion: 1742767789
      type: object
    FinancingTariffStatus:
      description: Статус тарифа за финансирование
      enum:
      - APPROVED
      example: APPROVED
      type: string
    ErrorResponse:
      example:
      - code: REST_ERROR_5001
        message: General service error
      items:
        $ref: '#/components/schemas/ErrorMessage'
      type: array
    IncomingPaymentOrderHandlingTariffType:
      description: Тип тарифа за обработанное входящее платежное поручение
      enum:
      - FOR_PAYMENT_FIX
      - FOR_PAYMENT_PERCENT
      example: FOR_PAYMENT_PERCENT
      type: string
    ErrorMessage:
      properties:
        code:
          $ref: '#/components/schemas/RestErrorCodes'
        message:
          description: Сообщение
          example: General service error
          type: string
      required:
      - code
      - message
      type: object
    IncomingPaymentOrderHandlingTariffStatus:
      description: Статус тарифа за обработанное входящее платежное поручение
      enum:
      - APPROVED
      example: APPROVED
      type: string
    TariffPlanState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/TariffPlanStatus'
        required:
        - status
        type: object
      description: Состояние тарифного плана
      example:
        status: APPROVED
        statusDate: '2025-10-16T12:00:01.024991'
        errors: []
        cqrsVersion: 1742767789
      type: object
    TariffPlan:
      description: Тарифный план
      example:
        id: 87c4b6c5-4340-4b01-b910-8736420178d2
        contractId: 4f7d974a-dd63-421b-ba2b-712da215b86b
        financingTariffs:
        - id: 7591a148-5ccb-4b53-984d-1a6cb0f3c72c
          type: FOR_FINANCE_PERCENT
          deferralFeeValue: 0.1234
          additionalPeriodFeeValue: 0.2345
          waitingPeriodFeeValue: 0.3456
          startDate: '2025-05-01'
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        - id: aae70d79-6912-41d6-81db-b74a0fd5f1e2
          type: FOR_FINANCE_FLOAT_CBR
          deferralFeeValue: 0.2345
          additionalPeriodFeeValue: 0.3456
          waitingPeriodFeeValue: 0.5678
          startDate: '2026-01-12'
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        financedSupplyTariffs:
        - id: 0cc43258-7c89-48c1-94ab-7c3885f97576
          type: FOR_FINANCED_SUPPLY_PERCENT
          value: 0.1234
          startDate: '2025-05-01'
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        - id: 0cc43258-7c89-48c1-94ab-7c3885f97576
          type: FOR_FINANCED_SUPPLY_FIX
          value: 500.55
          startDate: '2026-01-12'
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        incomingPaymentOrderHandlingTariffs:
        - id: 01516372-4465-4b9e-9aa3-19f421849592
          type: FOR_PAYMENT_PERCENT
          value: 0.1234
          startDate: '2025-05-01'
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        - id: 01516372-4465-4b9e-9aa3-19f421849592
          type: FOR_PAYMENT_FIX
          value: 100.11
          startDate: '2026-01-13'
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        state:
          status: APPROVED
          statusDate: '2025-10-16T12:00:01.024991'
          errors: []
          cqrsVersion: 1742767789
      properties:
        id:
          description: Идентификатор тарифного плана
          example: 87c4b6c5-4340-4b01-b910-8736420178d2
          format: uuid
          type: string
        contractId:
          description: Идентификатор контракта
          example: 4f7d974a-dd63-421b-ba2b-712da215b86b
          format: uuid
          type: string
        financingTariffs:
          description: Актуальные (текущий действующий и будущие) тарифы за финансирование.
          items:
            $ref: '#/components/schemas/FinancingTariff'
          minItems: 1
          type: array
        financedSupplyTariffs:
          description: Актуальные (текущий действующий и будущие) тарифы за профинансированную поставку
          items:
            $ref: '#/components/schemas/FinancedSupplyTariff'
          minItems: 0
          type: array
        incomingPaymentOrderHandlingTariffs:
          description: Актуальные (текущий действующий и будущие) тарифы за обработанное входящее платежное поручение
          items:
            $ref: '#/components/schemas/IncomingPaymentOrderHandlingTariff'
          minItems: 0
          type: array
        state:
          allOf:
          - $ref: '#/components/schemas/TariffPlanState'
          description: Состояние тарифного плана
          type: object
      required:
      - contractId
      - financedSupplyTariffs
      - financingTariffs
      - id
      - incomingPaymentOrderHandlingTariffs
      - state
      type: object
    PaginationResponse:
      example:
        offset: 0
        limit: 10
        totalCount: 100
      properties:
        offset:
          description: Число записей для смещения для формирования страницы ответа
          example: 1
          type: integer
        limit:
          description: Итоговое количество элементов на странице ответа
          example: 10
          type: integer
        totalCount:
          description: Общее количество элементов
          example: 100
          type: integer
      required:
      - limit
      - offset
      - totalCount
      type: object
    State:
      description: Состояние объекта
      properties:
        statusDate:
          description: Дата последнего изменения состояния объекта yyyy-MM-dd'T'HH:mm:ss.SSSSSS
          format: date-time
          pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
          type: string
        errors:
          description: Список ошибок в объекте. Может быть пустым списком или null
          items:
            $ref: '#/components/schemas/ErrorMessage'
          type: array
        cqrsVersion:
          description: hashCode от statusDate, status и errors
          example: -1628796591
          type: integer
      required:
      - cqrsVersion
      - statusDate
      type: object
    TariffPlanStatus:
      description: Статус тарифного плана
      enum:
      - APPROVED
      example: APPROVED
      type: string
    FinancingTariffType:
      description: Тип тарифа за финансирование
      enum:
      - FOR_FINANCE_PERCENT
      - FOR_FINANCE_FLOAT_CBR
      example: FOR_FINANCE_PERCENT
      type: string
    FinancedSupplyTariffState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/FinancedSupplyTariffStatus'
        required:
        - status
        type: object
      description: Состояние тарифа за профинансированную поставку
      example:
        status: APPROVED
        statusDate: '2025-10-16T12:00:01.024991'
        errors: []
        cqrsVersion: 1742767789
      type: object
    FinancedSupplyTariffType:
      description: Тип тарифа за профинансированную поставку
      enum:
      - FOR_FINANCED_SUPPLY_FIX
      - FOR_FINANCED_SUPPLY_PERCENT
      example: FOR_FINANCED_SUPPLY_PERCENT
      type: string
    RestErrorCodes:
      description: '| code            | description                                          |

        |-----------------|------------------------------------------------------|

        | REST_ERROR_5001 | General service error                                |

        | REST_ERROR_5004 | Agreement does not exist                             |

        | REST_ERROR_5017 | DealConditions does not exist                        |

        | REST_ERROR_5024 | Action is available at working hour                  |

        | REST_ERROR_5025 | Supplies are not found                               |

        | REST_ERROR_5026 | Approved contract does not exist                     |

        | REST_ERROR_5027 | Supplies must be selected on only one deal condition |

        | REST_ERROR_5028 | Approved deal conditions do not exist                |

        | REST_ERROR_5029 | Approved agreement does not exist                    |

        | REST_ERROR_5031 | Account for financing cannot be empty                |

        | REST_ERROR_5032 | Data validation failed                               |

        | REST_ERROR_5033 | File is infected                                     |

        | REST_ERROR_5034 | Invalid type of file                                 |

        | REST_ERROR_5035 | File is empty                                        |

        | REST_ERROR_5036 | Failed to read file                                  |

        | REST_ERROR_5037 | Supplier are not found                               |

        | SELECTED_ORGANIZATION_REQUIRED | selectedCnum is required when several organizations are available |

        | SELECTED_ORGANIZATION_NOT_ALLOWED | selectedCnum is not included in allowed organizations |

        '
      enum:
      - REST_ERROR_5001
      - REST_ERROR_5004
      - REST_ERROR_5017
      - REST_ERROR_5024
      - REST_ERROR_5025
      - REST_ERROR_5026
      - REST_ERROR_5027
      - REST_ERROR_5028
      - REST_ERROR_5029
      - REST_ERROR_5031
      - REST_ERROR_5032
      - REST_ERROR_5033
      - REST_ERROR_5034
      - REST_ERROR_5035
      - REST_ERROR_5036
      - SELECTED_ORGANIZATION_REQUIRED
      - SELECTED_ORGANIZATION_NOT_ALLOWED
      example: REST_ERROR_5001
      type: string
    TariffPlanPageResponse:
      allOf:
      - properties:
          tariffPlans:
            description: Тарифные планы
            items:
              $ref: '#/components/schemas/TariffPlan'
            type: array
        type: object
      - $ref: '#/components/schemas/PaginationResponse'
      example:
        tariffPlans:
        - id: 87c4b6c5-4340-4b01-b910-8736420178d2
          contractId: 4f7d974a-dd63-421b-ba2b-712da215b86b
          financingTariffs:
          - id: 7591a148-5ccb-4b53-984d-1a6cb0f3c72c
