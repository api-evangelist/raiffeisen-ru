openapi: 3.0.3
info:
  title: API интеграции B2B оплат через СБП
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 932
    x-short-team-name: FPS B2B
  description: '# Подключение к СБП

    Для отправки СБП-платежей оставьте заявку в [RBO](https://sso.rbo.raiffeisen.ru/signin)
    → Продукты → В2В-платежи по СБП.


    Райффайзенбанк выполнит регистрацию и создаст мерчанта СБП В2В. После завершения
    процесса вы будете оповещены по электронной почте.


    **Мерчант СБП B2B** - это учетная запись компании в системе быстрых платежей (СБП),
    которая позволяет принимать и отправлять платежи между юридическими лицами.


    Когда компания подает заявку на подключение к СБП B2B, для неё создаётся **уникальный
    мерчант**. Он нужен для того, чтобы система НСПК могла однозначно определить эту
    компанию и проводить для нее платежи.


    # Тестирование СБП

    Для получения тестовых данных для интеграции напишите на ecom@raiffeisen.ru.

    В ответном письме мы отправим вам токен для авторизации в тестовой среде и два
    счёта для тестирования сервиса.


    Райффайзенбанк выполнит регистрацию. После завершения процесса вы будете оповещены
    по электронной почте.



    Пример кода наложения подписи на языке Java опубликован на [GitHub](https://github.com/Raiffeisen-DGTL/data-signing)

    '
