openapi: 3.2.0
info:
  title: интеграции Системы быстрых платежей (СБП) для B2B Testing…
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 932
    x-short-team-name: FPS B2B
  description: '# Подключение к СБП

    Для приёма и / или отправки СБП-платежей оставьте заявку в РБО → Продукты → В2В-платежи по СБП.'
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  version: '0.1'
servers:
- url: https://pay-test.raif.ru
  description: Sandbox
- url: https://pay.raif.ru
  description: Production
tags:
- name: Testing
  x-displayName: Тестирование СБП
  description: Для получения тестовых данных для интеграции напишите на ecom@raiffeisen.ru.
paths:
  /api/sandbox/b2b/sbp/v1/qrs/{qrId}/payment:
    post:
      summary: Создание тестовой оплаты
      description: '!! Данные endpoint можно использовать только в ТЕСТОВОМ окружении !!'
      tags:
      - Testing
      operationId: createTestPayment
      parameters:
      - $ref: '#/components/parameters/QrId'
      requestBody:
        $ref: '#/components/requestBodies/RequestBodyOfSandBoxPayment'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  requestBodies:
    RequestBodyOfSandBoxPayment:
      content:
        application/json:
          schema:
            required:
            - amount
            type: object
            properties:
              amount:
                $ref: '#/components/schemas/Amount'
      required: true
  schemas:
    Amount:
      type: number
      format: float
      maximum: 1000000
      description: Сумма операции в рублях
      example: 8573.79
    ErrorResponseDto:
      type: object
      properties:
        code:
          type: string
          description: Код ошибки запроса.
        message:
          type: string
          description: Описание ошибки
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
          examples:
            default:
              value:
                code: INVALID_DATA
                message: Некорректные данные
  parameters:
    QrId:
      name: qrId
      in: path
      required: true
      description: Уникальный идентификатор платёжной ссылки
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      description: '[Bearer secretKey](#tag/authorization)


        example: eyJ0eXA***

        '
      scheme: bearer
      bearerFormat: JWT
      x-internal: false
x-tagGroups:
- name: Тестирование
  tags:
  - testing
- name: API Стандартная схема
  tags:
  - order
  - reusable-payment-link
  - invoice
  - report-standard
- name: API Транзитная схема
  tags:
  - splits
  - applications
  - rp-accounting
  - report-transit
- name: Выписки
  tags:
  - incoming-statements
  - outgoing-statements
- name: Уведомления
  tags:
  - callback
