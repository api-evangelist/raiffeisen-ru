modes:
- name: Raiffeisen API sandbox
  base_url: https://sandbox.api.raiffeisen.ru
  session: Данные хранятся 24 часа, затем удаляются.
  credentials: Client ID / Client Secret issued automatically per browser session
- name: Raif Pay test
  base_url: https://pay-test.raif.ru
  production_base_url: https://pay.raif.ru
test_values:
  source: https://developer.raiffeisen.ru/docs/sandbox/test-values
  deterministic: 'Значения детерминированы: одинаковый ввод всегда даёт одинаковый результат.'
  online_bank_login:
    login_password: test_user / sandbox
    result: Успешный вход, возврат кода авторизации
  tokens:
  - object: access_token, id_token
    lifetime: 24 часа
  - object: refresh_token
    lifetime: 30 дней
  - object: Код авторизации
    behavior: Повторный обмен → 400 invalid_grant
  message_scenarios:
  - action: Повторная отправка с тем же MsgId
    result: Обычно HTTP 400 + RJCT
  - action: Запрос статуса по неизвестному msgId
    result: HTTP 200 + NPMT «Платёж не найден»
  - action: NbOfTxs ≠ числу PmtInf
    result: Первоначально HTTP 200 + PDNG , затем после асинхронной проверки RJCT
  - action: CtrlSum ≠ сумме InstdAmt
    result: Первоначально HTTP 200 + PDNG , затем RJCT
  - action: Отправка без ds:Signature
    result: HTTP 400 + RJCT — XML не соответствует XSD
