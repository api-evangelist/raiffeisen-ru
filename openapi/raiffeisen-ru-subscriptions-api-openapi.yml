openapi: 3.2.0
info:
  title: Raiffeisen Ru Subscriptions API
  version: '1.0'
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 178
    x-short-team-name: PAPAS
  x-description-i18n:
    eng: '# Connection to acquiring


      To connect, fill out an application in [the online bank](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) or [the mobile application.](https://rbo.page.link/internet)


      For questions about working with the API, please contact Raiffeisenbank support service:

      - email: ecom@raiffeisen.ru


      ### Preparatory activities

      To accept payments:

      * Fill out the [application](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) to connect acquiring

      * Choose an integration method and implement it

      * Make test payments


      ### Payment page integration methods

      To integrate the payment page, use:

      * A ready-made library that allows you to open a popup for entering payment data and transfer a complex data structure

      * Redirecting the client to the Raiffeisenbank payment page


      # Operation scheme

      ## Bank payment form

      Demonstration of the payment form:


      [Payment form](https://pay.raif.ru/pay/demo.html)


      During the payment process, the user performs the following actions:

      * The user adds goods/services to the store cart and clicks the "Pay" button

      * The partner opens a payment form

      * The user enters the bank card details on the payment form and confirms the payment


      <a href=''images/payment_form_scheme_en.svg'' target=''_blank''><img src=''images/payment_form_scheme_en.svg''></a>


      # API

      Interaction is carried out via the HTTP protocol using the `POST` `GET` `PUT` `DELETE` methods.


      When sending requests to open a payment form and create an order with opening a payment form, the API returns a response in the HTML document format, responses to other requests are returned in JSON format.


      ## Authorization

      To authorize requests, you need:

      * `publicId` - The identifier that is used to open the payment form and is public.

      * `secretKey` - A secret key that is used for inter-service interaction. It is private, must be stored in a secure place and must not be transferred to third parties.


      | Circuit           | URL address       |

      |------------------|-------------------------|

      | Production       |https://pay.raif.ru      |

      | Test             |https://pay-test.raif.ru |


      Inter-service requests are authorized using the secret key `secretKey`. The authorization parameter is passed in the `Authorization` header, the value of which is formed as `Bearer + secretKey`


      You can view the production `publicId` and generate a `secretKey` in the [Online Bank](https://www.rbo.raiffeisen.ru/acquiring/mcp#/), or [Personal Account](https://pay.raif.ru/account/#/auth).


      Instructions for generating `secretKey` can be found in the Help Center:

      * [Generate a secret key in Online Banking](https://help.pay.raif.ru/sbp/rbo/secretkey)

      * [Generate a secret key in your Personal Account](https://help.pay.raif.ru/sbp/lk/secretkey)


      To generate a `secretKey` in the test circuit, you must contact the support service ecom@raiffeisen.ru


      # Testing

      ## Acquiring

      `Bank payment form`:

      | PAN of a bank card| Card validity period| CVV | OTP code| Payment scenario   |

      |-------------------|---------------------|-----|---------|--------------------|

      | 4000001000000018  | 12/35               | 880 |   1234  | Successfull payment|

      | 4000001000000018  | 12/35               | 880 |   1111  | Unsuccessful payment|


      For a full payment testing cycle, you must specify a payment amount greater than 10 rubles.


      ## SBP

      For a full testing cycle, Raiffeisenbank provides the opportunity to use a demo application for QR code payment on behalf of the buyer:

      [WEB application for payment by QR code](https://pay.raif.ru/pay/rfuture/)


      The application can be opened in the browser of any device with a camera. After opening the application, you need to click on the "Scan QR" button (if necessary, allow the browser to access the camera) and scan the image of the test QR code.


      **Bank apps won''t work for QR code payments in the test environment**


      # SDK

      Using JS SDK allows you to open a form from the frontend part in a pop-up window, or redirect the user to the Raiffeisenbank page, which provides a seamless payment scenario for the client.


      Additionally, you can customize the payment form interface and transfer additional parameters for subsequent payment.

      You can customize the visual part of the form (company name, logo, button color) in the [Payment Form Configurator](https://pay.raif.ru/pay/configurator/).


      The payment form configurator also allows you to obtain code for embedding it into a JS library.

      Available SDK:

      * [JS SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-javascript)

      * [PHP SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-php)

      * [NODE SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-node)

      * [JAVA SDK](https://github.com/Raiffeisen-DGTL/ecom-sdk-java)


      JS SDK allows you to open a payment form from the frontend of your application. When using other SDKs to work with the payment form, you must either use the methods described in the [[Payment form]](#tag/payform) section yourself, or use the JS SDK additionally.


      Plugins for various CMS can also be found on [GitHub](https://github.com/Raiffeisen-DGTL/).


      Questions regarding solution support can be sent to technical support: ecom@raiffeisen.ru'
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: 'Operations tagged subscriptions across 2 of this provider''s published API definitions: raiffeisen-ru-raif-pay-payment-form-openapi.json, raiffeisen-ru-raif-pay-payment-form-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: Subscriptions
  x-displayName: Подписки и рекуррентные платежи
  x-x-displayName-i18n:
    eng: Subscriptions
  description: 'В данном разделе описаны методы, с помощью которых можно провести списание по оформленной подписке, а также получить статус платежа.


    **API для данного сценария может быть расширяемым**.'
  x-description-i18n:
    eng: 'This section describes the methods by which you can write off a pre-formed subscription, as well as obtain the payment status.


      **The API for this scenario may be extensible**.

      '
paths:
  /payments/v1/merchants/{publicId}/payments:
    parameters:
    - $ref: '#/components/parameters/publicId'
    post:
      summary: Создание платежа
      x-summary-i18n:
        eng: Create payment
      operationId: post-payments-v1-merchants-publicId-payments
      responses:
        '200':
          $ref: '#/components/responses/CreatePaymentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Ошибка формирования платежа:
                  $ref: '#/components/examples/WL_ERROR_400_ERROR_CREATE_PAYMENT'
                Ошибка валидации:
                  $ref: '#/components/examples/WL_ERROR_400_ERROR_VALID_TO_CREATE_PAYMENT'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/WL_ERROR_403_FORBIDDEN'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      description: 'Метод позволяет сформировать платеж по ранее сформированной привязке.


        Подробнее о сценариях подписок и привязок см. в разделе [[Подписки и привязки]](#section/Shemy-raboty/Podpiski-i-privyazki).


        Привязку можно создать:

        * С помощью метода [[Создание заказа с получением платежной ссылки]](#operation/post-payments-v1-merchants-publicId-orders-payment-link2) — при открытии платежной формы

        * С помощью метода [[Создание подписки на форме]](#operation/post-v1-merchants-publicId-forms) — непосредственно на платежной форме банка


        При успешном списании на адрес мерчанта будет отправлено [[Уведомление об оплате (v3)]](#tag/Callback/operation/payment-callback)'
      x-description-i18n:
        eng: 'The method allows you to generate a payment for a previously created subscription.

          '
      tags:
      - Subscriptions
      requestBody:
        $ref: '#/components/requestBodies/CreatePaymentRequest'
      security:
      - secretKey: []
      parameters: []
      x-internal: false
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /payments/v1/merchants/{publicId}/payments/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: Идентификатор платежа
      x-description-i18n:
        eng: Payment ID
    get:
      summary: Получение информации по платежу
      x-summary-i18n:
        eng: Receiving payment information
      tags:
      - Subscriptions
      responses:
        '200':
          $ref: '#/components/responses/GetWLStatusCardPaymentResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/WL_ERROR_403_FORBIDDEN'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Платеж не найден:
                  $ref: '#/components/examples/WL_ERROR_404_PAYMENT_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Внутренняя ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      operationId: get-payments-v1-merchants-publicId-payments-id
      security:
      - secretKey: []
      description: Метод позволяет получить состояние платежа.
      x-description-i18n:
        eng: '`For merchants with PCI DSS certificate` <br> <br>

          The method allows you to get the payment status, as well as the necessary data for passing 3DS authentication at any stage of payment.

          '
      x-internal: false
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /v1/merchants/{publicId}/subscriptions/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: Идентификатор подписки
      x-description-i18n:
        eng: Subscription ID
    get:
      summary: Получение информации по подписке
      x-summary-i18n:
        eng: Receiving information by subscription
      operationId: get-v1-merchants-publicId-subscriptions-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSubscription'
              examples:
                ACQUIRING:
                  $ref: '#/components/examples/GET_SUBSCRIPTION_INFO_ACQUIRING'
                SBP:
                  $ref: '#/components/examples/GET_SUBSCRIPTION_INFO_SBP'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/FORBIDDEN_ERROR_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/SUBSCRIPTION_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      tags:
      - Subscriptions
      description: Метод позволяет получить информацию по подписке
      x-description-i18n:
        eng: The method allows you to obtain information about a subscription
      security:
      - secretKey: []
    patch:
      summary: Изменение подписки
      x-summary-i18n:
        eng: Change subscription
      operationId: patch-v1-merchants-publicId-subscriptions-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSubscription'
      responses:
        '200':
          $ref: '#/components/responses/GetSubscriptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/FORBIDDEN_ERROR_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/SUBSCRIPTION_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      description: Метод позволяет изменить данные для подписки
      x-description-i18n:
        eng: The method allows you to change the subscription data
      tags:
      - Subscriptions
      security:
      - secretKey: []
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /v2/merchants/{publicId}/subscriptions/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: Идентификатор подписки
      x-description-i18n:
        eng: Subscription ID
    delete:
      summary: Отмена подписки
      x-summary-i18n:
        eng: Cancel subscription
      operationId: delete-v2-merchants-publicId-subscriptions-id
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Example 1:
                  $ref: '#/components/examples/SUBSCRIPTION.DELETE_SUBSCRIPTION'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/FORBIDDEN_ERROR_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Подписка не найдена:
                  $ref: '#/components/examples/SUBSCRIPTION_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
      description: 'Метод позволяет отменить подписку. После отмены проведение списаний по подписке будет недоступно.

        Отменить можно подписку только в статусе `SUBSCRIBED`.'
      x-description-i18n:
        eng: 'This method allows you to cancel subscription. After cancellation, subscription charges will no longer be available.

          You can only cancel a subscription if it has the `SUBSCRIBED` status.'
      tags:
      - Subscriptions
      security:
      - secretKey: []
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
components:
  schemas:
    ClearingStatus:
      title: ClearingStatus
      type: string
      enum:
      - PENDING
      - COMPLETED
      - FAILED
    PaymentDeclineReason:
      type: string
      description: Код причины отклонения платежа. Описание значений приведено в разделе [Справочник ошибок](#tag/Errors).
      x-description-i18n:
        eng: Payment decline reason code. Values are described in [List of errors](#tag/Errors).
      enum:
      - PAYMENT_DECLINED
      - INSUFFICIENT_FUNDS
      - LIMIT_EXCEEDED
      - PAYER_LIMIT_EXCEEDED
      - CARD_UNAVAILABLE
      - FRAUD_SUSPECTED
      - TIMEOUT
      - INVALID_DATA
      - OPERATION_NOT_SUPPORTED
      - ACCOUNT_NOT_FOUND
      - AUTHENTICATION_FAILED
      - PROCESSING_ERROR
      - USER_CANCELLED
      - SUBSCRIPTION_TERMINATED
    SubscriptionAutoCharge:
      title: SubscriptionAutoCharge
      type: object
      description: Данные автоматического списания по подписке. Объект передается, если по подписке необходимо взимать деньги на регулярной основе.
      x-description-i18n:
        eng: Automatic subscription debit data. This item is passed if the subscription requires recurring payments.
      properties:
        frequency:
          type: string
          description: 'Периодичность списания по подписке<br>

            Если параметр передан, то банк будет автоматически проводить ежемесячное списание средств.'
          x-description-i18n:
            eng: 'Subscription debit frequency<br>

              If this parameter is passed, the bank will automatically debit funds monthly.'
          enum:
          - MONTHLY
        firstChargeDate:
          type: string
          format: date
          description: 'Дата первого списания по подписке<br>

            Списание в указанную дату произойдет автоматически, далее – с заданной периодичностью начиная с этой даты. Переданное значение должно быть не меньше 7 дней от текущей даты. Например, при создании подписки 1 января firstChargeDate может быть 8 января или позже.<br>

            Если параметр не передан, то при `frequency` равен `MONTHLY` первое списание по подписке произойдет через месяц после привязки счета клиентом.'
          x-description-i18n:
            eng: 'Date of first subscription charge<br>

              The debit will be automatically debited on the specified date. Then, it will be debited at the specified frequency starting from that date. The value passed must be at least 7 days old. For example, if you create a subscription on January 1st, firstChargeDate could be January 8th or later.

              If the parameter is not passed, then if `frequency` is equal to `MONTHLY`, the first subscription charge will occur one month after the client links the account.'
        amount:
          type: number
          description: Сумма платежа в рублях. Для копеек доступно два знака после точки.
          x-description-i18n:
            eng: Payment amount in rubles. For kopecks, two decimal places are allowed.
          minimum: 1
      required:
      - frequency
      - amount
    GeneralWLPayment:
      type: object
      x-examples: {}
      properties:
        id:
          type: string
          description: Идентификатор платежа. Если не передан будет сформирован на стороне Банка. Рекомендуем использовать [UUID v4](https://ru.wikipedia.org/wiki/UUID)
          x-description-i18n:
            eng: Payment id
          maxLength: 40
          pattern: ^[A-Za-z0-9-_.]+$
        amount:
          type: number
          description: Сумма платежа в рублях. Для копеек доступно два знака после точки.
          x-description-i18n:
            eng: Payment amount in rubles. For kopecks, two signs after the dot are available.
          exclusiveMinimum: 0
        order:
          type: object
          description: Заказ
          x-description-i18n:
            eng: Order
          properties:
            id:
              type: string
              description: Идентификатор заказа. Если не передан будет сформирован на стороне Банка. Рекомендуем использовать [UUID v4](https://ru.wikipedia.org/wiki/UUID)
              x-description-i18n:
                eng: Order id
              maxLength: 40
              pattern: ^[A-Za-z0-9-_.]+$
            comment:
              $ref: '#/components/schemas/OrderComment'
        extra:
          $ref: '#/components/schemas/Extra'
        status:
          type: object
          description: Статус платежа
          x-description-i18n:
            eng: Payment status
          required:
          - value
          - date
          properties:
            value:
              $ref: '#/components/schemas/WLPaymentStatus'
            date:
              type: string
              description: Дата и время создания платежа
              x-description-i18n:
                eng: Date and time of payment update
              format: date-time
            declineReason:
              $ref: '#/components/schemas/PaymentDeclineReason'
        splits:
          $ref: '#/components/schemas/Split'
      required:
      - id
      - amount
      - status
    Subscription:
      title: Subscription
      type: object
      description: Данные для оформления подписки и будущих рекурентных платежей. Результат подписки зависит от плательщика. При успешной подписке будет отправлено [[Уведомление о подписке (v2)]](#tag/Callback/operation/subscriptionNotificationV2).
      x-description-i18n:
        eng: Subscription data. Subscription results depend on the payer. If the subscription is successful [[a subscription notification (v2) will be sent to the merchant's address]](#tag/Callback/operation/subscriptionNotificationV2).
      properties:
        id:
          type: string
          description: Идентификатор подписки. Рекомендуем использовать длинный формат без возможности перебора, например, использовать формат [UUIDv4](https://ru.wikipedia.org/wiki/UUID)
          x-description-i18n:
            eng: Subscription ID. We recommend using a long, non-threadable format, such as [UUIDv4](https://ru.wikipedia.org/wiki/UUID)
          maxLength: 40
          example: a7631fbb-f94f-4c17-1e13-0e96a3a77113
          pattern: ^[A-Za-z0-9-_.]+$
        purpose:
          type: string
          description: 'Описание подписки<br>

            Может содержать:<br>

            * Символы латиницы (A-Z и a-z)

            * Символы кириллицы (А-Я и а-я)

            * Цифры 0-9

            * Спецсимволы: `(`, `)`, `!`, `@`, `[`, `]`, `#`, `+`, `=`, `-`, `|`, `.`, `,`'
          x-description-i18n:
            eng: 'Subscription description<br>

              May contain:<br>

              * Latin characters (A-Z и a-z)

              * Cyrillic symbols (А-Я и а-я)

              * Numbers 0-9

              * Special characters: `(`, `)`, `!`, `@`, `[`, `]`, `#`, `+`, `=`, `-`, `|`, `.`, `,`'
          maxLength: 140
          example: Подписка на интернет магазин
          pattern: ^[A-Za-zА-Яа-я0-9 ()!@\[\]#+=_\|.,-]+$
        autoCharge:
          $ref: '#/components/schemas/SubscriptionAutoCharge'
        customer:
          $ref: '#/components/schemas/SubscriptionCustomer'
        autoAcceptance:
          type: boolean
          default: false
          description: 'Флаг для управления привязкой карты. Если флаг установлен в `true`, чекбокс привязки на платежной форме будет установлен по умолчанию на согласие плательщика с привязкой карты.<br>

            Для управления флагом необходима дополнительная настройка со стороны Банка. <br>

            Поле используется только для метода [[Создание заказа с получением платежной ссылки]](#tag/payform/operation/post-payments-v1-merchants-publicId-orders-payment-link2)

            '
          x-description-i18n:
