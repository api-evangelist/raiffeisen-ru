        senderPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/SenderPaymentPurpose'
          description: 'Назначение платежа, которое увидит плательщик при оплате.
            Можно не заполнять, тогда укажет плательщик

            <br>Может содержать:

            <br>• Символы латинского алфавита (A–Z и a–z) с десятичными кодами из
            диапазонов [065-090] и [097-122] в кодировке UTF-8;

            <br>• Символы русского алфавита (А-Я и а-я) с десятичными кодами из диапазона
            [1040-1103] в кодировке UTF-8;

            <br>• Цифры 0-9 с десятичными кодами из диапазона [048-057] в кодировке
            UTF-8;

            <br>• Специальные символы с десятичными кодами из диапазонов [032-047],
            [058-064], [091-096], [123-126] в кодировке UTF-8; - Символ «№» под номером
            8470 в кодировке UTF-8

            '
        receiverPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/ReceiverPaymentPurpose'
          description: 'Назначение платежа, которое увидит получатель в выписке в
            поле «Основание операции» вместе с инн плательщика

            <br>Например, "ИНН плательщика: 231150869432. Какое-то назначение платежа"

            <br>Если поле не заполнено, то поле «Основание операции» заполнится по
            шаблону, в который будет передан идентификатор многоразовой платежной
            ссылки, наименование плательщика и инн плательщика.

            <br>Например, «Перевод по идентификатору 123e4567-e89b-12d3-a456-426655440000.
            Плательщик: ООО Ромашка, ИНН: 231150869432. Осуществлен через СБП B2В».

            <br>Может содержать:

            <br>• Символы латинского алфавита (A–Z и a–z) с десятичными кодами из
            диапазонов [065-090] и [097-122] в кодировке UTF-8;

            <br>• Символы русского алфавита (А-Я и а-я) с десятичными кодами из диапазона
            [1040-1103] в кодировке UTF-8;

            <br>• Цифры 0-9 с десятичными кодами из диапазона [048-057] в кодировке
            UTF-8;

            <br>• Специальные символы с десятичными кодами из диапазонов [032-047],
            [058-064], [091-096], [123-126] в кодировке UTF-8;

            <br>• Символ «№» под номером 8470 в кодировке UTF-8

            '
        expirationDate:
          allOf:
          - $ref: '#/components/schemas/ExpirationDate'
          description: 'Срок жизни многоразовой платежной ссылки

            <br>Может содержать точную дату и время или количество минут. Передача
