openapi: 3.2.0
info:
  title: Счета и документы Closing Documents API
  description: Управление счетами на оплату и закрывающими документами
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/invoices
tags:
- name: closingDocuments
  description: Управление закрывающими документами
paths:
  /v4/closing-documents/{documentId}:
    get:
      tags:
      - closingDocuments
      summary: Получить детальную информацию о закрывающем документе
      description: Возвращает детальную информацию о закрывающем документе по id документа
      operationId: getDocumentDetails
      parameters:
      - name: documentId
        in: path
        required: true
        description: Идентификатор закрывающего документа
        schema:
          type: string
          format: uuid
          example: c735502b-fb38-4f60-8f06-ba3cb72a7b0e
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosingDocumentDetailsResponse'
              examples:
                closingDocumentDetailConsignmentNote:
                  $ref: '#/components/examples/closingDocumentDetailConsignmentNote'
                closingDocumentDetailWorkAct:
                  $ref: '#/components/examples/closingDocumentDetailWorkAct'
                closingDocumentDetailUPD:
                  $ref: '#/components/examples/closingDocumentDetailUPD'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - closingDocuments
      summary: Обновить информацию о закрывающем документе
      description: Обновляет информацию о закрывающем документе по id документа
      operationId: updateDocument
      parameters:
      - name: documentId
        in: path
        required: true
        description: Идентификатор закрывающего документа
        schema:
          type: string
          format: uuid
          example: c735502b-fb38-4f60-8f06-ba3cb72a7b0e
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ConsignmentNoteRequest'
              - $ref: '#/components/schemas/UPDRequest'
              - $ref: '#/components/schemas/WorkActRequest'
            examples:
              consignmentNoteRequest:
                $ref: '#/components/examples/consignmentNoteRequest'
              workActRequest:
                $ref: '#/components/examples/workActRequest'
              updRequest:
                $ref: '#/components/examples/updRequest'
        required: true
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v4/closing-documents:
    get:
      tags:
      - closingDocuments
      summary: Получить список закрывающих документов
      description: Возвращает список закрывающих документов
      operationId: getDocuments
      parameters:
      - name: page
        in: query
        required: false
        description: Номер страницы для пагинации, нумерация с нуля
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
          example: 0
      - name: size
        in: query
        required: false
        description: Количество элементов на странице
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 50
          minimum: 1
          example: 30
      - name: sumFrom
        in: query
        required: false
        description: Минимальная сумма документа (включительно) для фильтрации
        schema:
          type: number
          example: 1000.0
      - name: sumTo
        in: query
        required: false
        description: Максимальная сумма документа (включительно) для фильтрации
        schema:
          type: number
          example: 500000.0
      - name: types
        in: query
        required: false
        description: Список типов закрывающих документов для фильтрации
        schema:
          type: array
          items:
            type: string
            description: Тип закрывающего документа
            enum:
            - BILL
            - WORK_ACT
            - CONSIGNMENT_NOTE
            - UPD
            - INVOICE_FACTURA
            example: WORK_ACT
          uniqueItems: true
          example:
          - WORK_ACT
          - UPD
      - name: periodFrom
        in: query
        required: false
        description: Начало периода фильтрации по дате документа (включительно)
        schema:
          type: string
          format: date
          example: '2026-09-01'
      - name: periodTo
        in: query
        required: false
        description: Конец периода фильтрации по дате документа (включительно)
        schema:
          type: string
          format: date
          example: '2026-09-30'
      - name: customerSearchString
        in: query
        required: false
        description: Строка поиска по контрагенту (наименование или ИНН)
        schema:
          type: string
          example: ООО Ромашка
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosingDocumentListResponse'
              examples:
                closingDocumentListResponse:
                  $ref: '#/components/examples/closingDocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - closingDocuments
      summary: Создать закрывающий документ
      description: 'Создает закрывающий документ одного из следующих видов: Товарная накладная (ConsignmentNoteRequest), Акт работ (WorkActRequest), УПД (UPDRequest)'
      operationId: createDocument
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ConsignmentNoteRequest'
              - $ref: '#/components/schemas/UPDRequest'
              - $ref: '#/components/schemas/WorkActRequest'
            examples:
              consignmentNoteRequest:
                $ref: '#/components/examples/consignmentNoteRequest'
              workActRequest:
                $ref: '#/components/examples/workActRequest'
              updRequest:
                $ref: '#/components/examples/updRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosingDocumentResponse'
              examples:
                closingDocumentCreateResponse:
                  $ref: '#/components/examples/closingDocumentCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
    delete:
      tags:
      - closingDocuments
      summary: Удалить закрывающие документы
      description: Удаляет один или несколько закрывающих документов
      operationId: removeDocuments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIdsRequest'
            examples:
              closingDocumentDeleteRequest:
                $ref: '#/components/examples/closingDocumentDeleteRequest'
        required: true
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
  /v4/closing-documents/{documentId}/file:
    get:
      tags:
      - closingDocuments
      summary: Получить документ в виде файла
      description: Возвращает документ (XML или PDF) по его id. Для PDF можно запросить вариант без информации о формировании документа (параметр withoutGenerationInfo)
      operationId: file
      parameters:
      - name: documentId
        in: path
        required: true
        description: Идентификатор закрывающего документа
        schema:
          type: string
          format: uuid
          example: c735502b-fb38-4f60-8f06-ba3cb72a7b0e
      - name: docType
        in: query
        required: false
        description: Формат файла документа
        schema:
          type: string
          enum:
          - PDF
          - XML
          example: PDF
      - name: withoutGenerationInfo
        in: query
        required: false
        description: Исключить из PDF блок с информацией о формировании документа
        schema:
          type: boolean
          default: false
          example: false
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: byte
            application/xml;charset=windows-1251:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    CustomerRequest:
      type: object
      description: Заказчик
      properties:
        inn:
          type: string
          description: ИНН
          example: '394439302723'
        innType:
          type: string
          description: Тип ИНН заказчика. INDIVIDUAL (физик) / LEGAL (юрик)
          enum:
          - INDIVIDUAL
          - IE
          - COMPANY
          example: COMPANY
        name:
          type: string
          description: Наименование
          example: ООО Заказчик
        kpp:
          type: string
          description: КПП
          example: '637996731'
        address:
          type: string
          description: Адрес
          example: г. Москва, ул. Тестовая, д. 1
      required:
      - innType
      - name
    SellerRequest:
      type: object
      description: Продавец
      properties:
        inn:
          type: string
          description: ИНН
          example: '394439302723'
        name:
          type: string
          description: Наименование продавца
          example: ООО Продавец
        address:
          type: string
          description: Адрес продавца
          example: 123154, Москва г, ул. Тестовая, д. 2
        kpp:
          type: string
          description: КПП
          example: '637996731'
        okpo:
          type: string
          description: ОКПО
          example: 0120223589
        consignor:
          type: boolean
          description: Признак является ли продавец отправителем груза
          example: false
        phoneNumber:
          type: string
          description: Номер телефона
          example: +7 (900) 449-10-42
        bankRequisites:
          $ref: '#/components/schemas/BankRequisitesRequest'
          description: Банковские реквизиты
      required:
      - consignor
      - inn
      - name
    Name:
      type: object
      description: ФИО
      properties:
        lastName:
          type: string
          description: Фамилия
          minLength: 1
          example: Иванов
        firstName:
          type: string
          description: Имя
          minLength: 1
          example: Иван
        middleName:
          type: string
          description: Отчество
          example: Иванович
      required:
      - firstName
      - lastName
    Waybill:
      type: object
      description: Транспортная накладная
      properties:
        number:
          type: string
          description: Номер транспортной накладной
          example: Транспорт-552
        date:
          type: string
          format: date
          description: Дата транспортной накладной
          example: '2026-09-30'
    ReceiverRequest:
      type: object
      description: Получатель груза
      properties:
        inn:
          type: string
          description: ИНН
          example: '394439302723'
        innType:
          type: string
          description: Тип ИНН. INDIVIDUAL (ФЛ) / IE (ИП) / COMPANY (ООО)
          enum:
          - INDIVIDUAL
          - IE
          - COMPANY
          example: IE
        name:
          type: string
          description: Наименование продавца
          example: ООО Получатель
        address:
          type: string
          description: Адрес продавца
          example: г. Москва, ул. Тестовая, д. 3
        kpp:
          type: string
          description: КПП
          example: '637996731'
        okpo:
          type: string
          description: ОКПО
          example: 0120223589
        phoneNumber:
          type: string
          description: Номер телефона
          example: +7 (900) 449-10-42
        bankRequisites:
          $ref: '#/components/schemas/BankRequisitesRequest'
          description: Банковские реквизиты
        isInn:
          type: boolean
          description: Признак наличия ИНН
          example: true
        isKpp:
          type: boolean
          description: Признак наличия КПП
          example: true
      required:
      - innType
      - isInn
      - isKpp
      - name
    UPD:
      description: Модель универсального передаточного документа (УПД)
      allOf:
      - $ref: '#/components/schemas/AbstractClosingDocumentResponse'
      - type: object
        properties:
          status:
            type: string
            description: Статус УПД
            example: '2'
          goods:
            $ref: '#/components/schemas/Goods'
            description: Товары
          additionalInfo:
            $ref: '#/components/schemas/AdditionalInfo'
            description: Дополнительная информация
          transferInfo:
            $ref: '#/components/schemas/TransferInfo'
            description: Информация о передаче/приемке
          seller:
            $ref: '#/components/schemas/Seller'
            description: Продавец
          shipper:
            $ref: '#/components/schemas/Participant'
            description: Грузоотправитель
          buyer:
            $ref: '#/components/schemas/Participant'
            description: Покупатель
          receiver:
            $ref: '#/components/schemas/Participant'
            description: Грузополучатель
      required:
      - additionalInfo
      - buyer
      - goods
      - seller
      - status
      - transferInfo
      - type
    DocumentIdsRequest:
      type: object
      description: Запрос на удаление закрывающих документов
      properties:
        documentIds:
          type: array
          description: Список идентификаторов документов для удаления
          items:
            type: string
            format: uuid
          minItems: 1
          example:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
      required:
      - documentIds
    ServiceList:
      type: object
      description: Список услуг
      properties:
        items:
          type: array
          description: Список услуг
          items:
            $ref: '#/components/schemas/ItemMiniResponse'
        totalPrice:
          type: number
          description: Итоговая сумма
          example: 22600.0
        totalVatAmount:
          type: number
          description: Итоговый НДС
          example: 0.0
      required:
      - items
      - totalPrice
      - totalVatAmount
    CDListLinkedDocumentResponse:
      type: object
      description: Список связанных документов
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор связанного документа
          example: 60612e6c-d182-4b59-a868-69714a910ee3
        type:
          type: string
          description: Тип связанного документа. Одно из значений BILL, WORK_ACT, CONSIGNMENT_NOTE, INVOICE_FACTURA
          example: BILL
        documentNumber:
          type: string
          description: Номер связанного документа
          example: '1'
      required:
      - id
      - type
    ItemMiniResponse:
      type: object
      description: Модель товара
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор товара (возвращается в ответах по счетам, у закрывающих документов отсутствует)
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name:
          type: string
          description: Наименование единицы товара.
          example: Услуги по настройке ПО
        count:
          type: number
          description: Количество
          example: 5
        price:
          type: number
          description: Цена единицы товара
          example: 1200.5
        vat:
          $ref: '#/components/schemas/Unit'
          description: НДС
        unit:
          $ref: '#/components/schemas/Unit'
          description: Единица измерения
        sum:
          type: number
          description: Итоговая стоимость
          example: 6002.5
        vatAmount:
          type: number
          description: НДС
          example: 1000.42
      required:
      - count
      - name
      - price
      - sum
      - unit
      - vat
      - vatAmount
    BuyerRequest:
      type: object
      description: Покупатель
      properties:
        inn:
          type: string
          description: ИНН
          example: '394439302723'
        innType:
          type: string
          description: Тип ИНН. INDIVIDUAL (ФЛ) / IE (ИП) / COMPANY (ООО)
          enum:
          - INDIVIDUAL
          - IE
          - COMPANY
          example: COMPANY
        name:
          type: string
          description: Наименование продавца
          example: ООО Покупатель
        address:
          type: string
          description: Адрес продавца
          example: г. Москва, ул. Тестовая, д. 1
        kpp:
          type: string
          description: КПП
          example: '637996731'
        okpo:
          type: string
          description: ОКПО
          example: 0120223589
        receiver:
          type: boolean
          description: Признак является ли покупатель получателем груза
          example: false
        phoneNumber:
          type: string
          description: Номер телефона
          example: +7 (900) 449-10-42
        bankRequisites:
          $ref: '#/components/schemas/BankRequisitesRequest'
          description: Банковские реквизиты
        isInn:
          type: boolean
          description: Признак наличия ИНН
          example: true
        isKpp:
          type: boolean
          description: Признак наличия КПП
          example: true
      required:
      - innType
      - isInn
      - isKpp
      - name
      - receiver
    DocumentBase:
      type: object
      description: Документ-основание
      properties:
        name:
          type: string
          description: Наименование документа
          example: Счет на оплату
        number:
          type: string
          description: Номер документа
          example: '84860631'
        date:
          type: string
          format: date
          description: Дата документа
          example: '2026-09-30'
      required:
      - date
      - name
      - number
    AdditionalInfo:
      type: object
      description: Дополнительная информация УПД
      properties:
        documentNumber:
          type: string
          description: Номер документа
          example: UPD-1c6410d2
        documentDate:
          type: string
          format: date
          description: Дата документа
          example: '2026-09-25'
        operationType:
          type: string
          description: Тип операции
          example: Продажа
        correctionNumber:
          type: string
          description: Номер исправления
          example: '1'
        correctionDate:
          type: string
          format: date
          description: Дата исправления
          example: '2026-09-26'
        paymentDocumentNumber:
          type: string
          description: Номер платежно-расчетного документа
          example: '123'
        paymentDocumentDate:
          type: string
          format: date
          description: Дата платежно-расчетного документа
          example: '2026-09-26'
      required:
      - documentDate
      - documentNumber
    UPDRequest:
      allOf:
      - $ref: '#/components/schemas/AbstractClosingDocumentRequest'
      - type: object
        properties:
          items:
            type: array
            description: Список товаров/работ/услуг
            items:
              $ref: '#/components/schemas/ItemRequest'
            maxItems: 2147483647
            minItems: 1
          additionalInfo:
            $ref: '#/components/schemas/UPDAdditionalInfoRequest'
            description: Дополнительная информация
          transferInfo:
            $ref: '#/components/schemas/TransferInfoRequest'
            description: Информация о передаче/приемке
          buyer:
            $ref: '#/components/schemas/Participant'
            description: Покупатель
          shipper:
            $ref: '#/components/schemas/Participant'
            description: Грузоотправитель. Если поле отсутствует, грузоотправителем считается продавец
          receiver:
            $ref: '#/components/schemas/Participant'
            description: Грузополучатель. Если поле отсутствует, грузополучателем считается покупатель
          bills:
            type: array
            description: Связанные счета
            items:
              type: string
              format: uuid
            uniqueItems: true
            example:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Модель УПД
      required:
      - additionalInfo
      - buyer
      - items
      - transferInfo
      - type
    CDDetailsLinkedDocumentResponse:
      type: object
      description: Связанный документ в детальной информации о закрывающем документе
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор связанного документа
          example: 60612e6c-d182-4b59-a868-69714a910ee3
        type:
          type: string
          description: Тип закрывающего документа
          enum:
          - BILL
          - WORK_ACT
          - CONSIGNMENT_NOTE
          - UPD
          - INVOICE_FACTURA
          example: WORK_ACT
        documentNumber:
          type: string
          description: Номер связанного документа
          example: '35503799'
        documentDate:
          type: string
          format: date
          description: Дата связанного документа
          example: '2026-09-30'
        totalPrice:
          type: number
          description: Итоговая сумма
          example: 22600.0
        totalVatAmount:
          type: number
          description: Итоговый НДС
          example: 0.0
        payer:
          $ref: '#/components/schemas/Payer'
          description: Плательщик
        items:
          type: array
          description: Список товаров
          items:
            $ref: '#/components/schemas/ItemMiniResponse'
      required:
      - documentDate
      - id
      - items
      - totalPrice
      - totalVatAmount
      - type
    Goods:
      type: object
      description: Товары
      properties:
        items:
          type: array
          description: Список товаров
          items:
            $ref: '#/components/schemas/Item'
        totalPrice:
          type: number
          description: Итоговая сумма
          example: 500000.0
        totalVatAmount:
          type: number
          description: Итоговый НДС
          example: 45454.55
      required:
      - items
      - totalPrice
      - totalVatAmount
    WorkActRequest:
      allOf:
      - $ref: '#/components/schemas/AbstractClosingDocumentRequest'
      - type: object
        properties:
          services:
            type: array
            description: Список услуг
            items:
