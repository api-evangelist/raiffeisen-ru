openapi: 3.2.0
info:
  version: '1.1'
  title: для фискализации чеков Raif Pay Fiscal Controller API
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 47
    x-short-team-name: ASMEME
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: 'Свои предложения и идеи о документации можно оставить в репозитории по адресу: https://github.com/Raiffeisen-DGTL/ecom-API/blob/master/fiscal.yaml


    # Поддержка 54-ФЗ

    По закону от 22.05.2003 № 54–ФЗ \"О применении контрольно-кассовой техники при осуществлении расчетов в Российской Федерации\" при оплате товаров, работ или услуг необходимо формировать фискальный чек и отправлять его в налоговую с помощью кассы.Клиенты Райффайзенбанка, подключившие интернет-эквайринг, также могут воспользоваться…'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: fiscal-controller
  x-displayName: Методы API
  description: 'Для фискализации чеков через партнёра Райффайзенбанк предоставляет API из следующих запросов:

    * Сохранение чека

    * Регистрация чека

    * Получение статуса чека


    Взаимодействие осуществляется по протоколу HTTP с использованием методов POST, PUT, GET.'
paths:
  /fiscal/v1/receipts/sell:
    post:
      tags:
      - fiscal-controller
      summary: Сохранение чека прихода
      operationId: post-fiscal-v1-receipts-sell
      description: 'Метод предназначен для создания нового чека прихода с указанным receiptNumber. Также позволяет обновить уже существующий чек прихода при повторном запросе с тем же receiptNumber. Метод возвращает тело чека, а также его тип и статус в дополнительных параметрах ответа.

        Отправка чека по ФФД 1.2 не поддерживается для сервисов БИФИТ и Chekonline.

        Отправка чека по ФФД 1.05 не поддерживается для сервиса Билайн.

        Если Вы хотите перейти с ФФД 1.05 на ФФД 1.2, то отправьте заявку в поддержку ecom@raiffeisen.ru'
      parameters:
      - schema:
          type: string
        in: header
        name: Authorization
        description: '[Bearer secretKey](#tag/authorization)'
        required: true
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/receiptWhiteLabel'
            examples:
              Чек прихода (ФФД 1.05):
                value:
                  receiptNumber: '3000827351831'
                  orderNumber: order-2024_001
                  client:
                    email: customer@test.ru
                    name: Иванов Иван Иванович
                  items:
                  - name: Шоколадные конфеты
                    price: 1000
                    quantity: 1.2
                    amount: 1200
                    paymentObject: COMMODITY
                    paymentMode: FULL_PAYMENT
                    measurementUnit: кг
                    nomenclatureCode: 00 00 00 01 00 21 FA 41 00 23 05 41 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 12 00 AB 00
                    vatType: VAT20
                  total: 1200
              Чек прихода по агентской операции (ФФД 1.05):
                value:
                  receiptNumber: '3000827351832'
                  orderNumber: order-2024_002
                  client:
                    email: customer@test.ru
                    name: Иванов Иван Иванович
                  items:
                  - name: Шоколадные конфеты
                    price: 1000
