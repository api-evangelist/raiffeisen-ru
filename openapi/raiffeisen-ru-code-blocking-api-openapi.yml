openapi: 3.2.0
info:
  title: Управление кодами внесения АДМ Code Blocking API
  version: 1.0.0
  description: '# Общая информация


    Данный раздел описывает методы для просмотра и управления выпущенными кодами внесения АДМ, включая:

    - Получение списка кодов

    - Фильтрация по ключевым атрибутам

    - Получение детальной информации о коде

    - Блокировка кода

    - Изменение электронной почты для получения чеков'
servers:
- url: https://api.raiffeisen.ru/adm
tags:
- name: code-blocking
  description: ''
paths:
  /v1/code-deactivations:
    post:
      summary: (Черновик) Заявка на блокировку кода внесения
      description: 'Позволяет создать заявку на деактивацию кода внесения.

        Использование данного API предполагает подписание в личном кабинете RBO.'
      tags:
      - code-blocking
      operationId: deactivateCode
      requestBody:
        description: Заявка для создания
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateCodeResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              examples:
                Ошибка валидации:
                  $ref: '#/components/examples/BadRequestErrorExample'
        '403':
          description: Доступ запрещён. Операция по блокировке кода недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
              examples:
                Доступ запрещён:
                  $ref: '#/components/examples/ForbiddenErrorExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
components:
  schemas:
    BadRequestErrorResponse:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          example: INVALID_DATA
        message:
          type: string
          example: The request contains invalid fields or values
        traceId:
          type: string
          example: 84b19a21e19410b62c30b4cd40c228a1
    DeactivateCodeResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: 6f6cd181-13dc-4736-b944-6d9da53f45a3
          description: Идентификатор заявки
    ForbiddenErrorResponse:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: Setting available=true is not allowed. Code unblocking is disabled.
        traceId:
          type: string
          example: 84b19a21e19410b62c30b4cd40c228a1
    DeactivateCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          example: '2873654434'
          description: Код внесения
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
  responses:
    InternalError:
      description: Внутренняя ошибка
    Unauthorized:
      description: Аутентификация не пройдена
  examples:
    ForbiddenErrorExample:
      summary: Пример ошибки доступа
      value:
        code: FORBIDDEN
        message: Permission denied for code blocking
        traceId: 84b19a21e19410b62c30b4cd40c228a1
    BadRequestErrorExample:
      summary: Пример ошибки валидации
      value:
        code: INVALID_DATA
        message: The request contains invalid fields or values
        traceId: 84b19a21e19410b62c30b4cd40c228a1
