    PaymentDetails:
      title: PaymentDetails
      type: string
      description: 'Назначение платежа. Отображается в выписке. Может содержать:<br>

        - Символы латиницы (A–Z и a–z)

        - Символы кириллицы (А-Я и а-я)

        - Цифры 0-9

        - Спецсимволы: пробел и `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`

        - Спецсимвол `№`'
      x-description-i18n:
        eng: 'Payment details. Displayed in the statement. May contain:<br>

          - Latin characters (A–Z and a–z)

          - Cyrillic characters (А-Я and а-я)

          - Digits 0-9

          - Special characters: space and `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`

          - Special character `№`'
      pattern: ^(?=.*\S)[A-Za-zА-Яа-яЁё0-9 !"#$%''()*+,\-./:;=>?@\[\\\]\^_`{\|}~№]+$
    SubscriptionPurpose:
      title: SubscriptionPurpose
      type: string
      pattern: ^[A-Za-zА-Яа-я0-9 ()!@\[\]#+=_\|.,-]+$
      description: 'Описание подписки<br>

        Может содержать:<br>

        * Символы латиницы (A-Z и a-z)

        * Символы кириллицы (А-Я и а-я)

        * Цифры 0-9

        * Спецсимволы: `(`, `)`, `!`, `@`, `[`, `]`, `#`, `+`, `=`, `-`, `|`, `.`, `,`'
      x-description-i18n:
        eng: 'Subscription description<br>

          May contain:<br>

