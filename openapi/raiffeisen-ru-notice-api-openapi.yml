paths:
  /v1/notices:
    get:
      description: Метод получение списка уведомлений по фильтрам
      operationId: getNotices
      parameters:
      - description: Клиентский номер
        examples:
          oneCnum:
            summary: Пример с одним клиентский номером
            value:
            - AAAAAA
          multipleCnums:
            summary: Пример с несколькими клиентскими номерами
            value:
            - AAAAAA
            - BBBBBB
        in: query
        name: cnums
        required: false
        schema:
          example:
          - AAAAAA
          items:
            example: AAAAAA
            type: string
          type: array
      - description: ИНН или наименование покупателя
        examples:
          inn:
            summary: Только инн
            value: '33333333'
          name:
            summary: Только наименование
            value: Ромаш
        in: query
        name: innOrNameSearchParam
        required: false
        schema:
          example: Ромаш
          type: string
      - description: Статусы уведомлений
        examples:
          oneStatus:
            summary: Один статус
            value:
            - WAIT_CLIENT_SIGNING
          multipleStatuses:
            summary: Несколько статусов
            value:
            - WAIT_CLIENT_SIGNING
            - WAIT_BANK_SINGING
        in: query
        name: statuses
        required: false
        schema:
          example:
          - WAIT_CLIENT_SIGNING
          items:
            $ref: '#/components/schemas/NoticeStatus'
          type: array
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Одно уведомление
                  value:
                  - id: 2c44306f-fc96-4780-9b37-6447273b190e
                    createdAt: '2025-07-10T06:53:37.433211'
                    condition:
                      id: 2c44306f-fc96-4780-9b37-6447273b190e
