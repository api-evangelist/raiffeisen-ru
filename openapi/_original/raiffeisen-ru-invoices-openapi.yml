        name:
          type: "string"
          description: "Наименование единицы товара"
          example: "Услуги по настройке ПО"
        count:
          type: "number"
          description: "Количество"
          example: 5
        price:
          type: "number"
          description: "Цена единицы товара"
          example: 1200.5
        unit:
          type: "string"
          description: "Единица измерения товара"
          example: "HOUR"
          enum:
          - "PIECE"
          - "MINUTE"
          - "HOUR"
          - "DAY"
          - "CENTIMETER"
          - "DECIMETER"
          - "METER"
          - "KILOMETER"
          - "SQUARE_METER"
          - "HECTARE"
          - "CUBIC_METER"
          - "LITER"
          - "GRAM"
          - "KILOGRAM"
          - "TON"
          - "KIT"
          - "BOX"
          - "KILOWATT_HOUR"
          - "GIGA_CALORIES"
          - "STANDARD_UNIT"
          - "LINEAR_METER"
          - "PACKAGE"
          - "SERVICE"
          - "PAIR"
          - "MACHINE_HOUR"
          - "MONTH"
          - "EMPTY"
        vat:
          type: "string"
          description: "НДС"
          example: "VAT_20"
          enum:
          - "VAT_0"
          - "NO_VAT"
          - "VAT_22"
          - "VAT_20"
          - "VAT_18"
          - "VAT_10"
          - "VAT_7"
          - "VAT_5"
