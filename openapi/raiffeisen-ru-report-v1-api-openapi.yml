    SplitByPdf:
      type: string
      enum:
      - ACCOUNT
      - ACCOUNT_DATE
      - MULTIPLE_ACCOUNT_DATE
      description: 'Разделить выписки на отдельные файлы и генерировать zip архив.

        ACCOUNT - разделить по счетам (в архиве каждый файл будет содержать выписки за период по одному счету),

        ACCOUNT_DATE - разделить по счетам и дням (в архиве каждый файл будет содержать выписки по счету за один день),

        MULTIPLE_ACCOUNT_DATE - разделить по дням (в архиве каждый файл будет содержать выписки по нескольким счетам за один день),

        null - генерируется один файл.

        По умолчанию генерируется один файл.'
      example: ACCOUNT
    SplitByAccountDateMT:
      type: string
      enum:
      - ACCOUNT_DATE
      - ACCOUNT_DATE_CHUNKS
      description: "Разделить выписки на отдельные файлы и генерировать zip архив. \nACCOUNT_DATE - разделить по счетам за день (в архиве каждый файл будет содержать выписки за один день по одному счету), \nACCOUNT_DATE_CHUNKS - разделить по счетам за день, разбивая файл на части по 1000 символов (в архиве каждый файл будет содержать часть выписки за один день по одному счету),\nnull - генерируется один файл. По умолчанию генерируется один файл."
      example: ACCOUNT_DATE
