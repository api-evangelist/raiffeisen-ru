          minItems: 1
          maxItems: 5
          description: '`Тег ФФД — 1260` <br/>

            Отраслевые реквизиты предмета расчета. Только для ФФД 1.2 <br/>

            Большинство ОФД поддерживают обработку только 1 элемента в массиве. Если Вам необходимо передавать более 1 элемента в массиве, то сверьтесь с протоколом Вашего ОФД

            '
          x-description-i18n:
            eng: '`The tag FDF — 1260` <br/>

              Sectoral properties. Relevant for FFD 1.2 only <br/>

              Most OFD support processing of only 1 element in an array. If you need to transfer more than 1 element in an array, then check with the protocol of your OFD

              '
          items:
            type: object
            properties:
              federalId:
                type: string
                description: '`Тег ФФД — 1262` <br/>

                  Идентификатор Федерального органа исполнительной власти. Должно принимать одно из значений справочника в соответствии с [приказом ФНС России](https://www.nalog.gov.ru/rn77/about_fts/docs/10020801/)'
                x-description-i18n:
                  eng: '`The tag FDF — 1262` <br/>

                    Identifier of the Federal Executive Authority. Must take one of the directory values in accordance with [the order of the Federal Tax Service of Russia](https://www.nalog.gov.ru/rn77/about_fts/docs/10020801/)'
                example: '030'
              documentDate:
                type: string
                format: date
                description: '`Тег ФФД — 1263` <br/>

                  Дата нормативного акта федерального органа исполнительной власти, регламентирующего порядок заполнения поля «значение отраслевого реквизита»'
                x-description-i18n:
                  eng: '`The tag FDF — 1263` <br/>

                    Date of the normative act of the federal executive body regulating the procedure for filling in the field "value of the sectoral property"'
                example: '2023-11-21'
              documentNumber:
                type: string
                description: '`Тег ФФД — 1264` <br/>

                  Номер нормативного акта федерального органа исполнительной власти, регламентирующего порядок заполнения поля «значение отраслевого реквизита»'
                x-description-i18n:
