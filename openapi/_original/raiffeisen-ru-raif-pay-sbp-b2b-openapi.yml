openapi: 3.0.3
info:
  title: API интеграции Системы быстрых платежей (СБП) для B2B
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 932
    x-short-team-name: FPS B2B
  description: '# Подключение к СБП

    Для приёма и / или отправки СБП-платежей оставьте заявку в [РБО](https://sso.rbo.raiffeisen.ru/signin)
    → Продукты → В2В-платежи по СБП.


    Райффайзенбанк выполнит регистрацию и создаст мерчанта СБП В2В. После завершения
    процесса вы будете оповещены по электронной почте.


    **Мерчант СБП B2B** - это учетная запись компании в системе быстрых платежей (СБП),
    которая позволяет принимать и отправлять платежи между юридическими лицами.


    Когда компания подает заявку на подключение к СБП B2B, для неё создаётся **уникальный
    мерчант**. Он нужен для того, чтобы система НСПК могла однозначно определить эту
    компанию и проводить для нее платежи.


    # Авторизация

    Для авторизация запросов необходимы:

    * secretKey - секретный ключ, который используется для межсервисного взаимодействия.


    Тестовый хост: https://pay-test.raif.ru


    Продуктовый хост: https://pay.raif.ru


    BАЖНО: Секретный ключ необходимо хранить в защищённом месте, нельзя публиковать
    на сторонних ресурсах или передавать третьим лицам.


    Межсервисные запросы авторизуются посредством секретного ключа API (SECRET_KEY).
    Параметр авторизации указывается в заголовке Authorization, значение которого
    формируется как \"Bearer SECRET_KEY\".


    Посмотреть боевой publicId и сгенерировать ключи для мерчанта СБП В2В можно в
    [РБО](https://sso.rbo.raiffeisen.ru/signin) → Прием платежей → Настройки, выбрав
    нужно мерчанта.


    <div align=center><a href=''images/createKey.png'' target=''_blank''><img src=''images/createKey.png''></a></div>


    Для генерации тестового секретного ключа необходимо обратиться по адресу: ecom@raiffeisen.ru

    '
