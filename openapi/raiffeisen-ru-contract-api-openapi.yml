openapi: 3.2.0
info:
  description: API Факторинга
  title: Финансирование. Факторинг Contract API
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/factoring
tags:
- description: Контракт
  name: Contract
paths:
  /v1/contracts:
    get:
      description: Метод получения контрактов по параметрам
      operationId: getContracts
      parameters:
      - description: Идентификатор основных условий обслуживания поставщик-дебитор
        in: query
        name: dealConditionsId
        required: false
        schema:
          example: b5c1e36d-bde1-42bf-8d72-9d0aa4504f73
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                multipleContracts:
                  summary: Контракты
                  value:
                    contracts:
                    - id: 4f7d974a-dd63-421b-ba2b-712da215b86b
                      number: A12345
                      state:
                        status: APPROVED
                        statusDate: '2025-10-16T12:00:01.024991'
                        errors: []
                        cqrsVersion: 1742767789
                    - id: 0d8809f8-2c7f-4c62-8a51-2468906b7f1c
                      number: 54321B
                      state:
                        status: IN_PROCESSING
                        statusDate: '2025-10-16T18:48:15.032112'
                        errors: []
                        cqrsVersion: 5139236428
              schema:
                $ref: '#/components/schemas/ContractListResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  summary: Ошибка
                  value:
                  - code: REST_ERROR_5001
                    message: General service error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение контрактов
      tags:
      - Contract
components:
  schemas:
    ErrorMessage:
      properties:
        code:
          $ref: '#/components/schemas/RestErrorCodes'
        message:
          description: Сообщение
          example: General service error
          type: string
      required:
      - code
      - message
      type: object
    ContractStatus:
      description: Статус контракта
      enum:
      - IN_PROCESSING
      - APPROVED
      example: APPROVED
      type: string
    RestErrorCodes:
      description: '| code            | description                                          |

        |-----------------|------------------------------------------------------|

        | REST_ERROR_5001 | General service error                                |

        | REST_ERROR_5004 | Agreement does not exist                             |

        | REST_ERROR_5017 | DealConditions does not exist                        |

        | REST_ERROR_5024 | Action is available at working hour                  |

        | REST_ERROR_5025 | Supplies are not found                               |

        | REST_ERROR_5026 | Approved contract does not exist                     |

        | REST_ERROR_5027 | Supplies must be selected on only one deal condition |

        | REST_ERROR_5028 | Approved deal conditions do not exist                |

        | REST_ERROR_5029 | Approved agreement does not exist                    |

        | REST_ERROR_5031 | Account for financing cannot be empty                |

        | REST_ERROR_5032 | Data validation failed                               |

        | REST_ERROR_5033 | File is infected                                     |

        | REST_ERROR_5034 | Invalid type of file                                 |

        | REST_ERROR_5035 | File is empty                                        |

        | REST_ERROR_5036 | Failed to read file                                  |

        | REST_ERROR_5037 | Supplier are not found                               |

        | SELECTED_ORGANIZATION_REQUIRED | selectedCnum is required when several organizations are available |

        | SELECTED_ORGANIZATION_NOT_ALLOWED | selectedCnum is not included in allowed organizations |

        '
      enum:
      - REST_ERROR_5001
      - REST_ERROR_5004
      - REST_ERROR_5017
      - REST_ERROR_5024
      - REST_ERROR_5025
      - REST_ERROR_5026
      - REST_ERROR_5027
      - REST_ERROR_5028
      - REST_ERROR_5029
      - REST_ERROR_5031
      - REST_ERROR_5032
      - REST_ERROR_5033
      - REST_ERROR_5034
      - REST_ERROR_5035
      - REST_ERROR_5036
      - SELECTED_ORGANIZATION_REQUIRED
      - SELECTED_ORGANIZATION_NOT_ALLOWED
      example: REST_ERROR_5001
      type: string
    ContractListResponse:
      allOf:
      - properties:
          contracts:
            description: Контракты
            items:
              $ref: '#/components/schemas/Contract'
            type: array
        type: object
      example:
        contracts:
        - id: 4f7d974a-dd63-421b-ba2b-712da215b86b
          number: A12345
          state:
            status: APPROVED
            statusDate: '2025-10-16T12:00:01.024991'
            errors: []
            cqrsVersion: 1742767789
        - id: 0d8809f8-2c7f-4c62-8a51-2468906b7f1c
          number: 54321B
          state:
            status: IN_PROCESSING
            statusDate: '2025-10-16T18:48:15.032112'
            errors: []
            cqrsVersion: 5139236428
      type: object
    Contract:
      description: Контракт
      example:
        id: 4f7d974a-dd63-421b-ba2b-712da215b86b
        number: A12345
        state:
          status: APPROVED
          statusDate: '2025-10-16T12:00:01.024991'
          errors: []
          cqrsVersion: 1742767789
      properties:
        id:
          description: Идентификатор контракта
          example: 4f7d974a-dd63-421b-ba2b-712da215b86b
          format: uuid
          type: string
        number:
          description: Номер контракта
          example: А12345
          type: string
        state:
          allOf:
          - $ref: '#/components/schemas/ContractState'
          description: Состояние контракта
          type: object
      required:
      - id
      - number
      - state
      type: object
    State:
      description: Состояние объекта
      properties:
        statusDate:
          description: Дата последнего изменения состояния объекта yyyy-MM-dd'T'HH:mm:ss.SSSSSS
          format: date-time
          pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
          type: string
        errors:
          description: Список ошибок в объекте. Может быть пустым списком или null
          items:
            $ref: '#/components/schemas/ErrorMessage'
          type: array
        cqrsVersion:
          description: hashCode от statusDate, status и errors
          example: -1628796591
          type: integer
      required:
      - cqrsVersion
      - statusDate
      type: object
    ContractState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/ContractStatus'
        required:
        - status
        type: object
      description: Состояние контракта
      example:
        status: APPROVED
        statusDate: '2025-10-16T12:00:01.024991'
        errors: []
        cqrsVersion: 1742767789
      type: object
    ErrorResponse:
      example:
      - code: REST_ERROR_5001
        message: General service error
      items:
        $ref: '#/components/schemas/ErrorMessage'
      type: array
  responses:
    Unauthorized:
      description: Аутентификация не пройдена
    InternalError:
      description: Внутренняя ошибка
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
