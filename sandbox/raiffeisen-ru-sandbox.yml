description: 'Two sandboxes. (1) Raiffeisen API sandbox at https://sandbox.api.raiffeisen.ru for the corporate banking APIs: Code Flow authentication, ruble payments in ISO 20022 (pain.001.001.raif) and
  account statements, with per-session synthetic credentials kept 24 hours. "Данные песочницы полностью синтетические ... подпись проверяется структурно, без криптографии." (2) Raif Pay test contour https://pay-test.raif.ru
  for acquiring/SBP, with published test card and negative-test amounts.'
