              allOf:
              - $ref: '#/components/schemas/ReceiverPaymentPurpose'
              description: 'Назначение платежа, которое увидит получатель в выписке
                в поле «Основание операции» вместе с инн плательщика.

                <br>Например, "ИНН плательщика: 231150869432. Какое-то ваше назначение"

                <br>Если поле не заполнено, то поле «Основание операции» заполнится
                по шаблону, в который будет передан идентификатор заказа, наименование
                плательщика и инн плательщика.

                <br>Например, «Перевод по идентификатору nM43NFfqiaAh04QdSmCoI5u4S2YrWU2ikHJ.
                Плательщик: ООО Ромашка, ИНН: 231150869432. Осуществлен через СБП
                B2В».

                <br>Может содержать:

                <br>• Символы латинского алфавита (A–Z и a–z) с десятичными кодами
                из диапазонов [065-090] и [097-122] в кодировке UTF-8;

                <br>• Символы русского алфавита (А-Я и а-я) с десятичными кодами из
                диапазона [1040-1103] в кодировке UTF-8;

                <br>• Цифры 0-9 с десятичными кодами из диапазона [048-057] в кодировке
                UTF-8;

                <br>• Специальные символы с десятичными кодами из диапазонов [032-047],
                [058-064], [091-096], [123-126] в кодировке UTF-8;

                <br>• Символ «№» под номером 8470 в кодировке UTF-8

                '
