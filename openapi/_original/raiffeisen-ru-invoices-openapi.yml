      required:
      - "additionalInfo"
      - "buyer"
      - "goods"
      - "seller"
      - "type"
    AbstractClosingDocumentRequest:
      type: "object"
      description: "Базовая модель запроса на создание закрывающего документа"
      discriminator:
        propertyName: "type"
      properties:
        type:
          type: "string"
          description: "Тип закрывающего документа"
          enum:
          - "BILL"
          - "WORK_ACT"
          - "CONSIGNMENT_NOTE"
          - "UPD"
          - "INVOICE_FACTURA"
          example: "WORK_ACT"
        bills:
          type: "array"
          description: "Связанные счета"
          items:
            type: "string"
            format: "uuid"
          uniqueItems: true
          example:
          - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      required:
      - "type"
    AdditionalInfoRequest:
      type: "object"
      description: "Дополнительная информация"
      properties:
        documentNumber:
          type: "string"
          description: "Номер документа"
          example: "35503799"
        documentDate:
          type: "string"
          format: "date"
          description: "Дата отправки документа"
