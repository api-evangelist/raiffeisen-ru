  /v1/supplies/for-desired-financing-amount:
    get:
      description: "Метод получения списка поставок, сумма availableFinancingAmount\
        \ которых меньше или равна желаемой сумме финансирования. Подобранные пост\
        авки относятся к одному дебитору (сублимиту). Метод не гарантирует оптимал\
        ьный подбор поставок - не гарантируется, что сумма availableFinancingAmount\
        \ подобранных поставок максимальна для заданной границы в виде желаемой су\
        ммы. Приоритетом для включения поставок в список является более ранняя deferralStartDate.\
        \  Отсортированные по deferralStartDate поставки включаются в результирующ\
        ий список до тех пора, пока сумма availableFinancingAmount <= желаемой сум\
        ме. При isPartiallyFinanceable = true единожды может быть добавлена постав\
        ка, нарушающая условие 'сумма availableFinancingAmount <= желаемой сумме'\n"
      operationId: "getSuppliesForAmount"
      parameters:
      - description: "Идентификатор основных условий обслуживания Поставщик-Дебито\
          р, по контрактам которых необходимо подобрать поставки"
        example: "b5c1e36d-bde1-42bf-8d72-9d0aa4504f73"
        in: "query"
        name: "dealConditionsId"
        required: true
        schema:
          example: "b5c1e36d-bde1-42bf-8d72-9d0aa4504f73"
          format: "uuid"
          type: "string"
      - description: "Желаемая сумма финансирования - та сумма, меньше или равна к\
          оторой должна быть сумма availableFinancingAmount поставок"
        in: "query"
        name: "desiredFinancingAmount"
        required: true
        schema:
          example: 500000.0
          type: "number"
      - description: "Возможность частичного финансирования на заданную сумму. Есл\
          и true - сумма availableFinancingAmount подобранных  поставок может быть\
          \ больше desiredFinancingAmount за счет добавления одной поставки в резу\
          льтирующий список\n"
        in: "query"
        name: "isPartiallyFinanceable"
        required: true
        schema:
          example: false
          type: "boolean"
