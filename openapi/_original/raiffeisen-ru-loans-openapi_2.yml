# x-archived-from: raiffeisen-ru-loans-openapi.yml
# x-archived-on: 2026-10-09
---
openapi: "3.0.3"
info:
  description: "API кредитования юридических лиц"
  title: "Финансирование. Кредитование"
  version: "1.0.0"
servers:
- url: "https://api.raiffeisen.ru/loans-financing"
tags:
- description: "Соглашение"
  name: "Agreement"
- description: "Информация о клиенте"
  name: "ClientInfo"
- description: "Досрочное погашение"
  name: "EarlyRepayment"
- description: "Транш"
  name: "Loan"
paths:
  /v1/agreements/by-cnums:
    get:
      description: "Метод получение соглашений пользователя по параметрам"
      operationId: "getAgreementsByCnums"
      parameters:
      - description: "Список клиентских номеров (список CNUM)"
        in: "query"
        name: "cnumList"
        required: true
        schema:
          example:
          - "AAABBB"
          - "BBBAAA"
          items:
            example: "AAABBB"
            type: "string"
          type: "array"
          uniqueItems: true
      - description: "Признак - нужны только активные соглашения"
        in: "query"
        name: "activeOnly"
        required: false
        schema:
          example: true
          type: "boolean"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLineDtoResponse"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод получение соглашений пользователя по параметрам"
      tags:
      - "Agreement"
  /v1/client-info/accounts:
    get:
      description: "Метод получения информации по счетам клиента (для оформления д\
        осрочного погашения кредита). Метод предназначен только для использования\
        \ в сценариях связанных с кредитованием ЮЛ и может возвращать не все счета\
        \ клиента."
      operationId: "getClientAccounts"
      parameters:
      - description: "Список клиентских номеров (список CNUM)"
        in: "query"
        name: "cnumList"
        required: true
        schema:
          example:
          - "AAABBB"
          - "BBBAAA"
          items:
            example: "AAABBB"
            type: "string"
          type: "array"
          uniqueItems: true
      - description: "ISO код валюты счета клиента"
        in: "query"
        name: "filterByCurrency"
        required: false
        schema:
          example: "RUB"
          type: "string"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientInfoAccountDtoResponse"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Получение информации по счетам клиента (для оформления досрочного\
        \ погашения кредита)"
      tags:
      - "ClientInfo"
  /v1/loans:
    get:
      description: "Метод для получения списка кредитных линий по идентификатору ф\
        асилити и статусу"
      operationId: "getLoans"
      parameters:
      - description: "Идентификатор фасилити"
        in: "query"
        name: "facilityId"
        required: true
        schema:
          example: "AAABBB12345"
          type: "string"
      - description: "Фильтровать неактивные кредитные линии"
        in: "query"
        name: "activeOnly"
        required: false
        schema:
          example: true
          type: "boolean"
      - description: "Лимит"
        in: "query"
        name: "limit"
        required: false
        schema:
          example: 10
          format: "int32"
          type: "integer"
      - description: "Список клиентских номеров (список CNUM)"
        in: "query"
        name: "cnumList"
        required: true
        schema:
          example:
          - "AAABBB"
          - "BBBAAA"
          items:
            example: "AAABBB"
            type: "string"
          type: "array"
          uniqueItems: true
      - description: "ISO код валюты"
        in: "query"
        name: "currency"
        required: false
        schema:
          example: "RUB"
          type: "string"
      - description: "Только подходящие для досрочных погашений"
        in: "query"
        name: "onlyValidForEarlyRepayment"
        required: false
        schema:
          example: true
          type: "boolean"
      - description: "Плановая дата досрочного погашения"
        in: "query"
        name: "plannedRepaymentDate"
        required: false
        schema:
          example: "2020-01-01"
          format: "date"
          type: "string"
      - description: "Язык"
        in: "query"
        name: "acceptLanguage"
        required: false
        schema:
          example: "ru"
          type: "string"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод для получения списка кредитных линий по идентификатору фасил\
        ити и статусу"
      tags:
      - "Loan"
  /v1/early-repayment/to-be-signed:
    get:
      description: "Метод для получения списка досрочных погашений, готовых для по\
        дписания"
      operationId: "getEarlyRepaymentsToBeSigned"
      parameters:
      - description: "Страница"
        in: "query"
        name: "page"
        required: true
        schema:
          example: 0
          format: "int32"
          type: "integer"
      - description: "Количество элементов на странице"
        in: "query"
        name: "itemsPerPage"
        required: true
        schema:
          example: 50
          format: "int32"
          type: "integer"
      - description: "Список клиентских номеров (список CNUM)"
        in: "query"
        name: "cnumList"
        required: true
        schema:
          example:
          - "AAABBB"
          - "BBBAAA"
          items:
            example: "AAABBB"
            type: "string"
          type: "array"
          uniqueItems: true
      - description: "Список идентификаторов досрочных погашений"
        in: "query"
        name: "idList"
        required: false
        schema:
          example:
          - "123e4567-e89b-12d3-a456-426614174000"
          items:
            example: "123e4567-e89b-12d3-a456-426614174000"
            format: "uuid"
            type: "string"
          type: "array"
          uniqueItems: true
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageableResultEarlyRepaymentStateDto"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод для получения списка досрочных погашений, готовых для подпис\
        ания"
      tags:
      - "EarlyRepayment"
  /v1/early-repayment/sign:
    post:
      description: "Метод для получения информации о подписании досрочного погашен\
        ия"
      operationId: "getEarlyRepaymentSignInformation"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetEarlyRepaymentRequestSignInformationDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInformationResponseDto"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод для получения информации о подписании досрочного погашения"
      tags:
      - "EarlyRepayment"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
  /v1/early-repayment/accept-signature:
    post:
      description: "Метод подписаниия досрочного погашения с помощью цифровой подп\
        иси"
      operationId: "acceptSignature"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCryptoProSignatureRequestDto"
        required: true
      responses:
        "200":
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод подписаниия досрочного погашения с помощью цифровой подписи"
      tags:
      - "EarlyRepayment"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
  /v1/early-repayment:
    delete:
      description: "Метод для удаления досрочного погашения"
      operationId: "deleteEarlyRepayment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EarlyRepaymentDeleteRequestDto"
        required: true
      responses:
        "200":
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод для удаления досрочного погашения"
      tags:
      - "EarlyRepayment"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
    get:
      description: "Метод получения досрочного погашения по id"
      operationId: "getEarlyRepayment"
      parameters:
      - description: "Идентификатор досрочного погашения"
        example: "123e4567-e89b-12d3-a456-426614174000"
        in: "query"
        name: "earlyRepaymentId"
        required: true
        schema:
          example: "123e4567-e89b-12d3-a456-426614174000"
          format: "uuid"
          type: "string"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyRepaymentStateWithCommissionInfoDto"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод получения досрочного погашения по id"
      tags:
      - "EarlyRepayment"
    post:
      description: "Метод создания нового досрочного погашения"
      operationId: "createEarlyRepayment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EarlyRepaymentCreationRequestDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyRepaymentSaveResultDto"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод создания нового досрочного погашения"
      tags:
      - "EarlyRepayment"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
    put:
      description: "Метод для обновления досрочного погашения"
      operationId: "updateEarlyRepayment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EarlyRepaymentUpdateRequestDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyRepaymentSaveResultDto"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
          description: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "Метод для обновления досрочного погашения"
      tags:
      - "EarlyRepayment"
      parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/IdTokenHeader"
components:
  schemas:
    CreditLineDtoResponse:
      example:
      - facilityId: "AAABBB12345"
        cnumList:
        - "AAABBB"
        loanMaxPeriod: 12
        percentRateType:
        - "FIXED"
        loanMaxPeriodType: "MONTH"
        status: "LIVE"
        agreement:
          id: "bf1d1868-a98e-4ae5-976f-0c4e21e0d510"
          number: "12345-MSK"
          startDate: "2020-01-01"
          lastAvailabilityDate: "2120-01-01"
          expiryDate: "2220-01-01"
          revolving: true
        segment: "MIDDLE"
      items:
        $ref: "#/components/schemas/CreditLineDto"
      type: "array"
    CreditLineDto:
      description: "Информация по кредитной линии"
      example:
        facilityId: "AAABBB12345"
        cnumList:
        - "AAABBB"
        loanMaxPeriod: 12
        percentRateType:
        - "FIXED"
        loanMaxPeriodType: "MONTH"
        status: "LIVE"
        agreement:
          id: "bf1d1868-a98e-4ae5-976f-0c4e21e0d510"
          number: "12345-MSK"
          startDate: "2020-01-01"
          lastAvailabilityDate: "2120-01-01"
          expiryDate: "2220-01-01"
          revolving: true
        segment: "MIDDLE"
      properties:
        facilityId:
          description: "Идентификатор фасилити"
          example: "AAABBB12345"
          type: "string"
        cnumList:
          description: "Список клиентских номеров (список CNUM)"
          example:
          - "AAABBB"
          - "BBBAAA"
          items:
            type: "string"
          type: "array"
          uniqueItems: true
        loanMaxPeriod:
          description: "Период"
          example: 12
          type: "number"
        percentRateType:
          description: "Типы ставки"
          example:
          - "FIXED"
          items:
            $ref: "#/components/schemas/PercentRateType"
          type: "array"
          uniqueItems: true
        loanMaxPeriodType:
          $ref: "#/components/schemas/LoanMaxPeriodType"
        status:
          $ref: "#/components/schemas/CreditLineStatus"
        agreement:
          $ref: "#/components/schemas/Agreement"
        segment:
          $ref: "#/components/schemas/Segment"
      type: "object"
    BaseErrorResponse:
      description: "Данные об ошибке"
      example:
        timestamp: "2000-01-23T04:56:07.000+00:00"
        message: "Error message"
      properties:
        timestamp:
          description: "Дата и время возникновения ошибки"
          example: "2000-01-23T04:56:07Z"
          format: "date-time"
          type: "string"
        message:
          description: "Сообщение об ошибке"
          example: "Error message"
          type: "string"
      type: "object"
    ClientInfoAccountDtoResponse:
      example:
      - accountNumber: "40702810123456789012"
        organizationCnum: "AAABBB"
        availableBalance: 1.2345678901E8
        currency: "RUB"
      items:
        $ref: "#/components/schemas/ClientInfoAccountDto"
      type: "array"
      uniqueItems: true
    ClientInfoAccountDto:
      description: "Информация по счету клиента"
      example:
        accountNumber: "40702810123456789012"
        organizationCnum: "AAABBB"
        availableBalance: 1.2345678901E8
        currency: "RUB"
      properties:
        accountNumber:
          description: "Номер счета"
          example: "40702810123456789012"
          type: "string"
        organizationCnum:
          description: "Клиентский номер (CNUM)"
          example: "AAABBB"
          type: "string"
        availableBalance:
          description: "Доступный баланс"
          example: 1.2345678901E8
          type: "number"
        currency:
          description: "Валюта счета"
          example: "RUB"
          type: "string"
      type: "object"
    LoanResponse:
      example:
      - loanId: "ABCDEF"
        organizationCnum: "AAABBB"
        status: "ACTIVE"
        amount: 10000.12
        currency: "RUB"
        interestRate: 10.23
        drawdownDate: "2020-01-01"
        scheduleType: "ANNUITY"
        facilityId: "AAABBB12345"
        originalAmount: 1000000.12
        maturityDate: "2030-01-01"
        valueDate: "2020-01-02"
        nextPrincipalDate: "2025-01-01"
        nextPrincipalPayment: 10.23
        nextInterestDate: "2025-01-02"
        nextInterestPayment: 1.23
        baseRate: "FIXED"
        disabledNextInterestPayment: false
        rolloverDate: "2025-03-01"
        baseRateChangeIndicator: "daily"
        baseRateDescription: "Fixed rate"
        principalAmount: 10000.23
        interestRateType: "VAR"
        loanType: "HT"
        loanInterestForCurrentOperday: 1.23
      items:
        $ref: "#/components/schemas/Loan"
      type: "array"
    Loan:
      allOf:
      - $ref: "#/components/schemas/BaseLoan"
      - properties:
          principalAmount:
            description: "Сумма основного долга транша"
            type: "number"
          interestRateType:
            description: "Тип процентной ставки"
            type: "string"
          loanType:
            description: "Тип транша"
            type: "string"
          loanInterestForCurrentOperday:
            description: "Сумма начисленных процентов по траншу на момент открытия\
              \ операционного дня"
            type: "number"
      description: "Информация по траншу"
      example:
        loanId: "ABCDEF"
        organizationCnum: "AAABBB"
        status: "ACTIVE"
        amount: 10000.12
        currency: "RUB"
        interestRate: 10.23
        drawdownDate: "2020-01-01"
        scheduleType: "ANNUITY"
        facilityId: "AAABBB12345"
        originalAmount: 1000000.12
        maturityDate: "2030-01-01"
        valueDate: "2020-01-02"
        nextPrincipalDate: "2025-01-01"
        nextPrincipalPayment: 10.23
        nextInterestDate: "2025-01-02"
        nextInterestPayment: 1.23
        baseRate: "FIXED"
        disabledNextInterestPayment: false
        rolloverDate: "2025-03-01"
        baseRateChangeIndicator: "daily"
        baseRateDescription: "Fixed rate"
        principalAmount: 10000.23
        interestRateType: "VAR"
        loanType: "HT"
        loanInterestForCurrentOperday: 1.23
      type: "object"
    PageableResultEarlyRepaymentStateDto:
      description: "Страница с информацией о досрочных погашениях"
      example:
        data:
        - facilityId: "AAABBB12345"
          loanId: "ABCDEF"
          repaymentType: "PARTIAL"
          partialRepaymentKind: "REDUCE_NEXT"
          repaymentDate: "2020-01-01"
          repaymentAmount: 1000000.23
          repaymentCurrency: "RUB"
          accountNumber: "45201810600000480000"
          notice: "Some valuable notice"
          repaymentId: "123e4567-e89b-12d3-a456-426614174000"
          organizationCnum: "AAABBB"
          repaymentNumber: 12345
          status: "READY_FOR_SIGN"
          createdAt: "2000-01-23T04:56:07.000+00:00"
          bankComment: "Early repayment bank comment"
          lastSignResult: "DIGESTS_NOT_EQUAL"
          interestAmount: 10.23
          cancelRepaymentInfo:
            id: "bf1d1868-a98e-4ae5-976f-0c4e21e0d510"
            number: 1234
          smsSignedDocumentsPackage:
            id: "457-408943-23"
            number: 457
        totalDataRecordsCount: 50
      properties:
        data:
          description: "Список с информацией о досрочных погашениях"
          example:
          - facilityId: "AAABBB12345"
            loanId: "ABCDEF"
            repaymentType: "PARTIAL"
            partialRepaymentKind: "REDUCE_NEXT"
            repaymentDate: "2020-01-01"
            repaymentAmount: 1000000.23
            repaymentCurrency: "RUB"
            accountNumber: "45201810600000480000"
            notice: "Some valuable notice"
            repaymentId: "123e4567-e89b-12d3-a456-426614174000"
            organizationCnum: "AAABBB"
            repaymentNumber: 12345
            status: "READY_FOR_SIGN"
            createdAt: "2000-01-23T04:56:07.000+00:00"
            bankComment: "Early repayment bank comment"
            lastSignResult: "DIGESTS_NOT_EQUAL"
            interestAmount: 10.23
            cancelRepaymentInfo:
              id: "bf1d1868-a98e-4ae5-976f-0c4e21e0d510"
              number: 1234
            smsSignedDocumentsPackage:
              id: "457-408943-23"
              number: 457
          items:
            $ref: "#/components/schemas/EarlyRepaymentStateDto"
          type: "array"
        totalDataRecordsCount:
          description: "Общее количество досрочных погашений"
          example: 50
          format: "int32"
          type: "integer"
      type: "object"
    GetEarlyRepaymentRequestSignInformationDto:
      description: "Получении информация о подписании досрочных погашений"
      example:
        ids:
        - "123e4567-e89b-12d3-a456-426614174000"
      properties:
        ids:
          description: "Список идентификаторов досрочных погашений"
          example:
