openapi: 3.2.0
info:
  title: Raiffeisen Ru Buyer API
  version: 1.0.0
  description: 'Operations tagged Buyer across 2 of this provider''s published API definitions: raiffeisen-ru-payment-control-openapi.yml, raiffeisen-ru-payment-control-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.raiffeisen.ru/pay-control
tags:
- description: Покупатели
  name: Buyer
paths:
  /v1/buyers/requisites:
    get:
      description: Метод поиска организации по ИНН для создания покупателя
      operationId: getBuyerRequisites
      parameters:
      - description: ИНН организации
        in: query
        name: inn
        required: true
        schema:
          example: '7777225556'
          maxLength: 12
          minLength: 10
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                one:
                  summary: Одна организация
                  value:
                  - ogrn: '123456789012345'
                    inn: '1234567890'
                    kpp: '123456789'
                    fullName: АО Ромашка
              schema:
                $ref: '#/components/schemas/BuyerRequisitesList'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Поиск организации по ИНН
      tags:
      - Buyer
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/buyers:
    get:
      description: Метод получение списка покупателей по фильтрам
      operationId: getBuyers
      parameters:
      - description: Клиентский номер
        examples:
          oneCnum:
            summary: Пример с одним клиентский номером
            value:
            - AAAAAA
          multipleCnums:
            summary: Пример с несколькими клиентскими номерами
            value:
            - AAAAAA
            - BBBBBB
        in: query
        name: cnums
        required: false
        schema:
          example:
          - AAAAAA
          items:
            example: AAAAAA
            type: string
          type: array
      - description: ИНН или наименование покупателя
        examples:
          inn:
            summary: Только инн
            value: '33333333'
          name:
            summary: Только наименование
            value: Ромаш
        in: query
        name: innOrNameSearchParam
        required: false
        schema:
          example: Ромаш
          type: string
      - description: Статусы покупателя
        examples:
          oneStatus:
            summary: Один статус
            value:
            - APPROVED
          multipleStatuses:
            summary: Несколько статусов
            value:
            - APPROVED
            - REJECTED
        in: query
        name: statuses
        required: false
        schema:
          example:
          - APPROVED
          items:
            $ref: '#/components/schemas/BuyerStatus'
          type: array
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Один покупатель
                  value:
                  - id: 2c44306f-fc96-4780-9b37-6447273b190e
                    createdAt: '2025-07-10T06:53:37.433211'
                    fullName: Акционерное общество Ромашка
                    shortName: АО Ромашка
                    inn: '1234567890'
                    kpp: '123456789'
                    ogrn: '123456789012345'
                    clients:
                    - id: 2c44306f-fc96-4780-9b37-6447273b190e
                      createdAt: '2025-07-10T06:53:37.433211'
                      requisites:
                        ogrn: '123456789012345'
                        fullNameRus: Акционерное общество Ромашка
                        shortNameRus: АО Ромашка
                        address: address
                        opf: opf
                        inn: '1234567890'
                        kpp: '123456789'
                        shortNameEn: АО Ромашка
                        cnum: AAAAAA
                        fullNameEn: Акционерное общество Ромашка
                        okved: '11.11'
                      contacts:
                      - id: 2c44306f-fc96-4780-9b37-6447273b190e
                        createdAt: '2025-07-10T06:53:37.433211'
                        email: foobar@mail.ru
                        state:
                          statusDate: '2021-07-10T06:53:37.433111'
                          errors: []
                          status: CREATED
                        cqrsVersion: -1628796591
                      state:
                        statusDate: '2021-07-10T06:53:37.433111'
                        errors: []
                        status: APPROVED
                      cqrsVersion: -1628796591
                    state:
                      statusDate: '2025-07-10T06:53:37.433111'
                      errors: []
                      status: APPROVED
                    cqrsVersion: -1628796591
              schema:
                $ref: '#/components/schemas/BuyerList'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение списка покупателей по фильтрам
      tags:
      - Buyer
    post:
      description: Для добавления к обслуживанию покупателя, вам нужно его создать
      operationId: createBuyer
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: Запрос на создание покупателя
                value:
                  buyerRequisites:
                    ogrn: '123456789012345'
                    inn: '1234567890'
                    kpp: '123456789'
                    fullName: АО Ромашка
                  cnum: AAAAAA
            schema:
              $ref: '#/components/schemas/CreateBuyerRequest'
        description: Параметры для создания
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Успешно создан
                  value:
                    id: 2c44306f-fc96-4780-9b37-6447273b190e
                    createdAt: '2025-07-10T06:53:37.433211'
                    fullName: Акционерное общество Ромашка
                    shortName: АО Ромашка
                    inn: '1234567890'
                    kpp: '123456789'
                    ogrn: '123456789012345'
                    state:
                      statusDate: '2025-07-10T06:53:37.433111'
                      errors: []
                      status: APPROVED
                    cqrsVersion: -1628796591
              schema:
                $ref: '#/components/schemas/Buyer'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Создание покупателя
      tags:
      - Buyer
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/buyers/{buyerId}:
    get:
      description: Метод получения покупателя по идентификатору
      operationId: getBuyerById
      parameters:
      - description: Идентификатор покупателя
        in: path
        name: buyerId
        required: true
        schema:
          example: 76b44414-8259-4a09-b4dd-dbe33e0a1729
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Покупатель
                  value:
                    id: 2c44306f-fc96-4780-9b37-6447273b190e
                    createdAt: '2025-07-10T06:53:37.433211'
                    fullName: Акционерное общество Ромашка
                    shortName: АО Ромашка
                    inn: '1234567890'
                    kpp: '123456789'
                    ogrn: '123456789012345'
                    clients:
                    - id: 2c44306f-fc96-4780-9b37-6447273b190e
                      createdAt: '2025-07-10T06:53:37.433211'
                      requisites:
                        ogrn: '123456789012345'
                        fullNameRus: Акционерное общество Ромашка
                        shortNameRus: АО Ромашка
                        address: address
                        opf: opf
                        inn: '1234567890'
                        kpp: '123456789'
                        shortNameEn: АО Ромашка
                        cnum: AAAAAA
                        fullNameEn: Акционерное общество Ромашка
                        okved: '11.11'
                      contacts:
                      - id: 2c44306f-fc96-4780-9b37-6447273b190e
                        createdAt: '2025-07-10T06:53:37.433211'
                        email: foobar@mail.ru
                        state:
                          statusDate: '2021-07-10T06:53:37.433111'
                          errors: []
                          status: CREATED
                        cqrsVersion: -1628796591
                      state:
                        statusDate: '2021-07-10T06:53:37.433111'
                        errors: []
                        status: APPROVED
                      cqrsVersion: -1628796591
                    state:
                      statusDate: '2025-07-10T06:53:37.433111'
                      errors: []
                      status: APPROVED
                    cqrsVersion: -1628796591
              schema:
                $ref: '#/components/schemas/Buyer'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение покупателя по идентификатору
      tags:
      - Buyer
    servers:
    - url: https://api.raiffeisen.ru/pay-control
components:
  schemas:
    RestErrorCodes:
      description: '| code            | description                                                      |

        |-----------------|------------------------------------------------------------------|

        | REST_ERROR_5001 | General service error                                            |

        | REST_ERROR_5002 | Current CQRS version is different                                |

        | REST_ERROR_0001 | inn not valid                                                    |

        | REST_ERROR_0002 | ogrn not valid                                                   |

        | REST_ERROR_0003 | okved not valid                                                  |

        | REST_ERROR_0004 | opf not valid                                                    |

        | REST_ERROR_0005 | fullNameRus not valid                                            |

        | REST_ERROR_0006 | shortNameRus not valid                                           |

        | REST_ERROR_0007 | fullNameEn not valid                                             |

        | REST_ERROR_0008 | shortNameEn not valid                                            |

        | REST_ERROR_0009 | address not valid                                                |

        | REST_ERROR_0010 | you can`t use product                                            |

        | REST_ERROR_0011 | buyer already exists                                             |

        | REST_ERROR_0012 | can''t fetched buyer requisites from DaData                       |

        | REST_ERROR_0013 | can''t find data for buyer requisites                             |

        | REST_ERROR_0014 | client not valid                                                 |

        | REST_ERROR_0015 | agreement not valid                                              |

        | REST_ERROR_0016 | buyer not valid                                                  |

        | REST_ERROR_0017 | condition with contract number and date already exists           |

        | REST_ERROR_0018 | for the PRO tariff, at least one contact must be fully filled in |

        | REST_ERROR_0019 | for the PRO newTariff, payment period must be filled             |

        | REST_ERROR_0020 | for the PRO newTariff, payment period must be less then max      |

        | REST_ERROR_0021 | contract date must be after then current date                    |

        | REST_ERROR_0022 | agreement already exists for client                              |

        | REST_ERROR_0023 | condition with current contract number and date already exist    |

        | REST_ERROR_1000 | Unexpected error. Call to support team - paycontrol.support@raiffeisen.ru. |

        | REST_ERROR_1001 | File contains viruses                                            |

        | REST_ERROR_1002 | Incorrect file format                                            |

        | REST_ERROR_1003 | Supplies number exceeds limit                                    |

        | REST_ERROR_1004 | The file size exceeds 1 MB                                       |

        | REST_ERROR_1005 | Invalid cell type (row %d, column %d)                            |

        | REST_ERROR_1006 | Incorrect number of columns, expected: %d, found: %d             |

        | REST_ERROR_1007 | Invalid header, expected: %s, found: %s                          |

        | REST_ERROR_1008 | INN must contain 10 or 12 digits                                 |

        | REST_ERROR_1009 | INN cannot be empty                                              |

        | REST_ERROR_1010 | contract number cannot be empty                                  |

        | REST_ERROR_1011 | contract date cannot be empty                                    |

        | REST_ERROR_1012 | primary document number is empty                                 |

        | REST_ERROR_1013 | primary document date is empty                                   |

        | REST_ERROR_1014 | Supply sum cannot be empty                                       |

        | REST_ERROR_1015 | Invalid KPP                                                      |

        | REST_ERROR_1016 | payment date is empty                                            |

        | REST_ERROR_1017 | payment date is not found in calendar                            |

        | REST_ERROR_1018 | Supply already exists in file                                    |

        | REST_ERROR_1019 | Date cannot be in the future: supply date                        |

        | REST_ERROR_1020 | Date cannot be in the future: additional document date           |

        | REST_ERROR_1021 | File is empty                                                    |

        | REST_ERROR_2000 | Supply with this number/date already exists                      |

        | REST_ERROR_2001 | payment date must be later than contract date                    |

        | REST_ERROR_2002 | payment date must be later than the primary document date        |

        | REST_ERROR_2003 | primary document date cannot be earlier than contract date       |

        | REST_ERROR_2004 | additional document date cannot be earlier than contract date    |

        | REST_ERROR_2005 | Supply amount cannot be less than payment amount                 |

        | REST_ERROR_3000 | Posting amount cannot be more than remaining amount              |

        | REST_ERROR_3001 | Debt sum cannot be less than posting amount                      |

        | REST_ERROR_3002 | Supply already repaid                                            |

        | REST_ERROR_4000 | Out payment order already exists for incoming payment            |

        | REST_ERROR_4001 | Remaining amount must be equal zero                              |

        '
      enum:
      - REST_ERROR_5001
      - REST_ERROR_1000
      - REST_ERROR_1001
      - REST_ERROR_1002
      - REST_ERROR_1003
      - REST_ERROR_1004
      - REST_ERROR_1005
      - REST_ERROR_1006
      - REST_ERROR_1007
      - REST_ERROR_1008
      - REST_ERROR_1009
      - REST_ERROR_1010
      - REST_ERROR_1011
      - REST_ERROR_1012
      - REST_ERROR_1013
      - REST_ERROR_1014
      - REST_ERROR_1015
      - REST_ERROR_1016
      - REST_ERROR_1017
      - REST_ERROR_1018
      - REST_ERROR_1019
      - REST_ERROR_1020
      - REST_ERROR_1021
      - REST_ERROR_2000
      - REST_ERROR_2001
      - REST_ERROR_2002
      - REST_ERROR_2003
      - REST_ERROR_2004
      - REST_ERROR_2005
      example: REST_ERROR_5001
      type: string
    ErrorMessage:
      properties:
        code:
          $ref: '#/components/schemas/RestErrorCodes'
        description:
          description: Сообщение
          example: General service error
          type: string
        traceId:
          description: traceId
          example: 29bda8ca-4d33-11ec-81d3-0242ac130000
          type: string
      required:
      - code
      - description
      type: object
    BuyerStatus:
      description: Статус покупателя
      enum:
      - SENT_TO_CHECK
      - APPROVED
      - REJECTED
      example: APPROVED
      type: string
    Client:
      description: Клиент
      example:
        id: 2c44306f-fc96-4780-9b37-6447273b190e
        createdAt: '2025-07-10T06:53:37.433211'
        contacts:
        - id: 2c44306f-fc96-4780-9b37-6447273b190e
          createdAt: '2025-07-10T06:53:37.433211'
          email: foobar@mail.ru
          state:
            statusDate: '2025-07-10T06:53:37.433211'
            errors: []
            status: CREATED
          cqrsVersion: -1628796591
        requisites:
          fullNameRus: Акционерное общество Ромашка
          shortNameRus: АО Ромашка
          fullNameEn: Joint-stock company Romashka
          shortNameEn: JSC Romashka
          inn: '1234567890'
          ogrn: '123456789012345'
          okved: '11.11'
          cnum: AAAAAA
          opf: OOO
          address: address
        state:
          statusDate: '2025-07-10T06:53:37.433211'
          errors: []
          status: APPROVED
        cqrsVersion: -1628796591
      properties:
        id:
          description: Идентификатор клиента
          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
        createdAt:
          description: Дата и время создания
          example: '2025-07-10T06:53:37.433211'
          pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
          type: string
        contacts:
          description: Контакты
          example:
          - id: 2c44306f-fc96-4780-9b37-6447273b190e
            createdAt: '2025-07-10T06:53:37.433211'
            email: foobar@mail.ru
            state:
              statusDate: '2021-07-10T06:53:37.433111'
              errors: []
              status: CREATED
            cqrsVersion: -1628796591
          items:
            $ref: '#/components/schemas/Contact'
          type: array
        requisites:
          $ref: '#/components/schemas/OrganizationRequisites'
        state:
          $ref: '#/components/schemas/ClientState'
        cqrsVersion:
          description: hashCode от state - состояния объекта
          example: -1628796591
          type: integer
      required:
      - contacts
      - cqrsVersion
      - createdAt
      - id
      - requisites
      - state
      type: object
    BuyerState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/BuyerStatus'
        type: object
      description: Состояние покупателя
      example:
        statusDate: '2025-07-10T06:53:37.433211'
        errors: []
        status: APPROVED
      type: object
    ContactStatus:
      description: Статус контакта
      enum:
      - CREATED
      example: CREATED
      type: string
    ErrorResponse:
      example:
      - code: REST_ERROR_5001
        description: General service error
        traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
      items:
        $ref: '#/components/schemas/ErrorMessage'
      type: array
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCodes'
        description:
          description: Сообщение
          example: General service error
          type: string
      required:
      - code
      - description
      type: object
    BuyerRequisitesList:
      example:
      - fullName: АО Ромашка
        inn: '1234567890'
        ogrn: '123456789012345'
        kpp: '123456789'
      items:
        $ref: '#/components/schemas/BuyerRequisites'
      type: array
    Contact:
      description: Контакт
      properties:
        id:
          description: Идентификатор контакта
          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
        createdAt:
          description: Дата и время создания
          example: '2025-07-10T06:53:37.433211'
          pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
          type: string
        email:
          description: Email
          example: foobar@mail.ru
          format: email
          type: string
        state:
          $ref: '#/components/schemas/ContactState'
        cqrsVersion:
          description: hashCode от state - состояния объекта
          example: -1628796591
          type: integer
      required:
      - cqrsVersion
      - createdAt
      - email
      - id
      - state
      type: object
    CreateBuyerRequest:
      description: Запрос на создание покупателя
      example:
        buyerRequisites:
          ogrn: '123456789012345'
          inn: '1234567890'
          kpp: '123456789'
          fullName: АО Ромашка
        cnum: AAAAAA
      properties:
        buyerRequisites:
          $ref: '#/components/schemas/BuyerRequisites'
        cnum:
          description: Клиентский номер
          example: AAAAAA
          maxLength: 6
          minLength: 6
          type: string
      type: object
    Buyer:
      allOf:
      - $ref: '#/components/schemas/BuyerRequisites'
      - properties:
          id:
            description: Идентификатор покупателя
            example: 2c44306f-fc96-4780-9b37-6447273b190e
            format: uuid
            type: string
          createdAt:
            description: Дата и время создания
            example: '2025-07-10T06:53:37.433211'
            pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
            type: string
          clients:
            description: Клиенты связанные с покупателем
            example:
            - id: 2c44306f-fc96-4780-9b37-6447273b190e
              createdAt: '2025-07-10T06:53:37.433211'
              requisites:
                ogrn: '123456789012345'
                fullNameRus: Акционерное общество Ромашка
                shortNameRus: АО Ромашка
                address: address
                opf: opf
                inn: '1234567890'
                kpp: '123456789'
                shortNameEn: АО Ромашка
                cnum: AAAAAA
                fullNameEn: Акционерное общество Ромашка
                okved: '11.11'
              contacts:
              - id: 2c44306f-fc96-4780-9b37-6447273b190e
                createdAt: '2025-07-10T06:53:37.433211'
                email: foobar@mail.ru
                state:
                  statusDate: '2021-07-10T06:53:37.433111'
                  errors: []
                  status: CREATED
                cqrsVersion: -1628796591
              state:
                statusDate: '2021-07-10T06:53:37.433111'
                errors: []
                status: APPROVED
              cqrsVersion: -1628796591
            items:
              $ref: '#/components/schemas/Client'
            type: array
          state:
            $ref: '#/components/schemas/BuyerState'
          cqrsVersion:
            $ref: '#/components/schemas/CqrsVersion'
        required:
        - cqrsVersion
        - id
        - state
        type: object
      description: Покупатель
      example:
        ogrn: '123456789012345'
        createdAt: '2025-07-10T06:53:37.433211'
        clients:
        - id: 2c44306f-fc96-4780-9b37-6447273b190e
          createdAt: '2025-07-10T06:53:37.433211'
          requisites:
            ogrn: '123456789012345'
            fullNameRus: Акционерное общество Ромашка
            shortNameRus: АО Ромашка
            address: address
            opf: opf
            inn: '1234567890'
            kpp: '123456789'
            shortNameEn: АО Ромашка
            cnum: AAAAAA
