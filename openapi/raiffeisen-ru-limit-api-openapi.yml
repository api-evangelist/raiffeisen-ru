          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
        cnum:
          description: Клиентский номер (CNUM)
          example: AA10AA
          type: string
        shortNameRus:
          description: Сокращенное наименование организации
