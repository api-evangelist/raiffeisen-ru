openapi: 3.2.0
info:
  title: Raiffeisen Ru Supply API
  version: 1.0.0
  description: 'Operations tagged Supply across 4 of this provider''s published API definitions: raiffeisen-ru-factoring-openapi.yml, raiffeisen-ru-payment-control-openapi.yml, raiffeisen-ru-factoring-openapi.yml, raiffeisen-ru-payment-control-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.raiffeisen.ru/factoring
- url: https://api.raiffeisen.ru/pay-control
tags:
- description: Поставка
  name: Supply
paths:
  /v1/supplies:
    post:
      description: Метод для загрузки поставок вручную
      operationId: uploadSupplies
      parameters:
      - description: Идентификатор Договора Факторинга
        in: query
        name: agreementId
        required: true
        schema:
          example: ba705955-3e0f-4956-84e0-e12616e84e2b
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: Ручная загрузка поставок
                value:
                  supplies:
                  - supplyNumber: 26052021-51
                    signDate: '2021-05-26'
                    amount: 100.0
                    contractNumber: 11122019-1
                    deferralStartDate: '2021-05-26'
                    debtorInn: '1121003135'
                  - supplyNumber: 27052021-10
                    invoiceNumber: '456'
                    signDate: '2021-05-27'
                    invoiceSignDate: '2021-05-28'
                    amount: 250000.5
                    contractNumber: 22032020-5
                    deferralStartDate: '2021-05-27'
                    debtorInn: '7701234567'
            schema:
              $ref: '#/components/schemas/SupplyUploadListRequest'
      responses:
        '202':
          content:
            application/json:
              examples:
                simple:
                  summary: Успешная загрузка
                  value:
                    supplies:
                    - id: 5675c400-9835-491d-8489-d42ea7ed551c
                    - id: 5d5417d0-edd5-4910-8ae4-43706287a203
              schema:
                $ref: '#/components/schemas/SupplyUploadListResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                validationError:
                  summary: Ошибка валидации
                  value:
                    code: REST_ERROR_5032
                    message: Data validation failed
                    details:
                    - param: array[2]
                      code: VALIDATION_ERROR_1213
                      message: Contract not found
                    - param: array[3].signDate
                      code: VALIDATION_ERROR_1211
                      message: Invoice sign date does not equal sign date
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Ручная загрузка поставок
      tags:
      - Supply
    servers:
    - url: https://api.raiffeisen.ru/factoring
  /v1/supplies/{id}:
    get:
      description: Метод получения поставки по идентификатору
      operationId: getSupplyById
      parameters:
      - description: Идентификатор поставки
        in: path
        name: id
        required: true
        schema:
          example: 5675c400-9835-491d-8489-d42ea7ed551c
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Поставка
                  value:
                    id: 5675c400-9835-491d-8489-d42ea7ed551c
                    amount: 123456.78
                    availableFinancingAmount: 98765.42
                    financedAmount: 25742.31
                    number: П-1234
                    deferralStartDate: '2025-10-13'
                    waitingPeriodEndDate: '2025-10-20'
                    debtor:
                      fullNameRus: АО Ромашка
                    state:
                      status: APPROVED
                      statusDate: '2025-10-13T10:53:37.433221'
                      errors: []
                      cqrsVersion: -1628796591
              schema:
                $ref: '#/components/schemas/Supply'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  summary: Ошибка
                  value:
                  - code: REST_ERROR_5001
                    message: General service error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение поставки по идентификатору
      tags:
      - Supply
    patch:
      description: Метод редактирования поставки
      operationId: editSupply
      parameters:
      - description: Идентификатор поставки
        in: path
        name: id
        required: true
        schema:
          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: Редактирование поставки
                value:
                  amount: 220.12
                  paymentDate: '2026-01-10'
                  additionalDocumentNumber: ДД-2
                  additionalDocumentDate: '2026-01-09'
                  mainDocumentNumber: ОД-2
                  mainDocumentDate: '2026-01-08'
                  cqrsVersion: -1628796591
            schema:
              $ref: '#/components/schemas/PatchSupplyRequest'
        description: Параметры для редактирования поставки
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Успешно обновлено
                  value:
                    id: 2c44306f-fc96-4780-9b37-6447273b190e
                    createdAt: '2025-07-10T06:53:37.433211'
                    mainDocumentNumber: ОД-2
                    mainDocumentDate: '2026-01-08'
                    additionalDocumentNumber: ДД-2
                    additionalDocumentDate: '2026-01-09'
                    amount: 220.12
                    debtSum: 220.12
                    paymentDate: '2026-01-10'
                    state:
                      statusDate: '2025-07-10T06:53:37.433211'
                      errors: []
                      status: SENT_TO_CHECK
                    cqrsVersion: -1628796590
              schema:
                $ref: '#/components/schemas/Supply_2'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Редактирование поставки
      tags:
      - Supply
    servers:
    - url: https://api.raiffeisen.ru/factoring
  /v1/supplies/search:
    post:
      description: Метод получения поставок по переданным параметрам
      operationId: getSupplies
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: Поиск поставок по набору параметров
                value:
                  agreementId: ba705955-3e0f-4956-84e0-e12616e84e2b
                  dealConditionsId: b5c1e36d-bde1-42bf-8d72-9d0aa4504f73
                  financingRequestId: e05f8afe-a72e-4a6f-8292-7edb51a724ec
                  waitingPeriodEndDateFrom: '2025-12-01'
                  waitingPeriodEndDateTo: '2025-12-31'
                  deferralStartDateFrom: '2025-12-01'
                  deferralStartDateTo: '2025-12-31'
                  deferralEndDateFrom: '2026-01-01'
                  statuses:
                  - APPROVED
                  - FINANCING_IN_PROGRESS
                  supplyIds:
                  - 5675c400-9835-491d-8489-d42ea7ed551c
                  - 5d5417d0-edd5-4910-8ae4-43706287a203
                  offset: 10
                  limit: 2
            schema:
              $ref: '#/components/schemas/SupplySearchRequest'
        description: Параметры для поиска поставок
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Поставки
                  value:
                    supplies:
                    - id: 5675c400-9835-491d-8489-d42ea7ed551c
                      amount: 123456.78
                      availableFinancingAmount: 98765.42
                      financedAmount: 25742.31
                      number: П-1234
                      deferralStartDate: '2025-10-13'
                      waitingPeriodEndDate: '2025-10-20'
                      debtor:
                        fullNameRus: АО Ромашка
                      state:
                        status: APPROVED
                        statusDate: '2025-10-13T10:53:37.433221'
                        errors: []
                        cqrsVersion: -1628796591
                    - id: 5d5417d0-edd5-4910-8ae4-43706287a203
                      amount: 567890.12
                      availableFinancingAmount: 397523.01
                      financedAmount: 267752.2
                      number: П-7777
                      deferralStartDate: '2025-10-14'
                      waitingPeriodEndDate: '2025-10-23'
                      debtor:
                        fullNameRus: АО Ромашка
                      state:
                        status: FINANCING_IN_PROGRESS
                        statusDate: '2025-10-05T11:21:55.381531'
                        errors: []
                        cqrsVersion: 3473257012
                    offset: 10
                    limit: 2
                    totalCount: 100
              schema:
                $ref: '#/components/schemas/SupplyPageResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  summary: Ошибка
                  value:
                  - code: REST_ERROR_5001
                    message: General service error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение поставок
      tags:
      - Supply
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
    servers:
    - url: https://api.raiffeisen.ru/factoring
  /v1/supplies/for-desired-financing-amount:
    get:
      description: Метод получения списка поставок, сумма availableFinancingAmount которых меньше или равна желаемой сумме финансирования. Подобранные поставки относятся к одному дебитору (сублимиту). Метод не гарантирует оптимальный подбор поставок - не гарантируется, что сумма availableFinancingAmount подобранных поставок максимальна для заданной границы в виде желаемой суммы. Приоритетом для включения поставок в список является более ранняя deferralStartDate. Отсортированные по deferralStartDate поставки включаются в результирующий список до тех пора, пока сумма availableFinancingAmount <= желаемой сумме. При isPartiallyFinanceable = true единожды может быть добавлена поставка, нарушающая условие 'сумма availableFinancingAmount <= желаемой сумме'
      operationId: getSuppliesForAmount
      parameters:
      - description: Идентификатор основных условий обслуживания Поставщик-Дебитор, по контрактам которых необходимо подобрать поставки
        example: b5c1e36d-bde1-42bf-8d72-9d0aa4504f73
        in: query
        name: dealConditionsId
        required: true
        schema:
          example: b5c1e36d-bde1-42bf-8d72-9d0aa4504f73
          format: uuid
          type: string
      - description: Желаемая сумма финансирования - та сумма, меньше или равна которой должна быть сумма availableFinancingAmount поставок
        in: query
        name: desiredFinancingAmount
        required: true
        schema:
          example: 500000.0
          type: number
      - description: 'Возможность частичного финансирования на заданную сумму. Если true - сумма availableFinancingAmount подобранных  поставок может быть больше desiredFinancingAmount за счет добавления одной поставки в результирующий список

          '
        in: query
        name: isPartiallyFinanceable
        required: true
        schema:
          example: false
          type: boolean
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Поставки
                  value:
                    supplies:
                    - id: 5675c400-9835-491d-8489-d42ea7ed551c
                      amount: 123456.78
                      availableFinancingAmount: 98765.42
                      financedAmount: 25742.31
                      number: П-1234
                      deferralStartDate: '2025-10-13'
                      waitingPeriodEndDate: '2025-10-20'
                      debtor:
                        fullNameRus: АО Ромашка
                      state:
                        status: APPROVED
                        statusDate: '2025-10-13T10:53:37.433221'
                        errors: []
                        cqrsVersion: -1628796591
                    - id: 5d5417d0-edd5-4910-8ae4-43706287a203
                      amount: 567890.12
                      availableFinancingAmount: 397523.01
                      financedAmount: 267752.2
                      number: П-7777
                      deferralStartDate: '2025-10-14'
                      waitingPeriodEndDate: '2025-10-23'
                      debtor:
                        fullNameRus: АО Ромашка
                      state:
                        status: FINANCING_IN_PROGRESS
                        statusDate: '2025-10-05T11:21:55.381531'
                        errors: []
                        cqrsVersion: 3473257012
              schema:
                $ref: '#/components/schemas/SupplyListResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  summary: Ошибка
                  value:
                  - code: REST_ERROR_5001
                    message: General service error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение списка поставок под желаемую сумму финансирования
      tags:
      - Supply
    servers:
    - url: https://api.raiffeisen.ru/factoring
  /v1/supplies/summary:
    get:
      description: Метод получения количества и суммы поставок в указанном статусе
      operationId: getSuppliesSummary
      parameters:
      - description: Статус поставки
        example: ON_CONTROL
        in: query
        name: status
        required: true
        schema:
          $ref: '#/components/schemas/SupplyStatus_2'
      - description: Клиентский номер
        examples:
          oneCnum:
            summary: Пример с одним клиентский номером
            value:
            - AAAAAA
          multipleCnums:
            summary: Пример с несколькими клиентскими номерами
            value:
            - AAAAAA
            - BBBBBB
        in: query
        name: cnums
        required: false
        schema:
          example:
          - AAAAAA
          items:
            example: AAAAAA
            type: string
          type: array
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Сводная информация
                  value:
                    count: 42
                    amount: '120.12'
              schema:
                $ref: '#/components/schemas/SupplySummary'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение сводной информации по поставкам в статусе
      tags:
      - Supply
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/supplies/reports:
    get:
      description: Метод получения документов реестров поставок в формате base64 для подписания
      operationId: getRegistryReports
      parameters:
      - description: Клиентский номер
        examples:
          oneCnum:
            summary: Пример с одним клиентский номером
            value:
            - AAAAAA
          multipleCnums:
            summary: Пример с несколькими клиентскими номерами
            value:
            - AAAAAA
            - BBBBBB
        in: query
        name: cnums
        required: false
        schema:
          example:
          - AAAAAA
          items:
            example: AAAAAA
            type: string
          type: array
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Дайджесты поставки
                  value:
                  - digest: 0JLQvtGCINGN0YLQviDQvdGD0LbQvdC+INC/0L7QtNC/0LjRgdCw0YLRjA==
                  - digest: 0JLQvtGCINGN0YLQviDQvdGD0LbQvdC+INC/0L7QtNC/0LjRgdCw0YLRjA==
              schema:
                $ref: '#/components/schemas/DigestResponseList'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение документов реестров поставок для подписания
      tags:
      - Supply
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/supplies/registries:
    get:
      description: Метод получения дайджеста реестров постаовок для доп. подписания
      operationId: getRegistries
