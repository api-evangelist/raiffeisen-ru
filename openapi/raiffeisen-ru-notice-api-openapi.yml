          format: uuid
          type: string
        createdAt:
          description: Дата и время создания
          example: '2025-07-10T06:53:37.433211'
          pattern: ([0-9]{4})-(?:[0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{6})
          type: string
        email:
          description: Email
          example: foobar@mail.ru
          format: email
          type: string
        state:
          $ref: '#/components/schemas/ContactState'
        cqrsVersion:
          description: hashCode от state - состояния объекта
          example: -1628796591
          type: integer
      required:
      - cqrsVersion
      - createdAt
      - email
      - id
      - state
      type: object
    CqrsRequest:
      description: Запрос с версией CQRS
      example:
        cqrsVersion: -1628796591
      properties:
        cqrsVersion:
          description: hashCode от state - состояния объекта
          example: -1628796591
          type: integer
      required:
