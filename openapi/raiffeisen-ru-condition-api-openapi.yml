openapi: 3.2.0
info:
  title: Raiffeisen Ru Condition API
  version: 1.0.0
  description: 'Operations tagged Condition across 2 of this provider''s published API definitions: raiffeisen-ru-payment-control-openapi.yml, raiffeisen-ru-payment-control-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.raiffeisen.ru/pay-control
tags:
- description: Условия
  name: Condition
paths:
  /v1/conditions:
    get:
      description: Метод получение списка условий обслуживания по фильтрам
      operationId: getConditions
      parameters:
      - description: Клиентский номер
        examples:
          oneCnum:
            summary: Пример с одним клиентский номером
            value:
            - AAAAAA
          multipleCnums:
            summary: Пример с несколькими клиентскими номерами
            value:
            - AAAAAA
            - BBBBBB
        in: query
        name: cnums
        required: false
        schema:
          example:
          - AAAAAA
          items:
            example: AAAAAA
            type: string
          type: array
      - description: ИНН или наименование покупателя
        examples:
          inn:
            summary: Только инн
            value: '33333333'
          name:
            summary: Только наименование
            value: Ромаш
        in: query
        name: buyerInnOrNameSearchParam
        required: false
        schema:
          example: Ромаш
          type: string
      - description: Номер контракта
        examples:
          simple:
            summary: Номер контракта
            value: КОНТРАКТ-1
        in: query
        name: contractNumber
        required: false
        schema:
          example: КОНТРАКТ-1
          type: string
      - description: Статусы условия обслуживания
        examples:
          oneStatus:
            summary: Один статус
            value:
            - APPROVED
          multipleStatuses:
            summary: Несколько статусов
            value:
            - APPROVED
            - SENT_TO_SIGN
        in: query
        name: statuses
        required: false
        schema:
          example:
          - APPROVED
          items:
            $ref: '#/components/schemas/ConditionStatus'
          type: array
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Успешно создан
                  value:
                  - id: 2c44306f-fc96-4780-9b37-6447273b190e
                    createdAt: '2025-07-10T06:53:37.433211'
                    contractNumber: ДП-1
                    contractDate: '2025-07-10'
                    client:
                      id: 2c44306f-fc96-4780-9b37-6447273b190e
                      createdAt: '2025-07-10T06:53:37.433211'
                      requisites:
                        ogrn: '123456789012345'
                        fullNameRus: Акционерное общество Ромашка
                        shortNameRus: АО Ромашка
                        address: address
                        opf: opf
                        inn: '1234567890'
                        kpp: '123456789'
                        shortNameEn: АО Ромашка
                        cnum: AAAAAA
                        fullNameEn: Акционерное общество Ромашка
                        okved: '11.11'
                      contacts:
                      - id: 2c44306f-fc96-4780-9b37-6447273b190e
                        createdAt: '2025-07-10T06:53:37.433211'
                        email: foobar@mail.ru
                        state:
                          statusDate: '2021-07-10T06:53:37.433111'
                          errors: []
                          status: CREATED
                        cqrsVersion: -1628796591
                      state:
                        statusDate: '2021-07-10T06:53:37.433111'
                        errors: []
                        status: APPROVED
                      cqrsVersion: -1628796591
                    buyer:
                      id: 2c44306f-fc96-4780-9b37-6447273b190e
                      createdAt: '2025-07-10T06:53:37.433211'
                      fullName: Акционерное общество Ромашка
                      shortName: АО Ромашка
                      inn: '1234567890'
                      kpp: '123456789'
                      ogrn: '123456789012345'
                      state:
                        statusDate: '2025-07-10T06:53:37.433111'
                        errors: []
                        status: APPROVED
                      cqrsVersion: -1628796591
                    contacts:
                    - id: 2c44306f-fc96-4780-9b37-6447273b190e
                      fullName: Иванов Иван Иванович
                      email: test@mail.ru
                      phoneNumber: +9 999 999 99 99
                      additionalNumber: '999'
                      workPosition: Бухгалтер
                      comment: Комментарий
                      state:
                        statusDate: '2025-07-10T06:53:37.433111'
                        errors: []
                        status: CREATED
                      cqrsVersion: -1628796591
                    tariffs:
                    - id: 2c44306f-fc96-4780-9b37-6447273b190e
