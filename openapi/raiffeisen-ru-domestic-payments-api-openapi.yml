openapi: 3.2.0
info:
  title: Raiffeisen Ru Domestic Payments API
  version: '1.0'
  description: 'Operations tagged domestic-payments across 4 of this provider''s published API definitions: raiffeisen-ru-domestic-payments-import-openapi.yml, raiffeisen-ru-domestic-payments-iso20022-openapi.yml, raiffeisen-ru-domestic-payments-import-openapi.yml, raiffeisen-ru-domestic-payments-iso20022-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.raiffeisen.ru/domestic-payments
tags:
- name: domestic-payments
