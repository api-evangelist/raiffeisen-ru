        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        state:
          allOf:
          - $ref: '#/components/schemas/LimitState'
          description: Состояние лимита
          type: object
        cqrsVersion:
          description: hashCode от state - состояния реестра
          example: -1628796591
          type: integer
      type: object
    CurrencyCode:
      description: Валюта платежа
      enum:
      - RUB
      example: RUB
      type: string
    LimitListResponse:
