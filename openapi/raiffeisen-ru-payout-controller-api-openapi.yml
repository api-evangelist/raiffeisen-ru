  x-x-displayName-i18n:
    eng: Payout methods
  description: 'Для реализации взаимодействия с партнёром Райффайзенбанк предоставляет API из следующих запросов:

    * получение списка банков, принимающих выплаты по СБП,

    * запрос на проведение выплаты,

    * запрос на создание заявки на выплату,

    * запрос на подтверждение заявки на выплату,

    * получение статуса выплаты.'
  x-description-i18n:
    eng: "To implement interaction with a partner, Raiffeisenbank provides an API from the following requests:\n * obtaining a list of banks accepting payout under the SBP,\n * request for payout,\n * request for create payout request,\n * confirmation of the request for payment,\n * receiving payout status.\n\nYou can see the list of banks connected to accepting SBP payouts on the website https://sbp.nspk.ru/participants/ in the \"Оплата по QR\" section.\n\nWe automatically maintain an up-to-date list and return it in [request to get participating banks](#operation/get-payout-v1-sbp-banks).\n"
