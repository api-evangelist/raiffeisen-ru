openapi: 3.2.0
info:
  title: Raiffeisen Ru Cash Reconciliation API
  x-refined-note:
  - x-description-i18n differs across the merged source definitions and was not carried
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged cashReconciliation across 3 of this provider''s published API definitions: raiffeisen-ru-raif-pay-payment-form-openapi.json, raiffeisen-ru-raif-pay-reports-openapi.yml, raiffeisen-ru-raif-pay-sbp-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
- url: https://api.raiffeisen.ru/raif-pay
tags:
- name: cashReconciliation
  x-displayName: Сверка операций за период
  x-x-displayName-i18n:
    eng: Reconciliation of transactions for the period
  description: 'Методы позволяют получить список операций и итоговые суммы за определенный промежуток времени.

    Возможно использование методов для закрытия кассового периода.'
  x-description-i18n:
    eng: 'The methods allow you to obtain a list of transactions and total amounts for a certain period of time.

      It is possible to use methods for closing the cash period.

      '
paths:
  /report/v1/transactions/summary:
    get:
      summary: Сверка по транзакциям за указанный период
      x-summary-i18n:
        eng: Reconciliation of transactions for the specified period
      tags:
      - cashReconciliation
      responses:
        '200':
          $ref: '#/components/responses/GetSummaryReportTransactionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Example 1:
                  $ref: '#/components/examples/RECONCILATION.BAD_REQUEST'
      operationId: get-report-v1-transactions-summary
      description: 'Отчёт по транзакциям за указанный период.


        Максимальная глубина запрашиваемых данных **не более трёх дней**.


        Пример запроса:


        ```

        GET https://pay.raif.ru/api/report/v1/transactions/summary?from=2026-01-15T00%3A00%3A00%2B03%3A00&to=2026-01-16T23%3A59%3A59%2B03%3A00

        ```'
      x-description-i18n:
        eng: "Transaction report for the specified period. <br>\nThe maximum requested data depth is **no more than three days**.\n\nExample:\n\n  ```\n  GET https://pay.raif.ru/api/report/v1/transactions/summary?from=2026-01-15T00%3A00%3A00%2B03%3A00&to=2026-01-16T23%3A59%3A59%2B03%3A00\n  ```\n"
      security:
      - secretKey: []
      parameters:
      - $ref: '#/components/parameters/SummaryFromParameter'
      - $ref: '#/components/parameters/SummaryToParameter'
      - $ref: '#/components/parameters/SummaryOperationType'
      - $ref: '#/components/parameters/SummaryQrIdParameter'
      - $ref: '#/components/parameters/SummaryTypesParameter'
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /report/v1/transactions:
    get:
      summary: Детализированный отчет транзакций за период
      x-summary-i18n:
        eng: Detailed report of transactions for the period
      tags:
      - cashReconciliation
      responses:
        '200':
          $ref: '#/components/responses/GetDetailTransactionsReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Example 1:
                  $ref: '#/components/examples/RECONCILATION.BAD_REQUEST'
      operationId: get-report-v1-transactions
      description: 'Получение детализированного отчёта по транзакциям за указанный период.


        Максимальная глубина запрашиваемых данных **не более трёх дней**.

        При указании `orderId` параметры `from` и `to` становятся необязательными


        Пример запроса:


        ```

        GET https://pay.raif.ru/api/report/v1/transactions?from=2026-01-15T00%3A00%3A00%2B03%3A00&to=2026-01-16T23%3A59%3A59%2B03%3A00

        ```'
      x-description-i18n:
        eng: "Receive a detailed transaction report for the specified period. <br>\nThe maximum requested data depth is **no more than three days**.\nWhen `orderId` is specified, `from` and `to` parameters become optional\n\nExample:\n\n  ```\n  GET https://pay.raif.ru/api/report/v1/transactions?from=2026-01-15T00%3A00%3A00%2B03%3A00&to=2026-01-16T23%3A59%3A59%2B03%3A00\n  ```\n"
      security:
      - secretKey: []
      parameters:
      - $ref: '#/components/parameters/OptionalSummaryFromParameter'
      - $ref: '#/components/parameters/OptionalSummaryToParameter'
      - $ref: '#/components/parameters/SummaryOperationType'
      - $ref: '#/components/parameters/SummaryQrIdParameter'
      - $ref: '#/components/parameters/SummaryTypesParameter'
      - $ref: '#/components/parameters/QueryOrderIdParameter'
    parameters: []
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /v1/transactions/summary:
    get:
      summary: Сверка по транзакциям за указанный период
      description: Отчёт по транзакциям за указанный период (не более трёх дней)
      tags:
      - cashReconciliation
      operationId: getV1TransactionsSummary
      parameters:
      - schema:
          type: string
          pattern: YYYY-MM-DD ТHH24:MM:SS±HH:MM
          format: URL encoded
        in: query
        name: from
        required: true
        description: Дата и время начала выборки
      - schema:
          type: string
          pattern: YYYY-MM-DD ТHH24:MM:SS±HH:MM
          format: URL encoded
        in: query
        name: to
        description: Дата и время окончания выборки
        required: true
      - schema:
          type: string
          enum:
          - Payment
          - Refund
        in: query
        name: operationTypes
        description: Фильтр по типу операции. Если значение не передано - выгружаются все типы операций
      - schema:
          type: string
        in: query
        name: qrId
        description: Фильтр по QR-коду. Если значение не передано - выгружаются все операции по мерчанту
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/comparisonSummaryRep'
              examples:
                Example 1:
                  summary: Пример сводной информации о платежах
                  value:
                    sbp:
                      payments:
                        sum: 21
                        count: 2
                      refunds:
                        sum: 10
                        count: 1
                      total:
                        sum: 11
                        count: 3
                    card:
                      payments:
                        sum: 23
                        count: 2
                      refunds:
                        sum: 11
                        count: 1
                      total:
                        sum: 12
                        count: 3
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Выбранный период превышает трое суток:
                  value:
                    code: ERROR.INVALID_REQUEST
                    message: Даты from и to должны быть определены в хронологическом порядке и интервалом не более 3х дней
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-operation-id-source: normalized
      x-operation-id-original: get-report-v1-transactions-summary
    servers:
    - url: https://api.raiffeisen.ru/raif-pay
  /v1/transactions:
    get:
      summary: Детализированный отчет транзакций за период
      tags:
      - cashReconciliation
      operationId: getV1Transactions
      description: Получение детализированного отчёта по транзакциям за указанный период (не более трёх дней)
      parameters:
      - schema:
          type: string
          pattern: ' YYYY-MM-DD ТHH24:MM:SS±HH:MM'
          format: URL encoded
        in: query
        name: from
        description: Дата и время начала выборки
        required: true
      - schema:
          type: string
          pattern: ' YYYY-MM-DD ТHH24:MM:SS±HH:MM'
          format: URL encoded
        in: query
        name: to
        description: Дата и время окончания выборки
        required: true
      - schema:
          type: string
          enum:
          - Payment
          - Refund
        in: query
        name: operationTypes
        description: Фильтр по типу операции. Если значение не передано - выгружаются все типы операций
      - schema:
          type: string
        in: query
        name: qrId
        description: Фильтр по QR-коду. Если значение не передано - выгружаются все операции по мерчанту
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sbp:
                    type: object
                    description: Операции СБП
                    properties:
                      payment:
                        type: array
                        description: Массив платежей СБП
                        items:
                          $ref: '#/components/schemas/reportPaymentSbpResponse'
                      refund:
                        type: array
                        description: Массив возвратов СБП
                        items:
                          $ref: '#/components/schemas/reportRefundSbpResponse'
                  card:
                    type: object
                    description: Операции по интернет-эквайрингу
                    properties:
                      payment:
                        type: array
                        description: Массив платежей по интернет-эквайрингу
                        items:
                          $ref: '#/components/schemas/reportPaymentCardResponse'
                      refund:
                        type: array
                        description: Массив возвратов по интернет-эквайрингу
                        items:
                          $ref: '#/components/schemas/reportRefundCardResponse'
              examples:
                Example 1:
                  summary: Пример информации по платежам и возвратам
                  value:
                    sbp:
                      payment:
                      - orderId: a3294_3FFERSer_RE
                        amount: 77
                        transactionDate: '2022-12-08T13:21:04.631543+03:00'
                        paymentSystem: Instant Payment QR
                        paymentDetails: Благотворительное пожертвование
                        transactionId: 178657
                        clientId: 007910******4567
                        qrId: AS1A007L7B8IPA1F8CBQ8RK2D27FHST9
                        sbpTransactionId: A23091339574920E000009529E6B66DF
                        orderComment: Комментарий
                      refund:
                      - orderId: a3294_3FFERSer_RE
                        amount: 17
                        transactionDate: '2022-12-09T13:17:04.631543+03:00'
                        paymentSystem: Instant Payment QR
                        paymentDetails: Возврат денежных средств
                        transactionId: 178658
                        clientId: 007910******4567
                        qrId: AS1A007L7B8IPA1F8CBQ8RK2D27FHST9
                        sbpTransactionId: B229701403532102000016268EEA632B
                        refundId: refundOrder1
                    card:
                      payment:
                      - orderId: xU5q5XG8m3oaDGKOTWg01671000652444
                        amount: 14
                        transactionDate: '2022-12-14T09:51:02.339+03:00'
                        paymentSystem: VISA
                        paymentDetails: Назначение платежа
                        transactionId: 5252420
                        clientId: 200043****823
                        authCode: 259AA
                        rrn: '935014591810'
                        orderComment: Благотворительное пожертвование
                      refund:
                      - orderId: xU5q5XG8m3oaDGKOTWg01671000652444
                        amount: 13
                        transactionDate: '2022-12-14T10:01:24.84+03:00'
                        paymentSystem: VISA
                        paymentDetails: Назначение платежа
                        transactionId: 5252440
                        clientId: 200043****823
                        authCode: 259AA
                        rrn: '935014591810'
                        refundId: refundId1
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Выбранный период превышает трое суток:
                  value:
                    code: ERROR.INVALID_REQUEST
                    message: Даты from и to должны быть определены в хронологическом порядке и интервалом не более 3х дней
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-operation-id-source: normalized
      x-operation-id-original: get-report-v1-transactions
    servers:
    - url: https://api.raiffeisen.ru/raif-pay
components:
  parameters:
    OptionalSummaryFromParameter:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
        example: '2026-01-15T12:00:00+03:00'
      description: 'Дата и время начала выборки. Параметр является необязательным.

        '
      x-description-i18n:
        eng: 'Start date and time of the selection. This parameter is optional.

          '
    SummaryToParameter:
      name: to
      in: query
      schema:
        type: string
        example: '2026-01-15T15:00:00+03:00'
        format: date-time
      description: Дата и время окончания выборки. <br> Параметр должен передаваться в формате URL-encoded. К примеру, значение `2026-01-15T15:00:00+03:00` необходимо привести к формату `2026-01-15T15%3A00%3A00%2B03%3A00`.
      x-description-i18n:
        eng: End date and time of the selection. <br> The parameter must be passed in URL-encoded format. For example, the value `2026-01-15T15:00:00+03:00` must be converted to the format `2026-01-15T15%3A00%3A00%2B03%3A00`.
      required: true
    QueryOrderIdParameter:
      name: orderId
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
        example: order-test
      description: 'Идентификатор заказа в системе мерчанта. При использовании этого параметра параметры `from` и `to` становятся необязательными.

        '
      x-description-i18n:
        eng: 'Order ID in the merchant system. When using this parameter, `from` and `to` parameters become optional.

          '
    SummaryTypesParameter:
      name: types
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - sbp
          - card
          - digital_ruble
      description: 'Типы операций для возврата. Допустимые значения: `sbp`, `card`, `digital_ruble`. Если параметр не указан, возвращаются только `sbp` и `card`.

        '
      x-description-i18n:
        eng: 'Operation types to return. Allowed values: `sbp`, `card`, `digital_ruble`. If not specified, only `sbp` and `card` are returned.

          '
      style: form
      explode: true
      example:
      - sbp
      - card
      - digital_ruble
    SummaryQrIdParameter:
      name: qrId
      in: query
      required: false
      schema:
        type: string
        example: AD1F2CD7212E48FA919AB52EF0AEFB33
      description: Идентификатор QR-кода. Если значение не передано - выгружаются все операции по мерчанту
      x-description-i18n:
        eng: QR code ID. If not provided, all transactions for the merchant are exported
    OptionalSummaryToParameter:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
        example: '2026-01-16T23:59:59+03:00'
      description: 'Дата и время окончания выборки. Параметр является необязательным.

        '
      x-description-i18n:
        eng: 'End date and time of the selection. This parameter is optional.

          '
    SummaryOperationType:
      name: operationTypes
      in: query
      required: false
      schema:
        type: string
        enum:
        - Payment
        - Refund
      description: Тип операции. Если значение не передано - выгружаются все типы операции
      x-description-i18n:
        eng: Transaction type. If not provided, all transaction types are exported
    SummaryFromParameter:
      name: from
      in: query
      schema:
        type: string
        example: '2026-01-15T12:00:00+03:00'
        format: date-time
      description: Дата и время начала выборки. <br> Параметр должен передаваться в формате URL-encoded. К примеру, значение `2026-01-15T12:00:00+03:00` необходимо привести к формату `2026-01-15T12%3A00%3A00%2B03%3A00`.
      x-description-i18n:
        eng: Start date and time of the selection. <br> The parameter must be passed in URL-encoded format. For example, the value `2026-01-15T12:00:00+03:00` must be converted to the format `2026-01-15T12%3A00%3A00%2B03%3A00`.
      required: true
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
  schemas:
    ReportPaymentCard:
      title: ReportPaymentCard
      type: object
      description: Платеж по ECOM
      x-description-i18n:
        eng: Payment by ECOM
      properties:
        orderId:
          type: string
          description: Уникальный идентификатор заказа в системе мерчанта
          x-description-i18n:
            eng: Unique order ID in the merchant system
        amount:
          type: number
          description: Сумма операции
          x-description-i18n:
            eng: Transaction amount
        transactionDate:
          type: string
          description: Дата операции
          x-description-i18n:
            eng: Transaction date
        paymentSystem:
          type: string
          description: Платежная система
          x-description-i18n:
            eng: Payment system
        paymentDetails:
          type: string
          description: Назначение платежа
          x-description-i18n:
            eng: Purpose of payment
        transactionId:
          type: integer
          description: Идентификатор операции в системе Банка
          x-description-i18n:
            eng: Operation identifier in the Bank system
        clientId:
          type: string
          description: Маскированный номер карты плательщика
          x-description-i18n:
            eng: Masked payer card number
        authCode:
          type: string
          description: Код авторизации, полученный от Банка-эмитента
          x-description-i18n:
            eng: Authorization code received from the Issuing Bank
        rrn:
          type: string
          description: Идентификатор транзакции в системе Банка
          x-description-i18n:
            eng: Transaction ID in the Bank system
        orderComment:
          type: string
          description: Комментарий к заказу
          x-description-i18n:
            eng: Comment to order
        fee:
          type: number
          format: float
          description: Комиссия по операции
          x-description-i18n:
            eng: Transaction fee
    ReportRefundSbp:
      title: ReportRefundSbp
      type: object
      description: Возврат СБП
      x-description-i18n:
        eng: SBP refund
      properties:
        orderId:
          type: string
          description: Уникальный идентификатор заказа в системе мерчанта
          x-description-i18n:
            eng: Unique order ID in the merchant system
        amount:
          type: number
          description: Сумма операции
          x-description-i18n:
            eng: Transaction amount
        transactionDate:
          type: string
          description: Дата операции
          x-description-i18n:
            eng: Transaction date
        paymentSystem:
          type: string
          description: Платежная система
          x-description-i18n:
            eng: Payment system
        paymentDetails:
          type: string
          description: Назначение платежа
          x-description-i18n:
            eng: Purpose of payment
        transactionId:
          type: integer
          description: Идентификатор транзакции СБП в системе Банка
          x-description-i18n:
            eng: SBP transaction identifier in the Bank system
        clientId:
          type: string
          description: Идентификатор плательщика в системе НСПК
          x-description-i18n:
            eng: Payer identifier in the NSPK system
        qrId:
          type: string
          description: Идентификатор QR-кода
          x-description-i18n:
            eng: QR code identifier
        sbpTransactionId:
          type: string
          description: Идентификатор операции в системе НСПК
          x-description-i18n:
            eng: Operation identifier in the NSPK system
        refundId:
          type: string
          description: Идентификатор запроса на возврат в системе мерчанта
          x-description-i18n:
            eng: Return request ID in the merchant system
        fee:
          type: number
          format: float
          description: Комиссия по операции
          x-description-i18n:
            eng: Transaction fee
    ReportRefundCard:
      title: ReportRefundCard
      type: object
      description: Возврат по ECOM
      x-description-i18n:
        eng: ECOM refund
      properties:
        orderId:
          type: string
          description: Уникальный идентификатор заказа в системе мерчанта
          x-description-i18n:
            eng: Unique order ID in the merchant system
        amount:
          type: number
          description: Сумма операции
          x-description-i18n:
            eng: Transaction amount
        transactionDate:
          type: string
          description: Дата операции
          x-description-i18n:
            eng: Transaction date
        paymentSystem:
          type: string
          description: Платежная система
          x-description-i18n:
            eng: Payment system
        paymentDetails:
          type: string
          description: Назначение платежа
          x-description-i18n:
            eng: Purpose of payment
        transactionId:
          type: integer
          description: Идентификатор операции в системе Банка
          x-description-i18n:
            eng: Operation identifier in the Bank system
        clientId:
          type: string
          description: Маскированный номер карты плательщика
          x-description-i18n:
            eng: Masked payer card number
        authCode:
          type: string
          description: Код авторизации, полученный от Банка-эмитента
          x-description-i18n:
            eng: Authorization code received from the Issuing Bank
        rrn:
          type: string
          description: Идентификатор транзакции в системе Банка
          x-description-i18n:
            eng: Transaction ID in the Bank system
        refundId:
          type: string
          description: Идентификатор запроса на возврат в системе мерчанта
          x-description-i18n:
            eng: Return request ID in the merchant system
        fee:
          type: number
          format: float
