                  items:
                  - name: Шоколадный торт
                    price: 1200
                    quantity: 1
                    amount: 1200
                    paymentObject: COMMODITY_MARKING_WITH_CODE
                    paymentMode: FULL_PAYMENT
                    measurementUnit: PIECE
                    vatType: VAT20
