      summary: Импорт подписанного с помощью XmlDSig платежа в формате ISO20022
      operationId: signedDomesticPayment
      description: 'ВАЖНО: Данный функционал недоступен для клиентов сегмента Финансовые институты!

        Отправка XML-файла, подписанного с использованием **XmlDSig**.

        API Документация на английском,

        API Документация на русском,

        XSD-схема для валидации,

        Документация API по подписанным ISO XML,

        Инструкция по подписи (Примеры на Java).'
      parameters:
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        description: 'XML-документ установленного формата, представляющий данные подписанного платежного поручения

          '
        content:
