openapi: 3.2.0
info:
  title: Raiffeisen Ru Deprecated API
  version: '1.0'
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 178
    x-short-team-name: PAPAS
  x-refined-note:
  - x-description-i18n differs across the merged source definitions and was not carried
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: 'Operations tagged deprecated across 4 of this provider''s published API definitions: raiffeisen-ru-raif-pay-payment-form-openapi.json, raiffeisen-ru-raif-pay-whitelabel-ecom-openapi.json, raiffeisen-ru-raif-pay-payment-form-openapi.yml, raiffeisen-ru-raif-pay-whitelabel-ecom-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: Deprecated
  x-displayName: Устаревшие методы
  x-x-displayName-i18n:
    eng: Deprecated methods
paths:
  /payments/v1/orders/{orderId}/transaction:
    parameters:
    - $ref: '#/components/parameters/orderId'
    get:
      summary: Получение информации о статусе транзакции
      responses:
        '200':
          $ref: '#/components/responses/GetTransactionInfoResponse'
      operationId: get-payments-v1-orders-orderId-transaction
      description: 'Метод позволяет получить статус транзакции.

        Необходимо проверять сумму, так как у плательщика есть возможность ее изменить.'
      x-summary-i18n:
        eng: Getting transaction status information
      x-description-i18n:
        eng: 'The method allows you to get the transaction status.

          It is necessary to check the amount, as customers have the opportunity to change it.

          '
      x-codeSample:
      - lang: PHP
        source: '<?php


          $orderId = ''order-test'';


          /** @var \Raiffeisen\Ecom\Client $client */

          $response = $client->getOrderTransaction($orderId);


          print_r($response);


          ?>

          '
      - lang: Node
        source: 'const orderId = ''order-test'';


          const response = await client.getOrderTransaction(orderId);

          '
      - lang: Java
        source: 'String orderId = "order-test";


          TransactionResponseData response = client.getTransaction(secretKey);

          '
      security:
      - secretKey: []
      deprecated: true
      tags:
      - Deprecated
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /payment/v1/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/orderId'
    get:
      summary: Получение информации о заказе
      responses:
        '200':
          $ref: '#/components/responses/GetOrderResponse'
        '404':
          $ref: '#/components/responses/Error404Response'
      operationId: get-payment-v1-orders-orderId
      description: Метод позволяет получить данные о заказе.
      security:
      - secretKey: []
      x-summary-i18n:
        eng: Getting order status information
      x-description-i18n:
        eng: The method allows you to get the order status
      deprecated: true
      tags:
      - Deprecated
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
  /payments/v1/orders/{orderId}/refunds/{refundId}:
    parameters:
    - $ref: '#/components/parameters/orderId'
    - $ref: '#/components/parameters/refundId'
    post:
      summary: Оформление возврата по платежу
      operationId: post-payments-v1-orders-orderId-refunds-refundId
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/CreateRefundResponse'
        '400':
          $ref: '#/components/responses/Error400Response'
        '415':
          $ref: '#/components/responses/Error415Response'
      description: 'Метод позволяет выполнить отмену/возврат по платежу, как полную, так и частичную.

        В случае с СБП выполняется только возврат.


        Для мерчантов с подключенной фискализацией метод также позволяет сформировать фискальный чек по возврату. Для этого необходимо в теле запроса передать данные чека в объекте receipt, чек возврата будет сформирован автоматически.'
      security:
      - secretKey: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRefundRequest'
      x-summary-i18n:
        eng: Refund
      x-description-i18n:
        eng: 'The method allows you to cancel /refund a payment, both full and partial.

          In the case of the SBP, only the return is performed.

          '
      x-extension-3:
      - lang: PHP
        source: '<?php


          $orderId = ''order-test'';

          $refundId = ''refund-test'';

          $amount = 150;


          /** @var \Raiffeisen\Ecom\Client $client */

          $response = $client->postOrderRefund($orderId, $refundId, $amount);


          print_r($response);


          ?>

          '
      - lang: Node
        source: 'const orderId = ''order-test'';

          const refundId = ''refund-test'';

          const amount = 150;


          const response = await client.postOrderRefund(orderId, refundId, amount);


          console.log(response);

          '
      - lang: Java
        source: 'String orderId = "order-test";

          String refundId = "refund-test";

          Refund refund = new Refund(BigDecimal.valueOf(150));


          OrderRefundResponseData response = client.createRefund(orderId, refundId, refund);

          '
      tags:
      - Deprecated
    get:
      summary: Получение статуса возврата
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/GetRefundStatusResponse'
      operationId: get-payments-v1-orders-orderId-refunds-refundId
      security:
      - secretKey: []
      description: Метод позволяет получить статус по отмене или возврату.
      x-summary-i18n:
        eng: Refund status
      x-description-i18n:
        eng: The method allows you to get the status of cancellation/refund.
      tags:
      - Deprecated
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: Production
components:
  responses:
    GetTransactionInfoResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
            - properties:
                code:
                  type: string
                  description: Код состояния http запроса
                  x-description-i18n:
                    eng: HTTP request status code
                transaction:
                  $ref: '#/components/schemas/Transaction'
              required:
              - code
              - transaction
            type: object
          examples:
            acquiring:
              value:
                code: SUCCESS
                transaction:
                  id: 120059
                  orderId: order-test
                  status:
                    value: SUCCESS
                    date: '2024-12-31T17:00:00+03:00'
                  paymentMethod: acquiring
                  paymentParams:
                    rrn: '935014591810'
                    authCode: 259AA
                  amount: 12500.5
                  comment: Покупка шоколадного торта
                  extra:
                    apiClient: Payform Software
                    apiClientVersion: 1.0.0
            sbp:
              value:
                code: SUCCESS
                transaction:
                  id: 120059
                  orderId: order-test
                  status:
                    value: SUCCESS
                    date: '2024-12-31T17:00:00+03:00'
                  paymentMethod: sbp
                  paymentParams:
                    qrId: AD100051KNSNR64I98CRUJUASC9M72QT
                  amount: 12500.5
                  comment: Покупка шоколадного торта
                  extra:
                    apiClient: Payform Software
                    apiClientVersion: 1.0.0
    Error400Response:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error4xx'
    Error404Response:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error4xx'
    CreateRefundResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: Код состояния http запроса
                x-description-i18n:
                  eng: HTTP request status code
                enum:
                - SUCCESS
                - ERROR
                example: SUCCESS
              amount:
                type: number
                description: Сумма возврата в рублях
                x-description-i18n:
                  eng: Refund amount in rubles
                example: 1200
              refundStatus:
                type: string
                description: Код состояния запроса на возврат
                x-description-i18n:
                  eng: Return Request Status Code
                enum:
                - IN_PROGRESS
                - COMPLETED
                - DECLINED
                example: COMPLETED
              receipt:
                $ref: '#/components/schemas/FiscalReceiptBasicWoRequiredParams'
    GetOrderResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              amount:
                type: number
                description: Сумма заказа
                x-description-i18n:
                  eng: Order amount
                example: 1200
              comment:
                type: string
                description: Комментарий. Не может быть пустым или содержать только пробелы. Может содержать:<br>• Символы латинского алфавита (A–Z и a–z) с десятичными кодами из диапазонов [065-090] и [097-122] в кодировке UTF-8;<br>• Символы русского алфавита (А-Я и а-я) с десятичными кодами из диапазона [1040-1103] в кодировке UTF-8;<br>• Цифры 0-9 с десятичными кодами из диапазона [048-057] в кодировке UTF-8;<br>• Специальные символы с десятичными кодами из диапазонов [032-047], [058-064], [091-096], [123-126] в кодировке UTF-8; - Символ «№» под номером 8470 в кодировке UTF-8
                x-description-i18n:
                  eng: Comment. Cannot be empty or contain only spaces. May contain:<br>• Latin alphabet characters (A–Z and a–z) with decimal codes from the ranges [065–090] and [097–122] in UTF-8 encoding;<br>• Symbols of the Russian alphabet (A-Z and a-ya) with decimal codes from the range [1040-1103] in UTF-8 encoding;<br>• Digits 0-9 with decimal codes from the range [048-057] in UTF-8 encoding;<br>• Special characters with decimal codes from the ranges [032-047], [058-064], [091-096], [123-126] in UTF-8 encoding; - Character "№" under number 8470 in UTF-8 encoding'
                example: Покупка шоколадного торта
              extra:
                type: object
                description: Дополнительные поля в формате key-value. Отображаются в реестрах
                x-description-i18n:
                  eng: Additional fields in key-value format. Displayed in registries
              status:
                type: object
                required:
                - value
                - date
                properties:
                  value:
                    $ref: '#/components/schemas/OrderStatusValue'
                  date:
                    type: string
                    description: Дата создания заказа
                    x-description-i18n:
                      eng: Order date and time. ISO-8601
                    format: date-time
                    example: '2024-12-31T17:45:13+03:00'
              expirationDate:
                type: string
                description: Дата истечения срока заказа
                x-description-i18n:
                  eng: Order date and time. ISO-8601
                format: date-time
                example: '2024-12-31T17:45:13+03:00'
            required:
            - amount
            - status
            - expirationDate
          examples:
            Example 1:
              value:
                amount: 12500.5
                comment: Покупка шоколадного торта
                extra:
                  apiClient: Payform Software
                status:
                  value: NEW
                  date: '2024-12-31T10:00:00+03:00'
                expirationDate: '2024-12-31T17:00:00+03:00'
    GetRefundStatusResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - SUCCESS
                - ERROR
                description: Код состояния http запроса
                x-description-i18n:
                  eng: HTTP request status code
              amount:
                type: number
                description: Сумма возврата в рублях
                x-description-i18n:
                  eng: Refund amount in rubles
                example: 1200
              refundStatus:
                type: string
                description: Код состояния запроса на возврат
                x-description-i18n:
                  eng: Return Request Status Code
                enum:
                - IN_PROGRESS
                - DECLINED
                - COMPLETED
                example: COMPLETED
            required:
            - code
            - amount
            - refundStatus
          examples:
            Example 1:
              value:
                code: SUCCESS
                amount: 1200
                refundStatus: COMPLETED
    Error415Response:
      description: Unsupported Media Type. Check content type in header parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error415'
  requestBodies:
    CreateRefundRequest:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Refund'
            - $ref: '#/components/schemas/RefundWithReceipt'
          examples:
            Возврат без чека:
              value:
                amount: 1200
                paymentDetails: Покупка в магазине №1
            Возврат с чеком (ФФД 1.05):
              value:
                amount: 1200
                paymentDetails: string
                receipt:
                  customer:
                    email: customer@test.ru
                    name: Иванов Иван Иванович
                  items:
                  - name: Шоколадный торт
                    price: 1200
                    quantity: 1
                    amount: 1200
                    paymentObject: COMMODITY
                    paymentMode: FULL_PREPAYMENT
                    measurementUnit: шт
                    nomenclatureCode: 00 00 00 01 00 21 FA 41 00 23 05 41 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 12 00 AB 00
                    vatType: VAT20
            Возврат с чеком (ФФД 1.2):
              value:
                amount: 1200
                paymentDetails: string
                receipt:
                  customer:
                    email: customer@test.ru
                    extra:
                      additionalInfo: Дополнительная информация о покупателе
                  items:
                  - name: Шоколадный торт
                    price: 1200
                    quantity: 1
                    amount: 1200
                    paymentObject: COMMODITY_MARKING_WITH_CODE
                    paymentMode: FULL_PREPAYMENT
                    measurementUnit: PIECE
                    vatType: VAT20
                    marking:
                      code:
                        format: GS1M
                        value: MDEwNDYwNzQyODY3OTA5MDIxNmVKSWpvV0g1NERkVSA5MWZmZDAgOTJzejZrU1BpckFwZk1CZnR2TGJvRTFkbFdDLzU4aEV4UVVxdjdCQmtabWs0PQ==
  schemas:
    FiscalReceiptBasic:
      title: Receipt
      type: object
      x-description-i18n:
        eng: Receipt data
      description: Данные чека. Объект должен быть передан, если подключена фискализация чеков. При отсутствии объекта receipt чек не будет создан. Если объект receipt был передан, но заполнен некорректно, сервис вернет ошибку.
      properties:
        customer:
          type: object
          description: Данные покупателя
          x-description-i18n:
            eng: Buyer details
          properties:
            email:
              type: string
              description: '`Тег ФФД — 1008` <br>

                E-mail покупателя для отправки чека. Если объект customer не передан, то чек отправляется на электронную почту мерчанта'
              x-description-i18n:
                eng: '`Tag FFD - 1008` <br>

                  Buyer''s email for sending a receipt. If the customer object is not passed, the receipt is sent to the merchant''s email

                  '
              example: customer@test.ru
              maxLength: 64
              format: email
            name:
              type: string
              description: '`Тег ФФД — 1227` <br>

                ФИО покупателя (ФФД 1.05)'
              x-description-i18n:
                eng: '`Tag FFD - 1227` <br>

                  Full name of the buyer (FFD 1.05)

                  '
              example: Иванов Иван Иванович
              maxLength: 256
            inn:
              type: string
              description: '`Тег ФФД — 1228` <br>

                ИНН покупателя. Может содержать только 10 или 12 цифр'
              x-description-i18n:
                eng: '`Tag FFD - 1228` <br>

                  Buyer''s tax identification number of 10 or 12 digits'
              pattern: ^(?:[0-9]{10}|[0-9]{12})$
              example: '7707083893'
            extra:
              type: object
              description: Дополнительная информация о покупателе (ФФД 1.2)<br>Объект свободного наполнения, передается в ОФД без изменений. Если Вам необходимо передать доп. данные покупателя в extra, то сверьтесь с протоколом Вашего ОФД
              x-description-i18n:
                eng: Additional information about the buyer (FFD 1.2)<br>An object of free filling, transferred to the OFD without changes. If you need to transfer additional buyer data to extra, then check with the protocol of your OFD
              additionalProperties:
                type: string
          required:
          - email
        timezone:
          type: string
          description: '`Тег ФФД — 1011` <br/>

            Часовая зона (+02:00, +03:00... +11:00). Только для ФФД 1.2'
          x-description-i18n:
            eng: '`Tag FFD - 1011` <br>

              Time zone (+02:00, +03:00... +11:00). Only for FFD 1.2

              '
        onlinePayment:
          type: boolean
          description: '`Тег ФФД — 1125` <br/>

            Признак расчета в Интернете'
          x-description-i18n:
            eng: '`Tag FFD - 1125` <br>

              Internet settlement flag

              '
        items:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 100
          description: Позиции чека
          x-description-i18n:
            eng: Receipt items
          items:
            $ref: '#/components/schemas/receiptItem'
        payments:
          type: array
          uniqueItems: true
          minItems: 1
          description: Данные об оплате<br>Объект заполняется только для чеков с зачетом аванса или частичной предоплаты. Если чек содержит только безналичный вид оплаты (без зачета аванса/частичной предоплаты), то объект payments не заполняется.<br>Если payments не передан, то по умолчанию заполняется безналичным видом оплаты и ее суммой, которая равна сумме чека
          x-description-i18n:
            eng: Payment types info. Object must be passed only for receipts that include prepaid amount (either advance or partial prepayment receipts)<br> If null, then value E_PAYMENT is set by default, with the total receipt amount
          items:
            $ref: '#/components/schemas/payments'
        additionalUserProperty:
          $ref: '#/components/schemas/additionalUserProperty'
      required:
      - items
    FiscalReceiptBasicWoRequiredParams:
      title: ФФД 1.05 | ФФД 1.2
      type: object
      description: Данные чека<br>Объект передается в ответе, только если подключена фискализация и чек был передан в запросе на возврат
      x-description-i18n:
        eng: Receipt data<br>The object is transmitted in the response only if fiscalization is enabled and the receipt was transmitted in the refund request
      properties:
        customer:
          type: object
          description: Данные о покупателе
          x-description-i18n:
            eng: Buyer details
          properties:
            email:
              type: string
              description: '`Тег ФФД — 1008` <br>

                E-mail покупателя для отправки чека'
              x-description-i18n:
                eng: '`Tag FFD - 1008` <br>

                  Buyer''s email for sending a receipt.

                  '
              example: customer@test.ru
              format: email
              maxLength: 64
            name:
              type: string
              description: '`Тег ФФД — 1227` <br>

                ФИО покупателя (ФФД 1.05)'
              x-description-i18n:
                eng: '`Tag FFD - 1227` <br>

                  Full name of the buyer (FFD 1.05)

                  '
              maxLength: 256
              example: Иванов Иван Иванович
            inn:
              type: string
              description: '`Тег ФФД — 1228` <br>

                ИНН покупателя. Может содержать только 10 или 12 цифр'
              x-description-i18n:
                eng: '`Tag FFD - 1228` <br>

                  Buyer''s tax identification number of 10 or 12 digits'
              pattern: ^(?:[0-9]{10}|[0-9]{12})$
              example: '7707083893'
            extra:
              type: object
              description: Дополнительная информация о покупателе (ФФД 1.2)<br>Объект свободного наполнения, передается в ОФД без изменений. Если Вам необходимо передать доп. данные покупателя в extra, то сверьтесь с протоколом Вашего ОФД
              x-description-i18n:
                eng: Additional information about the buyer (FFD 1.2)<br>An object of free filling, transferred to the OFD without changes. If you need to transfer additional buyer data to extra, then check with the protocol of your OFD
        items:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 100
          description: Позиции чека
          x-description-i18n:
            eng: Receipt items
          items:
            $ref: '#/components/schemas/receiptItem'
        payments:
          type: array
          uniqueItems: true
          minItems: 1
          description: Данные об оплате<br>Объект заполняется только для чеков с зачетом аванса или частичной предоплаты. Если чек содержит только безналичный вид оплаты (без зачета аванса/частичной предоплаты), то объект payments не заполняется.<br>Если payments не передан, то по умолчанию заполняется безналичным видом оплаты и ее суммой, которая равна сумме чека
          x-description-i18n:
            eng: Payment types info. Object must be passed only for receipts that include prepaid amount (either advance or partial prepayment receipts)<br> If null, then value E_PAYMENT is set by default, with the total receipt amount
          items:
            $ref: '#/components/schemas/payments'
        additionalUserProperty:
          $ref: '#/components/schemas/additionalUserProperty'
    Error4xx:
      title: Error4xx
      type: object
      properties:
        code:
          type: string
          description: Код ошибки
          x-description-i18n:
            eng: Error code
        message:
          type: string
          description: Описание ошибки
          x-description-i18n:
            eng: Error description
      required:
      - code
      - message
    payments:
      type: object
      title: платежи
      x-title-i18n:
        eng: payments
      required:
      - type
      - amount
      description: Данные об оплате и ее видах
      x-description-i18n:
        eng: Info on payment and its types
      properties:
        type:
          type: string
          description: Вид оплаты. Возможные значения:<br/>• E_PAYMENT – безналичная оплата<br/>• PREPAID – предварительная оплата (зачет аванса и/или предыдущих платежей)
          x-description-i18n:
            eng: Payment type. Valid values:<br/>• E_PAYMENT – electronic payment<br/>• PREPAID – prepaid amount (advance payment and/or previous payments)
          example: PREPAID
          enum:
          - E_PAYMENT
          - PREPAID
        amount:
          type: number
          description: '`Тег ФФД — 1081. Сумма по чеку безналичными` <br/>

            `Тег ФФД — 1251. Сумма по чеку предоплатой (зачетом аванса и(или) предыдущих платежей)` <br/>

