  /v2/transfers/iso20022/unsigned:
    post:
      tags:
      - domestic-payments
      summary: Импорт неподписанного платежа в формате ISO20022
      operationId: unsignedDomesticPayment
      description: 'ВАЖНО: Данный функционал недоступен для клиентов сегмента Финансовые институты!

        Отправка XML-файла с неподписанными платежами.

        Документация по неподписанным платежам на английском,

        Документация по неподписанным платежам на русском,

        XSD-схема для валидации,

        Документация API по ISO XML.'
      parameters:
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        description: XML-документ установленного формата, представляющий данные неподписанного платежного поручения
        content:
          application/xml:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: Задача для рублевого платежа успешно создана
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '413':
          $ref: '#/components/responses/FileIsTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.raiffeisen.ru/domestic-payments
