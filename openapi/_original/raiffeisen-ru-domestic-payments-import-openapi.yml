  /v2/transfers/import/status/{importTaskId}:
    get:
      tags:
      - "domestic-payments"
      summary: "Статус импорта"
      operationId: "getImportStatus"
      description: "ВАЖНО: Данный функционал недоступен для клиентов сегмента Фина\
        нсовые институты!  \nПолучение статуса импорта по идентификатору задачи.\n"
      parameters:
      - name: "importTaskId"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "Идентификатор задачи импорта"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: "Результат импорта"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProcessImportDto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v2/transfers/import/status/{importTaskId}/full:
