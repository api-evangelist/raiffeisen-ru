            <br/>• TERABYTE – терабайт

            <br/>• OTHER – иное

            <br/>Если передано значение не из списка выше, то в ОФД автоматически будет передано OTHER

            '
          x-description-i18n:
            eng: '`The tag FDF — 2108` <br/>

              Unit of measurement of goods, work, services, other payment objects

              <br/> If FFD 1.05, string value up to 16 symbols has to be passed.

              <br/> If FFD 1.2, value from the list is accepted:

