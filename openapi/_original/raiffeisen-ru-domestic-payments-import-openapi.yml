      tags:
      - "domestic-payments"
      summary: "Статус импорта и всех документов"
      operationId: "getImportStatusFull"
      description: "ВАЖНО: Данный функционал недоступен для клиентов сегмента Фина\
        нсовые институты!  \nПолучение статуса импорта и статусов всех связанных д\
        окументов.\n"
      parameters:
      - name: "importTaskId"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "Идентификатор задачи импорта"
      - $ref: "#/components/parameters/IdTokenHeader"
      - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
