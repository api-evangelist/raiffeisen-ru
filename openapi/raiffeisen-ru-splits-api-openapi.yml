        marking:
          type: object
          description: 'Данные маркировки. Только для ФФД 1.2

            <br/>Обязательно к заполнению, если предметом расчета является маркированный товар, который имеет код маркировки''

            '
          x-description-i18n:
            eng: 'Marking data. Relevant for FFD 1.2 only

