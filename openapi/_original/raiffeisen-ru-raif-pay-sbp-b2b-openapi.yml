tags:
- name: testing
  x-displayName: Тестирование СБП
  description: 'Для получения тестовых данных для интеграции напишите на ecom@raiffeisen.ru.

    В ответном письме мы отправим вам токен для авторизации в тестовой среде и два
    счёта для тестирования сервиса.


    Ниже представлены запросы ТОЛЬКО для тестового окружения,

    запросы для продуктового окружения описаны <a href=''https://pay.raif.ru/doc/transfers.html''>тут</a>


    Также для тестовой платы можно использовать R-Future со сканированием qr.

    Для оплаты методом сканирования нужно открыть ссылку imageUrl(в ответе на создание
    qr) или перейти по адресу

    https://pay-test.raif.ru/api/b2b/sbp/v1/qrs/{qrId}/image - появится изображение
    QR

    Далее открыть https://pay-test.raif.ru/pay/rfuture/# нажать кнопку "Сканировать
    QR", навести камеру и

    появится форма оплаты, по которой можно произвести платеж.

    '
