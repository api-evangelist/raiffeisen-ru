    BillDetailsResponse:
      type: "object"
      description: "Детальная информация о счете на оплату"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Идентификатор счета"
          example: "60612e6c-d182-4b59-a868-69714a910ee3"
