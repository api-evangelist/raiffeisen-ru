          example:
          - "AAAAAA"
          items:
            example: "AAAAAA"
            type: "string"
          type: "array"
      - description: "ИНН или наименование покупателя"
        examples:
          inn:
            summary: "Только инн"
            value: "33333333"
          name:
            summary: "Только наименование"
            value: "Ромаш"
        in: "query"
        name: "innOrNameSearchParam"
        required: false
        schema:
          example: "Ромаш"
