- name: authorization
  x-displayName: Авторизация
  description: 'Для авторизации запросов необходим secretKey - секретный ключ, который
    используется для межсервисного взаимодействия.


    Sandbox: https://pay-test.raif.ru


    Production: https://pay.raif.ru


    ВАЖНО: Секретный ключ необходимо хранить в защищённом месте, нельзя публиковать
    на сторонних ресурсах или передавать третьим лицам.


    Межсервисные запросы авторизуются посредством секретного ключа API (SECRET_KEY).
    Параметр авторизации указывается в заголовке Authorization, значение которого
    формируется как \"Bearer SECRET_KEY\".


    Посмотреть боевой publicId и сгенерировать ключи для мерчанта СБП В2В можно в
    [RBO](https://sso.rbo.raiffeisen.ru/signin) → Прием платежей → Настройки, выбрав
    нужно мерчанта.


    <div align=center><a href=''images/createKey.png'' target=''_blank''><img src=''images/createKey.png''/></a></div>


    Для генерации тестового секретного ключа необходимо обратиться по адресу: ecom@raiffeisen.ru

    '
- name: qr-sender
  x-displayName: Методы V1. Платежи по QR
- name: transfers-v2
  x-displayName: Методы V2. Платежи по QR или реквизитам (в разработке)
  description: '**Методы в разработке**


    Методы позволяют создавать и проводить B2B-платежи двумя способами:


    - по QR-коду или платежной ссылке,

    - по банковским реквизитам получателя.


    Способ зависит от значения поля `type` - от него же меняются параметры запроса
    и данные в ответе:


    - `type` = `QR` - платеж по QR-коду или платежной ссылке. Получатель должен заранее
    сформировать их и передать плательщику.

    - `type` = `REQUISITES` - платеж по реквизитам. Получателю не нужно ничего делать
    заранее: плательщик сразу указывает реквизиты счета и формирует платеж.

    '
- name: incoming-statements
  x-displayName: Входящие платежи
