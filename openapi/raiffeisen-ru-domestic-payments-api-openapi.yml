  /v2/transfers/iso20022/{msgId}/status:
    get:
      tags:
      - domestic-payments
      summary: Получение краткой квитанции по пакету платежей в формате ISO20022
      operationId: domesticPackageStatus
      description: 'ВАЖНО: Данный функционал недоступен для клиентов сегмента Финансовые институты!

        Получение краткой квитанции по пакету платежей в формате ISO20022.

        API Документация на английском,

        API Документация на русском.'
      parameters:
      - name: msgId
        in: path
        required: true
        schema:
          type: string
        description: Уникальный идентификатор пакета
        example: ORCRUWIRE0170202229000030
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Статус успешно получен
          content:
            application/xml:
              schema:
                type: string
              examples:
                RJCT:
                  summary: RJCT - Документ отклонен
                  value: '<Document> ... <DtldSts>RJCT</DtldSts> ... </Document>

                    '
                PDNG:
                  summary: PDNG - Документ в очереди на обработку
                  value: '<Document>...<DtldSts>PDNG</DtldSts>...</Document>

                    '
                FSGN:
                  summary: FSGN - Документ ждет отправки
                  value: '<Document> ... <DtldSts>FSGN</DtldSts> ... </Document>

                    '
                ACSP:
                  summary: ACSP - Документ в работе у банка
                  value: '<Document> ... <DtldSts>ACSP</DtldSts> ... </Document>

                    '
                ATTN:
                  summary: ATTN - Требует внимания
                  value: '<Document> ... <DtldSts>ATTN</DtldSts> ... </Document>

                    '
                ACSC:
                  summary: ACSC - Документ исполнен
                  value: '<Document> ... <DtldSts>ACSC</DtldSts> ... </Document>

                    '
                CANC:
                  summary: CANC - Документ отозван
                  value: '<Document> ... <DtldSts>CANC</DtldSts> ... </Document>

                    '
                DBLC:
                  summary: DBLC - Платеж не был создан так как является дубликатом
                  value: '<Document> ... <DtldSts>DBLC</DtldSts> ... </Document>

                    '
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.raiffeisen.ru/domestic-payments
  /v2/transfers/iso20022/{msgId}/status/full:
    get:
      tags:
      - domestic-payments
      summary: Получение полной квитанции по пакету и платежам внутри пакета в формате ISO20022
      operationId: domesticPackageStatusFull
      description: 'ВАЖНО: Данный функционал недоступен для клиентов сегмента Финансовые институты!

        Получение полной квитанции по пакету и платежам внутри пакета в формате ISO20022, подробная информация по каждому платежу в пакете.

        API Документация на английском,

        API Документация на русском.'
      parameters:
      - name: msgId
        in: path
        required: true
        schema:
          type: string
        description: Уникальный идентификатор пакета
        example: ORCRUWIRE0170202229000030
      - $ref: '#/components/parameters/IdTokenHeader'
