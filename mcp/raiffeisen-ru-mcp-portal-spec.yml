info:
  title: "MCP: сценарии, документация и спецификации API Райффайзен Банка"
  version: "0.0.3"
  summary: "Бизнес-сценарии, документация и спецификации API с developer.raif.ru д\
    ля ИИ-ассистентов"
  description: "# Документация API Портала для ИИ-ассистентов\n\nСервис предоставл\
    яет ИИ-ассистентам доступ к материалам, опубликованным на\n[developer.raif.ru](https://developer.raif.ru/):\
    \ документации на русском и английском\nязыках, каталогу бизнес-сценариев, пуб\
    личных API, их операциям и актуальным\nверсиям спецификаций.\n\nСервис работае\
    т по протоколу MCP (Model Context Protocol). MCP позволяет подключать\nвнешние\
    \ источники данных к ИИ-ассистентам: ассистент вызывает доступные инструменты\
    ,\nполучает нужный документ или спецификацию и использует их для ответа на воп\
    рос,\nанализа API или подготовки интеграции.\n\nОбычно работа строится так:\n\n\
    1. Получить список бизнес-сценариев, документов или публичных API.\n2. Выбрать\
    \ сценарий, документ, API либо его вариант по содержимому или идентификатору.\n\
    3. Получить компактный список операций API и при необходимости отфильтровать е\
    го по варианту.\n4. Загрузить полное содержимое документа или спецификации, ко\
    гда требуется полный контракт.\n\nДля этих задач сервер предоставляет семь инс\
    трументов.\n\n## Инструменты\n\n### `list_public_scenarios`\n\nВозвращает полн\
    ый актуальный каталог бизнес-сценариев в том же порядке, что и на публичном По\
    ртале,\nсо всеми полями публичного представления, включая описание для бизнеса\
    \ и разработчика.\nВозвращаются только сценарии на языке, заданном необязатель\
    ным параметром `language`\n(`ru` по умолчанию или `en`), в том числе помеченны\
    е `isDraft`.\nЕсли получить весь каталог не удалось, инструмент возвращает оши\
    бку вместо неполного списка.\n\n**Когда использовать:**\n- Нужно узнать, какие\
    \ задачи бизнеса можно решить с помощью API Банка\n- Нужно выбрать подходящий\
    \ сценарий и изучить его шаги и связанные API\n- Нужно получить актуальный спи\
    сок сценариев на русском или английском языке\n\n---\n\n### `list_public_documentation`\n\
    \nВозвращает упорядоченный список доступных документов с метаданными. Необязат\
    ельный параметр\n`language` ограничивает результат документами на русском (`ru`)\
    \ или английском (`en`) языке.\n\n**Когда использовать:**\n- Нужно узнать, как\
    ие инструкции и справочные материалы доступны\n- Нужно получить `documentId` п\
    еред вызовом `get_public_documentation`\n- Нужно отфильтровать документацию по\
    \ языку\n\n---\n\n### `get_public_documentation`\n\nВозвращает метаданные и по\
    лное исходное содержимое документа по его `documentId`.\n\n**Когда использоват\
    ь:**\n- `documentId` уже получен через `list_public_documentation`\n- Нужен по\
    лный текст инструкции, справочного материала или связанного файла\n\n---\n\n###\
    \ `list_public_apis`\n\nВозвращает полный актуальный каталог публичных API со\
    \ всех страниц API Router.\n\n**Когда использовать:**\n- Нужно узнать, какие п\
    убличные API доступны\n- Нужно получить `apiId` перед поиском вариантов, опера\
    ций или загрузкой спецификации\n\n---\n\n### `list_public_api_variants`\n\nВоз\
    вращает актуальные варианты публичного API по его `apiId`.\n\n**Когда использо\
    вать:**\n- `apiId` уже получен через `list_public_apis`\n- Нужно получить `variantCode`\
    \ перед фильтрацией операций или загрузкой спецификации\n\n---\n\n### `list_public_api_operations`\n\
    \nВозвращает полный список операций публичного API по обязательному `apiId`. Н\
    еобязательный\n`variantCode` ограничивает результат выбранным вариантом.\n\n**К\
    огда использовать:**\n- `apiId` уже получен через `list_public_apis`\n- Нужно\
    \ быстро узнать доступные операции без загрузки полной спецификации\n- Нужно н\
    айти operationId, метод и путь либо отфильтровать операции по `variantCode`\n\n\
    ---\n\n### `get_public_api_specification`\n\nВозвращает полное актуальное соде\
    ржимое спецификации выбранного варианта публичного API\nв исходном формате YAML\
    \ или JSON.\n\n**Когда использовать:**\n- `apiId` и `variantCode` получены чер\
    ез инструменты каталога\n- Нужен полный контракт API для анализа, генерации кл\
    иента или интеграции\n"
