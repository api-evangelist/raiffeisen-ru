openapi: 3.2.0
info:
  title: Торговое Финансирование. Гарантии Issued guarantees API
  description: API для получения информации по выпущенным гарантиям
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/trade-finance
tags:
- name: Issued guarantees
  description: Выпущенные гарантии
paths:
  /v1/guarantees/get-actives-by-cnum:
    post:
      tags:
      - Issued guarantees
      summary: Получение списка активных гарантий
      operationId: getActivesByCnum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActivesByCnumRequest'
        required: true
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuaranteeShortDTO'
              examples:
                simple:
                  summary: Список активных гарантий
                  description: Возвращает список активных гарантий по указанным CNUM
                  value:
                  - number: 70690/GI/250911
                    issueDate: '2025-09-11'
                  - number: 70691/GI/250912
                    issueDate: '2025-09-12'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
  /v1/guarantees/commission/excel:
    post:
      tags:
      - Issued guarantees
      summary: Получение графика комиссий по гарантии в формате Excel
      operationId: getFeesForClientInExcel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeCommissionExcelRequest'
        required: true
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
                format: binary
              examples:
                simple:
                  summary: График комиссии в формате Excel
                  description: Возвращает график комиссии по гарантии в формате Excel
                  value: <binary data>
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
  /v1/guarantees/commission/excel/all:
    post:
      tags:
      - Issued guarantees
      summary: Получение графика комиссий по нескольким гарантиям в формате Excel
      operationId: getAllFeesForClientInExcel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeCommissionExcelRequest'
        required: true
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
                format: binary
              examples:
                simple:
                  summary: Реестр гарантий в формате Excel
                  description: Возвращает реестр гарантий в формате Excel
                  value: <binary data>
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/IdTokenHeader'
  /v1/guarantees/change-log/list:
    get:
      tags:
      - Issued guarantees
      summary: Получение списка изменений по гарантии
      operationId: getChangeLogList
      parameters:
      - name: entityId
        in: query
        required: true
        explode: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuaranteeChangeLogDto'
              examples:
                simple:
                  summary: Список изменений по гарантии
                  description: Возвращает список изменений по указанной гарантии
                  value:
                  - applicationNumber: APP123456
                    applicationDate: '2024-08-30'
                    effectiveDate: '2025-09-11'
                    section: Основные параметры
                    parametrName: Сумма гарантии
                    sectionEn: Main parameters
                    parametrNameEn: Guarantee amount
                    oldValue: 9000.0
                    newValue: 10115.0
                    isSeparate: false
                    isFromTfo: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/guarantees:
    post:
      tags:
      - Issued guarantees
      summary: Получение списка гарантий по CNUM и фильтру
      operationId: getAllByFilterAndCNum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeFilterRequest'
        required: true
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteesResponse'
              examples:
                simple:
                  summary: Список гарантий по CNUM и фильтру
                  description: Возвращает список гарантий по указанным CNUM и фильтру
                  value:
                    offset: 0
