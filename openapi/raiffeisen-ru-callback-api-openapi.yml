  CallbackPaymentGeneral:
    post:
      summary: Уведомление об оплате (v2)
      x-summary-i18n:
        eng: Payment notification (v2)
      operationId: callbackPaymentGeneral
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotificationV2'
            examples:
              sbp:
                $ref: '#/components/examples/PaymentNotificationV2SBP'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Api-Signature-SHA256
        description: Заполняется подписью, полученной алгоритмом HMAC-SHA-256 с использованием выбранного секретного ключа и контрольной строки
        x-description-i18n:
          eng: Filled with a signature obtained by the HMAC-SHA-256 algorithm using the selected secret key and control string
        required: true
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  CallbackPaymentOld:
    post:
      summary: Уведомление об оплате (v1)
      x-summary-i18n:
        eng: Payment notification (v1)
      operationId: callbackPaymentOld
      tags:
      - Callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotificationV1'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Api-Signature-SHA256
        description: Заполняется подписью, полученной алгоритмом HMAC-SHA-256 с использованием выбранного секретного ключа и контрольной строки
        x-description-i18n:
          eng: Filled with a signature obtained by the HMAC-SHA-256 algorithm using the selected secret key and control string
        required: true
    servers:
    - url: https://pay.raif.ru/api
      description: Production
    - url: https://pay-test.raif.ru/api
      description: Sandbox
  CallbackRefund:
