      value:
        accountKeys:
        - 40701978200000000001:401867
        - 40701978200000000001:401867
        from: '2023-10-06'
        to: '2023-10-06'
        zero: true
        fileName: file
        intraday: true
        debitCreditFilter: DEBIT
        includeHolds: true
        encoding: WINDOWS
        splitBy: ACCOUNT_DATE
        zeroIfNoStatementExpected: true
        sort:
        - sortBy: DEBIT
