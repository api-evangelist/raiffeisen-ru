    '
- name: splits
  x-displayName: Разделение платежа (Сплитование)
  description: 'Этот раздел позволяет вам удобно управлять распределением денег при
    получении денежных средств через СБП B2B.

    Вы можете создать заказ и указать, на какие счета и в каком объёме нужно зачислить
    полученные средства — как внутри нашего банка, так и в другие банки.


    Например:

    Вы получаете оплату от клиента, и деньги автоматически распределяются между несколькими
    контрагентами. Или вся сумма направляется на один счёт — ваш или вашего партнёра
    в любом банке.


    Для управления счетами можно воспользоваться методом [API](#tag/applications)
    или обратиться в техническую поддержку банка: ecom@raiffeisen.ru.


    Денежные средства распределяются на счета контрагентов на следующий день после
    совершения платежа.


    <a href=''images/b2b-order-splits.svg'' target=''_blank''><img src=''images/b2b-order-splits.svg''></a>

    '
- name: applications
  x-displayName: Заявки для счетов со сплитованием
- name: rp-accounting
  x-displayName: Счета для сплитования
- name: callback
  x-displayName: Уведомления об операциях
  description: 'Для информирования клиента о проведённых платежах могут использоваться
    HTTP-уведомления на адрес, указанный в его настройках.


    Боевой адрес можно указать в [личном кабинете](https://www.rbo.raiffeisen.ru/acquiring/mcp#/)
    во вкладке "Прием платежей"


    <div align=center><a href=''images/callback.png'' target=''_blank''><img src=''images/callback.png''></a></div>


    Также адрес для тестовой и боевой среды можно указать с помощью [метода в API](#operation/createCallback).


    Для партнёра уведомление представляет собой входящий POST-запрос, который использует
    JSON-структуру.


    Уведомление считается принятым, если получатель ответил на запрос кодом HTTP 200.


    Ответы с любыми другими HTTP-кодами будут считаться невалидными. Повторные попытки
    отправки будут проводиться с интервалами: 5 сек, 1 мин, 12 мин и 2 ч 24 мин


    Для проверки подлинности уведомления по Заказу и Многоразовой платежной ссылке
    к данным добавляется подпись в заголовке ```X-Api-Signature-SHA256```

    , полученная на основе общего секретного ключа и контрольной строки ```id|qr.id|payment.id|payment.status.value|payment.amount|payment.status.date```

    с помощью HMAC-SHA-256.


    Необходимо проверять сумму для проверки корректности уведомления.


    Уведомления отправляются с IP 193.28.44.23

    '
- name: report-standard
  x-displayName: Реестр
  description: 'Реестры по платежам отправляются на ежедневной, еженедельной, ежемесячной
    основе, в зависимости от выставленной настройки. В РБО -> Прием платежей -> Реестры


    <a href=''https://help.pay.raif.ru/sbp/rbo/reports''>Инструкция по настройке реестров</a>


    В случае отсутствия операций за день, реестр на следующий день не отправляется.


    Формат реестра:


    Наименование колонки | Значение

    --------|------------------

    Мерчант | Идентификатор в системе СБП

    Дата операции МСК | Дата и время проведения операции (МСК)

    ID платежной ссылки | Уникальный идентификатор платежной ссылки (qrId)

    ID операции | Внутренний идентификатор платежа

    ID операции НСПК | Идентификатор операции в системе НСПК

    ID заказа | Уникальный идентификатор заказа в системе партнёра

    Основание операции в выписке | Назначение платежа в выписке получателя

    Назначение платежа | Расширенное Назначение Платежа

    Сумма | Сумма Операции

    НДС | Сумма НДС

    Дополнительные поля | Дополнительные поля, указанные получателем (extra)

    Комиссия | Комиссия за транзакцию

    Наименования плательщика | Наименование Юридического Лица Плательщика

    Банковский счёт плательщика | Номер банковского счета Плательщика

    ИНН плательщика | Идентификационный номер налогоплательщика Плательщика

    ID банка плательщика | Идентификатор Банка Плательщика

    Наименование банка плательщика | Наименование Банка Плательщика

    Бик банка плательщика | Банковский Идентификационный Код Банка Плательщика


    <a download='''' target=''_blank'' href=''images/B2BReport-standard.csv''>Пример
    реестра в кодировке WIN-1251 для Windows систем</a>


    <a download='''' target=''_blank'' href=''images/B2BReport-standard-utf8.csv''>Пример
    реестра в кодировке UTF-8 для UNIX систем</a>

    '
