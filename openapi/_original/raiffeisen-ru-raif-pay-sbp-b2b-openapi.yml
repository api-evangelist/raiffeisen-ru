            точному времени или часовому поясу

            <br>Параметр не может быть меньше текущей даты и времени

            <br>После истечения срока действия многоразовой платежной ссылки оплату
            по ней провести нельзя

            <br>При передачи количества минут указываете в таком виде (например, +
            60 минут): "expirationDate": "+60m"

            '
        redirectUrl:
          allOf:
          - $ref: '#/components/schemas/RedirectUrl'
        restrictions:
          allOf:
          - $ref: '#/components/schemas/Restrictions'
