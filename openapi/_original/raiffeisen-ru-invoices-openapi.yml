      - $ref: "#/components/schemas/AbstractClosingDocumentRequest"
      - type: "object"
        properties:
          goods:
            $ref: "#/components/schemas/GoodsRequest"
            description: "Товары"
          additionalInfo:
            $ref: "#/components/schemas/AdditionalInfoRequest"
            description: "Дополнительная информация"
          seller:
            $ref: "#/components/schemas/SellerRequest"
            description: "Продавец"
          consignor:
            $ref: "#/components/schemas/ConsignorRequest"
            description: "Отправитель груза. Поле обязательно, если seller.consignor\
              \ = false"
          buyer:
            $ref: "#/components/schemas/BuyerRequest"
            description: "Покупатель"
          receiver:
            $ref: "#/components/schemas/ReceiverRequest"
            description: "Получатель груза. Поле обязательно, если buyer.receiver\
              \ = false"
          bills:
            type: "array"
            description: "Связанные счета"
            items:
              type: "string"
              format: "uuid"
            uniqueItems: true
            example:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
