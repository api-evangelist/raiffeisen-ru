      schema:
        type: integer
        minimum: 0
      example: 10
    AcceptCharset:
      name: Accept-Charset
      in: header
      required: false
      description: 'Позволяет клиенту выбрать кодировку символов в ответе.

        Если заголовок не передан, используется кодировка по умолчанию (UTF-8).

        '
      schema:
        type: string
        enum:
        - UTF-8
        - Windows-1251
        - CP866
        default: UTF-8
      example: UTF-8
      x-description-i18n:
        eng: 'Allows the client to select the character encoding in the response.

          If the header is not provided, the default encoding (UTF-8) is used.

          '
    ContentTypeCharset:
      name: Content-Type
      in: header
      required: false
      description: 'Тип содержимого запроса с указанием кодировки символов тела запроса.

        Сервер декодирует тело запроса в соответствии с указанным charset.

        '
      schema:
        type: string
        enum:
        - application/json; charset=UTF-8
        - application/json; charset=Windows-1251
        - application/json; charset=CP866
        default: application/json; charset=UTF-8
      example: application/json; charset=UTF-8
      x-description-i18n:
        eng: 'Request content type with character encoding of the request body.

          The server decodes the request body according to the specified charset.

          '
    PayoutStatuses:
      name: status
      in: query
      description: Запрашиваемые статусы выплат
      schema:
        type: string
        enum:
        - ON_SIGNING
        - COMPLETED
        - DECLINED
        - IN_PROGRESS
        - PENDING
        - DRAFT
        - WAITING_CONFIRMATION
        - WAITING_INCOME_REGISTRATION
        - WAITING_RECEIPT_RELEASING
        - WAITING_RECEIPT_CANCELLATION
        - READY_TO_PROCESS
      example: IN_PROGRESS
    BundleStatus:
      name: status
      in: query
      description: 'Запрашиваемые статусы реестров:<br/>

        • COMPLETED_WITH_ERRORS – операция выполнена, не все выплаты имеют статус SUCCESS.<br/>

        • IN_PROGRESS – обработка операции, промежуточный статус.<br/>

        • COMPLETED – операция выполнена, все выплаты в статусе COMPLETED.<br/>

        • DECLINED – операция не выполнена, финальный статус.<br/>

        • DRAFT – в статусе черновик, ожидает подписания.<br/>

        • ON_SIGNING – в статусе подписания.<br/>

        • ARCHIVED – в статусе в архиве.<br/>'
      schema:
        enum:
        - ON_SIGNING
        - COMPLETED_WITH_ERRORS
        - IN_PROGRESS
        - DECLINED
        - COMPLETED
        - DRAFT
        - ARCHIVED
        example: IN_PROGRESS
    Sort:
