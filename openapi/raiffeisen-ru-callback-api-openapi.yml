components:
  schemas:
    PaymentNotificationDataV3:
      title: PaymentNotificationDataV3
      type: object
      properties:
        id:
          type: string
          description: Идентификатор платежа
          x-description-i18n:
            eng: Payment ID
          pattern: ^[A-Za-z0-9-_.]+$
        publicId:
          type: string
          description: Идентификатор мерчанта в системе Банка
          x-description-i18n:
            eng: Merchant ID in the bank system
        amount:
          type: number
          description: Сумма платежа в рублях. Для копеек доступно два знака после точки.
          x-description-i18n:
            eng: Payment amount in rubles. Two decimal places are available for kopecks.
        order:
          type: object
          properties:
            id:
              type: string
              description: Идентификатор заказа в системе мерчанта
              x-description-i18n:
                eng: Order ID in the merchant system
            comment:
              $ref: '#/components/schemas/OrderComment'
        status:
          type: object
          description: Статус платежа
          x-description-i18n:
            eng: Payment status
          required:
          - value
          - date
          properties:
            value:
              $ref: '#/components/schemas/PaymentStatus'
            date:
              type: string
              format: date-time
              description: Дата и время создания платежа
              x-description-i18n:
                eng: Payment creation date and time
            declineReason:
              type: string
              description: Причина отклонения. Указывается в случае отклонения операции.
              x-description-i18n:
                eng: Reason for rejection. Specified if the operation is declined.
        extra:
          type: object
          description: Дополнительные поля в формате key-value
          x-description-i18n:
            eng: Additional fields in key-value format
          additionalProperties:
            type: string
        subscription:
          type: object
          description: Блок информации о подписке. Заполняется для платежей, которые были проведены по сценарию оплаты по подписке.
          x-description-i18n:
            eng: Subscription information block. Filled in for payments made via the subscription payment scenario.
          properties:
            id:
              type: string
              description: Идентификатор подписки
              x-description-i18n:
                eng: Subscription ID
              pattern: ^[A-Za-z0-9-_.]+$
            purpose:
              type: string
              description: Описание подписки
              x-description-i18n:
                eng: Subscription description
          required:
          - id
      required:
      - id
      - publicId
      - amount
      - order
      - status
    SubscriptionNotificationV2:
      title: SubscriptionNotificationV2
      description: Уведомление о подписке (v2)
      x-description-i18n:
        eng: Subscription notification (v2)
      type: object
      properties:
        event:
          type: string
          enum:
          - SUBSCRIPTION
          description: Тип сообщения
          x-description-i18n:
            eng: Message type
        data:
          oneOf:
          - $ref: '#/components/schemas/SbpSubscriptionNotificationV2'
          - $ref: '#/components/schemas/CardSubscriptionNotificationV2'
          discriminator:
            propertyName: paymentMethod
            mapping:
              SBP: '#/components/schemas/SbpSubscriptionNotificationV2'
              ACQUIRING: '#/components/schemas/CardSubscriptionNotificationV2'
          type: object
          properties:
            paymentMethod:
              $ref: '#/components/schemas/schemas-PaymentMethod'
          description: Данные о подписке
          x-description-i18n:
            eng: Subscription data
      required:
      - event
      - data
    AcquiringStatusImplementation:
      title: AcquiringStatusImplementation
      discriminator:
        propertyName: value
        mapping:
          COMPLETED: '#/components/schemas/SuccessRefundCallback'
          DECLINED: '#/components/schemas/DeclinedAcquiringRefundCallback'
      oneOf:
      - $ref: '#/components/schemas/SuccessRefundCallback'
      - $ref: '#/components/schemas/DeclinedAcquiringRefundCallback'
      description: Статус возврата эквайринга
      x-description-i18n:
        eng: Acquiring refund status
    OrderComment:
      title: OrderComment
      type: string
      description: 'Комментарий. Доступен в реестрах и Онлайн-Банке. Не может быть пустым или содержать только пробелы. Может содержать:<br>

        • Символы латиницы (A–Z и a–z) <br>

        • Символы кириллицы (А-Я и а-я) <br>

        • Цифры 0-9 <br>

        • Спецсимволы: пробел и `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`<br>

        • Спецсимвол `№`'
      x-description-i18n:
        eng: 'Comment. Cannot be empty or contain only spaces. May contain:<br>

          • Latin symbols (A–Z и a–z); <br>

          • Cyrillic symbols (А-Я и а-я); <br>

          • Digits 0-9;<br>

          • Special symbols: spaces and `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`<br>

          • Special symbol №

          '
      maxLength: 140
      pattern: ^(?=.*\S)[A-Za-zА-Яа-яЁё0-9 !"#$%''()*+,\-./:;=>?@\[\\\]\^_`{\|}~№]+$
      example: Тестовый комментарий
    PaymentNotificationV3:
      title: PaymentNotificationV3
      type: object
      properties:
        event:
          type: string
          enum:
          - PAYMENT
          description: Тип сообщения
          x-description-i18n:
            eng: Message type
        data:
          oneOf:
          - $ref: '#/components/schemas/CardPaymentNotificationV3'
          - $ref: '#/components/schemas/SbpPaymentNotificationV3'
          - $ref: '#/components/schemas/DigitalRublePaymentNotificationV3'
          discriminator:
            propertyName: paymentMethod
            mapping:
              ACQUIRING: '#/components/schemas/CardPaymentNotificationV3'
              SBP: '#/components/schemas/SbpPaymentNotificationV3'
              DIGITAL_RUBLE: '#/components/schemas/DigitalRublePaymentNotificationV3'
          type: object
          properties:
            paymentMethod:
