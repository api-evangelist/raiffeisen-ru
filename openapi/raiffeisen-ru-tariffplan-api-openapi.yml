                        state:
                          status: APPROVED
                          statusDate: '2025-10-16T12:00:01.024991'
                          errors: []
                          cqrsVersion: 1742767789
                      state:
                        status: APPROVED
                        statusDate: '2025-10-16T12:00:01.024991'
                        errors: []
                        cqrsVersion: 1742767789
                    offset: 0
                    limit: 1
                    totalCount: 1
                one-with-only-required-tariffs:
                  description: Один тарифный план. У данного тарифного плана задан только обязательный тип тарифов. Такой результат возможен при указании contractId
                  summary: Тарифный план с обязательными тарифами
                  value:
                    tariffPlans:
                    - id: e2430cd0-6a91-4fd7-92fa-191a0857cb72
                      contractId: 4d8c17f5-c954-499d-bb6c-15bd9518c457
                      financingTariffs:
                      - id: afc37b8f-f166-497c-a967-da7da7278c01
                        type: FOR_FINANCE_PERCENT
                        deferralFeeValue: 0.9876
                        additionalPeriodFeeValue: 0.8765
                        waitingPeriodFeeValue: 0.7654
                        startDate: '2025-10-12'
