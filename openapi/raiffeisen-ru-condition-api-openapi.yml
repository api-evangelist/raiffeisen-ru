  /v1/conditions/{id}/sign:
    post:
      description: Метод перевода условия обслуживания из статуса DRAFT в статус SENT_TO_SIGN
      operationId: sendConditionToSign
      parameters:
      - description: Идентификатор условий обслуживания
        in: path
