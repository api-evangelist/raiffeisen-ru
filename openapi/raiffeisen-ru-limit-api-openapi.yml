openapi: 3.2.0
info:
  title: Raiffeisen Ru Limit API
  version: 1.0.0
  description: 'Operations tagged Limit across 2 of this provider''s published API definitions: raiffeisen-ru-agency-factoring-openapi.yml, raiffeisen-ru-agency-factoring-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.raiffeisen.ru/payables-financing
tags:
- description: Лимит
  name: Limit
paths:
  /v1/limits:
    get:
      description: Метод получения лимита
      operationId: getLimits
      parameters:
      - description: Клиентский номер (CNUM)
        in: query
        name: cnums
        required: false
        schema:
          example: AAABBB
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Одобренный
                  value:
                  - principal:
                      ogrn: '1027739326449'
                      shortNameRus: АО Ромашка
                      cqrsVersion: -1628796591
                      inn: '7744000302'
                      kpp: '770401001'
                      id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                      state:
                        statusDate: '2021-07-10T06:53:37.433111Z'
                        errors: []
                        status: APPROVED
                      fullNameEng: Joint Stock Chamomile
                      cnum: AA10AA
                      fullNameRus: Акционерное общество Ромашка
                    rest: 90.0
                    amount: 100.01
                    cqrsVersion: -1628796591
                    id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                    used: 10.01
                    state:
                      statusDate: '2021-07-10T06:53:37.433111Z'
                      errors: []
                      status: APPROVED
                    currencyCode: RUB
              schema:
                $ref: '#/components/schemas/LimitListResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERR_5001
                    message: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получения лимита
      tags:
      - Limit
    servers:
    - url: https://api.raiffeisen.ru/payables-financing
components:
