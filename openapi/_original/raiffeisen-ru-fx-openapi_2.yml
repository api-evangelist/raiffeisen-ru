                settlCurrency:
                  type: "string"
                  description: "Валюта счёта расчёта курсовой разницы. Указывать т\
                    олько для settlMethod \"NON_DELIVERABLE\" в одной из валют sellCurrency/buyCurrency"
                  example: "RUB"
                fixingReferenceType:
                  type: "string"
                  description: "Источник фиксинга. Для DELIVERABLE опциона не пере\
                    давать"
                  example: "CBRF_FIXING"
                  enum:
                  - "CBRF_FIXING"
                  - "RAIF_FIXING"
            examples:
              Пример CALL опциона:
                summary: "Пример беспоставочного опциона"
                value:
                  sellCurrency: "USD"
                  buyCurrency: "RUB"
                  amount: 5000
                  side: "SELL"
                  optionSide: "BUY"
                  strike: 90
                  valueDate: "2025-11-19"
                  dateOfPremium: null
                  endorsementType: "OTP"
                  premiumCurrency: "RUB"
                  settlMethod: "NON_DELIVERABLE"
                  settlCurrency: "RUB"
                  fixingReferenceType: "CBRF_FIXING"
              Пример PUT опциона:
                summary: "Пример поставочного опциона"
                value:
                  sellCurrency: "EUR"
                  buyCurrency: "USD"
                  amount: 20000.5
                  side: "BUY"
                  optionSide: "SELL"
                  strike: 100.5474
                  valueDate: "2025-12-15"
                  dateOfPremium: "TRADE_DATE"
                  endorsementType: "CRYPTO_PRO"
                  premiumCurrency: "EUR"
                  settlMethod: "DELIVERABLE"
        required: true
      responses:
        "200":
          description: "Опционная премия по запрошенным параметрам"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "result"
                - "requestId"
                properties:
                  result:
                    type: "object"
                    description: "Результат запроса опционной премии"
                    required:
                    - "quoteId"
                    - "currencyPair"
                    - "optionType"
                    - "sellAmount"
                    - "sellCurrency"
                    - "buyAmount"
                    - "buyCurrency"
                    - "premiumAmount"
                    - "premiumPercent"
                    - "premiumCurrency"
                    - "strike"
                    - "strikeDecimalPlaces"
                    - "expiryDate"
                    - "valueDate"
                    - "tradeDate"
                    - "ttl"
                    - "tradeable"
                    properties:
                      quoteId:
                        type: "string"
                        description: "Идентификатор квоты"
                        example: "4394e69f995f11f0a9bef9063f1c899a"
                      currencyPair:
                        type: "string"
                        description: "Валютная пара опциона"
                        example: "EUR/RUB"
                      optionType:
                        type: "string"
                        description: "Тип опциона"
                        example: "CALL"
                        enum:
                        - "CALL"
                        - "PUT"
                      sellAmount:
                        type: "string"
                        description: "Сумма на списание со стороны клиента"
                        example: 600.0
                      sellCurrency:
                        type: "string"
                        description: "Валюта суммы на списание со стороны клиента"
                        example: "RUB"
                      buyAmount:
                        type: "string"
                        description: "Сумма на зачисление со стороны клиента"
                        example: 6.0
                      buyCurrency:
                        type: "string"
                        description: "Валюта суммы на зачисление со стороны клиент\
                          а"
                        example: "EUR"
                      premiumAmount:
                        type: "string"
                        description: "Сумма премии"
                        example: 24.37
                      premiumPercent:
                        type: "string"
                        description: "Премия в процентах"
                        example: 4.06
                      premiumCurrency:
                        type: "string"
                        description: "Валюта премии"
                        example: "RUB"
                      strike:
                        type: "string"
                        description: "Цена исполнения"
                        example: 100.0
                      strikeDecimalPlaces:
                        type: "integer"
                        description: "Количество знаков после запятой цены исполне\
                          ния"
                        example: 4
                      expiryDate:
                        type: "string"
                        format: "date"
                        description: "Дата истечения срока опциона"
                        example: "2025-09-29"
                      valueDate:
                        type: "string"
                        format: "date"
                        description: "Дата платежа опциона"
                        example: "2025-09-30"
                      tradeDate:
                        type: "string"
                        format: "date-time"
                        description: "Дата запроса премии"
                        example: "2025-09-24T15:58:08.326844099Z"
                      ttl:
                        type: "integer"
                        description: "Срок жизни премии в мс"
                        example: 10000
                      tradeable:
                        type: "boolean"
                        description: "Признак, что торговля разрешена"
                        example: true
                  requestId:
                    type: "string"
                    description: "Идентификатор запроса для трейсинга"
        "400":
          description: "Некорректный запрос"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "error"
                - "requestId"
                properties:
                  error:
                    type: "object"
                    description: "Объект с кодом ошибки"
                    required:
                    - "code"
                    properties:
                      code:
                        type: "string"
                        description: "Значение кода ошибки"
                        example: "app.invalid.request"
                      message:
                        type: "string"
                        description: "Описание кода ошибки"
                        example: "Bad Request"
                      data:
                        type: "array"
                        description: "Дополнительная информация об ошибке"
                        items:
                          type: "object"
                          properties:
                            field:
                              type: "string"
                              description: "Параметр"
                            value:
                              type: "string"
                              description: "Значение параметра"
                  requestId:
                    type: "string"
                    description: "Идентификатор запроса"
                    example: "c396fda4d36c4f12"
              examples:
                Некорректный запрос:
                  summary: "Некорректный запрос"
                  value:
                    error:
                      code: "app.invalid.request"
                      message: "Bad Request"
                    requestId: "c396fda4d36c4f12"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "Бизнес-ошибки"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "error"
                - "requestId"
                properties:
                  error:
                    type: "object"
                    description: "Объект с кодом ошибки"
                    required:
                    - "code"
                    properties:
                      code:
                        type: "string"
                        description: "Значение кода ошибки"
                      message:
                        type: "string"
                        description: "Описание кода ошибки"
                  requestId:
                    type: "string"
                    description: "Идентификатор запроса"
              examples:
                Опционы выключены для клиента:
                  summary: "Запрос опционной премии выключен"
                  value:
                    error:
                      code: "options.disabled"
                    requestId: "c396fda4d36c4f12"
                Запрос вне часов торговли:
                  summary: "Запрос был произведен вне часов торговли"
                  value:
                    error:
                      code: "options.invalid.trading.time.outside.trading.hours"
                    requestId: "c396fda4d36c4f12"
                Запрос в нерабочий день:
                  summary: "Запрос был произведен в праздники"
                  value:
                    error:
                      code: "options.invalid.trading.time.holiday"
                    requestId: "c396fda4d36c4f12"
                Запрошенная сумма превышает допустимый порог лимита:
                  summary: "Запрошенная сумма превышает допустимый порог объема"
                  value:
                    error:
                      code: "options.requested.amount.too.high"
                    requestId: "c396fda4d36c4f12"
                Запрошенная сумма после округления равна 0:
                  summary: "Запрошенная сумма меньше допустимого объема"
                  value:
                    error:
                      code: "options.requested.amount.too.low"
                    requestId: "c396fda4d36c4f12"
                Запрошенная сумма после пересчёта из котируемой в базовую и округления равна 0:
                  summary: "Запрошенная сумма меньше допустимого объема"
                  value:
                    error:
                      code: "options.opposite.amount.too.low"
                    requestId: "c396fda4d36c4f12"
                Неподдерживаемая валютная пара:
                  summary: "Неподдерживаемая валютная пара"
                  value:
                    error:
                      code: "options.unsupported.currency.pair"
                    requestId: "c396fda4d36c4f12"
                Некорректная дата платежа:
                  summary: "Некорректная дата платежа"
                  value:
                    error:
                      code: "options.value.date.invalid"
                    requestId: "c396fda4d36c4f12"
                Получилась нулевая премия:
                  summary: "Получилась нулевая премия по условиям опциона"
                  value:
                    error:
                      code: "options.premium.zero"
                    requestId: "c396fda4d36c4f12"
                Страйк слишком высокий:
                  summary: "Страйк выше ожидаемого значения"
                  value:
                    error:
                      code: "options.strike.too.high"
                    requestId: "c396fda4d36c4f12"
                Страйк слишком низкий:
                  summary: "Страйк ниже ожидаемого значения"
                  value:
                    error:
                      code: "options.strike.too.low"
                    requestId: "c396fda4d36c4f12"
                Неизвестная ошибка прайсера:
                  summary: "Неизвестная ошибка"
                  value:
                    error:
                      code: "options.option.pricer.unknown.error"
                    requestId: "c396fda4d36c4f12"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    Unauthorized:
      description: "Аутентификация не пройдена"
    InternalError:
      description: "Внутренняя ошибка"
  parameters:
    IdTokenHeader:
      name: "Id-Token"
      in: "header"
      description: "Идентификационный токен пользователя"
      required: true
      schema:
        type: "string"
        format: "byte"
        example: "SUQgVE9LRU4gRk9SIFRFU1RJTkc="
    AuthorizationHeader:
      name: "Authorization"
      in: "header"
      description: "Токен доступа"
      required: true
      schema:
        type: "string"
        format: "byte"
        example: "Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc="
  schemas:
    DeliverableConversionBlotterRequest:
      type: "object"
      required:
      - "offset"
      - "limit"
      properties:
        offset:
          type: "integer"
          description: "Значение смещения строк из истории"
        limit:
          type: "integer"
          description: "Ограничение на количество строк из истории, не более 1000\
            \ записей в одном запросе"
        filter:
          type: "array"
          description: "Объект с параметрами фильтрации.\nДоступные фильтры (property):\n\
            - id — номер заявки\n- creationDate — дата создания (from/to)\n- processingDate\
            \ — дата обработки (from/to)\n- sendDate — дата отправления (from/to)\n\
            - creator.signer.name — автор\n- tradeDate — дата заключения сделки (from/to)\n\
            - clientBuyAccount.currency — валюта зачисления\n- clientSellAccount.currency\
            \ — валюта списания\n- clientBuyAmount — сумма зачисления\n- clientSellAmount\
            \ — сумма списания\n- price — обменный курс\n- participant.signer.name\
            \ — подписант\n- comment — заметка\n- status — статус"
          items:
            $ref: "#/components/schemas/BlotterFilterItem"
        sort:
          type: "array"
          description: "Объект с параметрами сортировки"
          items:
            $ref: "#/components/schemas/BlotterSortItem"
    BlotterSortItem:
      type: "object"
      properties:
        property:
          type: "string"
          description: "Объект с параметрами сортировки.\nДоступные паарметры (property):\n\
            - creationDate\n- sendDate\n- processingDate\n- creator.signer.name"
        direction:
          type: "string"
          description: "Направление сортировки, с возможными значениями \"ASC\" ил\
            и \"DESC\""
          enum:
          - "ASC"
          - "DESC"
    BlotterFilterItem:
      type: "object"
      required:
      - "property"
      - "clause"
      properties:
        property:
          type: "string"
          description: "Параметр фильтрации"
          enum:
          - "id"
          - "creationDate"
          - "processingDate"
          - "sendDate"
          - "creator.signer.name"
          - "tradeDate"
          - "clientBuyAccount.currency"
          - "clientSellAccount.currency"
          - "clientBuyAmount"
          - "clientSellAmount"
          - "price"
          - "participant.signer.name"
          - "comment"
          - "status"
        clause:
          type: "array"
          description: "Значение фильтра"
    DeliverableConversionBlotterResponse:
      type: "object"
      required:
      - "result"
      - "requestId"
      properties:
        result:
          type: "object"
          description: "Объект с результатом исполнения запроса"
          required:
          - "hasMore"
          - "list"
          properties:
            hasMore:
              type: "boolean"
              description: "Признак наличия других записей в истории, удовлетворяю\
                щих параметрам запроса"
            list:
              type: "array"
              description: "Массив истории подтверждений сделок"
              items:
                $ref: "#/components/schemas/DeliverableConversionBlotterItem"
        requestId:
          type: "string"
          description: "Идентификатор запроса"
    DeliverableConversionBlotterItem:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Идентификатор записи"
        clientBuyAccount:
          type: "object"
          description: "Объект с информацией о счете покупки"
          required:
          - "number"
          - "currency"
          - "accountType"
          - "trustManagementName"
          properties:
            number:
              type: "string"
              description: "Номер счета покупки"
              example: 12334
            currency:
              type: "object"
              description: "Валюта счета покупки"
              required:
              - "isoCode"
              - "numericCode"
              properties:
                isoCode:
                  type: "string"
                  example: "RUB"
                numericCode:
                  type: "string"
                  example: 643
            accountType:
              type: "string"
              description: "Тип счета (INTERNAL/EXTERNAL)"
              example: "EXTERNAL"
            trustManagementName:
              type: "string"
              description: "Наименование управляющей компании"
              example: null
        clientSellAccount:
          type: "object"
          description: "Объект с информацией о счете продажи"
          required:
          - "number"
          - "currency"
          - "accountType"
          - "trustManagementName"
          properties:
            number:
              type: "string"
              description: "Номер счета продажи"
              example: 40817840000000382729
            currency:
              type: "object"
              description: "Валюта счета продажи"
              required:
              - "isoCode"
              - "numericCode"
              properties:
                isoCode:
                  type: "string"
                  example: "USD"
                numericCode:
                  type: "string"
                  example: 840
            accountType:
              type: "string"
              description: "Тип счета (INTERNAL/EXTERNAL)"
              example: "INTERNAL"
            trustManagementName:
              type: "string"
              description: "Наименование управляющей компании"
              example: null
        clientSellAmount:
          type: "string"
          description: "Сумма продажи"
        clientBuyAmount:
          type: "string"
          description: "Сумма покупки"
        creationDate:
          type: "string"
          description: "Дата создания подтверждения (ISO 8601)"
          example: "2025-07-22T13:23:13.507701Z"
        tradeDate:
          type: "string"
          description: "Дата заключения сделки (ISO 8601)"
          example: "2025-07-22T13:23:13.507701Z"
        valueDate:
          type: "string"
          description: "Дата расчетов по сделке (ISO 8601)"
          example: "2025-07-22T13:23:13.507701Z"
        sendDate:
          type: "string"
          description: "Дата подписания подтверждения (ISO 8601)"
          example: "2025-07-22T13:23:13.507701Z"
        processingDate:
          type: "string"
          description: "Дата исполнения подтверждения (ISO 8601)"
          example: "2025-07-22T13:27:04.747733Z"
        price:
          type: "string"
          description: "Обменный курс"
        creator:
          type: "object"
          description: "Информация о создателе сделки"
          required:
          - "id"
          - "name"
          properties:
            id:
              type: "string"
              description: "Идентификатор создателя"
              example: "organization.user.authority.external.id"
            name:
              type: "string"
              description: "ФИО создателя"
              example: "Вячеславов Александр Михайлович"
        traders:
          type: "array"
          description: "Список подписантов сделки"
          items:
            type: "object"
            properties:
              id:
                type: "string"
                description: "Идентификатор подписанта"
                example: "organization.user.authority.external.id"
              name:
                type: "string"
                description: "ФИО подписанта"
                example: "Вячеславов Александр Михайлович"
        status:
          type: "string"
          description: "Статус подтверждения"
        resultComment:
          type: "string"
          nullable: true
          description: "Комментарий при отклонении подтверждения"
        comment:
          type: "string"
          nullable: true
          description: "Комментарий к подтверждению"
        conversionAgreementNumber:
          type: "string"
          description: "Номер подтверждения"
        confirmDeal:
          type: "boolean"
          nullable: true
          description: "Признак, что подтверждение формируется на основании соглаш\
            ения об условиях совершения конверсионной сделки"
        client:
          type: "object"
          description: "Объект с информацией о клиенте"
          required:
          - "id"
          - "name"
          - "shortName"
          - "clientType"
          properties:
            id:
              type: "string"
              description: "Идентификатор клиента"
              example: 409387
            name:
              type: "string"
              description: "Наименование клиента"
              example: "Авилекс ООО"
            shortName:
              type: "string"
              description: "Короткое наименование клиента"
              example: "Авилекс"
            clientType:
              type: "string"
              description: "Тип клиента"
              example: "REAL"
servers:
- url: "https://api.raiffeisen.ru/fx"
