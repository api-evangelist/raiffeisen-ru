        "400":
          content:
            application/json:
              example:
              - code: "REST_ERR_5001"
                message: "General service error"
                traceId: "29bda8ca-4d33-11ec-81d3-0242ac130000"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
