          description: '`Тег ФФД — 1030` <br/>

            Наименование товара, работы, услуги, иного предмета расчета'
          x-description-i18n:
            eng: '`The tag FDF — 1030` <br/>

              Name of goods, work, service, other payment objects'
          example: Шоколадный торт
        price:
          type: number
          description: '`Тег ФФД — 1079` <br/>

            Цена за единицу товара, работы, услуги, иного предмета расчета в рублях (8 символов на целую часть, 2 на дробную)'
          x-description-i18n:
            eng: '`The tag FDF — 1079` <br/>

              Price per unit of goods, work, services, other payment objects in rubles (8 characters for a whole part, 2 for a fractional part)'
          example: 1200
        quantity:
          type: number
          description: '`Тег ФФД — 1023` <br/>

