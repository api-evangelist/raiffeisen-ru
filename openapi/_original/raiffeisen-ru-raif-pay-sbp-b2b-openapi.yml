            <br>Поле имеет ограничения по длине в зависимости от переданного типа
            платежа: Если не передан тип платежа (paymentMethods == null) или он включает
            значение PAYMENT_ORDERS, то длина назначения платежа не должна превышать
            179 символов. Если передан ТОЛЬКО тип SBP_B2B, то поле может содержать
            до 210 символов.

            <br>Может содержать:

            <br>• Символы латиницы (A–Z и a–z)

            <br>• Символы кириллицы (А-Я и а-я)

            <br>• Цифры 0-9

            <br>• Спецсимволы: пробел и `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`,
            `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`,
            `^`, `_`, `{`, `|`, `}`, `~`,`№`

            '
