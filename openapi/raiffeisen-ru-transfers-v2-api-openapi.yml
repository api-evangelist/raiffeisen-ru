openapi: 3.2.0
info:
  title: интеграции B2B оплат через СБП Transfers V2 API
  contact:
    email: ecom@raiffeisen.ru
    name: Support e-mail
    x-team-id: 932
    x-short-team-name: FPS B2B
  description: '# Подключение к СБП

    Для отправки СБП-платежей оставьте заявку в RBO → Продукты → В2В-платежи по СБП.'
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  version: '0.1'
servers:
- url: https://pay-test.raif.ru
  description: Sandbox
- url: https://pay.raif.ru
  description: Production
tags:
- name: transfers-v2
  x-displayName: Методы V2. Платежи по QR или реквизитам (в разработке)
  description: '**Методы в разработке**


    Методы позволяют создавать и проводить B2B-платежи двумя способами:


    - по QR-коду или платежной ссылке,

    - по банковским реквизитам получателя.'
paths:
  /api/v2/b2b/transfers:
    post:
      tags:
      - transfers-v2
      summary: Создание B2B-платежа по QR-коду, ссылке или реквизитам
      operationId: createPaymentV2
      description: 'Метод позволяет создать B2B-платеж. Способ указывается в поле `type`:


        - `QR` - по QR-коду или платежной ссылке получателя,

        - `REQUISITES` - по банковским реквизитам получателя.


        Что происходит с платежом дальше, зависит от криптографической подписи:


        - Если запрос подписан заголовками `Content-Digest` и `Signature`, платеж исполняется сразу после создания.

        - Если подписи нет, создается документ, который нужно подписать в Райффайзен Бизнес Онлайн в разделе «Документы в работе». Платеж уйдет в обработку только после подписания.'
      security:
      - BearerAuth: []
      parameters:
      - name: Content-Digest
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/ContentDigest'
      - name: Signature
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentV2Request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentV2Response'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/v2/b2b/transfers/{id}:
    get:
      tags:
      - transfers-v2
      summary: Детальная информация о платеже B2B (V2)
      operationId: getPaymentV2
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentV2Response'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/v2/b2b/transfers/bundles:
    post:
      tags:
      - transfers-v2
      summary: Создание пакета B2B-платежей по QR-коду, ссылке или реквизитам
      operationId: createPaymentBundleV2
      description: 'Метод позволяет создать пакет платежей B2B. Пакет может одновременно содержать платежи разных типов:


        - `QR` — платёж по QR-коду

        - `REQUISITES` — платёж по реквизитам


        Счёт списания задаётся один раз для всего пакета в поле `account`.'
      security:
      - BearerAuth: []
      parameters:
      - name: Content-Digest
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ContentDigest'
      - name: Signature
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentBundleV2Request'
            examples:
              qrPayments:
                $ref: '#/components/examples/CreatePaymentBundleV2QrExample'
              requisitesPayments:
                $ref: '#/components/examples/CreatePaymentBundleV2ReqExample'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBundleV2Response'
              examples:
                qrPayments:
                  $ref: '#/components/examples/PaymentBundleV2QrExample'
                requisitesPayments:
                  $ref: '#/components/examples/PaymentBundleV2ReqExample'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
  /api/v2/b2b/transfers/bundles/{id}:
    get:
      tags:
      - transfers-v2
      summary: Получение информации о пакете платежей B2B (V2)
      operationId: getPaymentBundleV2
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBundleV2Response'
              examples:
                qrPayments:
                  $ref: '#/components/examples/PaymentBundleV2QrExample'
                requisitesPayments:
                  $ref: '#/components/examples/PaymentBundleV2ReqExample'
        '400':
          $ref: '#/components/responses/Error400ResponseDto'
        '403':
          $ref: '#/components/responses/Error403ResponseDto'
        '404':
          $ref: '#/components/responses/Error404ResponseDto'
        '500':
          $ref: '#/components/responses/InternalServerErrorDto'
components:
  schemas:
    Extra:
      type: object
      description: Дополнительные поля в json-формате
      example:
        additionalInfo: Тестовая операция
    CreatePaymentBundleV2ReqRequest:
      required:
      - type
      - id
      - amount
      - paymentPurpose
      - receiver
      type: object
      description: Запрос на создание платежа по реквизитам в составе пакета
      properties:
        type:
          type: string
          description: Тип платежа
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
        receiver:
          $ref: '#/components/schemas/ReqReceiverRequestDto'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurpose'
        totalTaxAmount:
          allOf:
          - $ref: '#/components/schemas/TotalTaxAmount'
        statementPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/StatementPaymentPurpose'
        extra:
          allOf:
          - $ref: '#/components/schemas/Extra'
    CreatePaymentBundleV2QrRequest:
      required:
      - type
      - id
      - qrId
      type: object
      description: Запрос на создание платежа по QR-коду в составе пакета
      properties:
        type:
          type: string
          description: Тип платежа
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
        qrId:
          allOf:
          - $ref: '#/components/schemas/QrId'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurpose'
        totalTaxAmount:
          allOf:
          - $ref: '#/components/schemas/TotalTaxAmount'
        statementPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/StatementPaymentPurpose'
        extra:
          allOf:
          - $ref: '#/components/schemas/Extra'
    Account:
      type: string
      minLength: 20
      maxLength: 20
      pattern: ^[0-9]+$
      description: Банковский счёт ЮЛ или ИП для списания средств
      example: '40817810601002630020'
    SbpTransactionId:
      type: string
      minLength: 10
      maxLength: 40
      description: Идентификатор транзакции NSPK, внесен в требование к экранным формам
      example: '40817810601002630020'
    QrReceiverDto:
      required:
      - inn
      - legalName
      - bank
      - brandName
      - address
      type: object
      description: Данные получателя для платежа по QR-коду
      properties:
        inn:
          allOf:
          - $ref: '#/components/schemas/Inn'
        legalName:
          allOf:
          - $ref: '#/components/schemas/LegalName'
        brandName:
          allOf:
          - $ref: '#/components/schemas/BrandName'
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
        mcc:
          allOf:
          - $ref: '#/components/schemas/MccCodeDto'
        bank:
          allOf:
          - $ref: '#/components/schemas/QrBankDto'
    MccCodeDto:
      type: object
      description: Данные mcc-кода получателя
      properties:
        code:
          $ref: '#/components/schemas/MccCode'
        title:
          $ref: '#/components/schemas/MccTitle'
    Address:
      type: string
      maxLength: 140
      description: Фактический адрес ТСП
      example: г. Москва, ул. Б.Татарская, д.133, стр.1
    ContentDigest:
      type: string
      description: Дайджест, подписываемый клиентом, является строкой в формате base64, в которой хранится результат хеш-функции sha256, представленный массивом байт. Подробности создания можно найти в <a href='https://help.pay.raif.ru/ru/sbp-b2b/sign' target='_blank'>инструкции</a>.
      example: yxlZv97...
      x-exclude-for-generate-front: true
    QrId:
      type: string
      maxLength: 32
      description: Уникальный идентификатор платёжной ссылки
      example: AS1B001K33DNHAKV2KNBJRQK6KHNQKJ5
    PaymentStatus:
      type: object
      description: Статус платежа
      allOf: []
      required:
      - updateDate
      - value
      properties:
        value:
          $ref: '#/components/schemas/SignedPaymentStatusesEnum'
          x-exclude-for-generate-front: true
        updateDate:
          type: string
          format: date-time
          description: Дата и время обновления статуса
          example: '2024-06-12T19:36:55+03:00'
        failReason:
          type: string
          description: Причина отклонения. Указывается в случае отклонения платежа.
    ReqReceiverRequestDto:
      required:
      - account
      - inn
      - bankBic
      type: object
      description: Данные получателя
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
          description: Банковский счёт ЮЛ или ИП получателя
        inn:
          allOf:
          - $ref: '#/components/schemas/Inn'
          description: ИНН ЮЛ или ИП получателя
        kpp:
          allOf:
          - $ref: '#/components/schemas/Kpp'
        bankBic:
          allOf:
          - $ref: '#/components/schemas/BankBic'
          description: БИК банка получателя
    MccCode:
      type: string
      minLength: 4
      maxLength: 4
      description: MCC-код получателя
      example: '4121'
    Inn:
      type: string
      minLength: 10
      maxLength: 12
      description: ИНН ЮЛ или ИП
      example: '4285733785'
    CreatePaymentBundleV2TransferRequest:
      discriminator:
        propertyName: type
        mapping:
          QR: '#/components/schemas/CreatePaymentBundleV2QrRequest'
          REQUISITES: '#/components/schemas/CreatePaymentBundleV2ReqRequest'
      oneOf:
      - $ref: '#/components/schemas/CreatePaymentBundleV2QrRequest'
      - $ref: '#/components/schemas/CreatePaymentBundleV2ReqRequest'
    StatementPaymentPurpose:
      type: string
      maxLength: 150
      description: 'Назначение платежа, которое увидит отправитель в выписке в поле «Основание операции».

        <br>Может содержать:

        <br>• Символы латиницы (A–Z и a–z)

        <br>• Символы кириллицы (А-Я и а-я)

        <br>• Цифры 0-9

        <br>• Спецсимволы: пробел и `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`, `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`, `_`, `{`, `|`, `}`, `~`,`№`

        '
      example: Какое-то назначение платежа
    CreatePaymentBundleV2Request:
      required:
      - id
      - account
      - transfers
      type: object
      description: Запрос на создание пакета платежей
      properties:
        id:
          $ref: '#/components/schemas/BundleId'
        account:
          $ref: '#/components/schemas/Account'
        transfers:
          type: array
          description: Массив платежей по QR-коду или реквизитам
          items:
            $ref: '#/components/schemas/CreatePaymentBundleV2TransferRequest'
    BankBic:
      type: string
      description: БИК банка получателя
      example: '044525700'
    PaymentV2Response:
      discriminator:
        propertyName: type
        mapping:
          QR: '#/components/schemas/PaymentV2QrResponse'
          REQUISITES: '#/components/schemas/PaymentV2ReqResponse'
      oneOf:
      - $ref: '#/components/schemas/PaymentV2QrResponse'
      - $ref: '#/components/schemas/PaymentV2ReqResponse'
    BankId:
      type: string
      description: Идентификатор банка получателя
      example: '100000000007'
    Kpp:
      type: string
      minLength: 9
      maxLength: 9
      description: КПП получателя. Обязательное если получатель ЮЛ (не ИП)
      example: '123456789'
    BundleId:
      type: string
      minLength: 1
      maxLength: 40
      pattern: ^[A-z0-9-_.]+$
      description: Уникальный идентификатор пакета
      example: ee64d393836241dcb557
    PaymentV2QrResponse:
      required:
      - type
      - id
      - qrId
      - account
      - createdDate
      - status
      - amount
      - receiver
      - sender
      type: object
      description: Ответ на создание платежа по QR-коду
      properties:
        type:
          type: string
          description: Тип платежа
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
        qrId:
          allOf:
          - $ref: '#/components/schemas/QrId'
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
        createdDate:
          allOf:
          - $ref: '#/components/schemas/CreateDate'
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatus'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        totalTaxAmount:
          allOf:
          - $ref: '#/components/schemas/TotalTaxAmount'
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurpose'
        statementPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/StatementPaymentPurpose'
        receiver:
          allOf:
          - $ref: '#/components/schemas/QrReceiverDto'
        sender:
          allOf:
          - $ref: '#/components/schemas/SenderDto-2'
        sbpTransactionId:
          allOf:
          - $ref: '#/components/schemas/SbpTransactionId'
        extra:
          allOf:
          - $ref: '#/components/schemas/Extra'
    CreatePaymentV2ReqRequest:
      required:
      - type
      - id
      - account
      - amount
      - paymentPurpose
      - receiver
      type: object
      description: Запрос на создание платежа по реквизитам
      properties:
        type:
          type: string
          description: Тип платежа
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
        receiver:
          $ref: '#/components/schemas/ReqReceiverRequestDto'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurpose'
        totalTaxAmount:
          allOf:
          - $ref: '#/components/schemas/TotalTaxAmount'
        statementPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/StatementPaymentPurpose'
        extra:
          allOf:
          - $ref: '#/components/schemas/Extra'
    PaymentBundleStatus:
      type: object
      description: Статус пакета
      required:
      - value
      - updateDate
      properties:
        value:
          type: string
          description: Статус
          enum:
          - SUCCESS
          - FAILED
          - IN_PROGRESS
          example: SUCCESS
        updateDate:
          type: string
          format: date-time
          description: Дата и время обновления статуса
          example: '2024-06-12T19:36:55+03:00'
      x-exclude-for-generate-front: true
    PaymentV2Status:
      type: object
      description: Статус платежа
      required:
      - updateDate
      - value
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/SignedPaymentStatusesEnum'
            x-exclude-for-generate-front: true
        updateDate:
          type: string
          format: date-time
          description: Дата и время обновления статуса
          example: '2024-06-12T19:36:55+03:00'
        failReason:
          type: string
          description: Причина отклонения. Указывается в случае отклонения платежа.
    PaymentPurpose:
      type: string
      maxLength: 210
      description: Назначение платежа для получателя
      example: Какое-то назначение платежа
    QrBankDto:
      type: object
      description: Данные банка получателя
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/BankId'
        name:
          allOf:
          - $ref: '#/components/schemas/BankName'
        bic:
          allOf:
          - $ref: '#/components/schemas/BankBic'
    CreateDate:
      type: string
      format: date-time
      description: Дата и время создания платежа
    CreatePaymentV2QrRequest:
      required:
      - type
      - id
      - account
      - qrId
      type: object
      description: Запрос на создание платежа по QR-коду
      properties:
        type:
          type: string
          description: Тип платежа
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
        qrId:
          allOf:
          - $ref: '#/components/schemas/QrId'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurpose'
        totalTaxAmount:
          allOf:
          - $ref: '#/components/schemas/TotalTaxAmount'
        statementPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/StatementPaymentPurpose'
        extra:
          allOf:
          - $ref: '#/components/schemas/Extra'
    PaymentBundleV2QrResponse:
      required:
      - type
      - id
      - qrId
      - createdDate
      - status
      - amount
      - receiver
      - sender
      type: object
      description: Платёж по QR-коду в составе пакета
      properties:
        type:
          type: string
          description: Тип платежа
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
        qrId:
          allOf:
          - $ref: '#/components/schemas/QrId'
        createdDate:
          allOf:
          - $ref: '#/components/schemas/CreateDate'
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatus'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        totalTaxAmount:
          allOf:
          - $ref: '#/components/schemas/TotalTaxAmount'
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurpose'
        statementPaymentPurpose:
          allOf:
          - $ref: '#/components/schemas/StatementPaymentPurpose'
        receiver:
          allOf:
          - $ref: '#/components/schemas/QrReceiverDto'
        sender:
          allOf:
          - $ref: '#/components/schemas/SenderDto-2'
        sbpTransactionId:
          allOf:
          - $ref: '#/components/schemas/SbpTransactionId'
        extra:
          allOf:
          - $ref: '#/components/schemas/Extra'
    PaymentBundleV2TransferResponse:
      discriminator:
        propertyName: type
        mapping:
          QR: '#/components/schemas/PaymentBundleV2QrResponse'
          REQUISITES: '#/components/schemas/PaymentBundleV2ReqResponse'
      oneOf:
      - $ref: '#/components/schemas/PaymentBundleV2QrResponse'
      - $ref: '#/components/schemas/PaymentBundleV2ReqResponse'
    ReqReceiverDto:
      required:
      - account
      - inn
      - bank
      type: object
      description: Данные получателя для платежа по реквизитам
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
          description: Банковский счёт ЮЛ или ИП получателя
        inn:
          allOf:
          - $ref: '#/components/schemas/Inn'
        kpp:
          allOf:
          - $ref: '#/components/schemas/Kpp'
        legalName:
          allOf:
          - $ref: '#/components/schemas/LegalName'
        bank:
          allOf:
          - $ref: '#/components/schemas/ReqBankDto'
    Signature:
      type: string
      description: Подпись в формате base64, созданная при использовании RBO-сертификата. Подробности создания можно найти в <a href='https://help.pay.raif.ru/ru/sbp-b2b/sign' target='_blank'>инструкции</a>.
      example: MIAGCSqGSIb3D...
      x-exclude-for-generate-front: true
    LegalName:
      type: string
      maxLength: 512
      description: Сокращённое наименование ЮЛ или ИП
      example: ООО Торг
    Amount:
      type: number
      format: float
      description: Сумма платежа
      example: 8573.79
    PaymentBundleV2Response:
      required:
      - id
      - account
      - status
      - transfers
      type: object
      description: Информация о пакете платежей
      properties:
        id:
          $ref: '#/components/schemas/BundleId'
        account:
          $ref: '#/components/schemas/Account'
        status:
          $ref: '#/components/schemas/PaymentBundleStatus'
        transfers:
          type: array
          description: Массив платежей по QR-коду или реквизитам
          items:
            $ref: '#/components/schemas/PaymentBundleV2TransferResponse'
