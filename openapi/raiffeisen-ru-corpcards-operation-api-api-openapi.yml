openapi: 3.2.0
info:
  title: Raiffeisenbank cards Corpcards Operation API
  contact:
    email: dcc@raiffeisen.ru
    name: Support e-mail
    x-team-id: 228
    x-short-team-name: Corporate Cards
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: Автоматизированный выпуск карт с помощью API или реестра.
  x-description-i18n:
    eng: "Automated card issuance via API or registry. This allows you to issue corporate cards without documents or passports. Send us a list of cardholders via a registry through your online banking or API—we’ll issue the cards for you.\n\n# Registry\n\n1. Send the list of employees via online banking in XLS, CSV, or XML format. You can fill out the employee list manually or export it from your accounting system.\n\n2. If you order cards at a [bank branch](https://docs.google.com/spreadsheets/d/1lT-qOCGrAW7u9IFn8tDWwO1bnUt_gNPEncINGvVVbKE), delivery takes 3-5 business days.\n   If you order cards to be delivered to cardholders' addresses (only for XLS and CSV formats), delivery takes 5-7 business days, depending on the region. Cardholders will receive an SMS notification when their card is ready.\n\n## Registry Format\n  Template: <span style=\"white-space: pre;\">    </span> <Button onclick=\"document.location='images/Заявление на выпуск карт для нерезидентов v2.xlsx'\" color=\"primary\">XLS</Button>\n\n  Examples: <span style=\"white-space: pre;\">    </span> <Button onclick=\"document.location='images/xml_registry1.xml'\" color=\"primary\">XML_1</Button> <span style=\"white-space: pre;\">    </span> <Button onclick=\"document.location='images/xml_registry2.xml'\" color=\"primary\">XML_2</Button> <span style=\"white-space: pre;\">    </span> <Button onclick=\"document.location='images/csv_registry.csv'\" color=\"primary\">CSV</Button>\n\n   Parameter Name                     | Value\n  ------------------------------------|------------------------------------------------------------------------------------------\n   ИдПервичногоДокумента              | Unique registry identifier on the Company's side\n   РасчетныйСчетОрганизации           | Company account opened with the Bank to which the cards will be linked\n   ВидВклада/КодВидаВклада            | Card type <br> (MIR_CORPORATE/ MIR_CORPORATE_VIRTUAL/ CASH_IN&OUT)\n   Фамилия                            | Last name of the employee-cardholder\n   Имя                                | First name of the employee-cardholder\n   Отчество                           | Middle name of the employee-cardholder\n   ЭмбоссированныйТекст               | First and last name of the employee-cardholder in Latin script (to be printed on the card)\n   ОтделениеБанка/ ФилиалОтделенияБанка | Bank branch code where the cards will be delivered\n   Пол                                | Gender of the employee-cardholder\n   ДатаРождения                       | Date of birth\n   МестоРождения.СтранаНазвание       | Country of birth\n   Серия                              | Passport series (Russian passport)\n   Номер                              | Passport number (Russian passport)\n   ДатаВыдачи                         | Passport issue date\n   КемВыдан                           | Passport issuing authority\n   Гражданство                        | Citizenship\n   АдресПрописки.Страна               | Country of registration\n   АдресПрописки.РегионНазвание       | Region of registration address\n   АдресПрописки.НаселенныйПунктНазвание | Locality of registration address\n   АдресПрописки.УлицаНазвание        | Street of registration address <br> (if absent, specify \"Нет\")\n   АдресПрописки.Дом                  | House number of registration address\n   МобильныйТелефон                   | Employee-cardholder’s mobile phone <br> (79210000001 or 9210000001)\n   Суточный лимит <br> (CSV file)     | Daily cash withdrawal limit\n   Месячный лимит <br> (CSV file)     | Monthly spending limit\n   Секретное слово <br> (CSV file)    | Cardholder’s secret word\n   Индекс доставки <br> (CSV file)    | Delivery postal code\n   Регион доставки <br> (CSV file)    | Delivery region\n   Населенный пункт доставки <br> (CSV file) | Delivery locality\n   Улица доставки <br> (CSV file)     | Delivery street\n   Дом доставки <br> (CSV file)       | Delivery house number\n   Корпус доставки <br> (CSV file)    | Delivery building/block\n\n## Instructions for Exporting Registry from 1С\n[Instructions for Exporting Registry from 1С](https://docs.google.com/document/d/1xk9q9MDW1qx9oqQI64FF9PUBdShuLc-rgYuciY2SbzI)\n\n## List of Bank Branches for Card Pickup\n[List of Bank Branches for Card Pickup](https://docs.google.com/spreadsheets/d/1lT-qOCGrAW7u9IFn8tDWwO1bnUt_gNPEncINGvVVbKE)\n\n# About the API\n\nAfter signing the contract, you will receive an email with authorization details for the service.\n\n1. Integrate our API with your accounting system.\n2. Send the list of employees.\n3. Check card issuance status.\n4. Within 3-5 business days, the cards will be delivered to the bank branch. Cardholders will receive an SMS notification.\n\nCommunication is carried out via HTTP using GET/POST methods (each request description specifies the required method and address).\n   - POST requests use JSON arguments.\n   - GET requests work with query strings.\n\nThe API always returns a response in JSON format, regardless of the request type.\n   - Every response includes a message code (`code`). If a logical error occurs during processing, the API will also return an error description (`message`).\n\n## Authorization\n\nTo authorize requests, the following is required:\n- `secretKey` – a secret key used for inter-service communication.\n\nIMPORTANT: The secret key must be stored securely. Do not publish it on third-party resources or share it with unauthorized parties.\n\nInter-service requests are authorized via the API secret key (`SECRET_KEY`). The authorization parameter is specified in the `Authorization` header, formatted as `\"Bearer SECRET_KEY\"`.\n"
  version: '0.1'
servers:
- url: https://pay-test.raif.ru
  description: Sandbox
- url: https://pay.raif.ru
  description: Production
security:
- Authorization: []
tags:
- name: corpcards-operation-api
  x-displayName: Операции по картам
  x-x-displayName-i18n:
    eng: Cards operation
  description: 'Для просмотра информации и управления картой Райффайзенбанк предоставляет API:

    * Просмотр списка карт

    * Подробная информация по карте

    * История действий

    * Список операций

    * Реквизиты карты

    * Установка лимитов

    * Блокировка, разблокировка и закрытие карты'
  x-description-i18n:
    eng: 'To view and manage cards, Raiffeisenbank provides the following API:


      * View card list

      * Card details

      * Action history

      * Transaction list

      * Card details

      * Set limits

      * Block, unblock, and close card

      '
paths:
  /api/cards/v1/corporate-cards/cards:
    get:
      operationId: getCardsWithFilterAndPagination
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/AccountInQuery'
      - $ref: '#/components/parameters/ExpiryStartDate'
      - $ref: '#/components/parameters/ExpiryEndDate'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Product'
      - $ref: '#/components/parameters/FullNameParam'
      summary: Список карт
      x-summary-i18n:
        eng: List of cards
      description: Подробная информация о картах с фильтром и пагинацией
      deprecated: true
      x-description-i18n:
        eng: Detailed information about maps with filter and pagination
      tags:
      - corpcards-operation-api
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Страница карт
                x-description-i18n:
                  eng: Page of cards
                properties:
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/CardDto'
        '400':
          $ref: '#/components/responses/400_business_exception'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v1/corporate-cards/cards/{cardId}:
    parameters:
    - $ref: '#/components/parameters/CardId'
    get:
      summary: Информация о карте
      x-summary-i18n:
        eng: Information about card
      operationId: getCardById
      description: Подробная информация по конкретной карте
      deprecated: true
      x-description-i18n:
        eng: Detailed card information
      tags:
      - corpcards-operation-api
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v1/corporate-cards/cards/{cardId}/actions:
    get:
      tags:
      - corpcards-operation-api
      summary: История действий по карте
      x-summary-i18n:
        eng: Card transaction history
      description: Метод получения истории действий с картой
      x-description-i18n:
        eng: Card transaction history request method
      operationId: getCardActionHistory
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/CardActionDto'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v1/corporate-cards/cards/{cardId}/requisites:
    get:
      tags:
      - corpcards-operation-api
      summary: Реквизиты карты
      x-summary-i18n:
        eng: Card Requisites
      description: Получение реквизитов по карте. Инфраструктура клиента должна соответствовать стандартам PCI DSS
      x-description-i18n:
        eng: Obtaining card requisites. The client's infrastructure must comply with PCI DSS standards.
      operationId: getCardRequisites
      parameters:
      - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RequisitesDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v1/operations/cards/{cardId}/limit:
    post:
      tags:
      - corpcards-operation-api
      summary: Установка лимита по карте
      x-summary-i18n:
        eng: Card limit setup
      description: 'На данный момент возможна установка следующих лимитов:

        * суточный лимит на снятие наличных - "period": "DAILY", "type": "CASH"

        * месячный лимит на все операции (безналичные оплаты и снятие наличных) - "period": "MONTHLY", "type": "AUTH".


        Данные лимиты устанавливаются как по отдельности, так и оба единовременно'
      x-description-i18n:
        eng: 'Currently, the following limits can be set:

          * Daily cash withdrawal limit - "period": "DAILY", "type": "CASH"

          * Monthly limit for all transactions (card payments and cash withdrawals) - "period": "MONTHLY", "type": "AUTH"

          These limits can be configured either individually or both simultaneously."

          '
      operationId: setCardLimit
      parameters:
      - $ref: '#/components/parameters/CardId'
      requestBody:
        description: Тело сообщения
        x-description-i18n:
          eng: Request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitDto'
            examples:
              Daily:
                $ref: '#/components/examples/CardLimitDaily'
              Monthly:
                $ref: '#/components/examples/CardLimitMonthly'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v1/operations/cards/{cardId}/status:
    parameters:
    - $ref: '#/components/parameters/CardId'
    post:
      summary: Блокировка, разблокировка и закрытие карты
      x-summary-i18n:
        eng: Blocking, unblocking and closing a card
      description: Метод по закрытию и блокировке/разблокировке карты
      x-description-i18n:
        eng: Method for closing and blocking/unblocking a card
      operationId: changeCardStatus
      tags:
      - corpcards-operation-api
      requestBody:
        description: Change card status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardChangeStatusRequestDto'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v1/transactions/cards/{cardId}:
    get:
      tags:
      - corpcards-operation-api
      summary: Список операций по карте
      x-summary-i18n:
        eng: Card operation history
      description: 'Метод получения списка операций по карте (период не обязательный, если его не указывать то: toDate = текущая дата, fromDate = минус 7 дней от текущей даты)'
      x-description-i18n:
        eng: 'Method for retrieving card transaction list (period is optional; if not specified: toDate = current date, fromDate = current date minus 7 days)'
      operationId: getCardOperations
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/FromDate'
      responses:
        '200':
          description: Метод завершил работу
          x-description-i18n:
            eng: The method has completed execution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationDto'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/cards/v2/transactions/cards/{cardId}:
    get:
      tags:
      - corpcards-operation-api
      summary: Список операций по карте
      description: Метод получения списка операций по карте
      operationId: getCardOperationsV2
      x-raif-api-service: system
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/AmountMin'
      - $ref: '#/components/parameters/AmountMax'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/MerchantName'
      responses:
        '200':
          description: Метод завершил работу
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/OperationDtoV2'
              examples:
                Операции успешно получены:
                  $ref: '#/components/examples/OperationDtoV2Example'
        '400':
          $ref: '#/components/responses/400_invalid_data'
        '401':
          $ref: '#/components/responses/401_without_traceId'
        '500':
          $ref: '#/components/responses/500_without_traceId'
  /api/v1/cards:
    get:
      tags:
      - corpcards-operation-api
      summary: Получение информации о картах компании
      x-summary-i18n:
        eng: Getting information about company cards
      operationId: getCards
      parameters:
      - $ref: '#/components/parameters/CardIdParam'
      - $ref: '#/components/parameters/FullNameParam'
      - $ref: '#/components/parameters/Product-2'
      - $ref: '#/components/parameters/AccountInQuery'
      - $ref: '#/components/parameters/ExpiryStartDate'
      - $ref: '#/components/parameters/ExpiryEndDate'
      - $ref: '#/components/parameters/CardStatuses'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/LimitSelectionType'
      responses:
        '200':
          description: Успешный ответ
          x-description-i18n:
            eng: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardInfoPageableBff'
              examples:
                CardInfoPageable:
                  $ref: '#/components/examples/CardInfoExampleBff'
                CardInfoPageableEmpty:
                  $ref: '#/components/examples/CardInfoPageableEmptyExample'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /api/v1/cards/{cardId}:
    get:
      tags:
      - corpcards-operation-api
      summary: Получение информации о карте
      x-summary-i18n:
        eng: Getting information about company cards
      operationId: getSingleCardByCardId
      parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/LimitSelectionType'
      responses:
        '200':
          description: Успешный ответ
          x-description-i18n:
            eng: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardInfoDtoBff'
              examples:
                CardInfo:
                  $ref: '#/components/examples/CardInfoExampleBff'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
components:
  schemas:
    TransactionsCardDtoMaskedNumber:
      type: string
      description: 'Маскированный номер карты. Формат: первые 6 и последние 4 цифры, середина скрыта символами "*".

        '
      example: 553496******0091
    CardLimitResponseDto:
      type: object
      description: DTO, представляющий лимит по карте
      x-description-i18n:
        eng: DTO representing card limit
        rus: DTO, представляющий лимит по карте
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/LimitNameType'
        period:
          allOf:
          - $ref: '#/components/schemas/LimitPeriod'
        entityType:
          allOf:
          - $ref: '#/components/schemas/LimitEntityType'
        counterType:
          allOf:
          - $ref: '#/components/schemas/LimitCounterType'
        value:
          type: number
          format: decimal
          description: Значение
          x-description-i18n:
            eng: Value
          example: 100000
        available:
          type:
          - number
          - 'null'
          format: decimal
          description: Остаток по лимиту
          x-description-i18n:
            eng: Limit remaining value
            rus: Остаток по лимиту
          example: 20000
      required:
      - name
      - period
      - entityType
      - counterType
      - value
    Status:
      type: string
      enum:
      - ACTIVE
      - CLOSED
      - BLOCKED
      description: Статус карты
      x-description-i18n:
        eng: Card Status
      example: CLOSED
    OperationStatus:
      type: string
      description: Статус операции
      enum:
      - HOLD
      - CANCEL
      - CAPTURE
    StatusDto:
      type: object
      description: Данные о совершенной операции
      required:
      - value
      - dateTime
      properties:
        value:
          allOf:
          - $ref: '#/components/schemas/OperationStatus'
        dateTime:
          allOf:
          - $ref: '#/components/schemas/DateTime'
        captureDateTime:
          allOf:
          - $ref: '#/components/schemas/CaptureDateTime'
    HasNext:
      type: boolean
      description: Наличие следующей страницы
      x-description-i18n:
        eng: Availability of next page
    Label:
      type: string
      description: Расшифровка MCC.
      example: Различные продовольственные магазины
    MerchantName:
      type: string
      description: Название торговой точки
      example: YANDEX.TAXI
    LimitAdjustedBalance:
      type: number
      description: Баланс счёта с учётом доступного лимита
      x-description-i18n:
        eng: Balance including limit
      example: 13.37
    ExpiryDate:
      type: string
      description: Срок действия карты
      x-description-i18n:
        eng: Card validity period
      format: YYYY-MM-DD
      example: '2024-02-01'
    MerchantCountry:
      type: string
      description: Страна торговой точки.
      example: RU
    CardActivationStatusValue:
      type: object
      description: Объект, описывающий текущий статус активации карты и время последнего его обновления
      required:
      - value
      properties:
        value:
          allOf:
          - $ref: '#/components/schemas/ActivationStatus'
        updatedDate:
          allOf:
          - $ref: '#/components/schemas/UpdatedDateTime'
    LimitValue:
      type: string
      description: Значение
      x-description-i18n:
        eng: Value
      example: '100'
      pattern: '[0-9]+'
    CardDto:
      type: object
      required:
      - id
      - maskedNumber
      - status
      - createdDate
      - isActivated
      - expiryDate
      - product
      - account
      - type
      - currency
      - embossedName
      - person
      - limits
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/CardId'
        maskedNumber:
          allOf:
          - $ref: '#/components/schemas/MaskedNumber'
        status:
          allOf:
          - $ref: '#/components/schemas/Status'
        cardStatusState:
          allOf:
          - $ref: '#/components/schemas/CardStatusState'
        createdDate:
          allOf:
          - $ref: '#/components/schemas/CreatedDate'
        isActivated:
          allOf:
          - $ref: '#/components/schemas/IsActivated'
        expiryDate:
          allOf:
          - $ref: '#/components/schemas/ExpiryDate'
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
        isVirtual:
          allOf:
          - $ref: '#/components/schemas/IsVirtual'
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
        type:
          allOf:
          - $ref: '#/components/schemas/Type'
        currency:
          allOf:
          - $ref: '#/components/schemas/Currency'
        embossedName:
          allOf:
          - $ref: '#/components/schemas/EmbossedName'
        person:
          allOf:
          - $ref: '#/components/schemas/PersonDto'
        limits:
          type: array
          items:
