paths:
  /api/b2b/sbp/v1/orders:
    post:
      tags:
      - order
      summary: Создание заказа
      x-raif-api-summary-en: Create Order
      operationId: createDynamicPaymentLink
      security:
      - BearerAuth: []
      parameters: []
      x-raif-api-service: system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequestDto'
            examples:
              count_of_minutes:
                $ref: '#/components/examples/CreateOrderRequestDtoCountOfMinutes'
              without_restriction:
                $ref: '#/components/examples/CreateOrderRequestDtoWithoutRestriction'
              with_restriction:
                $ref: '#/components/examples/CreateOrderRequestDtoWithRestriction'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponseDto'
              examples:
                without_restrictions:
                  $ref: '#/components/examples/CreateOrderResponseDtoWithOutRestrictions'
                with_restrictions:
                  $ref: '#/components/examples/CreateOrderResponseDtoWithRestrictions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/b2b/split-orders:
    post:
      tags:
      - splits
      summary: Создание заказа со сплитованием
      operationId: createPaymentLinkSplits
      security:
      - BearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderSplitsRequestDto'
            examples:
              splits_count_of_minutes:
                $ref: '#/components/examples/CreateOrderSplitsRequestDtoCountOfMinutes'
              splits_without_restriction:
                $ref: '#/components/examples/CreateOrderSplitsRequestDtoWithoutRestriction'
              splits_with_restriction:
                $ref: '#/components/examples/CreateOrderSplitsRequestDtoWithRestriction'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderSplitsResponseDto'
              examples:
                splits_without_restrictions:
                  $ref: '#/components/examples/CreateOrderSplitsResponseDtoWithOutRestrictions'
                splits_with_restrictions:
                  $ref: '#/components/examples/CreateOrderSplitsResponseDtoWithRestrictions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/b2b/sbp/v1/qrs/{qrId}/image:
    parameters:
    - $ref: '#/components/parameters/QrId'
    get:
      tags:
      - order
      - splits
      summary: Генерация изображения платёжной ссылки
      operationId: getQrImage
      parameters:
      - $ref: '#/components/parameters/QrId'
      - $ref: '#/components/parameters/Format'
      - $ref: '#/components/parameters/WithLogo'
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string
                format: byte
  /api/v1/b2b/split-orders/{id}:
    get:
      tags:
      - splits
      summary: Получение данных заказа со сплитованием
      operationId: getOrderSplitsPaymentLinkInfo
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderIdWithoutGenerating'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderInfoSplitsResponseDto'
              examples:
                splits_without_restrictions:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoWithoutRestrictions'
                splits_active:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoActive'
                splits_paid:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoPaid'
                splits_expired:
                  $ref: '#/components/examples/OrderInfoSplitsResponseDtoExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - splits
      summary: Отмена заказа со сплитованием
      operationId: deleteOrderSplits
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderIdWithoutGenerating'
      description: Метод позволяет отменить неоплаченный заказ со сплитованием. После
        отмены оплата заказа с текущим id будет недоступна. Но вы можете переиспользовать
        этот id для создания нового заказа
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/b2b/sbp/v1/orders/{id}:
    get:
      tags:
      - order
      summary: Данные заказа
      operationId: getOrderPaymentLinkInfo
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderIdWithoutGenerating'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderInfoResponseDto'
              examples:
                without_restrictions:
                  $ref: '#/components/examples/OrderInfoResponseDtoWithoutRestrictions'
                active:
                  $ref: '#/components/examples/OrderInfoResponseDtoActive'
                paid:
                  $ref: '#/components/examples/OrderInfoResponseDtoPaid'
                expired:
                  $ref: '#/components/examples/OrderInfoResponseDtoExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - order
      summary: Отмена заказа
      operationId: deleteOrder
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderIdWithoutGenerating'
      description: Метод позволяет отменить неоплаченный заказ. После отмены оплата
        заказа с текущим id будет недоступна. Но вы можете переиспользовать этот id
        для создания нового заказа
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/sandbox/b2b/sbp/v1/qrs/{qrId}/payment:
    post:
      summary: Создание тестовой оплаты
      description: '!! Данные endpoint можно использовать только в ТЕСТОВОМ окружении
        !!'
      tags:
      - testing
      operationId: createTestPayment
      parameters:
      - $ref: '#/components/parameters/QrId'
      requestBody:
        $ref: '#/components/requestBodies/RequestBodyOfSandBoxPayment'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/settings/v1/callback:
