tags:
- name: payout-accounts
paths:
  /v1/payout-accounts:
    get:
      tags:
      - payout-accounts
      summary: Получение списка счетов
      description: Получение списка счетов клиента
      operationId: get-v1-payout-accounts-list
      x-summary-i18n:
        eng: Get list of accounts
      x-description-i18n:
        eng: Get the list of client accounts
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccountsList'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        '401':
          description: Неавторизованный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Response'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    servers:
    - url: https://pay-test.raif.ru/api
      description: Sandbox
    - url: https://pay.raif.ru/api
      description: prod
components:
  schemas:
    BadRequestErrorResponse:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          description: Код ошибки (`INVALID_DATA`)
          example: INVALID_DATA
        message:
          type: string
          description: Текст ошибки (`The request contains invalid fields or values`)
          example: The request contains invalid fields or values
        traceId:
          type: string
          description: Уникальный идентификатор запроса
          example: 84b19a21e19410b62c30b4cd40c228a1
    Error403Response:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          description: Код ошибки (`OPERATION_FORBIDDEN`)
          example: OPERATION_FORBIDDEN
        message:
          type: string
          description: Текст ошибки (`The operation is not allowed`)
          example: The operation is not allowed.
        traceId:
          type: string
          example: 84b19a21e19410b62c30b4cd40c228a1
          description: Уникальный идентификатор запроса
    InternalServerError:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          description: Код ошибки (`INTERNAL_ERROR`)
          example: INTERNAL_ERROR
        message:
          type: string
          description: Текст ошибки (`An internal error occurred`)
          example: An internal error occurred
        traceId:
          type: string
          description: Уникальный идентификатор запроса
          example: 84b19a21e19410b62c30b4cd40c228a1
    Error401Response:
      required:
      - code
      - message
      - traceId
      type: object
      properties:
        code:
          type: string
          description: Код ошибки (`UNAUTHORIZED`)
          example: UNAUTHORIZED
        message:
          type: string
          description: Текст ошибки (`The operation is not allowed`)
          example: The operation is not allowed.
        traceId:
          type: string
          example: 84b19a21e19410b62c30b4cd40c228a1
          description: Уникальный идентификатор запроса
    PayoutAccountsList:
      type: array
      description: Список счетов клиента
      x-description-i18n:
        eng: List of client accounts
      items:
        type: string
        description: Номер счёта
        x-description-i18n:
          eng: Account number
        example: '40700000000000000000'
  securitySchemes:
    BearerAuth:
      type: http
      description: '[Bearer secretKey](#tag/authorization)


        example: eyJ0eXA***

        '
      scheme: bearer
      bearerFormat: JWT
      x-internal: false
    UserTokenAuth:
      name: X-USER-ACCESS-TOKEN
      type: apiKey
      in: cookie
