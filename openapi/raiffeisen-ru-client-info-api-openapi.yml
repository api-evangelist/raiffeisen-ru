openapi: 3.2.0
info:
  description: API кредитования юридических лиц
  title: Финансирование. Кредитование Client Info API
  version: 1.0.0
servers:
- url: https://api.raiffeisen.ru/loans-financing
tags:
- description: Информация о клиенте
  name: Client Info
paths:
  /v1/client-info/accounts:
    get:
      description: Метод получения информации по счетам клиента (для оформления досрочного погашения кредита). Метод предназначен только для использования в сценариях связанных с кредитованием ЮЛ и может возвращать не все счета клиента.
      operationId: getClientAccounts
      parameters:
      - description: Список клиентских номеров (список CNUM)
        in: query
        name: cnumList
        required: true
        schema:
          example:
          - AAABBB
          - BBBAAA
          items:
            example: AAABBB
            type: string
          type: array
          uniqueItems: true
      - description: ISO код валюты счета клиента
        in: query
        name: filterByCurrency
        required: false
        schema:
          example: RUB
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInfoAccountDtoResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение информации по счетам клиента (для оформления досрочного погашения…
      tags:
      - Client Info
components:
  parameters:
    IdTokenHeader:
      name: Id-Token
      in: header
      description: Идентификационный токен пользователя
      required: true
      schema:
        type: string
        format: byte
        example: SUQgVE9LRU4gRk9SIFRFU1RJTkc=
    AuthorizationHeader:
      name: Authorization
      in: header
      description: Токен доступа
      required: true
      schema:
        type: string
        format: byte
        example: Bearer QXV0aG9yaXphdGlvbiBIZWFkZXIgRm9yIFRlc3Rpbmc=
  schemas:
    ClientInfoAccountDto:
      description: Информация по счету клиента
      example:
        accountNumber: '40702810123456789012'
        organizationCnum: AAABBB
        availableBalance: 1.2345678901E8
        currency: RUB
      properties:
        accountNumber:
          description: Номер счета
          example: '40702810123456789012'
          type: string
        organizationCnum:
          description: Клиентский номер (CNUM)
          example: AAABBB
          type: string
        availableBalance:
          description: Доступный баланс
          example: 1.2345678901E8
          type: number
        currency:
          description: Валюта счета
          example: RUB
          type: string
      type: object
    ClientInfoAccountDtoResponse:
      example:
      - accountNumber: '40702810123456789012'
        organizationCnum: AAABBB
        availableBalance: 1.2345678901E8
        currency: RUB
      items:
        $ref: '#/components/schemas/ClientInfoAccountDto'
      type: array
      uniqueItems: true
    BaseErrorResponse:
      description: Данные об ошибке
      example:
        timestamp: '2000-01-23T04:56:07.000+00:00'
        message: Error message
      properties:
        timestamp:
          description: Дата и время возникновения ошибки
          example: '2000-01-23T04:56:07Z'
          format: date-time
          type: string
        message:
          description: Сообщение об ошибке
          example: Error message
          type: string
      type: object
  responses:
    InternalError:
      description: Внутренняя ошибка
    Unauthorized:
      description: Аутентификация не пройдена
