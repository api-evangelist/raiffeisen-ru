openapi: 3.2.0
info:
  title: Raiffeisen Ru Agreement API
  version: 1.0.0
  description: 'Operations tagged Agreement across 8 of this provider''s published API definitions: raiffeisen-ru-agency-factoring-openapi.yml, raiffeisen-ru-factoring-openapi.yml, raiffeisen-ru-loans-openapi.yml, raiffeisen-ru-payment-control-openapi.yml, raiffeisen-ru-agency-factoring-openapi.yml, raiffeisen-ru-factoring-openapi.yml, raiffeisen-ru-loans-openapi.yml, raiffeisen-ru-payment-control-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.raiffeisen.ru/payables-financing
- url: https://api.raiffeisen.ru/factoring
- url: https://api.raiffeisen.ru/loans-financing
- url: https://api.raiffeisen.ru/pay-control
tags:
- description: Агентский договора
  name: Agreement
paths:
  /v1/agreements:
    get:
      description: Метод получение соглашений пользователя по параметрам
      operationId: getAgreements
      parameters:
      - description: Клиентский номер (CNUM)
        in: query
        name: cnums
        required: false
        schema:
          example: AAABBB
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Одобренный
                  value:
                  - cqrsVersion: -1628796591
                    compensationPeriod: 100
                    taxCompensationPeriod: true
                    nonAcceptanceWithdrawalFee: true
                    endWorkingDayFeeInvoice: 10
                    maxCompensationPeriod: 200
                    bkiAcceptanceDate: '2025-01-01'
                    isTaxAvailable: true
                    principal:
                      ogrn: '1027739326449'
                      shortNameRus: АО Ромашка
                      cqrsVersion: -1628796591
                      inn: '7744000302'
                      kpp: '770401001'
                      id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                      state:
                        statusDate: '2021-07-10T06:53:37.433111Z'
                        errors: []
                        status: APPROVED
                      fullNameEng: Joint Stock Chamomile
                      cnum: AA10AA
                      fullNameRus: Акционерное общество Ромашка
                    isBkiAccepted: true
                    number: АФ-1
                    autoprolongation: true
                    startWorkingDayFeeInvoice: 5
                    nonAcceptanceWithdrawal: true
                    id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                    state:
                      statusDate: '2021-07-10T06:53:37.433111Z'
                      errors: []
                      status: APPROVED
                    startDate: '2025-01-01'
                    expirationDate: '2025-01-01'
              schema:
                $ref: '#/components/schemas/AgreementListResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERR_5001
                    message: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение соглашений пользователя
      tags:
      - Agreement
    servers:
    - url: https://api.raiffeisen.ru/payables-financing
  /v1/agreements/{id}/accounts:
    get:
      description: Метод получения счетов списания по параметрам
      operationId: getAccounts
      parameters:
      - description: Номер договора
        in: path
        name: id
        required: true
        schema:
          example: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Несколько аккаунтов
                  value:
                    accounts:
                    - agreementId: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                      cbaNumber: '40916819105000006497'
                      state:
                        statusDate: '2021-07-10T06:53:37.433111Z'
                        errors: []
                        status: ACTIVE
                      id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                      cqrsVersion: -1628796591
                    - agreementId: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                      cbaNumber: '40916819105090006497'
                      state:
                        statusDate: '2021-07-10T06:53:37.433111Z'
                        errors: []
                        status: ACTIVE
                      id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
                      cqrsVersion: -1628795591
              schema:
                $ref: '#/components/schemas/AccountForWithdrawalResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ERROR
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ERROR
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение списка счетов для списания по параметрам
      tags:
      - Agreement
    servers:
    - url: https://api.raiffeisen.ru/payables-financing
  /v1/agreements/by-cnums:
    get:
      operationId: getAgreementsByCnums
      parameters:
      - description: Список клиентских номеров (список CNUM)
        in: query
        name: cnumList
        required: true
        schema:
          example:
          - AAABBB
          - BBBAAA
          items:
            example: AAABBB
            type: string
          type: array
          uniqueItems: true
      - description: Признак - нужны только активные соглашения
        in: query
        name: activeOnly
        required: false
        schema:
          example: true
          type: boolean
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLineDtoResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Метод получение соглашений пользователя по параметрам
      tags:
      - Agreement
    servers:
    - url: https://api.raiffeisen.ru/loans-financing
  /v1/agreements/{id}/digest:
    get:
      description: Метод получение дайджеста договора для подписи
      operationId: getAgreementDigest
      parameters:
      - description: Идентификатор договора
        in: path
        name: id
        required: true
        schema:
          example: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Дайджет
                  value:
                    digest: 0JLQvtGCINGN0YLQviDQvdGD0LbQvdC+INC/0L7QtNC/0LjRgdCw0YLRjA==
              schema:
                $ref: '#/components/schemas/DigestResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение дайджеста договора для подписи
      tags:
      - Agreement
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/agreements/{id}/main-parameters-digest:
    get:
      description: Метод получение дайджеста основных параметров договора для подписи
      operationId: getMainParametersDigest
      parameters:
      - description: Идентификатор договора
        in: path
        name: id
        required: true
        schema:
          example: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          content:
            application/json:
              examples:
                simple:
                  summary: Дайджет
                  value:
                    digest: 0JLQvtGCINGN0YLQviDQvdGD0LbQvdC+INC/0L7QtNC/0LjRgdCw0YLRjA==
              schema:
                $ref: '#/components/schemas/DigestResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Получение дайджеста основных параметров договора для подписи
      tags:
      - Agreement
    servers:
    - url: https://api.raiffeisen.ru/pay-control
  /v1/agreements/{agreementId}/accounts/{accountId}:
    patch:
      description: Метод обновление счета для списания клиента
      operationId: patchAgreementAccount
      parameters:
      - description: Идентификатор договора
        in: path
        name: agreementId
        required: true
        schema:
          example: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
          format: uuid
          type: string
      - description: Идентификатор счета
        in: path
        name: accountId
        required: true
        schema:
          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
      - $ref: '#/components/parameters/IdTokenHeader'
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: Новые реквизиты счета
                value:
                  accountNumber: '40916819105000006497'
                  cqrsVersion: 111111
            schema:
              $ref: '#/components/schemas/PatchAccountRequest'
        description: Новый номер счета
        required: true
      responses:
        '200':
          description: OK
        '400':
          content:
            application/json:
              examples:
                simple:
                  value:
                  - code: REST_ERROR_5001
                    description: General service error
                    traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
          description: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Обновление счета для списания клиента
      tags:
      - Agreement
    servers:
    - url: https://api.raiffeisen.ru/pay-control
components:
  schemas:
    RestErrorCodes:
      description: '| code            | description                                |

        |-----------------|--------------------------------------------|

        | REST_ERR_5001   | General service error                       |

        | REST_ERR_5040   | Tax is not available                        |

        | REST_ERR_5041   | Incorrect format of taxpayer status         |

        | REST_ERR_5042   | Incorrect format of KPP payer''s             |

        | REST_ERR_5043   | Incorrect format of UIN                     |

        | REST_ERR_5044   | Incorrect format of CBC                     |

        | REST_ERR_5045   | Incorrect format of OKTMO                   |

        | REST_ERR_5046   | Incorrect format of payment reason          |

        | REST_ERR_5047   | Incorrect format of tax period              |

        | REST_ERR_5048   | Incorrect format of the payment reason document number |

        | REST_ERR_5049   | Incorrect format of the payment reason document date   |

        | REST_ERR_5050   | Incorrect format of receiver name           |

        | REST_ERR_5051   | Incorrect format of purpose                 |

        '
      enum:
      - REST_ERR_5001
      - REST_ERR_5040
      - REST_ERR_5041
      - REST_ERR_5042
      - REST_ERR_5043
      - REST_ERR_5044
      - REST_ERR_5045
      - REST_ERR_5046
      - REST_ERR_5047
      - REST_ERR_5048
      - REST_ERR_5049
      - REST_ERR_5050
      - REST_ERR_5051
      example: REST_ERR_5001
      type: string
    ErrorMessage:
      example:
        code: REST_ERR_5001
        message: General service error
        traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
      properties:
        code:
          $ref: '#/components/schemas/RestErrorCodes'
        message:
          description: Сообщение
          example: General service error
          type: string
        traceId:
          description: traceId
          example: 29bda8ca-4d33-11ec-81d3-0242ac130000
          type: string
      required:
      - code
      - message
      - traceId
      type: object
    AccountForWithdrawalResponse:
      example:
        accounts:
        - id: 76b44414-8259-4a09-b4dd-dbe33e0a1729
          agreementId: 76b44414-8259-4a09-b4dd-dbe33e0a1729
          cbaNumber: '40916819105000006497'
          state:
            statusDate: '2025-07-10T06:53:37.433211'
            errors: []
            status: ACTIVE
          cqrsVersion: -1628796591
      properties:
        accounts:
          description: Счета
          example:
          - id: 76b44414-8259-4a09-b4dd-dbe33e0a1729
            agreementId: 76b44414-8259-4a09-b4dd-dbe33e0a1729
            cbaNumber: '40916819105000006497'
            state:
              statusDate: '2025-07-10T06:53:37.433211'
              errors: []
              status: ACTIVE
            cqrsVersion: -1628796591
          items:
            $ref: '#/components/schemas/Account'
          type: array
      type: object
    Principal:
      description: Принципал
      example:
        id: 2c44306f-fc96-4780-9b37-6447273b190e
        cnum: AA10AA
        shortNameRus: АО Ромашка
        fullNameRus: Акционерное общество Ромашка
        fullNameEng: Joint Stock Chamomile
        inn: '7744000302'
        ogrn: '1027739326449'
        kpp: '770401001'
        state:
          statusDate: '2025-07-10T06:53:37.433211'
          errors: []
          status: APPROVED
        cqrsVersion: -1628796591
      properties:
        id:
          description: Идентификатор принципала
          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
        cnum:
          description: Клиентский номер (CNUM)
          example: AA10AA
          type: string
        shortNameRus:
          description: Сокращенное наименование организации
          example: АО Ромашка
          type: string
        fullNameRus:
          description: Полное наименование организации
          example: Акционерное общество Ромашка
          type: string
        fullNameEng:
          description: Полное наименование организации на англ. языке
          example: Joint Stock Chamomile
          type: string
        inn:
          description: ИНН
          example: '7744000302'
          type: string
        ogrn:
          description: ОГРН
          example: '1027739326449'
          type: string
        kpp:
          description: КПП
          example: '770401001'
          type: string
        state:
          allOf:
          - $ref: '#/components/schemas/PrincipalState'
          description: Состояние пакета
          type: object
        cqrsVersion:
          description: hashCode от state - состояния реестра
          example: -1628796591
          type: integer
      required:
      - cnum
      - cqrsVersion
      - fullNameEng
      - fullNameRus
      - id
      - inn
      - kpp
      - ogrn
      - shortNameRus
      - state
      type: object
    ErrorResponse:
      description: Список ошибок
      example:
      - code: REST_ERR_5001
        message: General service error
        traceId: 29bda8ca-4d33-11ec-81d3-0242ac130000
      items:
        $ref: '#/components/schemas/ErrorMessage'
      type: array
    Error:
      example:
        code: ERR_1001
        message: General service error
      properties:
        code:
          $ref: '#/components/schemas/ErrorCodes'
        message:
          description: Сообщение
          example: General service error
          type: string
        traceId:
          description: traceId
          example: 29bda8ca-4d33-11ec-81d3-0242ac130000
          type: string
      required:
      - code
      - message
      type: object
    AgreementListResponse:
      description: Список агентских договоров
      example:
      - cqrsVersion: -1628796591
        compensationPeriod: 100
        taxCompensationPeriod: true
        nonAcceptanceWithdrawalFee: true
        endWorkingDayFeeInvoice: 10
        maxCompensationPeriod: 200
        bkiAcceptanceDate: '2025-01-01'
        isTaxAvailable: true
        principal:
          ogrn: '1027739326449'
          shortNameRus: АО Ромашка
          cqrsVersion: -1628796591
          inn: '7744000302'
          kpp: '770401001'
          id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
          state:
            statusDate: '2021-07-10T06:53:37.433111Z'
            errors: []
            status: APPROVED
          fullNameEng: Joint Stock Chamomile
          cnum: AA10AA
          fullNameRus: Акционерное общество Ромашка
        isBkiAccepted: true
        number: АФ-1
        autoprolongation: true
        startWorkingDayFeeInvoice: 5
        nonAcceptanceWithdrawal: true
        id: bf1d1868-a98e-4ae5-976f-0c4e21e0d510
        state:
          statusDate: '2021-07-10T06:53:37.433111Z'
          errors: []
          status: APPROVED
        startDate: '2025-01-01'
        expirationDate: '2025-01-01'
      items:
        $ref: '#/components/schemas/Agreement'
      type: array
    AccountState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/AccountStatus'
        type: object
      description: Состояние счета
      example:
        statusDate: '2025-07-10T06:53:37.433211'
        errors: []
        status: ACTIVE
      type: object
    AccountStatus:
      description: Статус счета
      enum:
      - ACTIVE
      - BLOCKED
      example: ACTIVE
      type: string
    Agreement:
      example:
        id: 2c44306f-fc96-4780-9b37-6447273b190e
        principal:
          id: 2c44306f-fc96-4780-9b37-6447273b190e
          cnum: AA10AA
          shortNameRus: АО Ромашка
          fullNameRus: Акционерное общество Ромашка
          fullNameEng: Joint Stock Chamomile
          inn: '7744000302'
          ogrn: '1027739326449'
          kpp: '770401001'
          state:
            statusDate: '2025-07-10T06:53:37.433211'
            errors: []
            status: APPROVED
          cqrsVersion: -1628796591
        autoprolongation: true
        compensationPeriod: 100
        maxCompensationPeriod: 200
        number: АФ-1
        startDate: '2025-01-01'
        expirationDate: '2025-01-01'
        startWorkingDayFeeInvoice: 5
        endWorkingDayFeeInvoice: 10
        nonAcceptanceWithdrawal: true
        nonAcceptanceWithdrawalFee: true
        isBkiAccepted: true
        bkiAcceptanceDate: '2025-01-01'
        isTaxAvailable: true
        taxCompensationPeriod: true
        state:
          statusDate: '2025-07-10T06:53:37.433211'
          errors: []
          status: APPROVED
        cqrsVersion: -1628796591
      properties:
        id:
          description: Идентификатор договора
          example: 2c44306f-fc96-4780-9b37-6447273b190e
          format: uuid
          type: string
        principal:
          $ref: '#/components/schemas/Principal'
        autoprolongation:
          description: Признак автопролонгации соглашения
          example: true
          type: boolean
        compensationPeriod:
          description: Срок компенсации
          example: 100
          type: integer
        maxCompensationPeriod:
          description: Максимальный срок компенсации
          example: 200
          type: integer
        number:
          description: Номер соглашения
          example: АФ-1
          type: string
        startDate:
          description: Дата заключения соглашения
          example: '2025-01-01'
          format: date
          type: string
        expirationDate:
          description: Дата окончания соглашения
          example: '2025-01-01'
          format: date
          type: string
        startWorkingDayFeeInvoice:
          description: Первый день оплаты комиссий
          example: 5
          type: integer
        endWorkingDayFeeInvoice:
          description: Последний день оплаты комиссий
          example: 10
          type: integer
        nonAcceptanceWithdrawal:
          description: Согласие на безакцептное списание основного долга
          example: true
          type: boolean
        nonAcceptanceWithdrawalFee:
          description: Согласие на безакцептное списание долга по комиссиям
          example: true
          type: boolean
        isBkiAccepted:
          description: Согласие на проверку в БКИ
          example: true
          type: boolean
        bkiAcceptanceDate:
          description: Дата согласия на проверку в БКИ
          example: '2025-01-01'
          format: date
          type: string
        isTaxAvailable:
          description: Доступность отправки платежей в бюджет
          example: true
          type: boolean
        taxCompensationPeriod:
          description: Максимальный срок компенсации для платежей в бюджет
          example: true
          type: boolean
        state:
          allOf:
          - $ref: '#/components/schemas/AgreementState'
          description: Состояние договора
          type: object
        cqrsVersion:
          description: hashCode от state - состояния реестра
          example: -1628796591
          type: integer
      required:
      - autoprolongation
      - compensationPeriod
      - cqrsVersion
      - endWorkingDayFeeInvoice
      - id
      - isBkiAccepted
      - isTaxAvailable
      - maxCompensationPeriod
      - nonAcceptanceWithdrawal
      - nonAcceptanceWithdrawalFee
      - number
      - startDate
      - startWorkingDayFeeInvoice
      - state
      type: object
    AgreementStatus:
      description: Статус договора
      enum:
      - APPROVED
      - INVALID
      example: APPROVED
      type: string
    AgreementState:
      allOf:
      - $ref: '#/components/schemas/State'
      - properties:
          status:
            $ref: '#/components/schemas/AgreementStatus'
        type: object
      description: Состояние договора
      example:
