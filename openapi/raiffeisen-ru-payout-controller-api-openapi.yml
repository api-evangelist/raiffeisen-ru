              description: Номер телефона получателя
              x-description-i18n:
                eng: Recipient phone number
              maxLength: 15
            bankAlias:
              type: string
              minLength: 1
              description: Код банка получателя из запроса списка банков. Обязательно передается если не указан bankId.
              x-description-i18n:
                eng: Beneficiary's bank code from the list of banks request. It is required if bankId is not specified.
              maxLength: 255
            bankId:
