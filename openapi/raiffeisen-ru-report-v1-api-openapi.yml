        - 40701978200000000001:401867
        - '40702810500001306832'
        from: '2023-10-06'
        to: '2023-10-06'
        withAttachments: true
    tooManyTransactionsError:
      summary: Превышено допустимое количество операций для генерации
      value:
        code: too-many-transactions-error
        message: Too many transactions for generation
    camt053RequestAllFields:
      summary: Запрос camt053 все поля
      value:
        accountKeys:
        - 40701978200000000001:401867
        - 40701978200000000001:401867
        from: '2023-09-06'
        to: '2023-10-06'
        zero: true
        fileName: file
        sort:
        - sortBy: DEBIT
