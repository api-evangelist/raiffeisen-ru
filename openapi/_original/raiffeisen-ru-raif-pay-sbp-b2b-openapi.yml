      description: 'Назначение платежа, которое увидит получатель в выписке в поле
        «Основание операции» вместе с инн плательщика.

        <br>Например, "ИНН плательщика: 231150869432. Какое-то ваше назначение"

        <br>Если поле не заполнено, то поле «Основание операции» заполнится по шаблону,
        в который будет передан идентификатор заказа, наименование плательщика и инн
        плательщика.

        <br>Например, «Перевод по идентификатору nM43NFfqiaAh04QdSmCoI5u4S2YrWU2ikHJ.
        Плательщик: ООО Ромашка, ИНН: 231150869432. Осуществлен через СБП B2В».

        <br>Может содержать:

        <br>• Символы латиницы (A–Z и a–z)

        <br>• Символы кириллицы (А-Я и а-я)

        <br>• Цифры 0-9

        <br>• Спецсимволы: пробел и `!`, `"`, `#`, `$`, `%`, `''`, `(`, `)`, `*`,
        `+`, `,`, `-`, `.`, `/`, `:`, `;`, `=`, `>`, `?`, `@`, `[`, `\`, `]`, `^`,
