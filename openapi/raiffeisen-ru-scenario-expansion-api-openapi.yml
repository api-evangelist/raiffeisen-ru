openapi: 3.2.0
info:
  title: White-Label ecommerce Scenario Expansion API
  version: '1.0'
  license:
    name: Proprietary
    url: https://www.raiffeisen.ru/
  x-logo:
    url: images/raifflogo.png
    backgroundColor: '#FFFFFF'
    altText: Raiff logo
  description: '# Подключение к эквайрингу

    Для подключения заполните заявку в Онлайн-банке или мобильном приложении.'
  x-description-i18n:
    eng: "# Connection to acquiring\nTo connect, fill out an application in [the online bank](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) or [the mobile application.](https://rbo.page.link/internet)\n\nFor questions about working with the API, please contact Raiffeisenbank support service:\n- email: ecom@raiffeisen.ru\n\n### Preparatory activities\nTo accept payments:\n* Fill out the [application](https://www.rbo.raiffeisen.ru/sign-form/internet-acquiring) to connect acquiring\n* Choose an integration method and implement it\n* Make test payments\n\n# Operation scheme\n## Payment on the merchant's form\n\n<a href='images/WLEcom_en.svg' target='_blank'><img src='images/WLEcom_en.svg'></a>\n\n## Create payment with subscription\n\n<a href='images/WLEcom-sub-and-payment_en.svg' target='_blank'><img src='images/WLEcom-sub-and-payment_en.svg'></a>\n\n## Bind card\n`IN DEVELOPMENT` <br>\n\n<a href='images/WLEcom-bind-card_en.svg' target='_blank'><img src='images/WLEcom-bind-card_en.svg'></a>\n\n### Payment scenario\n`This workflow requires your company to have PCI DSS certification`<br><br>\nTo make a payment using your own payment form, you must support integration with the [Bank's API](#tag/white-label) methods.\n\n**1. Creating a payment or binding a bank card**\n\nTo make a payment or bind a bank card, you must first create a payment using the [[Create payment]](#operation/post-payments-v1-merchants-publicId-payments) method, specifying the required 'flow' parameter:\n- `flow: CARD` — Card payment\n- `flow: CARD_BINDING` — Card binding\n\nAs a result of executing the method, the payment will be generated in the Bank's system.\nThe method response will return a payment object with the status `NEW`.\n\n- Together with the payment object, additional parameters required for performing an additional [[3DS Method]](#operation/post3DSMethod) step may be returned.\n\n**2. Continuing the payment**\n\nAfter the payment or bind bank card has been created, you must continue processing the payment using the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method.\n- In some cases, the method can complete the payment (transfer it to the final status `SUCCESS`) if the payment passes via 3DS v.2 frictionless flow.\n\n**3. Calling the issuer's ACS for 3DS authentication and OTP code entry by the user**\n\nIf, as a result of executing the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method, the status `3DS_PENDING` is returned,\nthe merchant must redirect the payer to the issuing bank's authorization page, and also send a POST request to the issuer's authentication service.\n\n- The issuing bank's address will be returned in the `acsUrl` parameter\n- The parameters required to send in the request depend on the 3DS version\n\n**3DS v.1**:\n  | Parameter           | Description             |\n  |---------------------|-------------------------|\n  | `MD`                | Information for payment identification. The parameter is returned in the response of the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method. |\n  | `PaReq`             | The parameter required for payer authentication. The parameter is returned in the response of the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method. |\n  | `TermUrl`           | The URL on the merchant's side, to which the ACS will return the response after passing 3DS. The payer will also be redirected to this address after successful OTP code entry.|\n\n**3DS v.2**:\n  | Parameter         | Description             |\n  |-------------------|-------------------------|\n  | `creq`            | Payment session data required for 3DS authentication. The parameter is returned in the response of the [[Continue payment]](#operation/put-payments-v1-merchants-publicId-payments-id) method. |\n\nExample of sending a POST request to the issuer's ACS to continue 3DS v.2:\n```js\n  export function createContinuePayment3ds2Iframe(acsUrl, creq) {\n    const container = document.getElementById('otp-page');\n    const iframe = window.document.createElement('iframe');\n    iframe.id = 'threeDs-2-iframe';\n    iframe.style = 'height: 100%; width: 100%; overflow: hidden; position: absolute; top: 0; left: 0; background: white; z-index: 1000; border: none;';\n    const html = `\n      <body onload=\"document.forms[0].submit()\">\n        <div>\n          <form name=\"form\" action=\"${acsUrl}\" method=\"post\">\n            <input type=\"hidden\" name=\"creq\" value=\"${creq}\">\n          </form>\n        </div>\n      </body>\n    `;\n    container.appendChild(iframe);\n    iframe.contentWindow.document.open();\n    iframe.contentWindow.document.write(html);\n  }\n```\n\nAfter calling the ACS and successful OTP code entry by the user, the merchant's `termUrl` will receive an incoming request from the issuer with the `cres` parameter (in case of 3DS v.2 challenge), or `pares` and `md` in case of 3DS v.1.\n\nExample of obtaining pares via subscription and post-message listening:\n```js\n  window.addEventListener('message', (event) => {\n    try {\n      if (typeof event.data !== 'string') return;\n      const { pares } = JSON.parse(event.data);\n      // Call the required 3DS confirmation method to complete the payment\n    } catch (error) {\n      console.error('Error processing message:', error);\n    }\n  });\n```\n\n**4. 3DS confirmation and payment completion**\n\nTo complete the payment, you must finish processing the payment using the\n[[3DS v.1 Confirmation]](#operation/put-payments-v1-merchants-publicId-payments-id-3ds1-confirm) or\n[[3DS v.2 Confirmation]](#operation/put-api-payments-v1-merchants-publicId-payments-id-3ds2-confirm) methods.\n\nExample of completing the payment via 3DS v.1:\n  ```js\n  window.parent.postMessage(JSON.stringify({\n    pares: paRes\n  }), '*');\n  ```\n\nExample of completing the payment via 3DS v.2:\n  ```js\n  window.parent.postMessage(JSON.stringify({\n    cres: document.getElementById('data').dataset.cres,\n  }), '*');\n  ```\n\n**Payment status model**:\n\n<div style=\"text-align: center;\">\n  <img src=\"images/wl-ecom-payment-status-model.png\" alt=\"Payment status model\">\n</div>\n\n# Integration\nInteraction is carried out via the HTTP protocol using the `POST` `GET` `PUT` `DELETE` methods.\n\nWhen sending requests to open a payment form and create an order with opening a payment form, the API returns a response in the HTML document format, responses to other requests are returned in JSON format.\n\n## Authorization\nTo authorize requests, you need:\n* `publicId` - The identifier that is used to open the payment form and is public.\n* `secretKey` - A secret key that is used for inter-service interaction. It is private, must be stored in a secure place and must not be transferred to third parties.\n\n| Circuit          | URL address             |\n|------------------|-------------------------|\n| Production       |https://pay.raif.ru      |\n| Test             |https://pay-test.raif.ru |\n\nInter-service requests are authorized using the secret key `secretKey`. The authorization parameter is passed in the `Authorization` header, the value of which is formed as `Bearer + secretKey`\n\nYou can view the production `publicId` and generate a `secretKey` in the [Online Bank](https://www.rbo.raiffeisen.ru/acquiring/mcp#/), or [Personal Account](https://pay.raif.ru/account/#/auth).\n\nInstructions for generating `secretKey` can be found in the Help Center:\n* [Generate a secret key in Online Banking](https://help.pay.raif.ru/sbp/rbo/secretkey)\n* [Generate a secret key in your Personal Account](https://help.pay.raif.ru/sbp/lk/secretkey)\n\nTo generate a `secretKey` in the test circuit, you must contact the support service ecom@raiffeisen.ru\n\n# Testing\nFor a full payment testing cycle, you must specify a payment amount greater than 10 rubles.\n\n`Test cards for payment scenarios`\n| Card PAN          | Card validity period| CVV | OTP code| 3DS Scenario       |\n|-------------------|---------------------|-----|---------|--------------------|\n| 2201382000000039  | 12/35               | 880 |         | 3DS2 Frictionless  |\n| 2201382000000021  | 12/35               | 880 |   1234  | 3DS2 Challenge     |\n| 4000001000000018  | 12/35               | 880 |   1234  | 3DS1 Flow          |\n\n## Negative testing\n\nThe amounts listed below can be used to trigger errors for payments or subscription debits.\n\n| Scenario | Amount | Error type |\n|----------|--------|------------|\n|* Card payment <br> * Card subscription debit | 99.51 | Insufficient funds to perform the operation |\n|* Card payment | 99.61 | Authorization amount exceeded the card spending limit |"
  contact:
    name: Support e-mail
    email: ecom@raiffeisen.ru
    x-team-id: 178
    x-short-team-name: PAPAS
servers:
- url: https://pay-test.raif.ru/api
  description: Sandbox
- url: https://pay.raif.ru/api
  description: Production
tags:
- name: scenario-expansion
  x-displayName: Расширение сценариев
  x-x-displayName-i18n:
    eng: Available methods
  description: В данном разделе описаны методы, расширяющие сценарий проведения платежа.
paths:
  /payments/v2/merchants/{publicId}/orders/{orderId}/refunds:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
        maxLength: 40
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа
    post:
      summary: Оформление возврата
      tags:
      - scenario-expansion
      security:
      - secretKey: []
      x-summary-i18n:
        eng: Refund
      description: 'Метод позволяет выполнить возврат по заказу.

        Метод также позволяет провести возврат плательщику в другой банк. Поддерживаются как полный, так и частичный возвраты.'
      x-description-i18n:
        eng: 'The method allows you to make a refund for the order.

          The method also allows you to make a refund to the payer to another bank. Both full and partial refunds are supported.

          '
      operationId: post-payments-v2-merchants-publicId-orders-orderId-refunds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequestV2'
            examples:
              Возврат:
                value:
                  id: 348230ad-2a8d-4976-af4f-8603d11cba8c
                  amount: 432.21
                  paymentDetails: Возврат
              Возврат со сплитованием:
                value:
                  id: 348230ad-2a8d-4976-af4f-8603d11cba8c
                  amount: 432.21
                  paymentDetails: Возврат
                  splits:
                  - accountId: ea6f870f-debd-48cc-a83f-b87e7cee8582
                    amount: 10.21
                  - accountId: 226f0738-d5d8-4ee6-afff-71e05836820a
                    amount: 422
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusResponseV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Код ошибки
                  message:
                    type: string
                    description: Описание
                required:
                - code
                - message
  /payments/v2/merchants/{publicId}/orders/{orderId}/refunds/{refundId}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
      name: orderId
      in: path
      required: true
      description: Идентификатор заказ
    - schema:
        type: string
      name: refundId
      in: path
      required: true
      description: Идентификатор возврата
    get:
      summary: Получение информации по возврату
      tags:
      - scenario-expansion
      responses:
        '200':
          $ref: '#/components/responses/RefundStatusResponseV2'
        '404':
          $ref: '#/components/responses/Error404Response'
      operationId: get-payments-v2-merchants-publicId-orders-orderId-refunds-refundId
  /payments/v2/merchants/{publicId}/orders/{orderId}/clear:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
        maxLength: 40
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа
    post:
      tags:
      - scenario-expansion
      summary: Проведение клиринга
      operationId: post-payments-v2-merchants-publicId-orders-orderId-clear
      deprecated: false
      responses:
        '200':
          $ref: '#/components/responses/ClearCardPaymentResponse'
        '400':
          $ref: '#/components/responses/Error400Response'
      description: 'Метод позволяет выполнить принудительный клиринг операций по интернет-эквайрингу с возможностью частичной отмены.

        Поддерживает операции как со сплитованием платежей, так и без него.


        При переданных `splits` будет произведена частичная отмена, равная сумме по заказу за вычетом итоговой суммы клиринга.

        Сплиты, которые сохраняют ту же сумму, что и в оригинальном заказе, передавать не требуется.'
      security:
      - secretKey: []
      requestBody:
        $ref: '#/components/requestBodies/ClearEcomRequest'
      x-summary-i18n:
        eng: Clearing
      x-description-i18n:
        eng: 'This method enables forced clearing of internet acquiring operations with support for partial cancellation.

          It supports both operations with payment splitting and without splitting.


          When `splits` are provided, a partial cancellation is performed, where the cancellation amount equals the order amount minus the final clearing amount.

          Splits that retain the same amount as in the original order do not need to be included.

          '
  /v1/merchants/{publicId}/subscriptions/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: Идентификатор подписки
      x-description-i18n:
        eng: Subscription ID
    get:
      summary: Получение информации по подписке
      x-summary-i18n:
        eng: Get subscription info
      operationId: get-v1-merchants-publicId-subscriptions-id
      description: Метод позволяет получить информацию по подписке
      x-description-i18n:
        eng: The method allows you to retrieve information about a subscription
      tags:
      - scenario-expansion
      security:
      - secretKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSubscription'
              examples:
                ACQUIRING:
                  $ref: '#/components/examples/GET_SUBSCRIPTION_INFO_ACQUIRING'
                SBP:
                  $ref: '#/components/examples/GET_SUBSCRIPTION_INFO_SBP'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/FORBIDDEN_ERROR_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Подписка не найдена:
                  $ref: '#/components/examples/SUBSCRIPTION_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
  /v2/merchants/{publicId}/subscriptions/{id}:
    parameters:
    - $ref: '#/components/parameters/publicId'
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: Идентификатор подписки
      x-description-i18n:
        eng: Subscription ID
    delete:
      summary: Отмена подписки
      x-summary-i18n:
        eng: Cancel subscription
      operationId: delete-v1-merchants-publicId-subscriptions-id
      description: Метод позволяет отменить подписку. После отмены проведение списаний по подписке будет недоступно.
      x-description-i18n:
        eng: This method allows you to cancel a subscription. After cancellation, charging will no longer be available for this subscription.
      tags:
      - scenario-expansion
      security:
      - secretKey: []
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Действие недопустимо:
                  $ref: '#/components/examples/DELETE_SUBSCRIPTION'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Доступ запрещен:
                  $ref: '#/components/examples/FORBIDDEN_ERROR_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Подписка не найдена:
                  $ref: '#/components/examples/SUBSCRIPTION_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
              examples:
                Ошибка сервиса:
                  $ref: '#/components/examples/GENERAL_INTERNAL_ERROR_500'
components:
  requestBodies:
    ClearEcomRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Запрос на клиринг по операциям интернет эквайринга со сплитованием
            x-description-i18n:
              eng: Clearing request for Internet Acquiring operations with splitting
            properties:
              amount:
                type: number
                description: Итоговая сумма клиринга
                x-description-i18n:
                  eng: Final clearing amount
                example: 1200
              splits:
                $ref: '#/components/schemas/Split'
  schemas:
    RefundWithSplits:
      title: RefundWithSplits
      type: object
      properties:
        id:
          type: string
          example: 348230ad-2a8d-4976-af4f-8603d11cba8c
          description: Идентификатор возврата
          x-description-i18n:
            eng: Refund ID
        amount:
          type: number
          description: Сумма возврата в рублях
          x-description-i18n:
            eng: Refund amount in rubles
          format: float
          example: 432.21
        paymentDetails:
          $ref: '#/components/schemas/PaymentDetails'
        customer:
          type: object
          description: Объект данных получателя, будет заполнен при отправке возврата в другой банк. **Заполняется только для возвратов по СБП**
          x-description-i18n:
            eng: Recipient data object, populated when sending a refund to another bank
          properties:
            bankAlias:
              type: string
              description: Код банка плательщика. Коды банков можно получить выполнив [[Запрос на получение списка банков]](#tag/QR/operation/getBanksForRefunds).
              x-description-i18n:
                eng: Recipient bank code from the bank list request
            phone:
              type: string
              description: Номер телефона плательщика
              x-description-i18n:
                eng: Recipient's phone number
        splits:
          $ref: '#/components/schemas/Split'
        status:
          type: object
          properties:
            value:
              type: string
              description: Код состояния запроса на возврат
              x-description-i18n:
                eng: Refund status code
              enum:
              - IN_PROGRESS
              - COMPLETED
              - DECLINED
            date:
              type: string
              description: Дата и время состояния
              x-description-i18n:
                eng: Status date and time
              format: date-time
              example: '2024-12-31T17:00:00+03:00'
        receipt:
          $ref: '#/components/schemas/FiscalReceiptBasic'
    CardSubscription:
      title: CardSubscription
      allOf:
      - $ref: '#/components/schemas/schemas-Subscription'
      - type: object
        properties:
          paymentMethod:
            type: string
            description: Способ оплаты
            x-description-i18n:
              eng: Payment method
          groupId:
            $ref: '#/components/schemas/SubscriptionGroup'
          paymentSystem:
            type: string
            description: Платежная система
            x-description-i18n:
              eng: Payment system
            enum:
            - MIR
            - VISA
            - MASTERCARD
          cardNumber:
            type: string
            description: Маскированный номер карты
            x-description-i18n:
              eng: Masked payer card number
            pattern: ^[0-9*]+$
            minLength: 1
            maxLength: 20
            example: '2201382000000039'
          expirationDate:
            type: string
            description: Срок действия карты
            x-description-i18n:
              eng: Card validity period
            example: 2025-10
            pattern: ^(20\d{2})-(0[1-9]|1[0-2])$
    receiptItem:
      type: object
      title: ФФД 1.05 | ФФД 1.2
      properties:
        name:
          type: string
          maxLength: 128
          description: '`Тег ФФД — 1030` <br/>

            Наименование товара, работы, услуги, иного предмета расчета'
          x-description-i18n:
            eng: '`The tag FDF — 1030` <br/>

              Name of goods, work, service, other payment objects'
          example: Шоколадный торт
        price:
          type: number
          description: '`Тег ФФД — 1079` <br/>

            Цена за единицу товара, работы, услуги, иного предмета расчета в рублях (8 символов на целую часть, 2 на дробную)'
          x-description-i18n:
            eng: '`The tag FDF — 1079` <br/>

              Price per unit of goods, work, services, other payment objects in rubles (8 characters for a whole part, 2 for a fractional part)'
          example: 1200
        quantity:
          type: number
          description: '`Тег ФФД — 1023` <br/>

            Количество/вес (5 символов на целую часть, 3 на дробную)'
          x-description-i18n:
            eng: '`The tag FDF — 1023` <br/>

              Quantity / weight (5 characters for a whole part, 3 for a fractional part)'
          example: 1
        amount:
          type: number
          description: '`Тег ФФД — 1043` <br/>

            Сумма в рублях. Должна равняться произведению цены на количество (price * quantity). 8 символов на целую часть, 2 на дробную'
          x-description-i18n:
            eng: '`The tag FDF — 1023` <br/>

              Amount in rubles. Must be equal to price * quantity (8 characters for a whole part, 2 for a fractional part)'
          example: 1200
        paymentObject:
          type: string
          description: '`Тег ФФД — 1212` <br/>

            Признак предмета расчёта. Возможные значения:

            <br/>• COMMODITY – товар, который не является подакцизным и не подлежит маркировке (ФФД 1.05 и ФФД 1.2)

            <br/>• EXCISE – подакцизный товар, который не подлежит маркировке (ФФД 1.05 и ФФД 1.2)

            <br/>• JOB – работа (ФФД 1.05 и ФФД 1.2)

            <br/>• SERVICE – услуга (ФФД 1.05 и ФФД 1.2)

            <br/>• PAYMENT – платеж (ФФД 1.05 и ФФД 1.2)

            <br/>• ANOTHER – иной предмет расчета (ФФД 1.05 и ФФД 1.2)<br/>

            <br/>• COMMODITY_MARKING_NO_CODE – товар, который не является подакцизным, подлежит маркировке, но не имеет кода маркировки (ФФД 1.2)

            <br/>• COMMODITY_MARKING_WITH_CODE – товар, который не является подакцизным, подлежит маркировке и имеет код маркировки (ФФД 1.2)

            <br/>• EXCISE_MARKING_NO_CODE – подакцизный товар, который подлежит маркировке, но не имеет кода маркировки (ФФД 1.2)

            <br/>• EXCISE_MARKING_WITH_CODE – подакцизный товар, который подлежит маркировке и имеет код маркировки (ФФД 1.2)<br/>

            <br/>Для авансовых чеков и чеков частичной предоплаты должен заполняться значением PAYMENT. Если параметр не передан, то заполняется значением COMMODITY по умолчанию'
          x-description-i18n:
            eng: '`The tag FDF — 1212` <br/>

              Payment object type. Valid values:

              <br/>• COMMODITY – good (FFD 1.05 and FFD 1.2)

              <br/>• EXCISE – excisable good (FFD 1.05 and FFD 1.2)

              <br/>• JOB – job (FFD 1.05 and FFD 1.2)

              <br/>• SERVICE – service (FFD 1.05 and FFD 1.2)

              <br/>• PAYMENT – payment (FFD 1.05 and FFD 1.2)

              <br/>• ANOTHER – another payment object (FFD 1.05 and FFD 1.2)

              <br/>• COMMODITY_MARKING_NO_CODE – marked good that has no marking code (FFD 1.2)

              <br/>• COMMODITY_MARKING_WITH_CODE – marked good that has a marking code (FFD 1.2)

              <br/>• EXCISE_MARKING_NO_CODE – excisable good that has no marking code (FFD 1.2)

              <br/>• EXCISE_MARKING_WITH_CODE – excisable good that has a marking code (FFD 1.2)<br/>

              <br/>For advance payments and prepayments value PAYMENT must be passed. If null, value COMMODITY will be set by default'
          enum:
          - COMMODITY
          - EXCISE
          - JOB
          - SERVICE
          - PAYMENT
          - ANOTHER
          - COMMODITY_MARKING_NO_CODE
          - COMMODITY_MARKING_WITH_CODE
          - EXCISE_MARKING_NO_CODE
          - EXCISE_MARKING_WITH_CODE
          example: COMMODITY_MARKING_WITH_CODE
        paymentMode:
          type: string
          description: '`Тег ФФД — 1214` <br/>

            Способ расчета. Возможные значения:<br/>

            • FULL_PREPAYMENT – 100% предоплата до момента передачи предмета расчета<br/>

            • FULL_PAYMENT – полная оплата в момент передачи предмета расчета<br/>

            • ADVANCE – аванс<br/>

            • PREPAYMENT – частичная предоплата до момента передачи предмета расчета<br/>

            • CREDIT – Передача в кредит<br/>

            • CREDIT_PAYMENT – Оплата кредита<br/>

            Если параметр не передан, по умолчанию устанавливается значение FULL_PREPAYMENT'
          x-description-i18n:
            eng: '`The tag FDF — 1214` <br/>

              Payment mode. Valid values:<br/>

              • FULL_PREPAYMENT – 100% prepayment<br/>

              • FULL_PAYMENT – full payment<br/>

              • ADVANCE – advance payment<br/>

              • PREPAYMENT – partial prepayment<br/>

              • CREDIT – credit<br/>

              • CREDIT_PAYMENT – credit payment<br/>

              If null, the value FULL_PREPAYMENT is set dy default'
          enum:
          - FULL_PREPAYMENT
          - FULL_PAYMENT
          - ADVANCE
          - PREPAYMENT
          - CREDIT
          - CREDIT_PAYMENT
          example: FULL_PREPAYMENT
        measurementUnit:
          type: string
          description: '`Тег ФФД — 2108` <br/>

            Единица измерения товара, работы, услуги, иного предмета расчета.

            <br/> Для ФФД 1.05 передавать строковое значение до 16 символов включительно.

            <br/> Для ФФД 1.2 передавать значения из списка:

            <br/>• PIECE – штука/единица/дробный товар

            <br/>• GRAM – грамм

            <br/>• KILOGRAM – килограмм

            <br/>• TON – тонна

            <br/>• CENTIMETER – сантиметр

            <br/>• DECIMETER – дециметр

            <br/>• METER – метр

            <br/>• SQUARE_CENTIMETER – кв. сантиметр

            <br/>• SQUARE_DECIMETER – кв. дециметр

            <br/>• SQUARE_METER – кв. метр

            <br/>• MILLILITER – миллилитр

            <br/>• LITER – литр

            <br/>• CUBIC_METER – куб. метр

            <br/>• KILOWATT_HOUR – киловатт-час

            <br/>• GIGACALORIE – гигакалория

            <br/>• DAY – сутки/день

            <br/>• HOUR – час

            <br/>• MINUTE – минута

            <br/>• SECOND – секунда

            <br/>• KILOBYTE – килобайт

            <br/>• MEGABYTE – мегабайт

            <br/>• GIGABYTE – гигабайт

            <br/>• TERABYTE – терабайт

            <br/>• OTHER – иное

            <br/>Если передано значение не из списка выше, то в ОФД автоматически будет передано OTHER

            '
          x-description-i18n:
            eng: '`The tag FDF — 2108` <br/>

              Unit of measurement of goods, work, services, other payment objects

              <br/> If FFD 1.05, string value up to 16 symbols has to be passed.

              <br/> If FFD 1.2, value from the list is accepted:

              <br/>• PIECE – a piece

              <br/>• GRAM – gram

              <br/>• KILOGRAM – kilogram

              <br/>• TON – ton

              <br/>• CENTIMETER – centimeter

              <br/>• DECIMETER – decimeter

              <br/>• METER – meter

              <br/>• SQUARE_CENTIMETER – sq. centimeter

              <br/>• SQUARE_DECIMETER – sq. decimeter

              <br/>• SQUARE_METER – sq. meter

              <br/>• MILLILITER – milliliter

              <br/>• LITER – liter

              <br/>• CUBIC_METER – c. meter

              <br/>• KILOWATT_HOUR – kilowatt-hour

              <br/>• GIGACALORIE – gigacalorie

              <br/>• DAY – day or 24 hours

              <br/>• HOUR – an hour

              <br/>• MINUTE – a minute

              <br/>• SECOND – a second

              <br/>• KILOBYTE – a kilobyte

              <br/>• MEGABYTE – a megabyte

              <br/>• GIGABYTE – a gigabyte

              <br/>• TERABYTE – a terabyte

              <br/>• OTHER – other

              <br/>If passed value in off the list, value OTHER will passed automatically to OFD'''
          example: PIECE
        nomenclatureCode:
          type: string
          description: '`Тег ФФД — 1162` <br/>

            Номенклатурный код товара в 16-ричном представлении с пробелами или в формате GS1 DataMatrix. Только для ФФД 1.05.

            <br/>Примеры: ''''00 00 00 01 00 21 FA 41 00 23 05 41 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 12 00 AB 00'''' или ''''010463003407001221CMK45BrhN0WLf''''

            <br/>Если вы используете БИФИТ или Чек-Онлайн, номенклатурный код должен быть передан строго в 16-ричном представлении с пробелами. Если LIFE PAY или Эвотор – строго в формате GS1 DataMatrix'
          x-description-i18n:
            eng: '`The tag FDF — 1162` <br/>

              Product code in hexadecimal divided by spaces or in GS1 DataMatrix format. For FFD 1.05 only.

              <br/>For example, "00 00 00 01 00 21 FA 41 00 23 05 41 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 12 00 AB 00" or "010463003407001221CMK45BrhN0WLf"

              <br/>If you use BIFIT or Chekonline, the nomenclature code must be passed strictly in hexadecimal (hex) notation with spaces.

              <br/>If you use LIFE PAY or Evotor, the nomenclature code must be passed strictly in GS1 DataMatrix format'
          pattern: ^([a-fA-F0-9]{2}$)|(^([a-fA-F0-9]{2}\s){1,31}[a-fA-F0-9]{2}|01(?<gtin>\d{14})21(?<serial>[a-zA-Z0-9!" % &'()*+\/\-.,:;=<>?_]{13})([a-zA-Z0-9!" % &'()*+\/\- .,:;=<>?_]{1,119})?|(?<gtin1>\d{14})(?<serial1>[a-zA-Z0-9!" %&'()*+\/\-.,:;=<>?_]{11})[a-zA-Z0-9!" %&'()*+\/\-.,:;=<>?_]{4})$
          maxLength: 150
          example: 00 00 00 01 00 21 FA 41 00 23 05 41 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 12 00 AB 00
        vatType:
          type: string
          description: '`Тег ФФД — 1199` <br/>

            Ставка НДС на позицию чека. Возможные значения:<br/>

            • NONE – без НДС<br/>• VAT0 – НДС по ставке 0%<br/>

            • VAT10 – НДС чека по ставке 10%<br/>

            • VAT110 – НДС чека по расчетной ставке 10/110<br/>

