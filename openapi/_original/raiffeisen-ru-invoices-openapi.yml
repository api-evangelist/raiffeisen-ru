      - "payee"
      - "payer"
    GoodsRequest:
      type: "object"
      description: "Товары"
      example:
        items:
        - name: "Услуги по настройке ПО"
          count: 5
          price: 1200.5
          unit: "HOUR"
          vat: "VAT_20"
      properties:
        items:
          type: "array"
          description: "Список товаров"
          items:
            $ref: "#/components/schemas/ItemRequest"
          maxItems: 2147483647
          minItems: 1
          example:
          - name: "Услуги по настройке ПО"
            count: 5
            price: 1200.5
            unit: "HOUR"
            vat: "VAT_20"
      required:
      - "items"
    ItemRequest:
      type: "object"
